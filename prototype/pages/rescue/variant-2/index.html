<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue · Retry Runway</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---- core (shared by the three Rescue variants): titlebar meters, layer-2 content, simulated approval window ---- */
.tmeter { display: inline-flex; align-items: baseline; gap: 6px; height: var(--ctl-sm); padding: 0 var(--sp-2); border: 0; border-left: 2px solid var(--teal); border-radius: 0;
  background: none; color: var(--text); font-size: var(--fs-small); white-space: nowrap; cursor: pointer; }
.tmeter:hover { background: var(--hover); }
.tmeter.eng { border-left-color: var(--line2); }
.tmeter .k { color: var(--dim); }
.tmeter .money { font-size: var(--fs-mono); }
@media (max-width: 1240px) { .tmeter .k { display: none; } }
button.badge { border: 0; cursor: pointer; }
.recov { display: inline-flex; align-items: baseline; gap: var(--sp-2); height: var(--ctl); padding: 0 var(--sp-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
.recov:hover { background: var(--hover); }
.recov .k { font-size: var(--fs-small); color: var(--dim); }
.recov .money { font-weight: var(--fw-semibold); }
.l2 { display: grid; gap: var(--sp-3); }
.l2 h3 { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); margin: 0 0 var(--sp-1); }
.l2 p { margin: 0; }
.mail { border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--bg2); padding: var(--sp-2) var(--sp-3); }
.mail .mh { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-small); color: var(--dim); margin-bottom: var(--sp-1); }
.mail p { margin: 0; line-height: 1.55; }
.slot { font-family: var(--mono); font-size: var(--fs-small); color: var(--gold-l); background: color-mix(in srgb, var(--gold) 14%, transparent); border-radius: 3px; padding: 0 3px; white-space: nowrap; }
.slot.open { color: var(--muted); background: none; outline: 1px dashed var(--line2); outline-offset: -1px; }
.calls, .rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: var(--fs-small); color: var(--muted); }
.calls { font-family: var(--mono); }
.calls li::before { content: "→ "; color: var(--gold-l); }
.rules li::before { content: "✓ "; color: var(--ok); font-family: var(--mono); }
.rules li.x::before { content: "✕ "; color: var(--red-l); }
.rules li.x { color: var(--red-l); }
.rules li.wait::before { content: "… "; color: var(--dim); }
.sims { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); }
.lever .kbd { flex: none; }
.lever[aria-disabled="true"] { cursor: not-allowed; }
.lever[aria-disabled="true"] .t1 { color: var(--dim); }
.lever .val { font: var(--fs-mono) var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.decide { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.logrow .id { width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logrow .who { flex: none; font: var(--fs-small) var(--mono); color: var(--teal-l); }
.logrow.pp .who { color: var(--gold-l); }
.logrow .t1 { font: var(--fs-small) var(--mono); color: var(--muted); }

/* simulated approval window (its own OS window labelled `approval` in the app) */
.aback { position: fixed; inset: var(--shell-h) 0 0 0; z-index: 9200; display: grid; place-items: center; padding: var(--sp-4); background: var(--scrim); }
.aback.fresh { animation: ui-fade var(--t-med) var(--ease); }
.awin { width: min(560px, 100%); max-height: calc(100vh - var(--shell-h) - 32px); display: grid; grid-template-rows: var(--bar) minmax(0, 1fr) auto; overflow: hidden;
  background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 35%, transparent); }
.awin-bar { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-1) 0 var(--sp-3); background: var(--material); border-bottom: 1px solid var(--line); font-size: var(--fs-small); color: var(--dim); min-width: 0; }
.awin-bar .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.awin-b { overflow: auto; padding: var(--sp-3) var(--sp-4) var(--sp-4); display: grid; gap: var(--sp-3); align-content: start; }
.awin-f { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.awin-f .left { margin-right: auto; }
.awin .phases { display: flex; gap: var(--sp-1); }
.awin .akick { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--gold-l); }
.awin h2 { font: var(--fw-semibold) var(--fs-title2)/1.25 var(--display); margin: 2px 0 0; outline: none; }
.awin h2 .money { font-size: var(--fs-display); color: var(--gold-l); }
.awin .steps { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 2px; }
.awin details.ui-disclosure > :not(summary) { margin: 0 0 var(--sp-2) 16px; }
/* the baseline folds the module list to icons under 1180 px; keep that rail from scrolling sideways */
@media (max-width: 1180px) { .ui-split.has-insp .ui-sidebar .cnt:not(.need) { display: none; } .ui-split.has-insp .ui-sb-item { gap: var(--sp-1); padding: 0 var(--sp-1); } }
/* ---- variant 2 · Retry Runway: the week as a timeline; drag one lever onto one subscriber before PayPal's retry ---- */
.ui-inspector h2 { margin-top: var(--sp-2); }
.desk-chips { display: flex; gap: var(--sp-1); align-items: center; }
.desk-links { display: flex; gap: var(--sp-1); margin-left: calc(-1 * var(--sp-2)); }
.ui-row .need, .lane .need { width: 8px; flex: none; display: inline-flex; }

/* the lever tray: tokens you drag onto a lane */
.tray { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.tray .tl { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.token { display: inline-flex; align-items: baseline; gap: 6px; height: var(--ctl); padding: 0 var(--sp-2); border-radius: var(--r-sm); cursor: grab; touch-action: none; white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--m-rescue) 55%, var(--line)); background: color-mix(in srgb, var(--m-rescue) 10%, var(--panel)); color: var(--text); font: var(--fw-semibold) var(--fs-small) var(--mono); }
.token:hover { border-color: var(--m-rescue); }
.token span { font-weight: var(--fw-regular); color: var(--muted); }
.token.armed { outline: 2px solid var(--focus); outline-offset: 1px; }
.token[aria-disabled="true"] { cursor: not-allowed; border-style: dashed; border-color: var(--line2); background: none; color: var(--dim); }
.token.never { text-decoration: line-through; color: var(--dim); border: 1px dashed color-mix(in srgb, var(--refuse) 45%, var(--line)); background: none; cursor: help; }
.armhint { font-size: var(--fs-small); color: var(--gold-l); }

/* the runway */
.runway { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.axis, .lane { display: grid; grid-template-columns: 184px minmax(0, 1fr); }
.axis { height: 36px; border-bottom: 1px solid var(--line2); }
.axis .lab { padding: 0 var(--sp-3); font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); align-self: center; }
.ticks { position: relative; }
.ticks span { position: absolute; top: 0; bottom: 0; padding: 2px 0 0 4px; font: var(--fs-small) var(--mono); color: var(--dim); border-left: 1px solid var(--line); white-space: nowrap; }
.ticks span.today { color: var(--text); }
.ticks .nowlab { position: absolute; top: 17px; transform: translateX(-50%); font: var(--fw-semibold) var(--fs-small)/16px var(--mono); color: var(--bg); background: var(--steel); padding: 0 4px; border-radius: 3px; white-space: nowrap; z-index: 2; }
.lane { min-height: 64px; position: relative; border-bottom: 1px solid var(--line); outline: none; }
.lane.closed { min-height: 36px; }
.lane:last-child { border-bottom: 0; }
.lane .who { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; padding: 0 var(--sp-3); border-right: 1px solid var(--line); cursor: pointer; }
.lane .who .l1 { display: flex; align-items: center; gap: 6px; }
.lane .who .id { font: var(--fw-semibold) var(--fs-mono) var(--mono); white-space: nowrap; flex: none; }
.ui-split.has-insp .token span { display: none; }
@media (max-width: 1180px) { .ui-split.has-insp .lvslot .ui-btn { display: none; } }
.lane.sel .who { background: var(--sel); box-shadow: inset 2px 0 0 var(--teal); }
.lane:focus-visible .who { outline: 2px solid var(--focus); outline-offset: -2px; }
.lane:hover .who { background: var(--hover); }
.track { position: relative; overflow: hidden; cursor: pointer; background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 12.5% 100%; }
.track .past { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--bg) 40%, transparent); pointer-events: none; }
.track .nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--steel); opacity: .7; pointer-events: none; }
.zone { position: absolute; top: 0; bottom: 0; pointer-events: none; border-left: 1px dashed color-mix(in srgb, var(--gold) 50%, transparent);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, transparent) 0 5px, transparent 5px 10px); }
.mk { position: absolute; display: flex; align-items: center; gap: 4px; white-space: nowrap; pointer-events: none; transform: translateX(-5px); font: var(--fs-small) var(--mono); color: var(--muted); }
.mk .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mk.right { flex-direction: row-reverse; transform: translateX(calc(-100% + 5px)); }
.mk.fail .dot { background: var(--coral); border-radius: 2px; transform: rotate(45deg) scale(.85); } .mk.fail { color: var(--coral-l); }
.mk.retry .dot { background: var(--gold); border-radius: 2px; transform: rotate(45deg); } .mk.retry { color: var(--gold-l); }
.mk.paid .dot { background: var(--ok); } .mk.paid { color: var(--ok); }
.mk.own .dot { border: 2px solid var(--ok); }
.mk.lost .dot { background: var(--dim); border-radius: 2px; }
.mk.a { top: 7px; } .mk.mid { top: 11px; }
.lvslot { position: absolute; top: 33px; display: flex; gap: var(--sp-1); align-items: center; transform: translateX(6px); }
.lvslot.right { transform: translateX(calc(-100% - 6px)); }
.placed { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl-sm); padding: 0 var(--sp-2); border-radius: var(--r-sm); white-space: nowrap; cursor: pointer;
  border: 1px solid var(--m-rescue); background: color-mix(in srgb, var(--m-rescue) 16%, var(--panel2)); color: var(--text); font: var(--fw-semibold) var(--fs-small) var(--mono); }
.placed span { font-weight: var(--fw-regular); color: var(--muted); }
.placed.ghost { border-style: dashed; background: var(--panel); cursor: default; color: var(--muted); }
.placed.sugg { border-style: dashed; }
.bar { position: absolute; top: 34px; height: 20px; display: flex; align-items: center; padding: 0 var(--sp-2); border-radius: var(--r-sm); white-space: nowrap; overflow: hidden; pointer-events: none; font: var(--fs-small) var(--mono); }
.bar.inv { background: color-mix(in srgb, var(--gold) 16%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); color: var(--gold-l); }
.bar.pause { background: var(--hover); border: 1px dashed var(--line2); color: var(--steel); }
.lane.drop-ok .track { box-shadow: inset 0 0 0 2px var(--teal); background-color: color-mix(in srgb, var(--teal) 8%, transparent); }
.lane.drop-no .track { box-shadow: inset 0 0 0 2px var(--refuse); background-color: color-mix(in srgb, var(--refuse) 8%, transparent); cursor: not-allowed; }
.dhint { position: absolute; right: var(--sp-2); top: 6px; z-index: 3; padding: 0 var(--sp-2); height: 20px; display: flex; align-items: center; border-radius: var(--r-sm); background: var(--panel2); box-shadow: var(--shadow-1); font-size: var(--fs-small); pointer-events: none; }
.dhint.no { color: var(--red-l); } .dhint.ok { color: var(--teal-l); }
.groupsep { padding: 0 var(--sp-3); height: 24px; display: flex; align-items: center; font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); background: var(--bg2); border-bottom: 1px solid var(--line); }
.keys { margin-top: var(--sp-3); display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); }
.legend { display: grid; grid-template-columns: 16px 1fr; gap: 6px var(--sp-2); align-items: center; font-size: var(--fs-small); }
.legend .mk { position: static; transform: none; }
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar" id="titlebar"></header>
  <div class="ui-split" id="split">
    <aside class="ui-sidebar" id="sidebar" aria-label="Modules"></aside>
    <main class="ui-main" id="main"></main>
    <aside class="ui-inspector" id="insp" aria-label="Subscriber detail" hidden></aside>
  </div>
</div>
<div id="approvalLayer" hidden></div>
<script>
/* ---- core: rescue data model, lever rules, main-window chrome, layer-2 content, simulated approval window ----
   Shared by the three Rescue variants (inlined into each page). Money is integer cents. Built on shared/ui.js. */
window.Core = (function () {
  'use strict';
  const F = window.FIX;
  const T0 = Date.now(), NOW0 = new Date(F.nowISO).getTime();
  const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const now = () => NOW0 + (Date.now() - T0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = UI.esc;
  const usd = (c) => '$' + (c / 100).toFixed(2);
  const pad = (n) => String(n).padStart(2, '0');
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const dayLabel = (t) => { const d = new Date(t); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
  /* "in 4 d" stays as coarse as the data ("PayPal retries in 4 d"); under a day it counts down. */
  const left = (ms) => ms <= 0 ? 'now' : ms >= DAY ? Math.round(ms / DAY) + ' d' : Math.floor(ms / HOUR) + ' h ' + pad(Math.floor((ms % HOUR) / MIN)) + ' m';

  /* ---------------- data ---------------- */
  const R3 = F.mandates.find((m) => m.id === 'R-3');
  const plan = F.shop.find((x) => x.sku === 'care-plan');
  const PRICE = Math.round(plan.price * 100);            // $12.00 care plan
  const DISCOUNT_PCT = 20;                               // the rescue agent's slot value (FIX: −20% → $9.60)
  const RESUME = 'Sun 29 Nov';                           // PAUSE · max 1 cycle (R-3)
  const LEVERS = [
    { key: 'DISCOUNT_THIS_CYCLE', name: 'Discount this cycle', short: 'Discount', limit: 'max −25%', on: /DISCOUNT_THIS_CYCLE/.test(R3.text) },
    { key: 'PAUSE', name: 'Pause', short: 'Pause', limit: 'max 1 cycle', on: /PAUSE/.test(R3.text) },
    { key: 'RETRY_AFTER_FIX', name: 'Retry after fix', short: 'Retry after fix', limit: 'enabled', on: /RETRY_AFTER_FIX/.test(R3.text) },
    { key: 'DOWNGRADE', name: 'Downgrade', short: 'Downgrade', limit: 'off in R-3', on: !/DOWNGRADE off/.test(R3.text) }
  ];
  const LEVER = Object.fromEntries(LEVERS.map((l) => [l.key, l]));

  /* Page-local sample data the dataset lacks; ids, amounts and times follow FIX. */
  const RESCUE_SAMPLE = {
    'S-14': { subRef: 'I-4KD7…R2', failedAt: new Date('2026-10-29T06:00:00').getTime(), retryAt: NOW0 + 4 * DAY, invoice: 'INV2-8K4R-…' },
    'S-22': { subRef: 'I-9WQ2…H5', failedAt: null, retryAt: NOW0 + 18 * HOUR, invoice: 'INV2-3PX9-…', dealIfLever: 'D-0202' },
    'S-09': { subRef: 'I-2MZ8…C3', eventAt: new Date('2026-10-27T12:00:00').getTime(), eventDay: 'Tue' },
    'S-05': { subRef: 'I-6TB1…P9', eventAt: new Date('2026-10-26T12:00:00').getTime(), eventDay: 'Mon' }
  };
  const subs = F.subscribers.map((s) => Object.assign({}, s, RESCUE_SAMPLE[s.id], {
    suggested: s.state === 'FAILED' && !s.retryBlocked ? s.lever : null,
    afterRetry: s.retryBlocked ? s.lever : null,
    choice: s.state === 'FAILED' && !s.retryBlocked ? s.lever : null,
    left: false, offer: null, at: null
  }));
  const sub = (id) => subs.find((s) => s.id === id);
  const OPEN = ['FAILED', 'OFFER SENT', 'PAUSED', 'DOWNGRADE PENDING'];
  const isOpen = (s) => OPEN.includes(s.state);
  function ordered() {
    const o = subs.filter(isOpen).sort((a, b) => (a.retryAt || Infinity) - (b.retryAt || Infinity));
    return o.concat(subs.filter((s) => !isOpen(s)));
  }
  const retryLeft = (s) => s.retryAt ? left(s.retryAt - now()) : '—';
  const isWaiting = (s) => s.state === 'FAILED' && !!s.retryAt && s.retryAt - now() < DAY;
  const needsYou = (s) => (s.state === 'FAILED' && !!s.suggested && !s.left && !isWaiting(s)) || (s.state === 'OFFER SENT' && s.offer && s.offer.replied && !s.offer.captured);
  const dealHref = (id) => '../../deal/variant-1/index.html#' + id;
  const MANDATE_HREF = '../../mandate/variant-1/index.html#R-3';

  /* The money ledger for "recovered": rescue invoices and outstanding-balance captures only. */
  const ledger = [];
  const ownRetries = [{ sub: 'S-09', cents: PRICE, day: 'Tue' }];
  const recoveredCents = () => ledger.filter((x) => (x.kind === 'invoice' && x.status === 'PAID') || (x.kind === 'capture' && x.status === 'COMPLETED')).reduce((a, x) => a + x.cents, 0);
  function recoveredBreakdown() {
    const counted = ledger.filter((x) => (x.kind === 'invoice' && x.status === 'PAID') || (x.kind === 'capture' && x.status === 'COMPLETED'));
    const open = ledger.filter((x) => x.status === 'SENT');
    return { counted, open, own: ownRetries, replay: subs.filter((s) => s.replay) };
  }

  const log = [
    { t: 'Mon', who: 'paypal', what: 'S-05 · subscription cancelled by the subscriber' },
    { t: 'Tue', who: 'paypal', what: 'S-09 · PayPal’s own retry paid $12.00 · no lever used' },
    { t: '—', who: 'paypal', what: 'S-22 · PAYMENT.FAILED ×2 · next retry in 18 h · rescue agent waits' },
    { t: 'Thu 06:00', who: 'paypal', what: 'S-14 · BILLING.SUBSCRIPTION.PAYMENT.FAILED · REPLAY (recorded payload)' },
    { t: 'Thu 06:01', who: 'agent:rescue', what: 'D-0188 · suggests DISCOUNT_THIS_CYCLE −20% → $9.60 · inside R-3' }
  ];
  function addLog(who, what) { log.push({ t: hhmm(now()), who, what }); }

  /* ---------------- lever rules (closed list, one subscription) ---------------- */
  function leverInfo(s, key) {
    const L = LEVER[key];
    const r = { key, name: L.name, limit: L.limit, ok: false, why: '', code: '', effect: '', short: '', val: '', cents: 0, calls: [], approveLabel: '', headline: '', suggested: s.suggested === key };
    if (!L.on) { r.why = 'off in rescue mandate R-3'; r.code = 'off · R-3'; r.short = 'off in R-3'; r.val = 'revise plan'; r.calls = ['POST /v1/billing/subscriptions/{id}/revise (not enabled)']; return r; }
    if (key === 'DISCOUNT_THIS_CYCLE') {
      r.cents = PRICE * (100 - DISCOUNT_PCT) / 100;
      r.short = '−' + DISCOUNT_PCT + '% → ' + usd(r.cents) + ' invoice';
      r.val = '−' + DISCOUNT_PCT + '% → ' + usd(r.cents);
      r.effect = 'one PayPal invoice for ' + usd(r.cents) + ' (−' + DISCOUNT_PCT + '% of ' + usd(PRICE) + '), this cycle only';
      r.calls = ['POST /v2/invoicing/invoices · ' + usd(r.cents), 'POST /v2/invoicing/invoices/{id}/send', 'GET /v2/invoicing/invoices/{id} until PAID'];
      r.approveLabel = 'Create ' + usd(r.cents) + ' invoice & open email';
      r.headline = usd(r.cents) + ' invoice to ' + s.id;
    } else if (key === 'PAUSE') {
      r.short = 'suspend 1 cycle · back ' + RESUME;
      r.val = '1 cycle · back ' + RESUME.slice(4);
      r.effect = 'suspend this subscription now, activate it on ' + RESUME + ' (1 cycle)';
      r.calls = ['POST /v1/billing/subscriptions/{id}/suspend', 'POST /v1/billing/subscriptions/{id}/activate on ' + RESUME];
      r.approveLabel = 'Suspend 1 cycle & open email';
      r.headline = 'Pause ' + s.id + ' for one cycle';
    } else if (key === 'RETRY_AFTER_FIX') {
      r.cents = PRICE;
      r.short = 'email, then capture ≤ ' + usd(PRICE);
      r.val = 'email · capture ≤ ' + usd(PRICE);
      r.effect = 'your email asks them to fix their funding source; after they reply, a second approval captures the outstanding balance (≤ ' + usd(PRICE) + ')';
      r.calls = ['no PayPal call now', 'later: POST /v1/billing/subscriptions/{id}/capture · OUTSTANDING_BALANCE ≤ ' + usd(PRICE)];
      r.approveLabel = 'Open email · capture later';
      r.headline = 'Ask ' + s.id + ' to fix their funding';
    }
    if (s.state !== 'FAILED') { r.why = 'only a failed renewal takes a lever'; r.code = 'closed'; }
    else if (key === 'RETRY_AFTER_FIX' && s.replay) { r.why = 'REPLAY row · no real balance to capture'; r.code = 'REPLAY'; }

      '<div class="awin-bar"><span class="badge sandbox">Sandbox</span>' + (s.replay ? '<span class="badge replay">Replay</span>' : '') + '<span class="t" title="Prototype: in the app this is its own OS window labelled approval, the only window that can approve a rescue lever">approval window · The Table › Rescue › ' + esc(s.deal || s.dealIfLever || s.id) + '</span><button class="ui-btn plain icon" data-a="close" aria-label="Close the approval window">✕</button></div>' +

      '<ul class="rules">' + checks.map((c) => '<li' + (A.phase === 'CHECKING' ? ' class="wait"' : '') + ' title="' + esc(c[1]) + '">' + esc(c[0]) + '</li>').join('') + '</ul>' +

    if (fresh || A.phase === 'DONE' || A.phase === 'LOCKED') { const f = A.phase === 'LOCKED' ? $('[data-a="unlock"]', L) : $('#aTitle', L); if (f) f.focus({ preventScroll: true }); }

  }

  /* ---------------- main-window chrome ---------------- */
  const MODS = [['tables', 'Tables'], ['spend', 'Spend'], ['shield', 'Shield'], ['counter', 'Counter'], ['rescue', 'Rescue'], ['book', 'Book']];

    const needs = (k) => k === 'rescue' ? subs.filter(needsYou).length : F.deals.filter((d) => d.module === k && d.pending).length;
    const count = (k) => k === 'rescue' ? subs.filter(isOpen).length : F.deals.filter((d) => d.module === k).length;

    return rows.length ? '<div class="ui-group">' + rows.join('') + '</div>' : '';
  }
  /* the closed lever list for one subscriber, one line per lever; reasons live in a popover */
  function leverRows(s) {

  /* the desk: everything about one subscriber, still indicative; the long form opens in a sheet */
  function deskHtml(s) {
    const head = '<div class="desk-chips">' + stChip(s.state) + replayChip(s) + (needsYou(s) ? '<span class="ui-chip gold">needs you</span>' : '') + '</div>' +

        '<section class="ui-section"><div class="decide">' + reviewBtn(s.id, can ? 'Review & approve · ' + info.short : 'Review & approve', { disabled: !can }) + '</div>' +
        '<div style="margin-top:6px">' + silenceLine(s) + '</div>' +
        '<div class="desk-links">' + (info && info.ok ? '<button class="ui-btn plain sm" data-lsheet="' + s.id + '|' + s.choice + '">What it sends ›</button>' : '') +

    } else if (s.state === 'OFFER SENT') {
      const capNeeded = s.offer.lever === 'RETRY_AFTER_FIX' && s.offer.replied && !s.offer.captured;
      body = '<section class="ui-section"><div class="ui-section-h"><h3>' + esc(s.offer.lever) + ' approved · ' + hhmm(s.offer.at) + '</h3></div>' + evidence(s) + '</section>' +
        '<section class="ui-section">' + (capNeeded ? '<div class="decide">' + reviewBtn(s.id, 'Review & approve capture ≤ ' + usd(PRICE), { purpose: 'capture' }) + '</div>' : '') +
        '<div style="margin-top:6px">' + silenceLine(s) + '</div><div class="desk-links"><button class="ui-btn plain sm" data-lsheet="' + s.id + '|' + s.offer.lever + '">Email draft ›</button></div></section>';

        '<div style="margin-top:6px">' + silenceLine(s) + '</div><div class="desk-links"><button class="ui-btn plain sm" data-lsheet="' + s.id + '|' + s.offer.lever + '">Email draft ›</button></div></section>';

  /* ---------------- wiring ---------------- */

    if (c) {
      e.preventDefault(); e.stopPropagation();
      if (c.dataset.core === 'lock') { S.locked = !S.locked; toast(S.locked ? 'Idle lock on · privileged buttons now ask for Windows Hello' : 'Unlocked', S.locked ? 'gold' : undefined); emit(); }

    const sm = e.target.closest('[data-sim]');
    if (sm) { e.preventDefault(); e.stopPropagation(); sim(sm.dataset.sim, sm.dataset.id); return; }

  ['pointerdown', 'pointermove', 'wheel'].forEach((ev) => document.addEventListener(ev, () => { S.lastInput = Date.now(); }, { passive: true }));
  setInterval(() => { if (!S.locked && Date.now() - S.lastInput > 15 * MIN) { S.locked = true; emit(); } }, 30000);
  setInterval(() => { if (!A) emit(); }, 30000); // countdowns

  renderChrome();
  return { F, S, R3, PRICE, RESUME, DISCOUNT_PCT, LEVERS, LEVER, subs, sub, ordered, isOpen, isWaiting, needsYou, retryLeft, leverInfo, captureInfo, rulesFor, silence, silenceLine,

    openApproval, onChange, emit, reviewBtn, simBox, evidence, leverRows, deskHtml, leverSheet, auditSheet, sheet, pop, popHtml, closeLayers, dealHref, MANDATE_HREF, setCrumbTail, onEsc,

<script>
(function () {
  'use strict';
  const C = window.Core, esc = C.esc, usd = C.usd;
  const AX0 = new Date('2026-10-26T00:00:00').getTime(), AX1 = new Date('2026-11-03T00:00:00').getTime();
  const pct = (t) => Math.max(0, Math.min(100, (t - AX0) / (AX1 - AX0) * 100));
  let sel = null, armed = null, dragKey = null, focusSel = null;

  function tokenHtml(L) {
    const ex = C.leverInfo(C.sub('S-14'), L.key);
    const val = L.key === 'DISCOUNT_THIS_CYCLE' ? '−' + C.DISCOUNT_PCT + '%' : L.key === 'PAUSE' ? '1 cycle' : L.key === 'RETRY_AFTER_FIX' ? 'then capture' : 'off';
    if (!L.on) return '<span class="token" aria-disabled="true" title="' + esc(ex.why) + '">' + L.key + ' <span>' + val + '</span></span>';
    return '<button class="token' + (armed === L.key ? ' armed' : '') + '" draggable="true" data-token="' + L.key + '" aria-pressed="' + (armed === L.key) + '" title="R-3 · ' + esc(L.limit) + ' · drag onto one subscriber, or click then click a subscriber">' + L.key + ' <span>' + val + '</span></button>';
  }

  /* band a (top) = PayPal's events · band b (bottom) = Maya's side: the lever, the invoice, the outcome */
  function markers(s) {
    const n = C.now(); let h = '';
    if (s.failedAt) h += '<div class="mk fail right a" style="left:' + pct(s.failedAt) + '%"><span class="dot"></span>failed ' + C.hhmm(s.failedAt) + '</div>';
    if (s.retryAt) {
      const z0 = pct(Math.max(n, s.retryAt - C.DAY)), z1 = pct(s.retryAt);
      h += '<div class="zone" style="left:' + z0 + '%;width:' + (z1 - z0) + '%"></div>';
      h += '<div class="mk retry a' + (pct(s.retryAt) > 60 ? ' right' : '') + '" style="left:' + pct(s.retryAt) + '%"><span class="dot"></span>PayPal retry · ' + esc(C.retryLeft(s)) + '</div>';
    }
    if (s.eventAt) {
      const own = s.state === 'RETRY SUCCEEDED';
      h += '<div class="mk ' + (own ? 'own' : 'lost') + ' mid" style="left:' + pct(s.eventAt) + '%"><span class="dot"></span>' + (own ? s.eventDay + ' · own retry paid $12.00 · not counted' : s.eventDay + ' · cancelled') + '</div>';
    }
    const right = pct(n) > 55;
    if (s.state === 'OFFER SENT' && s.offer) {
      const a = pct(s.offer.at), w = Math.max(pct(n) - a, 0);
      h += '<div class="bar inv" style="left:' + a + '%;width:max(' + w + '%, 15rem)">' + (s.offer.lever === 'DISCOUNT_THIS_CYCLE' ? esc(s.offer.invoice) + ' · ' + usd(s.offer.cents) + ' · unpaid' : s.offer.replied ? 'replied · capture needs you' : 'email sent · awaiting reply') + '</div>';
    }
    if (s.state === 'PAUSED' && s.offer) h += '<div class="bar pause" style="left:' + pct(s.offer.at) + '%;right:0">suspended → activate ' + esc(C.RESUME) + ' ›</div>';
    if (!s.eventAt && s.at && (s.state === 'RECOVERED' || s.state === 'LOST' || s.state === 'RETRY SUCCEEDED')) {
      const cls = s.state === 'RECOVERED' ? 'paid' : s.state === 'LOST' ? 'lost' : 'own';
      const got = C.ledger.filter((x) => x.sub === s.id && (x.status === 'PAID' || x.status === 'COMPLETED')).reduce((a, x) => a + x.cents, 0);
      const lab = s.state === 'RECOVERED' ? C.hhmm(s.at) + ' · recovered ' + usd(got) : s.state === 'LOST' ? C.hhmm(s.at) + ' · cancelled' : C.hhmm(s.at) + ' · own retry paid · not counted';
      h += '<div class="mk ' + cls + ' mid' + (pct(s.at) > 60 ? ' right' : '') + '" style="left:' + pct(s.at) + '%"><span class="dot"></span>' + lab + '</div>';
    }
    if (s.state === 'FAILED') {
      const at = '" style="left:' + pct(n) + '%">';
      const slot = '<div class="lvslot' + (right ? ' right' : '') + at;
      if (C.isWaiting(s)) h += slot + '<span class="placed ghost">no lever · waits for the retry</span></div>';
      else if (s.left) h += slot + '<span class="placed ghost">left to PayPal · nothing sent</span></div>';
      else if (s.choice) { const info = C.leverInfo(s, s.choice); h += slot + '<button class="placed' + (info.suggested ? ' sugg' : '') + '" data-open="' + s.id + '" title="' + esc(s.choice + ' · ' + info.effect + (info.suggested ? ' · suggested by the rescue agent' : ' · your pick')) + '">' + esc(C.LEVER[s.choice].short) + ' <span>' + esc(info.cents ? usd(info.cents) : '1 cycle') + (info.suggested ? ' · suggested' : '') + '</span></button>' + C.reviewBtn(s.id, 'Review', { sm: true }) + '</div>'; }
      else h += slot + '<span class="placed ghost">drop a lever here</span></div>';
    }
    return h;
  }

  function laneHtml(s) {
    const open = C.isOpen(s), n = C.now();
    const line2 = s.state === 'FAILED' ? '<span class="ui-silence">' + (s.left ? 'left to PayPal' : 'silent') + ' → <b>nothing sent</b></span>' : C.silenceLine(s);
    return '<div class="lane' + (open ? '' : ' closed') + (sel === s.id ? ' sel' : '') + '" tabindex="0" data-lane="' + s.id + '" aria-label="' + s.id + ', ' + esc(s.state) + (s.retryAt ? ', PayPal retries in ' + C.retryLeft(s) : '') + '">' +
      '<div class="who"><span class="l1"><span class="need">' + (C.needsYou(s) ? '<span class="ui-dot gold" title="needs you"></span>' : '') + '</span><span class="id">' + s.id + '</span>' + C.stChip(s.state) + C.replayChip(s) + '</span>' + (open ? line2 : '') + '</div>' +
      '<div class="track" data-track="' + s.id + '"><div class="past" style="width:' + pct(n) + '%"></div><div class="nowline" style="left:' + pct(n) + '%"></div>' + markers(s) + '</div></div>';
  }

  function axisHtml() {
    const n = C.now(); let t = '';
    for (let i = 0; i < 8; i++) { const d = AX0 + i * C.DAY; const lab = C.dayLabel(d).split(' ').slice(0, 2).join(' '); t += '<span class="' + (new Date(d).getDate() === new Date(n).getDate() ? 'today' : '') + '" style="left:' + (i * 12.5) + '%">' + lab + '</span>'; }
    t += '<b class="nowlab" style="left:' + pct(n) + '%">' + C.hhmm(n) + '</b>';
    return '<div class="axis"><div class="lab">Subscriber</div><div class="ticks" aria-hidden="true">' + t + '</div></div>';
  }

  const LEGEND = '<div class="legend"><span class="mk retry"><span class="dot"></span></span><span>PayPal’s own retry · the default if you do nothing</span>' +
    '<span class="zone" style="position:static;display:block;height:14px"></span><span>its last 24 h · no offer, RETRY_AFTER_FIX off</span>' +
    '<span class="mk fail"><span class="dot"></span></span><span>the failed renewal</span><span class="mk own"><span class="dot"></span></span><span>PayPal’s own retry paid · not counted as recovered</span>' +
    '<span class="mk lost"><span class="dot"></span></span><span>cancelled by the subscriber</span></div><p class="ui-hint" style="margin:8px 0 0">Top band: PayPal’s events. Bottom band: your lever, the invoice, the outcome.</p>';

  function render() {
    const list = C.ordered(); const open = list.filter(C.isOpen), closed = list.filter((s) => !C.isOpen(s));
    const r = C.recoveredCents();
    C.setCrumbTail(sel ? sel + (C.sub(sel).deal ? ' · ' + C.sub(sel).deal : '') : '');
    const ae = document.activeElement; const keep = ae && ae.dataset && ae.dataset.lane ? ae.dataset.lane : null;
    C.$('#main').innerHTML =
      '<div class="ui-pagehead"><h1 id="h1" tabindex="-1">Retry runway</h1><span class="sub">one lever on one subscriber, before PayPal’s retry</span>' +
      '<div class="actions"><button class="ui-btn plain sm" data-legend>How to read ⓘ</button><button class="recov" data-cpop="recovered"><span class="k">Recovered this month</span><span class="money' + (r ? ' okc' : '') + '">' + usd(r) + '</span></button></div></div>' +
      '<div class="tray" role="toolbar" aria-label="Levers enabled by rescue mandate R-3"><button class="ui-btn plain sm" data-cpop="r3">Levers · R-3 ⓘ</button>' + C.LEVERS.map(tokenHtml).join('') +
      '<button class="token never" data-cpop="never">Plan price</button>' +
      (armed ? '<span class="armhint">' + armed + ' armed · click a subscriber · Esc cancels</span>' : '') + '</div>' +
      '<div class="runway">' + axisHtml() + (open.length ? open.map(laneHtml).join('') : '<div class="groupsep">No failed renewals.</div>') +
      '<div class="groupsep">Settled this month</div>' + closed.map(laneHtml).join('') + '</div>' +
      '<div class="keys ui-hint"><span>drag a lever onto a lane, or click lever then lane</span><span><span class="kbd">↑</span> <span class="kbd">↓</span> subscriber</span><span><span class="kbd">1</span>–<span class="kbd">4</span> place lever</span><span><span class="kbd">Enter</span> details · again to review</span><span><span class="kbd">Esc</span> close</span></div>';
    const insp = C.$('#insp');
    if (sel) { insp.innerHTML = '<div style="display:flex;justify-content:flex-end;margin:-4px -8px 0 0"><button class="ui-btn plain sm" data-close-insp aria-label="Close detail">✕</button></div>' + C.deskHtml(C.sub(sel)); }
    UI.inspector(C.$('#split'), !!sel);
    if (focusSel) { const f = C.$(focusSel); if (f) f.focus({ preventScroll: false }); focusSel = null; }
    else if (keep) { const f = C.$('[data-lane="' + keep + '"]'); if (f) f.focus({ preventScroll: true }); }
  }

  function place(id, key) {
    const s = C.sub(id); if (!s) return;
    if (!C.isOpen(s) || s.state !== 'FAILED') { C.toast('Not a failed renewal · ' + id + ' is ' + s.state + '; it takes no lever.', 'bad'); return; }
    if (C.setChoice(id, key)) { sel = id; C.addLog('owner', id + ' · placed ' + key + ' on the runway (not yet approved)'); focusSel = '[data-lane="' + id + '"]'; render(); }
  }

  /* drag and drop */
  document.addEventListener('dragstart', (e) => {
    const t = e.target.closest && e.target.closest('[data-token]'); if (!t) return;
    dragKey = t.dataset.token; e.dataTransfer.setData('text/plain', dragKey); e.dataTransfer.effectAllowed = 'copy';
  });
  const clearHints = (except) => C.$$('.lane').forEach((l) => { if (l === except) return; l.classList.remove('drop-ok', 'drop-no'); const h = C.$('.dhint', l); if (h) h.remove(); });
  document.addEventListener('dragend', () => { dragKey = null; clearHints(); });
  document.addEventListener('dragover', (e) => {
    const lane = e.target.closest && e.target.closest('[data-lane]'); if (!lane || !dragKey) return;
    const info = C.leverInfo(C.sub(lane.dataset.lane), dragKey);
    e.preventDefault(); e.dataTransfer.dropEffect = info.ok ? 'copy' : 'none';
    if (!lane.classList.contains(info.ok ? 'drop-ok' : 'drop-no')) {
      clearHints(lane); lane.classList.remove('drop-ok', 'drop-no'); lane.classList.add(info.ok ? 'drop-ok' : 'drop-no');
      const old = C.$('.dhint', lane); if (old) old.remove();
      lane.insertAdjacentHTML('beforeend', '<span class="dhint ' + (info.ok ? 'ok' : 'no') + '">' + esc(info.ok ? 'drop: ' + info.short : info.why) + '</span>');
    }
  });
  document.addEventListener('drop', (e) => {
    const lane = e.target.closest && e.target.closest('[data-lane]'); if (!lane || !dragKey) return;
    e.preventDefault(); const k = dragKey; dragKey = null; place(lane.dataset.lane, k);
  });

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-legend]')) { C.popHtml(e.target.closest('[data-legend]'), 'Reading the runway', LEGEND); return; }
    const tk = e.target.closest('[data-token]');
    if (tk) { armed = armed === tk.dataset.token ? null : tk.dataset.token; render(); if (armed) { const f = C.$('[data-token="' + armed + '"]'); if (f) f.focus(); } return; }
    const pk = e.target.closest('[data-lever-pick]');
    if (pk) { if (pk.getAttribute('aria-disabled') === 'true') { C.toast('Not this lever · ' + C.leverInfo(C.sub(sel), pk.dataset.leverPick).why + '. Nothing was sent.', 'bad'); return; } place(sel, pk.dataset.leverPick); focusSel = '[data-lever-pick="' + pk.dataset.leverPick + '"]'; render(); return; }
    if (e.target.closest('[data-close-insp]')) { const id = sel; sel = null; focusSel = '[data-lane="' + id + '"]'; render(); return; }
    const lane = e.target.closest('[data-lane]');
    if (lane) {
      if (armed) { const k = armed; armed = null; place(lane.dataset.lane, k); return; }
      sel = lane.dataset.lane; render(); return;
    }
    const cr = e.target.closest('[data-crumb-root]'); if (cr) { e.preventDefault(); sel = null; render(); }
  });
  document.addEventListener('keydown', (e) => {
    if (C.isBusy() || e.ctrlKey || e.metaKey || e.altKey) return;
    const lane = e.target.closest && e.target.closest('[data-lane]');
    if (!lane) return;
    const id = lane.dataset.lane; const lanes = C.$$('[data-lane]');
    const i = lanes.indexOf(lane);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = lanes[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (n) { n.focus(); if (sel) { sel = n.dataset.lane; focusSel = '[data-lane="' + sel + '"]'; render(); } } }
    else if (/^[1-4]$/.test(e.key)) { e.preventDefault(); place(id, C.LEVERS[+e.key - 1].key); }
    else if (e.key === 'Enter' && e.target === lane) {
      e.preventDefault(); const s = C.sub(id);
      if (sel === id && s.state === 'FAILED' && s.choice && C.leverInfo(s, s.choice).ok && !s.left) C.openApproval(id, s.choice, 'lever', lane);
      else { sel = id; focusSel = '[data-lane="' + id + '"]'; render(); }
    }
  });
  C.onEsc(() => {
    if (armed) { armed = null; render(); return true; }
    if (sel) { const id = sel; sel = null; focusSel = '[data-lane="' + id + '"]'; render(); return true; }
    return false;
  });
  C.onChange(render);
  render();
})();
</script>
<script src="../../../shared/shell.js" data-page="rescue" data-variant="2"></script>
</body>
