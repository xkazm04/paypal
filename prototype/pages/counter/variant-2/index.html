<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter · price rail</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---- Counter core (identical in the three variants): what the v2 baseline has no component for ---- */
body { overflow: hidden; }
.tb-meter { font-size: var(--fs-small); color: var(--dim); white-space: nowrap; }
.tb-meter b { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.tb-meter.eng { padding-left: var(--sp-3); border-left: 1px solid var(--line2); }
.tb-clock { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 1180px) { .tb-meter .lbl2 { display: none; } }
.cp { color: var(--coral-l); }
.cd { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--gold-l); font-variant-numeric: tabular-nums; white-space: nowrap; }
button.ui-chip { border: 0; cursor: pointer; }
button.ui-chip:hover { box-shadow: inset 0 0 0 1px currentColor; }
.ui-chip.dashed.coral { outline-color: color-mix(in srgb, var(--coral) 60%, transparent); }
.ui-row .who { flex: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ui-toast .who { display: block; font: var(--fw-semibold) var(--fs-small) var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
.ui-toast b { color: var(--gold-l); font-weight: var(--fw-semibold); }

/* five-stage progress: QUOTED -> CHECKOUT -> BUYER ON PAYPAL -> CAPTURED -> TRACKED */
.qdots { display: inline-flex; gap: 2px; width: 46px; flex: none; }
.qdots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line2); }
.qdots i.d { background: color-mix(in srgb, var(--teal) 55%, var(--line2)); }
.qdots i.c { background: var(--teal); } .qdots i.c.g { background: var(--gold); } .qdots i.c.k { background: var(--ok); }
.steps { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
.steps li { font: var(--fw-semibold) var(--fs-small)/1.2 var(--font); color: var(--dim); padding: 5px 4px 0; border-top: 3px solid var(--line2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.done { color: var(--muted); border-color: color-mix(in srgb, var(--teal) 55%, var(--line2)); }
.steps li.cur { color: var(--text); border-color: var(--teal); }
.steps li.cur.gold { border-color: var(--gold); color: var(--gold-l); }
.steps li.cur.ok { border-color: var(--ok); color: var(--ok); }
.steps li.na { opacity: .5; }

/* price scale (layer 2): hatched below the floor, market band, ticks */
.scale { position: relative; height: 46px; margin: var(--sp-2) var(--sp-4) var(--sp-1); }
.scale .bar { position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--panel3); }
.scale .below { position: absolute; left: 0; top: 20px; height: 6px; border-radius: 3px 0 0 3px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--refuse) 40%, var(--panel3)) 0 4px, var(--panel3) 4px 8px); }
.scale .band { position: absolute; top: 18px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--market) 18%, transparent); border: 1px solid color-mix(in srgb, var(--market) 35%, transparent); }
.scale .tk { position: absolute; top: 13px; width: 0; height: 20px; transform: translateX(-50%); }
.scale .tk::before { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: currentColor; }
.scale .tk i { position: absolute; left: 50%; transform: translateX(-50%); font: var(--fw-semibold) var(--fs-small)/1 var(--mono); font-style: normal; white-space: nowrap; }
.scale .tk.up i { top: -13px; } .scale .tk.dn i { bottom: -14px; }
.scale .tk i.l { transform: translateX(calc(-100% + 4px)); } .scale .tk i.r { transform: translateX(-4px); }
.scale .tk.floor { color: var(--teal-l); } .scale .tk.floor::before { width: 3px; left: -1.5px; }
.scale .tk.list { color: var(--steel); }
.scale .tk.mkt { color: var(--market); } .scale .tk.mkt::before { background: repeating-linear-gradient(var(--market) 0 3px, transparent 3px 5px); }
.scale .tk.was { color: var(--dim); } .scale .tk.was::before { background: repeating-linear-gradient(var(--teal) 0 2px, transparent 2px 5px); opacity: .7; }
.scale .dot { position: absolute; top: 17px; width: 11px; height: 11px; border-radius: 50%; transform: translateX(-50%); background: var(--teal); box-shadow: 0 0 0 2px var(--panel); }
.scale .dot.sold { background: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 2px var(--sp-3); font-size: var(--fs-small); color: var(--dim); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; background: var(--c); }

/* layer 2 bodies: quote, item, impact */
.l2-top { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.l2-amt { font: var(--fw-semibold) var(--fs-title3) var(--mono); font-variant-numeric: tabular-nums; }
.l2-kv { margin-top: var(--sp-3); }
.l2-warn { margin-top: var(--sp-2); padding: 4px 8px; border-radius: var(--r-sm); font-size: var(--fs-small); color: var(--coral-l); background: color-mix(in srgb, var(--coral) 10%, transparent); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tl li { display: grid; grid-template-columns: 64px 92px minmax(0, 1fr); gap: var(--sp-2); align-items: baseline; font-size: var(--fs-small); }
.tl time { font-family: var(--mono); color: var(--dim); }
.tl .ui-chip { justify-self: start; }
.trackform { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
.trackform .ui-field { width: 160px; }
.ta { width: 100%; height: auto; min-height: 52px; padding: 6px 8px; resize: vertical; font: inherit; line-height: var(--lh); }
.btnrow { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
.imp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--fs-small); }
.imp li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-2); align-items: baseline; color: var(--muted); }

/* feed export sheet */
.fixbox { padding: var(--sp-2) var(--sp-3); border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--coral) 45%, var(--line)); background: color-mix(in srgb, var(--coral) 5%, var(--panel)); margin-bottom: var(--sp-3); }
pre.csv { margin: var(--sp-2) 0 0; padding: var(--sp-2) var(--sp-3); max-height: 140px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); font: var(--fs-small)/1.5 var(--mono); color: var(--teal-l); white-space: pre; }
.ui-table tr.skip td { color: var(--dim); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--coral) 60%, transparent); }

/* the approval window: a separate OS window (label `approval`), simulated over a dimmed desktop */
.aw-back { position: fixed; inset: var(--shell-h) 0 0 0; z-index: 8800; display: grid; place-items: center; padding: var(--sp-4); background: var(--scrim); backdrop-filter: blur(2px); }
.aw { width: min(600px, 100%); max-height: calc(100vh - var(--shell-h) - 32px); display: grid; grid-template-rows: var(--bar) minmax(0, 1fr) auto; background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 30%, transparent); overflow: hidden; animation: ui-fade var(--t-med) var(--ease); }
.aw-bar { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) 0 var(--sp-3); background: var(--material); border-bottom: 1px solid var(--line); color: var(--dim); font-size: var(--fs-small); }
.aw-bar .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aw-b { overflow: auto; padding: var(--sp-3) var(--sp-4) var(--sp-4); }
.aw-b h2 { font: var(--fw-semibold) var(--fs-title2)/1.25 var(--display); margin: 2px 0 var(--sp-1); }
.aw-b h2:focus { outline: none; }
.aw-b .ui-table { margin-top: var(--sp-3); }
.aw-f { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--line); }
.aw-f .ui-silence { flex: 1; min-width: 0; }
.checks { list-style: none; padding: 0; margin: var(--sp-3) 0 0; display: grid; gap: 3px; font-size: var(--fs-small); color: var(--muted); }
.checks li::before { content: "✓"; display: inline-block; width: 16px; color: var(--ok); font-weight: var(--fw-bold); }
.checks li.pend::before { content: "…"; color: var(--dim); }
.checks li.warn::before { content: "!"; color: var(--gold-l); }
.aw .notice { margin-top: var(--sp-3); }
/* the baseline folds the sidebar to its dots under 1180px when an inspector column is open; keep counts tidy there */
@media (max-width: 1180px) {
  .ui-split.has-insp .ui-sidebar { overflow-x: hidden; }
  .ui-split.has-insp .ui-sb-item { position: relative; justify-content: center; }
  .ui-split.has-insp .ui-sb-item .cnt:not(.need) { display: none; }
  .ui-split.has-insp .ui-sb-item .cnt.need { position: absolute; top: 1px; right: 1px; padding: 2px 4px; }
}
.ui-btn.primary .kbd, .ui-btn.gold .kbd { color: inherit; border-color: currentColor; opacity: .75; }
.ui-section-h .ui-seg { flex: none; }
.ui-seg button { white-space: nowrap; }

/* ---- variant 2 · Price rail: one shared axis (% of list), draggable floor handles, visitors alongside ---- */
#split { --inspector: 320px; }
.ui-pagehead h1:focus { outline: none; }
.railtool { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-2); min-width: 0; }
.facts { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.lanegrid { display: grid; grid-template-columns: 168px minmax(0, 1fr) 132px; column-gap: var(--sp-3); align-items: center; }
.axis { position: sticky; top: calc(-1 * var(--sp-4)); z-index: 3; height: 26px; padding: 0 var(--sp-3); background: var(--panel); border-bottom: 1px solid var(--line2); }
.axis .hd { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.axis .scale-h { position: relative; height: 100%; }
.axis .scale-h span { position: absolute; top: 6px; transform: translateX(-50%); font: var(--fw-semibold) var(--fs-small)/1 var(--mono); color: var(--dim); white-space: nowrap; }
.axis .scale-h span.list { color: var(--steel); }
.lane { height: 40px; padding: 0 var(--sp-3); border-top: 1px solid var(--line); position: relative; }
#lanes .lane:first-child { border-top: 0; }
.lane:hover { background: var(--hover); }
.lane.hl { background: var(--sel); }
.lane.draft { box-shadow: inset 2px 0 0 var(--gold); }
.lane.bad { box-shadow: inset 2px 0 0 var(--refuse); }
.lane.flash { animation: flash 1.2s var(--ease); }
@keyframes flash { 0%, 60% { background: color-mix(in srgb, var(--coral) 16%, transparent); } }
.lt { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ititle { background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; font: inherit; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ititle:hover { color: var(--teal-l); }
.lane.oos .ititle { color: var(--dim); }
.track { position: relative; height: 40px; touch-action: none; }
.track .grid i { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.track .grid i.list { width: 2px; background: color-mix(in srgb, var(--steel) 50%, transparent); }
.track .base { position: absolute; left: 0; right: 0; top: 18px; height: 5px; border-radius: 3px; background: var(--panel3); }
.track .zone { position: absolute; left: 0; top: 18px; height: 5px; border-radius: 3px 0 0 3px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--refuse) 45%, var(--panel3)) 0 4px, var(--panel3) 4px 8px); }
.track .band { position: absolute; top: 14px; height: 13px; border-radius: 4px; background: color-mix(in srgb, var(--market) 16%, transparent); border: 1px solid color-mix(in srgb, var(--market) 35%, transparent); }
.track .med { position: absolute; top: 16px; width: 9px; height: 9px; transform: translateX(-50%) rotate(45deg); background: var(--market); }
.track .ghost { position: absolute; top: 8px; bottom: 8px; width: 0; border-left: 2px dashed color-mix(in srgb, var(--teal) 60%, transparent); }
.track .pin { position: absolute; top: 15px; width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; transform: translateX(-50%); background: var(--coral); box-shadow: 0 0 0 2px var(--panel); cursor: pointer; z-index: 1; }
.track .pin.sold { background: var(--ok); }
.track .pin.dead { background: var(--panel); box-shadow: 0 0 0 2px var(--panel), inset 0 0 0 2px var(--dim); }
.track .pin i { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: var(--fw-semibold) var(--fs-small)/1 var(--mono); font-style: normal; white-space: nowrap; color: var(--coral-l); }
.track .pin.hl { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--coral-l); }
.track .off { position: absolute; top: 12px; left: 0; font: var(--fw-semibold) var(--fs-small) var(--mono); color: var(--teal-l); }
.track .fixed { position: absolute; inset: 0; display: flex; align-items: center; color: var(--dim); font-size: var(--fs-small); }
.handle { position: absolute; top: 4px; width: 16px; height: 32px; transform: translateX(-50%); cursor: ew-resize; border-radius: 5px; outline: none; z-index: 2; }
.handle::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 6px; transform: translateX(-50%); border-radius: 3px; background: var(--teal); box-shadow: 0 0 0 2px var(--panel); }
.lane.draft .handle::before { background: var(--gold); }
.handle:focus-visible::before { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--focus); }
.handle.drag::before { width: 8px; }
.handle i { display: none; position: absolute; bottom: calc(100% - 4px); left: 50%; transform: translateX(-50%); padding: 1px 5px; border-radius: 4px; background: var(--panel2); box-shadow: var(--shadow-2); font: var(--fw-semibold) var(--fs-small)/1.3 var(--mono); font-style: normal; color: var(--teal-l); white-space: nowrap; }
.handle:hover i, .handle:focus-visible i, .handle.drag i { display: block; }
.lane.draft .handle i { color: var(--gold-l); }
.ro { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.ro .ui-field { width: 58px; height: 22px; text-align: right; font: var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; }
.lane.draft .ro .ui-field { border-color: var(--gold); color: var(--gold-l); }
.lane.bad .ro .ui-field { border-color: var(--refuse); }
.ro [data-ros] { width: 72px; flex: none; display: inline-flex; justify-content: flex-end; }
.ro .vm { font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ro .ui-btn.plain { padding: 0; color: var(--gold-l); }
.vm.over, .vm.above { color: var(--gold-l); } .vm.under, .vm.at { color: var(--muted); } .vm.none { color: var(--dim); }
.dock { position: sticky; bottom: var(--sp-3); z-index: 6; display: flex; justify-content: center; pointer-events: none; margin-top: var(--sp-3); }
.dock .in { pointer-events: auto; display: flex; align-items: center; gap: var(--sp-2); height: var(--bar); padding: 0 6px 0 var(--sp-3); border-radius: var(--r-lg); background: var(--panel2); box-shadow: var(--shadow-2); max-width: 100%; min-width: 0; }
.dock.on .in { box-shadow: var(--shadow-2), inset 0 0 0 1px var(--gold); }
.dock .txt2 { font-size: var(--fs-small); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dock .ui-silence { flex: none; }
/* visitors column (layer 1) */
.visitors { padding: var(--sp-4) var(--sp-3) var(--sp-6); }
.visitors .ui-section:first-child { margin-top: 0; }
.vrow { padding-right: 0; gap: var(--sp-1); }
.vrow > .ui-btn.icon { width: 20px; }
.vrow .t1 .amt { float: right; margin-left: var(--sp-2); }
.vrow .t2 { display: flex; align-items: center; gap: 6px; }
.vrow .t2 .ui-silence { flex: 1; min-width: 0; }
.vrow.hl { background: var(--sel); }
.visitors .ui-proto { margin-top: var(--sp-3); }
@media (max-width: 1180px) { .lanegrid { grid-template-columns: 132px minmax(0, 1fr) 124px; } .dock .ui-silence { display: none; } }
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar" id="top"></header>
  <div class="ui-split has-insp" id="split">
    <nav class="ui-sidebar" id="rail" aria-label="Modules"></nav>
    <main class="ui-main" id="view" tabindex="-1">
      <div class="ui-pagehead"><h1 tabindex="-1">Counter</h1><span class="sub">every floor on one rail, as a share of its list price</span>
        <div class="actions"><button class="ui-btn sm plain" data-act="legend" aria-label="Legend and keys">Legend ⓘ</button><button class="ui-btn sm" data-act="s2" id="s2btn"></button><button class="ui-btn sm" data-act="feed">Export feed</button></div></div>
      <div class="railtool"><span class="ui-hint">floors vs market</span><span id="facts" class="facts"></span><span class="ui-spacer"></span>
        <div class="ui-seg" role="group" aria-label="Lane order"><button data-act="sort" data-s="attention" aria-pressed="true">Look first</button><button data-act="sort" data-s="gap" aria-pressed="false">Floor − median</button><button data-act="sort" data-s="catalog" aria-pressed="false">Catalog</button></div></div>
      <section class="ui-group railbox" aria-label="Floor rail">
        <div class="axis lanegrid" id="axis" aria-hidden="true"></div>
        <div id="lanes"></div>
      </section>
      <div class="dock" id="dock" aria-live="polite"></div>
    </main>
    <aside class="ui-inspector visitors" id="vis" aria-label="At your counter"></aside>
  </div>
</div>
<script>
(() => {
'use strict';
/* ===== shared core (same in the three Counter variants): data, money, clock, quote lifecycle, S-2 draft,
   approval hand-off, feed export, window chrome and the layer-2 surfaces (quote, item, note, impact, S-2).
   Each variant declares render(), showQuote(id), showItem(sku) and onEsc() below the core. ===== */
const F = window.FIX;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = UI.esc;
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = n => String(n).padStart(2, '0');
const later = (ms, fn) => setTimeout(fn, REDUCE ? Math.min(ms, 60) : ms);

/* Money is integer cents, parsed from strings; no float arithmetic on amounts. */
const toC = n => { if (n == null) return null; const m = String(n).match(/^(\d+)(?:\.(\d{1,2}))?$/); return m ? parseInt(m[1], 10) * 100 + parseInt(((m[2] || '') + '00').slice(0, 2), 10) : null; };
const parseMoney = s => { const m = String(s).trim().replace(/^\$\s*/, '').replace(/,/g, '').match(/^(\d{1,6})(?:\.(\d{0,2}))?$/); return m ? parseInt(m[1], 10) * 100 + parseInt(((m[2] || '') + '00').slice(0, 2), 10) : null; };
const fmt = c => c == null ? '—' : (c < 0 ? '−' : '') + '$' + Math.floor(Math.abs(c) / 100).toLocaleString('en-US') + '.' + pad(Math.abs(c) % 100);
const fmt0 = c => c == null ? '—' : (Math.abs(c) % 100 ? fmt(c) : (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toLocaleString('en-US'));
const plain = c => Math.floor(c / 100) + (c % 100 ? '.' + pad(c % 100) : '');

/* Clock: the dataset's snapshot (Thu 29 Oct 14:02) advancing in real time; "+5 min" skews it. */
const MIN = 60000;
const T0 = new Date(F.nowISO).getTime();
const REAL0 = Date.now();
let skew = 0;
const now = () => T0 + (Date.now() - REAL0) + skew;
const at = (h, m) => { const d = new Date(T0); d.setHours(h, m, 0, 0); return d.getTime(); };
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hms = t => { const d = new Date(t); return hm(t) + ':' + pad(d.getSeconds()); };
const left = ms => { if (ms <= 0) return '0:00'; const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); };

/* Catalog fields the dataset lacks but the feed export needs (fictional shop, sandbox).
   'calibration' keeps a description under 25 chars: the dataset's one feed issue. */
const DESC = {
  'monitor-27-4k': 'Refurbished 27-inch 4K IPS panel, graded A, tested for dead pixels, 12-month shop warranty.',
  'monitor-24-ips': 'Refurbished 24-inch 1080p IPS monitor, graded A, tested, 12-month shop warranty.',
  'monitor-27-qhd': 'Refurbished 27-inch QHD monitor, 2560x1440, graded A, 12-month shop warranty.',
  'monitor-32-4k': 'Refurbished 32-inch 4K monitor, graded A, height-adjustable stand, 12-month warranty.',
  'monitor-arm': 'Single gas-spring monitor arm, VESA 75/100, desk clamp or grommet, holds 2-9 kg.',
  'monitor-arm-dual': 'Dual gas-spring monitor arm for two screens up to 27 inches, VESA 75/100.',
  'usb-c-dock': 'USB-C dock with 96 W pass-through charging, two DisplayPort outputs and gigabit LAN.',
  'dp-cable-2m': 'DisplayPort 1.4 cable, 2 metres, supports 4K at 144 Hz and 8K at 60 Hz.',
  'hdmi-21': 'HDMI 2.1 cable, 2 metres, 48 Gbps, supports 4K at 120 Hz.',
  'wipe-kit': 'Screen-wipe kit: anti-static spray, two microfibre cloths, safe for matte panels.',
  'calibration': 'Panel calibration.',
  'care-plan': 'Monthly care plan for any monitor bought here: dead-pixel swap and remote support.'
};

  const c = $(`[data-desc-count="${ta.dataset.desc}"]`, host); if (c) c.textContent = ta.value.replace(/\s+/g, ' ').trim().length + ' / 25';
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-track]'); if (!f) return;
  e.preventDefault();
  const pop = f.closest('.ui-popover');
  if (addTracking(f.dataset.track, $('input', f).value) && pop && UI.open) document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
});
document.addEventListener('keydown', e => {
  if (S.aw) {
    if (e.key === 'Escape') { e.preventDefault(); closeAw(); return; }
    if (e.key === 'Tab') { const f = $$('button:not([disabled]), a[href], [tabindex="-1"]', AWL).filter(x => x.offsetParent); if (!f.length) return; const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    return;
  }
  if (UI.open) return;
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openApproval(); return; }
  if (e.key === 'Escape') {
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) { ae.blur(); return; }
    if (onEsc()) return;
    if (draftDiff().length && !S.escArm) { S.escArm = true; toast('Your floor draft is not signed. Esc again goes back to The Table; the draft stays on this screen only.', 'gold'); return; }
    location.href = '../../../index.html#home';
  }
});
setInterval(tick, 1000);

/* ===== variant 2 · Price rail: every item on one shared axis (% of its list price). Floors are handles you drag;
   market sits as a band and a diamond; quotes sit on the same lane as pins. The people at the counter ride in
   the right column. Layer 2 is a sheet: an item (title, Enter on a handle) or a quote (pin, › on a visitor). ===== */
const LO = 60, HI = 110;
const V = { sort: 'attention', hl: null, focusH: null };
const pos = pct => Math.max(0, Math.min(100, (pct - LO) / (HI - LO) * 100));
const pctOf = (it, c) => c / it.priceC * 100;
const P = (it, c) => pos(pctOf(it, c)).toFixed(2) + '%';
const minFloor = it => Math.max(100, Math.ceil(it.priceC * LO / 100 / 100) * 100);

function attention(it) {
  if (orders.some(o => o.sku === it.sku && isLive(o))) return 0;
  if (it.sub) return 6;
  const c = vsMarket(it, S.draft[it.sku]).cls;
  if (c === 'over' || c === 'above') return 1;
  if (feedIssues(it).length) return 2;
  if (it.avail === 'out_of_stock') return 5;
  return S.draft[it.sku] !== S.signed[it.sku] ? 3 : 4;
}
function sorted() {
  const list = items.slice();
  if (V.sort === 'attention') list.sort((a, b) => attention(a) - attention(b));
  if (V.sort === 'gap') { const g = it => { const m = market(it), f = S.draft[it.sku]; return m && f != null ? (f - m.med) / it.priceC : -9; }; list.sort((a, b) => g(b) - g(a)); }
  return list;
}

/* ---- the visitors column (layer 1: who · item · amount · state · default on silence) ---- */
function vsil(o) {
  if (o.stage === 'QUOTED') return `lapses <b>${hm(o.expiresAt)}</b> · <span data-cd="${o.expiresAt}">${left(o.expiresAt - now())}</span>`;
  if (o.stage === 'AWAITING BUYER APPROVAL') return 'silent → <b>expires</b>';
  return 'order being created';
}
function visitorRow(o) {
  const it = IT[o.sku];
  return `<div class="ui-row two act vrow ${V.hl === o.sku ? 'hl' : ''}" data-hl="${o.sku}" tabindex="0" title="Show ${esc(short(it))} on the rail">
    <span class="main"><span class="t1"><span class="amt">${fmt(o.amtC)}</span><span class="cp">${esc(walletName(o.cp))}</span> · ${esc(short(it))}</span>
      <span class="t2">${o.stage === 'AWAITING BUYER APPROVAL' ? '<span class="ui-chip gold" data-tip="their owner approves on PayPal, in their own browser">On PayPal</span>' : chipHTML(o)}<span class="ui-silence" title="${esc(silence(o) || '')}">${vsil(o)}</span>${underDraft(o) ? '<span class="ui-chip coral" data-tip="Your draft floor is above this quote. Signing withdraws it; no money moves.">withdraws</span>' : ''}${noteChip(o)}</span></span>
    <button class="ui-btn plain icon" data-act="quote" data-id="${o.id}" aria-label="${o.id} details">›</button></div>`;
}
function pastRow(o) {
  const it = IT[o.sku];
  return `<div class="ui-row act" data-act="quote" data-id="${o.id}" tabindex="0"><span class="id">${o.id}</span><span class="main"><span class="t1">${esc(short(it))} <span class="dim">· ${esc(walletName(o.cp))}</span></span></span>${chipHTML(o)}<span class="amt ${isDone(o) ? 'okc' : 'dim'}">${fmt0(o.amtC)}</span></div>`;
}
function renderVisitors() {
  const live = orders.filter(isLive), past = orders.filter(o => !isLive(o));
  $('#vis').innerHTML = `<section class="ui-section"><div class="ui-section-h"><h2>At your counter</h2><span class="end">${live.length} live · none waits for you</span></div>
      <div class="ui-group">${live.length ? live.map(visitorRow).join('') : '<div class="ui-empty">Nobody is at your counter right now.</div>'}</div></section>
    <section class="ui-section"><div class="ui-section-h"><h2>Earlier this week</h2><span class="end">${past.length}</span></div>
      <div class="ui-group">${past.map(pastRow).join('')}</div></section>
    ${protoHTML()}
    <div class="ui-hint" style="margin-top:var(--sp-2)">Click a visitor to find its item on the rail.</div>`;
}

/* ---- the rail ---- */
function trackHTML(it) {
  const grid = `<div class="grid">${[60, 70, 80, 90, 100, 110].map(p => `<i class="${p === 100 ? 'list' : ''}" style="left:${pos(p)}%"></i>`).join('')}</div>`;
  if (S.signed[it.sku] == null) return grid + `<div class="fixed">fixed ${fmt0(it.priceC)}/mo · always quoted at list · no floor</div>`;
  const f = S.draft[it.sku], w = S.signed[it.sku], m = market(it);
  let h = grid + `<div class="base"></div><div class="zone" data-zone style="width:${P(it, f)}"></div>`;
  if (m && m.p25 != null) h += `<div class="band" style="left:${P(it, m.p25)};width:calc(${P(it, m.p75)} - ${P(it, m.p25)})" title="market p25–p75 ${fmt0(m.p25)}–${fmt0(m.p75)}"></div>`;
  if (m) h += `<div class="med" style="left:${P(it, m.med)}" title="market median ${fmt0(m.med)}"></div>`;
  h += `<div class="ghost" data-ghost style="left:${P(it, w)}" ${w === f ? 'hidden' : ''} title="signed floor ${fmt0(w)}"></div>`;
  orders.filter(o => o.sku === it.sku).forEach(o => {
    const cls = isLive(o) ? '' : isDone(o) ? 'sold' : 'dead';
    h += `<button class="pin ${cls} ${V.hl === it.sku && isLive(o) ? 'hl' : ''}" data-act="quote" data-id="${o.id}" style="left:${P(it, o.amtC)}" aria-label="${esc(o.id)} · ${esc(walletName(o.cp))} ${fmt(o.amtC)} · ${esc(stChip(o)[1])}">${isLive(o) ? `<i>${esc(walletName(o.cp))} ${fmt0(o.amtC)}</i>` : ''}</button>`;
  });
  if (pctOf(it, f) < LO) h += `<span class="off">◂ ${fmt0(f)}</span>`;
  h += `<div class="handle" data-h="${it.sku}" role="slider" tabindex="0" aria-label="Floor for ${esc(it.title)}" aria-valuemin="1" aria-valuemax="${plain(it.priceC)}" aria-valuenow="${plain(f)}" aria-valuetext="${fmt0(f)}, ${Math.round(pctOf(it, f))}% of list" style="left:${P(it, f)}"><i>${fmt0(f)} · ${Math.round(pctOf(it, f))}%</i></div>`;
  return h;
}
function roNote(it) {
  const f = S.draft[it.sku], w = S.signed[it.sku], bad = S.bad[it.sku];
  if (w == null) return '<span class="vm none">no floor</span>';
  if (bad) return `<span class="ui-chip red" data-tip="${esc(bad.err)}">fix</span>`;
  if (f !== w) return `<button class="ui-btn sm plain" data-act="revert" data-sku="${it.sku}" data-tip="Back to the signed floor">↺ ${fmt0(w)}</button>`;
  const vm = vmShort(it, f);
  return `<span class="vm ${vm.cls}" data-tip="${esc(vsMarket(it, f).txt)}">${esc(vm.txt)}</span>`;
}
function laneHTML(it) {
  const iss = feedIssues(it);
  const cls = ['lane', 'lanegrid', S.draft[it.sku] !== S.signed[it.sku] ? 'draft' : '', S.bad[it.sku] ? 'bad' : '', it.avail === 'out_of_stock' ? 'oos' : '', V.hl === it.sku ? 'hl' : ''].join(' ');
  return `<div class="${cls}" data-lane="${it.sku}">
    <div class="lt"><button class="ititle" data-act="item" data-sku="${it.sku}" title="${esc(it.title)} · ${esc(it.sku)}">${esc(short(it))}</button>${it.avail === 'out_of_stock' ? '<span class="ui-chip" data-tip="out of stock · not quoted">out</span>' : ''}${iss.length ? `<button class="ui-chip coral" data-act="feed" data-tip="${esc(iss.join(' · '))}">fix ›</button>` : ''}</div>
    <div class="track" data-track-sku="${it.sku}">${trackHTML(it)}</div>
    <div class="ro">${S.signed[it.sku] != null ? `<input class="ui-field" id="fi-${it.sku}" data-floor="${it.sku}" inputmode="decimal" autocomplete="off" value="${esc(S.bad[it.sku] ? S.bad[it.sku].text : plain(S.draft[it.sku]))}" aria-label="Floor for ${esc(it.title)} in dollars">` : ''}<span data-ros="${it.sku}">${roNote(it)}</span></div>
  </div>`;
}
function renderFacts() {
  const c = { over: 0, above: 0, under: 0, at: 0, none: 0 };
  items.filter(it => S.signed[it.sku] != null).forEach(it => { c[vsMarket(it, S.draft[it.sku]).cls]++; });
  $('#facts').innerHTML = `<span class="ui-chip ${c.over ? 'gold' : ''}">${c.over} over range</span><span class="ui-chip ${c.above ? 'gold' : ''}">${c.above} over median</span><span class="ui-chip">${c.under + c.at} at or under</span><span class="ui-chip dashed">${c.none} no reference</span>`;
}
function renderRail() {
  const fx = document.activeElement && document.activeElement.id;
  $('#lanes').innerHTML = sorted().map(laneHTML).join('');
  renderFacts();
  if (fx) { const el = document.getElementById(fx); if (el) el.focus({ preventScroll: true }); }
  if (V.focusH) { const el = $(`[data-h="${V.focusH}"]`); if (el) el.focus({ preventScroll: true }); V.focusH = null; }
}
function renderDock() {
  const diff = draftDiff(), errs = draftErrors(), on = diff.length || errs.length, D = $('#dock');
  D.className = 'dock' + (on ? ' on' : '');
  D.innerHTML = on ? `<div class="in"><span class="ui-chip gold">S-2 v${S.v + 1} draft</span><span class="txt2">${diff.length} moved${diff.length ? ': ' + diff.map(d => `${esc(short(d.it))} <span class="money gold">${fmt0(d.from)}→${fmt0(d.to)}</span>`).join(' · ') : ''}</span>
      ${errs.length ? `<span class="ui-chip red" data-tip="${esc(errs.map(x => short(x.it) + ': ' + x.err).join(' · '))}">${errs.length} to fix</span>` : ''}${impactChip()}
      <span class="ui-silence">silent → <b>v${S.v} stays</b></span>
      <button class="ui-btn sm" data-act="discard">Revert all</button><button class="ui-btn sm gold" data-act="sign" ${errs.length || !diff.length ? 'disabled' : ''}>Review &amp; sign in approval ↗</button></div>`
    : `<div class="in"><span class="ui-chip line">S-2 v${S.v} in force</span><span class="txt2">drag a handle to draft a floor · only the approval window signs</span></div>`;
}
/* partial update while dragging: the handle element must survive (pointer capture) */
function liveUpdate(sku) {
  const it = IT[sku], lane = $(`[data-lane="${sku}"]`); if (!lane) return;
  const f = S.draft[sku], w = S.signed[sku];
  lane.classList.toggle('draft', f !== w); lane.classList.toggle('bad', !!S.bad[sku]);
  const h = $('[data-h]', lane); h.style.left = P(it, f); $('i', h).textContent = `${fmt0(f)} · ${Math.round(pctOf(it, f))}%`;
  h.setAttribute('aria-valuenow', plain(f)); h.setAttribute('aria-valuetext', `${fmt0(f)}, ${Math.round(pctOf(it, f))}% of list`);
  $('[data-zone]', lane).style.width = P(it, f);
  $('[data-ghost]', lane).hidden = f === w;
  const inp = $(`#fi-${sku}`); if (inp && document.activeElement !== inp) inp.value = plain(f);
  $(`[data-ros="${sku}"]`).innerHTML = roNote(it);
  renderDock(); renderFacts(); renderVisitors(); refreshL2();
}
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-h]'); if (!h || S.aw || UI.open) return;
  e.preventDefault(); h.focus();
  drag = { sku: h.dataset.h, h, rect: h.parentElement.getBoundingClientRect() };
  try { h.setPointerCapture(e.pointerId); } catch (err) { /* synthetic event */ }
  h.classList.add('drag');
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const it = IT[drag.sku], pct = LO + (e.clientX - drag.rect.left) / drag.rect.width * (HI - LO);
  let c = Math.round(it.priceC * pct / 10000) * 100;
  c = Math.max(minFloor(it), Math.min(it.priceC, c));
  if (c !== S.draft[drag.sku]) { setDraft(drag.sku, c); liveUpdate(drag.sku); }
});
const endDrag = () => { if (!drag) return; const sku = drag.sku; drag.h.classList.remove('drag'); drag = null; V.focusH = sku; renderRail(); };
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  if (S.aw || UI.open) return;
  const h = e.target.closest && e.target.closest('[data-h]');
  if (h) {
    const sku = h.dataset.h, it = IT[sku], step = e.shiftKey ? 1000 : 100;
    const k = { ArrowLeft: -step, ArrowDown: -step, ArrowRight: step, ArrowUp: step, PageDown: -500, PageUp: 500 }[e.key];
    if (k) { e.preventDefault(); setDraft(sku, Math.max(100, Math.min(it.priceC, S.draft[sku] + k))); liveUpdate(sku); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); S.draft[sku] = S.signed[sku]; delete S.bad[sku]; liveUpdate(sku); return; }
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openItem(sku); return; }
  }
  const q = e.target.closest && e.target.closest('div[data-act="quote"]');
  if (q && e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); showQuote(q.dataset.id); return; }
  const v = e.target.closest && e.target.closest('[data-hl]');
  if (v && e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); highlight(v.dataset.hl); }
});
document.addEventListener('input', e => {
  const inp = e.target.closest('[data-floor]');
  if (inp) { setDraftText(inp.dataset.floor, inp.value); liveUpdate(inp.dataset.floor); }
});
document.addEventListener('focusout', e => {
  const inp = e.target.closest && e.target.closest('[data-floor]');
  if (inp && !S.bad[inp.dataset.floor]) inp.value = plain(S.draft[inp.dataset.floor]);
});
/* a click on a visitor row (not on its chips or buttons) finds its item on the rail */
document.addEventListener('click', e => {
  if (e.target.closest('button, input, a')) return;
  const v = e.target.closest('[data-hl]'); if (v) highlight(v.dataset.hl);
});
function highlight(sku) {
  V.hl = sku; renderVisitors(); renderRail();
  const lane = $(`[data-lane="${sku}"]`); if (!lane) return;
  lane.scrollIntoView({ block: 'center', behavior: REDUCE ? 'auto' : 'smooth' });
  lane.classList.remove('flash'); void lane.offsetWidth; lane.classList.add('flash');
  const h = $('[data-h]', lane); if (h) h.focus({ preventScroll: true });
}
const LEGEND = `<div class="legend" style="margin-bottom:var(--sp-2)"><span style="--c:var(--teal)">floor · drag</span><span style="--c:var(--gold)">draft floor</span><span style="--c:color-mix(in srgb, var(--market) 40%, transparent)">market p25–p75 · ◆ median</span><span style="--c:var(--coral)">live quote</span><span style="--c:var(--ok)">sold</span><span style="--c:color-mix(in srgb, var(--refuse) 45%, var(--panel3))">hatched: the agent can’t quote</span></div>
  <dl class="ui-kv"><dt>Axis</dt><dd>60–110% of each item’s own list price; a lower floor shows ◂ and is typed</dd><dt>Handle</dt><dd>←/→ ±$1 · Shift ±$10 · Delete reverts · Enter opens the item</dd><dt>Review</dt><dd>Ctrl+Enter opens the draft in the approval window</dd><dt>Never</dt><dd>a quote below a floor can’t be produced, so it has no error state</dd></dl>`;
Object.assign(ACT, {
  sort: el => { V.sort = el.dataset.s; $$('[data-act="sort"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); renderRail(); },
  legend: el => UI.popover(el, LEGEND, { title: 'Reading the rail' })
});
function showQuote(id) { openQuote(id); }
function showItem(sku) { openItem(sku); }
function onEsc() { if (V.hl) { V.hl = null; renderVisitors(); renderRail(); return true; } return false; }
function render() { chrome(); renderVisitors(); renderRail(); renderDock(); $('#s2btn').textContent = `S-2 v${S.v} · ${S.commit}`; }
$('#axis').innerHTML = `<span class="hd">Item</span><div class="scale-h">${[60, 70, 80, 90, 100, 110].map(p => `<span class="${p === 100 ? 'list' : ''}" style="left:${pos(p)}%">${p === 100 ? 'list' : p + '%'}</span>`).join('')}</div><span class="hd" style="text-align:right">Floor · S-2</span>`;
render();

})();
</script>
