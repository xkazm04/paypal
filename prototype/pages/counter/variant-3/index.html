<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter · journal and floor walk</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---- Counter core (identical in the three variants): what the v2 baseline has no component for ---- */
body { overflow: hidden; }
.tb-meter { font-size: var(--fs-small); color: var(--dim); white-space: nowrap; }
.tb-meter b { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.tb-meter.eng { padding-left: var(--sp-3); border-left: 1px solid var(--line2); }
.tb-clock { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 1180px) { .tb-meter .lbl2 { display: none; } }
.cp { color: var(--coral-l); }
.cd { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--gold-l); font-variant-numeric: tabular-nums; white-space: nowrap; }
button.ui-chip { border: 0; cursor: pointer; }
button.ui-chip:hover { box-shadow: inset 0 0 0 1px currentColor; }
.ui-chip.dashed.coral { outline-color: color-mix(in srgb, var(--coral) 60%, transparent); }
.ui-row .who { flex: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ui-toast .who { display: block; font: var(--fw-semibold) var(--fs-small) var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
.ui-toast b { color: var(--gold-l); font-weight: var(--fw-semibold); }

/* five-stage progress: QUOTED -> CHECKOUT -> BUYER ON PAYPAL -> CAPTURED -> TRACKED */
.qdots { display: inline-flex; gap: 2px; width: 46px; flex: none; }
.qdots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line2); }
.qdots i.d { background: color-mix(in srgb, var(--teal) 55%, var(--line2)); }
.qdots i.c { background: var(--teal); } .qdots i.c.g { background: var(--gold); } .qdots i.c.k { background: var(--ok); }
.steps { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
.steps li { font: var(--fw-semibold) var(--fs-small)/1.2 var(--font); color: var(--dim); padding: 5px 4px 0; border-top: 3px solid var(--line2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.done { color: var(--muted); border-color: color-mix(in srgb, var(--teal) 55%, var(--line2)); }
.steps li.cur { color: var(--text); border-color: var(--teal); }
.steps li.cur.gold { border-color: var(--gold); color: var(--gold-l); }
.steps li.cur.ok { border-color: var(--ok); color: var(--ok); }
.steps li.na { opacity: .5; }

/* price scale (layer 2): hatched below the floor, market band, ticks */
.scale { position: relative; height: 46px; margin: var(--sp-2) var(--sp-4) var(--sp-1); }
.scale .bar { position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--panel3); }
.scale .below { position: absolute; left: 0; top: 20px; height: 6px; border-radius: 3px 0 0 3px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--refuse) 40%, var(--panel3)) 0 4px, var(--panel3) 4px 8px); }
.scale .band { position: absolute; top: 18px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--market) 18%, transparent); border: 1px solid color-mix(in srgb, var(--market) 35%, transparent); }
.scale .tk { position: absolute; top: 13px; width: 0; height: 20px; transform: translateX(-50%); }
.scale .tk::before { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: currentColor; }
.scale .tk i { position: absolute; left: 50%; transform: translateX(-50%); font: var(--fw-semibold) var(--fs-small)/1 var(--mono); font-style: normal; white-space: nowrap; }
.scale .tk.up i { top: -13px; } .scale .tk.dn i { bottom: -14px; }
.scale .tk i.l { transform: translateX(calc(-100% + 4px)); } .scale .tk i.r { transform: translateX(-4px); }
.scale .tk.floor { color: var(--teal-l); } .scale .tk.floor::before { width: 3px; left: -1.5px; }
.scale .tk.list { color: var(--steel); }
.scale .tk.mkt { color: var(--market); } .scale .tk.mkt::before { background: repeating-linear-gradient(var(--market) 0 3px, transparent 3px 5px); }
.scale .tk.was { color: var(--dim); } .scale .tk.was::before { background: repeating-linear-gradient(var(--teal) 0 2px, transparent 2px 5px); opacity: .7; }
.scale .dot { position: absolute; top: 17px; width: 11px; height: 11px; border-radius: 50%; transform: translateX(-50%); background: var(--teal); box-shadow: 0 0 0 2px var(--panel); }
.scale .dot.sold { background: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 2px var(--sp-3); font-size: var(--fs-small); color: var(--dim); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; background: var(--c); }

/* layer 2 bodies: quote, item, impact */
.l2-top { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.l2-amt { font: var(--fw-semibold) var(--fs-title3) var(--mono); font-variant-numeric: tabular-nums; }
.l2-kv { margin-top: var(--sp-3); }
.l2-warn { margin-top: var(--sp-2); padding: 4px 8px; border-radius: var(--r-sm); font-size: var(--fs-small); color: var(--coral-l); background: color-mix(in srgb, var(--coral) 10%, transparent); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tl li { display: grid; grid-template-columns: 64px 92px minmax(0, 1fr); gap: var(--sp-2); align-items: baseline; font-size: var(--fs-small); }
.tl time { font-family: var(--mono); color: var(--dim); }
.tl .ui-chip { justify-self: start; }
.trackform { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
.trackform .ui-field { width: 160px; }
.ta { width: 100%; height: auto; min-height: 52px; padding: 6px 8px; resize: vertical; font: inherit; line-height: var(--lh); }
.btnrow { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
.imp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--fs-small); }
.imp li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-2); align-items: baseline; color: var(--muted); }

/* feed export sheet */
.fixbox { padding: var(--sp-2) var(--sp-3); border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--coral) 45%, var(--line)); background: color-mix(in srgb, var(--coral) 5%, var(--panel)); margin-bottom: var(--sp-3); }
pre.csv { margin: var(--sp-2) 0 0; padding: var(--sp-2) var(--sp-3); max-height: 140px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); font: var(--fs-small)/1.5 var(--mono); color: var(--teal-l); white-space: pre; }
.ui-table tr.skip td { color: var(--dim); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--coral) 60%, transparent); }

/* the approval window: a separate OS window (label `approval`), simulated over a dimmed desktop */
.aw-back { position: fixed; inset: var(--shell-h) 0 0 0; z-index: 8800; display: grid; place-items: center; padding: var(--sp-4); background: var(--scrim); backdrop-filter: blur(2px); }
.aw { width: min(600px, 100%); max-height: calc(100vh - var(--shell-h) - 32px); display: grid; grid-template-rows: var(--bar) minmax(0, 1fr) auto; background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 30%, transparent); overflow: hidden; animation: ui-fade var(--t-med) var(--ease); }
.aw-bar { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) 0 var(--sp-3); background: var(--material); border-bottom: 1px solid var(--line); color: var(--dim); font-size: var(--fs-small); }
.aw-bar .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aw-b { overflow: auto; padding: var(--sp-3) var(--sp-4) var(--sp-4); }
.aw-b h2 { font: var(--fw-semibold) var(--fs-title2)/1.25 var(--display); margin: 2px 0 var(--sp-1); }
.aw-b h2:focus { outline: none; }
.aw-b .ui-table { margin-top: var(--sp-3); }
.aw-f { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--line); }
.aw-f .ui-silence { flex: 1; min-width: 0; }
.checks { list-style: none; padding: 0; margin: var(--sp-3) 0 0; display: grid; gap: 3px; font-size: var(--fs-small); color: var(--muted); }
.checks li::before { content: "✓"; display: inline-block; width: 16px; color: var(--ok); font-weight: var(--fw-bold); }
.checks li.pend::before { content: "…"; color: var(--dim); }
.checks li.warn::before { content: "!"; color: var(--gold-l); }
.aw .notice { margin-top: var(--sp-3); }
/* the baseline folds the sidebar to its dots under 1180px when an inspector column is open; keep counts tidy there */
@media (max-width: 1180px) {
  .ui-split.has-insp .ui-sidebar { overflow-x: hidden; }
  .ui-split.has-insp .ui-sb-item { position: relative; justify-content: center; }
  .ui-split.has-insp .ui-sb-item .cnt:not(.need) { display: none; }
  .ui-split.has-insp .ui-sb-item .cnt.need { position: absolute; top: 1px; right: 1px; padding: 2px 4px; }
}
.ui-btn.primary .kbd, .ui-btn.gold .kbd { color: inherit; border-color: currentColor; opacity: .75; }
.ui-section-h .ui-seg { flex: none; }
.ui-seg button { white-space: nowrap; }

/* ---- variant 3 · Journal and floor walk: the counter as a transcript, the floors as a keyboard walk ---- */
.ui-pagehead h1:focus { outline: none; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
.walk { position: sticky; top: 0; }
/* journal (layer 1): one head row per thread, one line per step */
.thread + .thread { margin-top: var(--sp-2); }
.thread.live { border-color: color-mix(in srgb, var(--coral) 40%, var(--line)); }
.th-head .amt { width: 64px; }
.th-head .cd { width: 36px; text-align: right; }
.ev { gap: var(--sp-2); font-size: var(--fs-small); background: var(--bg2); }
.ev time { width: 62px; flex: none; font-family: var(--mono); color: var(--dim); }
.ev .actor { width: 86px; flex: none; display: flex; }
.ev .evt { flex: 1 1 auto; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th-foot { min-height: 30px; background: var(--bg2); }
.th-foot .ui-btn.plain { padding: 0; }
.slog { margin-top: var(--sp-2); }
/* walk (layer 1): progress, one card, its decision */
.prog { display: flex; gap: 3px; margin: 0 0 var(--sp-2); }
.prog button { flex: 1; height: 6px; border: 0; border-radius: 3px; padding: 0; background: var(--line2); cursor: pointer; }
.prog button.kept { background: color-mix(in srgb, var(--teal) 60%, var(--line2)); }
.prog button.changed { background: var(--gold); }
.prog button.bad { background: var(--refuse); }
.prog button.cur { outline: 2px solid var(--text); outline-offset: 1px; }
.prog button.sum { flex: 0 0 22px; background: none; box-shadow: inset 0 0 0 1px var(--line2); }
.wcard { padding: var(--sp-3) var(--sp-4) var(--sp-4); box-shadow: inset 0 2px 0 var(--m-counter); animation: wIn var(--t-med) var(--ease) both; }
@keyframes wIn { from { opacity: 0; transform: translateX(8px); } }
.wcard.changed { box-shadow: inset 0 2px 0 var(--gold); }
.wcard h3 { font: var(--fw-semibold) var(--fs-title3)/1.25 var(--display); margin: 2px 0 var(--sp-2); }
.why { display: flex; flex-wrap: wrap; gap: 4px; }
.bigfloor { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
.bigfloor .lab { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.bigfloor .ui-btn { width: 30px; padding: 0; height: 30px; font-size: var(--fs-title3); }
.bigfloor input { width: 120px; height: 38px; padding: 0 var(--sp-2); text-align: center; font: var(--fw-semibold) var(--fs-display) var(--mono); font-variant-numeric: tabular-nums; color: var(--teal-l); }
.wcard.changed .bigfloor input { color: var(--gold-l); border-color: var(--gold); }
.bigfloor input[aria-invalid="true"] { border-color: var(--refuse); }
.fsub { font-size: var(--fs-small); color: var(--muted); min-width: 0; line-height: 1.3; }
.fsub .err { color: var(--red-l); }
.wmeta { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-small); color: var(--dim); }
.wmeta .ui-btn { margin-left: auto; }
.wbtns { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
.wbtns .kbd { margin-left: 2px; }
.sumcard .ui-table { margin-top: var(--sp-2); }
.keyhelp { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--sp-3); font-size: var(--fs-small); align-items: baseline; }
/* thread sheet (layer 2): the conversation as it happened */
.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.msg { max-width: 86%; padding: 6px 10px; border-radius: var(--r); font-size: var(--fs-body); }
.msg .who { display: block; font: var(--fw-semibold) var(--fs-small) var(--mono); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; }
.msg .who time { color: var(--dim); font-weight: var(--fw-regular); margin-left: 6px; }
.msg.them { justify-self: start; background: color-mix(in srgb, var(--coral) 7%, var(--panel2)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--coral) 35%, var(--line)); }
.msg.them .who { color: var(--coral-l); }
.msg.us { justify-self: end; background: color-mix(in srgb, var(--teal) 10%, var(--panel2)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 35%, var(--line)); }
.msg.us .who { color: var(--teal-l); }
.msg.sys { justify-self: center; max-width: 96%; border: 1px dashed var(--line2); font: var(--fs-small)/1.4 var(--mono); color: var(--muted); text-align: center; }
.msg.sys .who { color: var(--dim); }
.msg.sys.paypal .who { color: var(--gold-l); } .msg.sys.core .who { color: var(--red-l); } .msg.sys.owner .who { color: var(--teal-l); }
.msg .quarantine { margin-top: 6px; text-align: left; }
@media (max-width: 1180px) { .cols { gap: var(--sp-3); } .th-head .qdots { display: none; } }
@media (max-width: 1180px) { #journal .ui-section-h > span:not(.end) { display: none; } }
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar" id="top"></header>
  <div class="ui-split" id="split">
    <nav class="ui-sidebar" id="rail" aria-label="Modules"></nav>
    <main class="ui-main" id="view" tabindex="-1">
      <div class="ui-pagehead"><h1 tabindex="-1">Counter</h1><span class="sub">who said what at your counter · your floors, one at a time</span>
        <div class="actions"><button class="ui-btn sm plain" data-act="help" id="keysbtn" aria-label="Keyboard keys">Keys <span class="kbd">?</span></button><button class="ui-btn sm" data-act="log" id="logbtn"></button><button class="ui-btn sm" data-act="s2" id="s2btn"></button><button class="ui-btn sm" data-act="feed">Export feed <span class="kbd">E</span></button></div></div>
      <div class="cols">
        <section id="journal" aria-label="Counter journal"></section>
        <section id="walk" class="walk" aria-label="Floor walk" aria-live="polite"></section>
      </div>
    </main>
  </div>
</div>
<script>
(() => {
'use strict';
/* ===== shared core (same in the three Counter variants): data, money, clock, quote lifecycle, S-2 draft,
   approval hand-off, feed export, window chrome and the layer-2 surfaces (quote, item, note, impact, S-2).
   Each variant declares render(), showQuote(id), showItem(sku) and onEsc() below the core. ===== */
const F = window.FIX;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = UI.esc;
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = n => String(n).padStart(2, '0');
const later = (ms, fn) => setTimeout(fn, REDUCE ? Math.min(ms, 60) : ms);

/* Money is integer cents, parsed from strings; no float arithmetic on amounts. */
const toC = n => { if (n == null) return null; const m = String(n).match(/^(\d+)(?:\.(\d{1,2}))?$/); return m ? parseInt(m[1], 10) * 100 + parseInt(((m[2] || '') + '00').slice(0, 2), 10) : null; };
const parseMoney = s => { const m = String(s).trim().replace(/^\$\s*/, '').replace(/,/g, '').match(/^(\d{1,6})(?:\.(\d{0,2}))?$/); return m ? parseInt(m[1], 10) * 100 + parseInt(((m[2] || '') + '00').slice(0, 2), 10) : null; };
const fmt = c => c == null ? '—' : (c < 0 ? '−' : '') + '$' + Math.floor(Math.abs(c) / 100).toLocaleString('en-US') + '.' + pad(Math.abs(c) % 100);
const fmt0 = c => c == null ? '—' : (Math.abs(c) % 100 ? fmt(c) : (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toLocaleString('en-US'));
const plain = c => Math.floor(c / 100) + (c % 100 ? '.' + pad(c % 100) : '');

/* Clock: the dataset's snapshot (Thu 29 Oct 14:02) advancing in real time; "+5 min" skews it. */
const MIN = 60000;
const T0 = new Date(F.nowISO).getTime();
const REAL0 = Date.now();
let skew = 0;
const now = () => T0 + (Date.now() - REAL0) + skew;
const at = (h, m) => { const d = new Date(T0); d.setHours(h, m, 0, 0); return d.getTime(); };
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hms = t => { const d = new Date(t); return hm(t) + ':' + pad(d.getSeconds()); };
const left = ms => { if (ms <= 0) return '0:00'; const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); };

/* Catalog fields the dataset lacks but the feed export needs (fictional shop, sandbox).
   'calibration' keeps a description under 25 chars: the dataset's one feed issue. */
const DESC = {
  'monitor-27-4k': 'Refurbished 27-inch 4K IPS panel, graded A, tested for dead pixels, 12-month shop warranty.',
  'monitor-24-ips': 'Refurbished 24-inch 1080p IPS monitor, graded A, tested, 12-month shop warranty.',
  'monitor-27-qhd': 'Refurbished 27-inch QHD monitor, 2560x1440, graded A, 12-month shop warranty.',
  'monitor-32-4k': 'Refurbished 32-inch 4K monitor, graded A, height-adjustable stand, 12-month warranty.',
  'monitor-arm': 'Single gas-spring monitor arm, VESA 75/100, desk clamp or grommet, holds 2-9 kg.',
  'monitor-arm-dual': 'Dual gas-spring monitor arm for two screens up to 27 inches, VESA 75/100.',
  'usb-c-dock': 'USB-C dock with 96 W pass-through charging, two DisplayPort outputs and gigabit LAN.',
  'dp-cable-2m': 'DisplayPort 1.4 cable, 2 metres, supports 4K at 144 Hz and 8K at 60 Hz.',
  'hdmi-21': 'HDMI 2.1 cable, 2 metres, 48 Gbps, supports 4K at 120 Hz.',
  'wipe-kit': 'Screen-wipe kit: anti-static spray, two microfibre cloths, safe for matte panels.',
  'calibration': 'Panel calibration.',
  'care-plan': 'Monthly care plan for any monitor bought here: dead-pixel swap and remote support.'
};
const items = F.shop.map(it => ({ sku: it.sku, title: it.title, kind: it.kind, avail: it.avail, sub: !!it.sub, priceC: toC(it.price), mktC: toC(it.mkt),
  desc: DESC[it.sku] || '', link: 'https://second-screen.example/p/' + it.sku, image: 'https://second-screen.example/img/' + it.sku + '.jpg' }));
const IT = Object.fromEntries(items.map(i => [i.sku, i]));
const short = it => it.title.replace(/^Refurbished /, '').split(',')[0];
const S2 = F.mandates.find(m => m.id === 'S-2');

const S = { v: S2.v, signedOn: S2.signed, signed: {}, draft: {}, bad: {}, locked: false, aw: null, seq: Math.max(...F.audit.map(a => a.seq)), log: [], escArm: false };
F.shop.forEach(it => { S.signed[it.sku] = toC(it.floor); S.draft[it.sku] = toC(it.floor); });
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0'); };
const commitOf = floors => { const x = hash('S-2|' + JSON.stringify(floors)); return x.slice(0, 4) + '…' + x.slice(-2); };
S.commit = commitOf(S.signed);

const market = it => {
  const m = F.market[it.sku];
  if (m) return { p25: toC(m.p25), med: toC(m.median), p75: toC(m.p75), src: m.src, at: m.retrieved };
  if (it.mktC != null) return { med: it.mktC, src: 'Channel3 reference', at: null };
  return null;
};
/* Facts only: where a floor sits against the market reference. No forecast. */
const vsMarket = (it, f) => {
  const m = market(it);
  if (f == null) return { cls: 'none', txt: it.sub ? 'subscription · fixed price' : '—' };
  if (!m) return { cls: 'none', txt: 'no market reference' };
  if (m.p75 != null && f > m.p75) return { cls: 'over', txt: `${fmt0(f - m.p75)} above market p75 ${fmt0(m.p75)}` };
  const d = f - m.med;
  if (d > 0) return { cls: 'above', txt: `${fmt0(d)} over market median ${fmt0(m.med)}` };
  if (d === 0) return { cls: 'at', txt: `at market median ${fmt0(m.med)}` };
  return { cls: 'under', txt: `${fmt0(-d)} under market median ${fmt0(m.med)}` };
};
/* Layer-1 form of the same fact: a few characters, the long form is the tooltip and the layer-2 line. */
const vmShort = (it, f) => {

  else if (vm.cls === 'above') r.push(['gold', 'over market median']);
  if (feedIssues(it).length) r.push(['coral', 'feed field missing']);
  if (it.avail === 'out_of_stock') r.push(['', 'out of stock']);
  if (!market(it)) r.push(['dashed', 'no market reference']);
  return r;
};
const rank = it => { const w = WHY(it).map(x => x[1]); return w.some(x => x.includes('counter')) ? 0 : w.some(x => x.includes('range')) ? 1 : w.some(x => x.includes('median')) ? 2 : w.some(x => x.includes('feed')) ? 3 : w.some(x => x.includes('stock')) ? 5 : 4; };
const WALK = items.filter(it => S.signed[it.sku] != null).sort((a, b) => rank(a) - rank(b)).map(it => it.sku);
const V = { i: 0, summary: false, seen: {}, scope: 'live', collapsed: {} };

/* ---- journal (layer 1) ---- */
const evShort = e => e.txt.replace(/ · (POST|GET) .*$/, '').replace(/ · items\[\].*$/, '');
function evRow(o, e) {
  const [c, l] = ACTOR[e.who] || ['', e.who];
  return `<div class="ui-row ev"><time>${esc(e.t)}</time><span class="actor"><span class="ui-chip ${c}">${e.who === 'them' ? esc(walletName(o.cp)) : l}</span></span><span class="evt" title="${esc(e.txt)}">${esc(evShort(e))}</span>${e.said ? noteChip(o) : ''}</div>`;
}
function threadHTML(o) {
  const it = IT[o.sku], live = isLive(o), col = V.collapsed[o.id] != null ? V.collapsed[o.id] : !live;
  const track = o.stage === 'CAPTURED' && it.kind === 'PHYSICAL';
  return `<div class="ui-group thread ${live ? 'live' : ''}" role="group" aria-label="${esc(o.id)} with ${esc(CPN(o.cp))}">
    <div class="ui-row two act th-head" data-act="thread" data-id="${o.id}" tabindex="0">
      <span class="id">${o.id}</span>
      <span class="main"><span class="t1"><span class="cp">${esc(walletName(o.cp))}</span> · ${esc(short(it))}</span>${live ? `<span class="ui-silence">${silenceShort(o)}</span>` : `<span class="t2">${esc(o.day)} · ${esc(doneLine(o))}</span>`}</span>
      ${underDraft(o) ? '<span class="ui-chip coral" data-tip="Your draft floor is above this quote. Signing withdraws it; no money moves.">withdraws</span>' : ''}
      ${chipHTML(o)}${live ? cdHTML(o) : ''}<span class="amt">${fmt(o.amtC)}</span>
      <button class="ui-btn sm plain" data-act="col" data-id="${o.id}" aria-expanded="${!col}" aria-label="${col ? 'Show' : 'Hide'} ${o.events.length} steps">${o.events.length} ${col ? '▸' : '▾'}</button></div>
    ${col ? '' : o.events.map(e => evRow(o, e)).join('') + `<div class="ui-row th-foot"><button class="ui-btn sm plain" data-act="jump" data-sku="${o.sku}">Check the ${esc(short(it).toLowerCase())} floor in the walk →</button>${track ? `<span class="ui-spacer"></span><button class="ui-btn sm" data-act="trackpop" data-id="${o.id}">Add tracking</button>` : ''}</div>`}
  </div>`;
}
function renderJournal() {
  const list = orders.filter(o => V.scope === 'all' || isLive(o) || o.day.startsWith('Thu'));
  list.sort((a, b) => (isLive(b) ? 1 : 0) - (isLive(a) ? 1 : 0));
  const live = orders.filter(isLive).length;
  $('#journal').innerHTML = `<div class="ui-section-h"><h2>Counter journal</h2><span>${live} live · no line waits for your click</span><span class="end"><span class="ui-seg" role="group" aria-label="Journal scope"><button data-act="scope" data-s="live" aria-pressed="${V.scope === 'live'}">Today</button><button data-act="scope" data-s="all" aria-pressed="${V.scope === 'all'}">This week</button></span></span></div>
    ${list.length ? list.map(threadHTML).join('') : '<div class="ui-group"><div class="ui-empty">Nobody is at your counter. Quotes appear here the moment another wallet’s agent asks.</div></div>'}
    <div style="margin-top:var(--sp-3)">${protoHTML()}</div>`;
  $('#logbtn').textContent = `Audit lines · ${S.log.length}`;
}
/* layer 2: the whole thread as a conversation */
const WHO = { them: 'their agent', us: 'your quoting agent', wallet: 'wallet', paypal: 'PayPal', core: 'core · mandate check', owner: 'you' };
function bubblesHTML(o) {
  return `<ol class="msgs">${o.events.map(e => {
    const cls = e.who === 'them' ? 'them' : e.who === 'us' ? 'us' : 'sys ' + e.who;
    const who = e.who === 'them' ? `${esc(walletName(o.cp))}’s agent` : WHO[e.who] || e.who;
    return `<li class="msg ${cls}"><span class="who">${who}<time>${esc(e.t)}</time></span>${esc(e.txt)}${e.said ? quarantineHTML(o) : ''}</li>`;
  }).join('')}</ol>`;
}

/* ---- floor walk (layer 1: the decision; facts one click away) ---- */
function progHTML() {
  return `<div class="prog" role="group" aria-label="Walk progress">${WALK.map((sku, i) => {
    const st = S.bad[sku] ? 'bad' : S.draft[sku] !== S.signed[sku] ? 'changed' : V.seen[sku] ? 'kept' : '';
    return `<button class="${st} ${!V.summary && i === V.i ? 'cur' : ''}" data-act="goto" data-i="${i}" aria-label="${esc(IT[sku].title)}${st ? ' · ' + st : ''}" title="${esc(short(IT[sku]))}"></button>`;
  }).join('')}<button class="sum ${V.summary ? 'cur' : ''}" data-act="summary" aria-label="Review the draft" title="Review the draft"></button></div>`;
}
function fsub(it) {
  const f = S.draft[it.sku], w = S.signed[it.sku], bad = S.bad[it.sku];
  if (bad) return `<span class="err">${esc(bad.err)}</span>`;
  return f === w ? `signed in S-2 v${S.v}<br><span class="dim">the agent can’t quote below it</span>` : `<span class="gold">draft</span> · signed ${fmt0(w)} (${f > w ? '+' : '−'}${fmt0(Math.abs(f - w))})<br><span class="dim">nothing changes until you sign</span>`;
}
function wmeta(it) {
  const m = market(it), f = S.draft[it.sku], vm = vmShort(it, f);
  return `<span>list ${fmt0(it.priceC)}</span><span>· ${m ? `market ${fmt0(m.med)}` : 'no market ref'}</span>${m ? `<span class="vm ${vm.cls === 'over' || vm.cls === 'above' ? 'gold' : ''}" data-tip="${esc(vsMarket(it, f).txt)}">· ${esc(vm.txt)}</span>` : ''}<button class="ui-btn sm plain" data-act="item" data-sku="${it.sku}">Facts &amp; catalog ›</button>`;
}
function cardHTML() {
  const sku = WALK[V.i], it = IT[sku], f = S.draft[sku], w = S.signed[sku], bad = S.bad[sku], changed = f !== w || !!bad;
  return `<section class="ui-card wcard ${changed ? 'changed' : ''}" aria-labelledby="wT">
    <div class="ui-hint">${V.i + 1} of ${WALK.length} · <span class="mono">${esc(it.sku)}</span> · ${it.kind.toLowerCase()}</div>
    <h3 id="wT">${esc(it.title)}</h3>
    <div class="why">${WHY(it).map(([c, t]) => `<span class="ui-chip ${c}">${esc(t)}</span>`).join('') || '<span class="ui-chip">nothing unusual</span>'}</div>
    <div class="bigfloor"><span class="lab">Floor</span><button class="ui-btn" data-act="wdec" aria-label="Lower the floor by $1" title="← (Shift: $10)">−</button><input class="ui-field" id="wfloor" data-wfloor="${sku}" inputmode="decimal" autocomplete="off" value="${esc(bad ? bad.text : plain(f))}" aria-label="Floor for ${esc(it.title)} in dollars" aria-invalid="${bad ? 'true' : 'false'}"><button class="ui-btn" data-act="winc" aria-label="Raise the floor by $1" title="→ (Shift: $10)">+</button><span class="fsub" id="wsub">${fsub(it)}</span></div>
    <div id="wscale">${scaleHTML(it)}</div>
    <div class="wmeta" id="wmeta">${wmeta(it)}</div>
    <div class="wbtns" id="wbtns">${wbtnsHTML()}</div>
  </section>`;
}
function wbtnsHTML() {
  const sku = WALK[V.i], w = S.signed[sku], changed = S.draft[sku] !== w || !!S.bad[sku];
  return `<button class="ui-btn" data-act="wprev" ${V.i === 0 ? 'disabled' : ''}>‹ Prev<span class="kbd">K</span></button>
      <button class="ui-btn primary" data-act="wkeep">${changed ? 'Keep change' : 'Keep ' + fmt0(w)} · next<span class="kbd">Enter</span></button>
      ${changed ? `<button class="ui-btn" data-act="wrevert">Revert to ${fmt0(w)}<span class="kbd">R</span></button>` : ''}
      <span class="ui-spacer"></span><button class="ui-btn plain" data-act="summary">Review draft<span class="kbd">S</span></button>`;
}
function summaryHTML() {
  const diff = draftDiff(), errs = draftErrors(), seen = WALK.filter(s => V.seen[s] || S.draft[s] !== S.signed[s]).length;
  return `<section class="ui-card wcard sumcard ${diff.length ? 'changed' : ''}" aria-labelledby="sT">
    <div class="ui-hint">review · ${seen} of ${WALK.length} floors looked at</div>
    <h3 id="sT" tabindex="-1">${diff.length ? `S-2 v${S.v + 1} draft · ${diff.length} change${diff.length > 1 ? 's' : ''}` : `No changes · S-2 v${S.v} stays`}</h3>
    ${diff.length ? `<div class="ui-group"><table class="ui-table"><tbody>${diff.map(d => `<tr><td class="clip">${esc(d.it.title)}</td><td class="num">${fmt(d.from)}</td><td class="num gold">${fmt(d.to)}</td><td><button class="ui-btn sm plain" data-act="goto" data-i="${WALK.indexOf(d.it.sku)}">edit</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="ui-hint">Every floor you looked at stays as signed. Nothing to sign.</div>'}
    ${errs.map(x => `<div class="l2-warn">${esc(short(x.it))}: ${esc(x.err)}</div>`).join('')}
    <div class="btnrow">${impactChip()}<span class="ui-silence">silent → <b>nothing is signed</b> · S-2 v${S.v} stays in force</span></div>
    <div class="wbtns"><button class="ui-btn gold" data-act="sign" ${!diff.length || errs.length ? 'disabled' : ''}>Sign in the approval window ↗<span class="kbd">S</span></button>${diff.length ? '<button class="ui-btn" data-act="discard">Discard draft</button>' : ''}<span class="ui-spacer"></span><button class="ui-btn plain" data-act="goto" data-i="0">Walk again</button></div>
    <div class="ui-hint" style="margin-top:var(--sp-2)">The care plan ($12/mo) is quoted at list, so it has no floor and is not in the walk.</div>
  </section>`;
}
function renderWalk(focusSel) {
  $('#walk').innerHTML = `<div class="ui-section-h"><h2>Floor walk</h2><span>look-at-first order</span><span class="end">S-2 v${S.v} · <span class="mono">${S.commit}</span></span></div>
    ${progHTML()}${V.summary ? summaryHTML() : cardHTML()}`;
  if (focusSel) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
}
function go(i) { V.summary = false; V.i = Math.max(0, Math.min(WALK.length - 1, i)); renderWalk('#wfloor'); }
function toSummary() { V.summary = true; renderWalk('[data-act="sign"]:not([disabled]), #sT'); }
function keepNext() {
  const sku = WALK[V.i]; if (S.bad[sku]) { toast('Fix this floor first, or press R to revert it.', 'bad'); return; }
  V.seen[sku] = true;
  if (V.i === WALK.length - 1) toSummary(); else go(V.i + 1);
  renderJournal();
}
function nudgeW(dc) {
  const sku = WALK[V.i]; setDraft(sku, (S.draft[sku] || 0) + dc);
  renderWalk('#wfloor'); renderJournal(); refreshL2();
}
const KEYS = `<div class="keyhelp"><span class="kbd">J</span><span>next item (keeps it)</span><span class="kbd">K</span><span>previous item</span><span class="kbd">← →</span><span>floor −/+ $1 · with Shift $10</span><span class="kbd">Enter</span><span>keep and go to the next</span><span class="kbd">R</span><span>revert this floor</span><span class="kbd">S</span><span>review, then sign in the approval window</span><span class="kbd">E</span><span>feed export</span><span class="kbd">Esc</span><span>leave a field · close a layer · back to The Table</span></div>`;
function logSheet() {
  UI.sheet({ title: `This session’s audit lines · ${S.log.length}`, size: 'wide', body: S.log.length
    ? `<div class="ui-hint" style="margin-bottom:var(--sp-2)">A local echo. The real log is append-only and hash-chained in the Rust core.</div><div class="ui-group"><table class="ui-table"><thead><tr><th>#</th><th>time</th><th>actor</th><th>action</th></tr></thead><tbody>${S.log.map(l => `<tr><td class="mono">${l.seq}</td><td class="mono">${esc(l.t)}</td><td class="mono">${esc(l.actor)}</td><td class="clip" title="${esc(l.action)}">${esc(l.action)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="ui-empty">Nothing yet this session. Simulations, floor signing and exports add lines here.</div>', actions: [{ label: 'Done', kind: 'primary' }] });
}
bubblesHTML.hasWords = true; /* their words sit in the first bubble, quarantined */
function showQuote(id) { openQuote(id, bubblesHTML); }
function showItem(sku) { openItem(sku); }
function render() { chrome(); renderJournal(); const keep = document.activeElement && document.activeElement.id === 'wfloor' ? '#wfloor' : null; renderWalk(keep); $('#s2btn').textContent = `S-2 v${S.v} · signed ${S.signedOn}`; }
Object.assign(ACT, {
  thread: el => showQuote(el.dataset.id),
  col: el => { const o = ORD(el.dataset.id), open0 = el.getAttribute('aria-expanded') === 'true'; V.collapsed[o.id] = open0; renderJournal(); const b = $(`[data-act="col"][data-id="${o.id}"]`); if (b) b.focus(); },
  scope: el => { V.scope = el.dataset.s; renderJournal(); },
  jump: el => { const i = WALK.indexOf(el.dataset.sku); if (i >= 0) go(i); },
  goto: el => go(+el.dataset.i),
  summary: () => toSummary(),
  wprev: () => go(V.i - 1),
  wkeep: () => keepNext(),
  wrevert: () => { const sku = WALK[V.i]; S.draft[sku] = S.signed[sku]; delete S.bad[sku]; renderWalk('#wfloor'); renderJournal(); refreshL2(); },
  wdec: () => nudgeW(-100), winc: () => nudgeW(100),
  help: () => UI.popover($('#keysbtn'), KEYS, { title: 'Keys' }),
  log: () => logSheet(),
  trackpop: el => { const o = ORD(el.dataset.id); UI.popover(el, trackFormHTML(o), { title: `Tracking for ${o.id}` }); const i = $('.ui-popover input'); if (i) i.focus(); }
});
document.addEventListener('input', e => {
  const inp = e.target.closest('[data-wfloor]'); if (!inp) return;
  const sku = inp.dataset.wfloor, it = IT[sku]; setDraftText(sku, inp.value);
  inp.setAttribute('aria-invalid', S.bad[sku] ? 'true' : 'false');
  $('#wsub').innerHTML = fsub(it); $('#wmeta').innerHTML = wmeta(it); $('#wscale').innerHTML = scaleHTML(it);
  $('.wcard').classList.toggle('changed', S.draft[sku] !== S.signed[sku] || !!S.bad[sku]);
  $('.prog').outerHTML = progHTML(); $('#wbtns').innerHTML = wbtnsHTML();
  renderJournal();
});
document.addEventListener('keydown', e => {
  if (S.aw || UI.open || e.ctrlKey || e.metaKey || e.altKey) return;
  const ae = document.activeElement, inField = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName), inWalk = ae && ae.id === 'wfloor';
  if (inWalk) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); nudgeW(e.shiftKey ? -1000 : -100); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); nudgeW(e.shiftKey ? 1000 : 100); return; }
    if (e.key === 'Enter') { e.preventDefault(); keepNext(); return; }
    /* a floor is digits only, so the walk's letter keys still act while the floor field has focus */
    if (!/^[jkrse?]$/i.test(e.key)) return;
  } else if (inField) return;
  const th = ae && ae.closest && ae.closest('[data-act="thread"]');
  if (th && e.key === 'Enter' && ae === th) { e.preventDefault(); showQuote(th.dataset.id); return; }
  const k = e.key.toLowerCase();
  if (k === 'j') { e.preventDefault(); if (!V.summary) keepNext(); }
  else if (k === 'k') { e.preventDefault(); if (V.summary) go(WALK.length - 1); else go(V.i - 1); }
  else if (!V.summary && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(ae && ae.closest && ae.closest('a, button, [tabindex]'))) { e.preventDefault(); nudgeW((e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1000 : 100)); }
  else if (k === 'r' && !V.summary) { e.preventDefault(); ACT.wrevert(); }
  else if (k === 's') { e.preventDefault(); if (V.summary) openApproval(); else toSummary(); }
  else if (k === 'e') { e.preventDefault(); openFeed(); }
  else if (e.key === '?') { e.preventDefault(); ACT.help(); }
});
function onEsc() { if (V.summary) { go(V.i); return true; } return false; }
render();

})();
</script>
<script src="../../../shared/shell.js" data-page="counter" data-variant="3"></script>
</body>
