<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal detail · v2 Proof sheet · The Table</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---- shared by the three deal variants: approval-window simulation, state strip, meters ---- */
#dvApproval { position: fixed; right: var(--sp-4); bottom: var(--sp-4); z-index: 8200; }
.apw { width: min(380px, calc(100vw - 32px)); background: var(--panel); border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); animation: apwIn var(--t-med) var(--ease) both; }
@keyframes apwIn { from { opacity: 0; transform: translateY(10px); } }
.apw-bar { display: flex; align-items: center; gap: var(--sp-2); height: 30px; padding: 0 var(--sp-1) 0 var(--sp-3); background: var(--bg2); border-bottom: 1px solid var(--line); font-size: var(--fs-small); color: var(--dim); }
.apw-t { flex: 1; }
.apw-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.apw-body { display: grid; gap: var(--sp-1); padding: var(--sp-3); }
.apw-k { font: var(--fw-semibold) var(--fs-small) var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--gold-l); }
.apw-big { font: var(--fw-semibold) var(--fs-display)/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.apw-ph { display: flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-1); }
.apw-p { margin: 0; }
.apw-sim, .sim { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); }
.apw-sim::before, .sim::before { width: 100%; margin-bottom: 0; }
.sim .none { color: var(--dim); }

/* state strip: done ✓ · current filled · the rest dim; a kind's missing steps are hidden */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font: var(--fw-medium) var(--fs-small)/1 var(--mono); color: var(--dim); min-width: 0; }
.strip .s { display: inline-flex; align-items: center; height: 20px; padding: 0 5px; border-radius: 4px; white-space: nowrap; }
.strip .s.done { color: var(--muted); }
.strip .s.done::before { content: "✓"; color: var(--ok); margin-right: 3px; }
.strip .s.cur { color: var(--on-teal); background: var(--teal); font-weight: var(--fw-semibold); }
.strip .s.cur.need, .strip .s.cur.held { color: var(--on-gold); background: var(--gold); }
.strip .s.cur.ok { color: var(--bg); background: var(--ok); }
.strip .s.stop { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); }
.strip .s.term { color: var(--on-refuse); background: var(--refuse); font-weight: var(--fw-semibold); }
.strip .s.term.off { color: var(--text); background: var(--panel3); }
.strip .ar { color: var(--line2); padding: 0 1px; }

/* two meters, never one axis */
.meters { display: flex; gap: var(--sp-3); font-size: var(--fs-small); color: var(--dim); white-space: nowrap; min-width: 0; }
.meters .m { padding-left: var(--sp-2); border-left: 2px solid var(--teal); }
.meters .m.eng { border-color: var(--line2); }
.meters b { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }

/* decision row: the one act on layer 1 */
.decide.need { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); box-shadow: inset 3px 0 0 var(--gold); }
.decide.hand { border-color: color-mix(in srgb, var(--teal) 50%, var(--line)); box-shadow: inset 3px 0 0 var(--teal); }
.decide .t1 b { font-weight: var(--fw-semibold); }
.cd { font: var(--fw-semibold) var(--fs-title3) var(--mono); font-variant-numeric: tabular-nums; color: var(--gold-l); }

/* lane marks: teal you · coral them · gold PayPal · line the gate */
.lane-you { box-shadow: inset 2px 0 0 var(--teal); } .lane-them { box-shadow: inset 2px 0 0 var(--coral); }
.lane-paypal { box-shadow: inset 2px 0 0 var(--gold); } .lane-gate { box-shadow: inset 2px 0 0 var(--line2); }
.vg { width: 12px; flex: none; text-align: center; font-weight: var(--fw-bold); }
.bandmini { display: block; flex: none; }
.dvband { width: 100%; max-width: 520px; height: auto; display: block; }
.xpre { max-height: 260px; overflow: auto; margin: var(--sp-2) 0 0; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line);
  font: var(--fs-small)/1.45 var(--mono); color: var(--teal-l); white-space: pre-wrap; }
.sheet-p { margin: 0 0 var(--sp-2); }
.ui-popover .ui-kv { font-size: var(--fs-small); }
.chk { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: grid; gap: 2px; font-size: var(--fs-small); color: var(--muted); }
.chk li::before { content: "✓ "; color: var(--ok); }
.chk li.x::before { content: "✗ "; color: var(--red-l); }
.ui-table tr.checking td { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.decide .ui-silence, .dock .ui-silence { white-space: normal; }

/* ---- v2 Proof sheet: only what is unique to this variant ---- */
body { overflow: hidden; }
.esc { white-space: nowrap; }
.nav { display: flex; gap: 2px; }
.figs { display: flex; align-items: center; gap: var(--sp-2) var(--sp-5); flex-wrap: wrap; margin-bottom: var(--sp-3); min-width: 0; }
.figs .amt { font: var(--fw-semibold) var(--fs-display)/1 var(--mono); font-variant-numeric: tabular-nums; }
.figs .f { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 320px; }
.figs .f .k { font-size: var(--fs-small); color: var(--dim); }
.figs .f .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.figs .push { margin-left: auto; text-align: right; }
.stripline { margin-bottom: var(--sp-3); }

/* the bet: graded claims, one per row; the proof opens in the inspector */
.claims .claim { outline: none; }
.claims .claim .kbd { flex: none; }
.claims .claim:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.g-pass { color: var(--ok); } .g-att { color: var(--coral-l); } .g-pend, .g-ask { color: var(--gold-l); } .g-fail { color: var(--red-l); } .g-na, .g-unk { color: var(--dim); }
.legend { display: flex; flex-wrap: wrap; gap: 4px var(--sp-2); align-items: center; margin-top: var(--sp-2); }
.story .t2 { white-space: nowrap; }
.foot { margin-top: var(--sp-4); }

/* inspector: proofs may wrap */
.ui-inspector .ui-row .t2, .ui-inspector .ui-table td { white-space: normal; }
.ui-inspector .ui-table td.mono { white-space: nowrap; }
.ui-inspector .ui-table th, .ui-inspector .ui-table td { padding: 0 6px; }
.ui-inspector .ui-table td { height: auto; padding-top: 4px; padding-bottom: 4px; }
.insp-h { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-1); }
.insp-acts { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-3); }
.ui-row.checking { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.ui-row .sq { width: 22px; flex: none; font: var(--fs-mono) var(--mono); color: var(--dim); }

/* go-to palette (a sheet) */
.pal .ui-field { width: 100%; }
.pal .ui-group { margin-top: var(--sp-2); max-height: 50vh; overflow: auto; }
.pal .ui-row .t1 { flex: 1; }
@media (max-width: 1180px) { .meters, .esc { display: none; } }
#view { max-width: 1120px; }
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar">
    <nav class="ui-crumbs" aria-label="Breadcrumb" id="crumbs"></nav>
    <span class="ui-hint esc"><span class="kbd">Esc</span> back</span>
    <span class="ui-spacer"></span>
    <div class="meters" id="meters"></div>
    <div class="nav">
      <button class="ui-btn sm icon" id="prev" data-tip="Previous deal  [" aria-label="Previous deal">‹</button>
      <button class="ui-btn sm" id="find" data-tip="Go to a deal  G or Ctrl K">Go to deal <span class="kbd">G</span></button>
      <button class="ui-btn sm icon" id="next" data-tip="Next deal  ]" aria-label="Next deal">›</button>
    </div>
    <span id="mode"></span>
    <button class="ui-btn sm" id="keys" aria-label="Keyboard keys">Keys</button>
    <button class="ui-btn sm" id="insp-t" data-tip="Show or hide the proof inspector">Inspector</button>
    <button class="ui-btn sm" id="idle" data-tip="Prototype · simulate 15 minutes idle">Active</button>
  </header>
  <div class="ui-split no-side has-insp" id="split">
    <main class="ui-main" id="main" tabindex="-1"><div id="view"></div></main>
    <aside class="ui-inspector" id="insp" aria-label="Proof"></aside>
  </div>
</div>

<script>
/* ===== Deal view core: the deal model, evidence rules and the simulated state machine.
   The same block is inlined in all three variants so each page opens from disk on its own.
   Nothing here moves money: decisions that release money only open the (simulated) approval
   window; external PayPal / counterparty events are "Prototype · sandbox simulation" buttons. */
window.DV = (function () {
  'use strict';
  const F = window.FIX;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cents = (v) => Math.round(Number(v) * 100);
  const money = (v) => v == null ? '—' : '$' + (cents(v) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money0 = (v) => v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US');
  const pad = (n) => String(n).padStart(2, '0');

  /* ---- clock: the snapshot is Thu 29 Oct 2026 14:02, then it ticks in real time ---- */
  const T0 = new Date(2026, 9, 29, 14, 2, 0).getTime();
  const started = Date.now();
  let skew = 0;
  const now = () => T0 + (Date.now() - started) + skew;
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAYOFF = { Mon: -3, Tue: -2, Wed: -1, Thu: 0, Fri: 1, Sat: 2, Sun: 3 };
  function ts(s) {
    const m = /^(?:(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(String(s).trim());
    if (!m) return null;
    return new Date(2026, 9, 29 + (m[1] ? DAYOFF[m[1]] : 0), +m[2], +m[3], +(m[4] || 0)).getTime();
  }
  const hhmm = (t, secs) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + (secs ? ':' + pad(d.getSeconds()) : ''); };
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  function clock(t, secs) { const d = new Date(t); return (sameDay(t, T0) ? '' : DOW[d.getDay()] + ' ') + hhmm(t, secs); }
  function dur(ms, secs) {
    if (ms <= 0) return secs === false ? '0 m' : '0:00:00';
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    if (d) return `${d} d ${h} h`;
    return secs === false ? `${h} h ${pad(m)} m` : `${h}:${pad(m)}:${pad(s % 60)}`;
  }

  /* ---- tiny deterministic hash (prototype stand-in for the envelope hash chain) ---- */
  function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
  const hash64 = (s) => fnv(s) + fnv('~' + s);
  const shortH = (h) => h.length > 8 ? h.slice(0, 4) + '…' + h.slice(-2) : h;

  /* ---- modules ---- */
  const MODS = {
    tables: { name: 'Tables', long: 'Haggle', color: 'var(--m-tables)' },
    spend: { name: 'Spend', long: 'Purchases', color: 'var(--m-spend)' },
    counter: { name: 'Counter', long: 'Shop', color: 'var(--m-counter)' },
    book: { name: 'Book', long: 'Deal book', color: 'var(--m-book)' },
    shield: { name: 'Shield', long: 'Scam shield', color: 'var(--m-shield)' },
    rescue: { name: 'Rescue', long: 'Renewals', color: 'var(--m-rescue)' }
  };
  const MOD_ORDER = ['tables', 'spend', 'counter', 'book', 'shield', 'rescue'];

  /* ---- data the dataset lacks, consistent with FIX (same ids, names, amounts, times) ---- */
  /* D-0187 closed on Monday: FIX keeps only its outcome, so its signed envelopes and the market
     snapshot stored with its terms (p41, as FIX says) are spelled out here. Illustrative. */
  const EXTRA_TRANSCRIPTS = {
    'D-0187': {
      head: '2b8e…41', terms: '8d2a…0f',
      envelopes: [
        { by: 'them', typ: 'LISTING', price: 249, t: 'Mon 10:31' }, { by: 'you', typ: 'OFFER', price: 185, t: 'Mon 10:33' },
        { by: 'them', typ: 'COUNTER', price: 238, t: 'Mon 10:37' }, { by: 'you', typ: 'COUNTER', price: 196, t: 'Mon 10:41' },
        { by: 'them', typ: 'COUNTER', price: 226, t: 'Mon 10:45' }, { by: 'you', typ: 'COUNTER', price: 205, t: 'Mon 10:49' },
        { by: 'them', typ: 'COUNTER', price: 216, t: 'Mon 10:53' }, { by: 'you', typ: 'COUNTER', price: 212, t: 'Mon 10:57' },
        { by: 'them', typ: 'ACCEPT', price: 212, t: 'Mon 11:00' }, { by: 'you', typ: 'ACCEPT', price: 212, t: 'Mon 11:00:30', note: 'policy · clause 6 (under $250)' }
      ]
    }
  };
  const CLOSE_SNAPSHOTS = { 'D-0187': { p25: 201, median: 218, p75: 232, src: 'Channel3 /similar-products', retrieved: 'Mon 11:18', atClose: true } };
  const CATEGORY = { 'usb-c-dock': 'parts', packing: 'packing', gpu: 'compute' };
  const SUBSCRIBER_CP = (sid) => {
    const s = F.subscribers.find((x) => x.id === sid) || {};
    return { id: sid, name: 'Subscriber ' + sid, who: `care plan subscriber since ${s.since || '—'} · a plain PayPal buyer, no wallet`, key: '—', paired: 'n/a · subscriber', firstSeen: s.since || '—', deals: 0 };
  };

  /* ---- live state ---- */
  const deals = F.deals.map((d) => Object.assign({}, d, { pp: d.pp ? Object.assign({}, d.pp) : null }));
  const byId = (id) => deals.find((d) => d.id === id);
  let locked = false;
  const listeners = [];
  const on = (fn) => listeners.push(fn);
  const emit = () => listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });

  const TERMINAL = ['WITHDRAWN', 'EXPIRED', 'REFUSED', 'MISMATCH', 'VOIDED', 'BLOCK', 'REFUNDED', 'DISPUTED', 'LOST'];
  function kindOf(d) { return d.module === 'tables' ? 'haggle' : d.module === 'counter' ? 'shop' : d.module === 'rescue' ? 'rescue' : d.module === 'shield' ? 'shield' : 'purchase'; }
  function cpOf(d) { return F.counterparties[d.cp] || SUBSCRIBER_CP(d.cp); }
  const cpShort = (d) => d.cp === 'dan' ? 'Dan' : cpOf(d).name;
  function modeOf(d) { return d.replay ? 'REPLAY' : F.mode; }

  function mandateOf(d) {
    if (d.module === 'counter') { const m = F.mandates.find((x) => x.id === 'S-2'); return { id: 'S-2', v: 1, label: 'S-2 v1 · shop floors', signed: m.signed, text: m.text }; }
    if (d.module === 'rescue') { const m = F.mandates.find((x) => x.id === 'R-3'); return { id: 'R-3', v: 1, label: 'R-3 v1 · rescue levers', signed: m.signed, text: m.text }; }
    const m = F.mandates[0];
    return { id: m.id, v: m.v, label: `${m.id} v${m.v} · open mandate`, signed: m.signed, agentKey: m.agentKey, commitment: m.commitment, prev: m.prev, clauses: m.clauses };
  }

  /* clause trace: what the gate checked for this deal, in clause order.
     verdict: pass | ask (needs Maya) | fail | na | unknown */
  function traceOf(d) {
    const md = mandateOf(d);
    const amt = d.amount;
    if (d.module === 'counter') {
      const sku = F.shop.find((s) => s.sku === d.ref);
      return [
        { n: 'S-2', name: 'Floor', verdict: sku && amt != null ? (amt >= sku.floor ? 'pass' : 'fail') : 'unknown', why: sku && amt != null ? `${money(amt)} ≥ floor ${money(sku.floor)} (list ${money(sku.price)})` : 'no SKU floor in this sample' },
        { n: 'S-2', name: 'Who may quote', verdict: 'pass', why: 'quoting agent, inside the per-SKU floors' },
        { n: 'H5', name: 'Receiving money', verdict: 'pass', why: 'the buyer approves on PayPal; capturing incoming money needs no click from you' }
      ];
    }
    if (d.module === 'rescue') {
      return [
        { n: 'R-3', name: 'Lever enabled', verdict: 'pass', why: 'DISCOUNT_THIS_CYCLE is enabled (max −25%)' },
        { n: 'R-3', name: 'Size', verdict: 'pass', why: '−20% ≤ max −25% → a $9.60 invoice this cycle' },
        { n: 'R-3', name: 'Who decides', verdict: d.state === 'FAILED' && d.pending ? 'ask' : 'pass', why: 'a lever is approved by you in the approval window' }
      ];
    }
    const c = md.clauses;
    const allow = ['packrite', 'cablehaus', 'dan', 'house'];
    const cp = cpOf(d);
    const hag = kindOf(d) === 'haggle';
    const pairedOk = /words ✓|house key|wallet shop/.test(cp.paired || '');
    const policyDone = d.decided === 'policy:clause6';
    const out = [];
    out.push({ n: 1, name: c[0].name, verdict: 'pass', why: hag ? 'Buy is allowed for the sourcing agent' : `Buy is allowed for the ${d.agent} agent` });
    out.push({ n: 2, name: c[1].name, verdict: pairedOk ? 'pass' : d.cp === 'partsco' ? 'na' : 'fail',
      why: pairedOk ? `${cp.name}: ${cp.paired}` : d.cp === 'partsco' ? 'payee route: a sandbox merchant, not a wallet peer' : `${cp.name} is ${cp.paired}` });
    if (hag) out.push({ n: 3, name: c[2].name, verdict: 'na', why: 'a haggle is bound by the band (clause 4), not the per-deal purchase cap' });
    else {
      const cat = CATEGORY[d.ref];
      const over = amt != null ? amt > 200 : (d.id === 'D-0192');
      const badCat = cat && !['office', 'parts', 'packing'].includes(cat);
      out.push({ n: 3, name: c[2].name, verdict: over || badCat ? 'fail' : 'pass',
        why: d.id === 'D-0192' ? 'quoted $11,960.00 > max $200.00 · category “compute” is not allowed'
          : `${amt != null ? money(amt) + (over ? ' > ' : ' ≤ ') + 'max $200.00' : 'no amount'}${cat ? ' · category ' + cat : policyDone ? ' · passed at capture' : ' · category not recorded in this sample'}` });
    }
    if (hag) {
      if (d.ref === 'monitor-27-4k') {
        const p = d.amount != null ? d.amount : null;
        out.push({ n: 4, name: c[3].name, verdict: p != null && p <= F.haggle.ceiling ? 'pass' : 'unknown', why: p != null ? `${money(p)} ≤ ceiling ${money(F.haggle.ceiling)} · round 5/6 · until 18:00` : 'no price yet' });
      } else out.push({ n: 4, name: c[3].name, verdict: d.state === 'WITHDRAWN' && /rounds/.test(d.sub) ? 'fail' : 'unknown', why: d.state === 'WITHDRAWN' && /rounds/.test(d.sub) ? 'max rounds reached → auto-WITHDRAW{ROUNDS}' : `the band for ${d.ref} is not in this sample` });
    }
    out.push({ n: 5, name: c[4].name, verdict: d.state === 'REFUSED' ? 'na' : 'pass', why: d.state === 'REFUSED' ? 'not reached' : 'checked before every call (max 12 deals · $900 a day)' });
    const stopped = ['BLOCK', 'REFUSED', 'EXPIRED'].includes(d.state);
    const countersigned = (d.events || []).some((e) => e.lane === 'you' && e.typ === 'ACCEPT' && /countersign/.test(e.signer || ''));
    if (amt != null) out.push({ n: 6, name: c[5].name,
      verdict: amt > 250 ? (d.pending === 'countersign' ? 'ask' : countersigned ? 'pass' : stopped ? 'na' : 'ask') : 'pass',
      why: amt > 250 ? `${money(amt)} > $250 → ${d.pending === 'countersign' ? 'your countersign is needed' : countersigned ? 'you countersigned' : stopped ? 'not reached' : 'your countersign would be needed'}` : `${money(amt)} ≤ $250 → policy may sign${policyDone ? ' · it did' : ''}` });
    const onList = allow.includes(d.cp);
    out.push({ n: 7, name: c[6].name, verdict: onList ? 'pass' : d.state === 'REFUSED' ? 'na' : TERMINAL.includes(d.state) ? 'fail' : 'ask',
      why: onList ? `${cp.payee || cp.name} is on the allowlist` : d.state === 'REFUSED' ? `not reached · ${cp.name} is not on the allowlist either` : TERMINAL.includes(d.state) ? `${cp.name} is not on the allowlist` : `${cp.name} is not on the allowlist → the money decision is yours` });
    return out;
  }

  /* ---- events (the signed timeline + PayPal + gate rows) ---- */
  /* lane: you | them | paypal | gate ; kind: env (signed envelope) | call | check | owner */
  function buildEvents(d) {
    const E = [];
    const add = (o) => { E.push(Object.assign({ id: d.id + ':' + E.length }, o)); };
    const cp = cpOf(d);
    const agentName = (F.agents.find((a) => a.id === d.agent) || {}).name || 'agent';
    if (d.id === 'D-0193') {
      add({ t: new Date(2026, 9, 12, 12, 0).getTime(), label: 'Mon 12 Oct', lane: 'gate', kind: 'owner', typ: 'PAIRED', text: `you paired with Dan · four words confirmed · key ${cp.key}` });
      let round = 0;
      F.haggle.envelopes.forEach((e) => {
        if (e.by === 'you') round++;
        add({ t: ts('Thu ' + e.t), lane: e.by, kind: 'env', typ: e.typ, price: e.price, seq: e.seq, sig: true,
          signer: e.by === 'you' ? 'your agent key 9f3c…a1' : 'Dan · 47be…0d', audit: e.seq === 10 ? 4416 : e.seq === 11 ? 4418 : null,

  function exportTranscript(d) {

    const body = {
      format: 'the-table.transcript/1', mode: modeOf(d), exported_at: new Date(now()).toISOString(),
      deal: { id: d.id, kind: d.kind, side: d.side, item: d.item, amount: d.amount == null ? null : (cents(d.amount) / 100).toFixed(2), currency: 'USD', state: d.state },

  function bandSVG(mk, opts) {

    const padv = (hi - lo) * 0.3 || 10; lo -= padv; hi += padv;
    const x = (v) => 12 + (v - lo) / (hi - lo) * (W - 24);
    const y = H / 2;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="dvband" role="img" aria-label="Market band p25 ${money0(mk.p25)}, median ${money0(mk.median)}, p75 ${money0(mk.p75)}${mk.price != null ? ', this deal ' + money0(mk.price) : ''}">`;
    s += `<line x1="12" x2="${W - 12}" y1="${y}" y2="${y}" stroke="var(--line2)" stroke-width="2"/>`;
    s += `<rect x="${x(mk.p25)}" y="${y - 8}" width="${x(mk.p75) - x(mk.p25)}" height="16" rx="4" fill="color-mix(in srgb, var(--market) 16%, transparent)" stroke="color-mix(in srgb, var(--market) 45%, transparent)"/>`;
    s += `<line x1="${x(mk.median)}" x2="${x(mk.median)}" y1="${y - 13}" y2="${y + 13}" stroke="var(--market)" stroke-width="2"/>`;

    s += `<text x="${x(mk.p25) - 4}" y="${H - 2}" text-anchor="end" fill="var(--dim)" font-size="12" font-family="var(--mono)">p25 ${money0(mk.p25)}</text>`;
    s += `<text x="${x(mk.p75) + 4}" y="${H - 2}" text-anchor="start" fill="var(--dim)" font-size="12" font-family="var(--mono)">p75 ${money0(mk.p75)}</text>`;
    s += `<text x="${x(mk.median)}" y="12" text-anchor="middle" fill="var(--market)" font-size="12" font-family="var(--mono)">median ${money0(mk.median)}</text>`;
    if (ceiling != null) s += `<line x1="${x(ceiling)}" x2="${x(ceiling)}" y1="${y - 16}" y2="${y + 10}" stroke="var(--teal)" stroke-dasharray="3 3" stroke-width="2"/><text x="${x(ceiling)}" y="12" text-anchor="middle" fill="var(--teal-l)" font-size="12" font-family="var(--mono)">ceiling ${money0(ceiling)}</text>`;
    if (mk.price != null) s += `<circle cx="${x(mk.price)}" cy="${y}" r="7" fill="${opts.priceColor || 'var(--gold)'}" stroke="var(--bg)" stroke-width="2"/>`;

  }

  /* ---- layer-1 one-liners: the decision in a few words (its exact words live in layer 2) ---- */
  const REVIEW_SHORT = {
    countersign: (d) => [`Countersign ${cpShort(d)}’s ${money(d.amount)}`, 'over $250 (clause 6) · pays no one'],
    approve: (d) => [`Approve ${money(d.amount)} on PayPal`, 'the order matches the signed deal · PayPal opens in your browser'],
    capture: (d) => [`Capture or void the ${money(d.amount)} hold`, 'clause 7 · the payee is not on the allowlist'],
    release: (d) => [`Release the shield hold on ${money(d.amount)}`, 'you type the payee’s name to release'],

  /* tone: need | hand | may | calm */
  function decisionLine(d) {
    const dc = decisionsOf(d);
    if (dc.handoff) return { tone: 'hand', chip: ['teal', 'In approval window'], t1: 'The decision is in the approval window', t2: `${dc.handoff.phase.toLowerCase()} · this window never pays` };
    if (d.state === 'IN BROWSER') return { tone: 'hand', chip: ['teal', 'In your browser'], t1: 'Approve on PayPal’s own page', t2: 'the wallet polls the order every 10 s · never trusts the redirect' };
    if (dc.review) { const [a, b] = REVIEW_SHORT[d.pending](d); return { tone: 'need', chip: ['gold', 'Needs you'], t1: a, t2: b }; }
    if (dc.withdraw) return { tone: 'may', chip: ['', 'You may withdraw'], t1: 'Nothing waits for you', t2: 'withdrawing is free · it cannot move money' };
    return { tone: 'calm', chip: [isTerminal(d) ? '' : 'line', isTerminal(d) ? 'Closed' : 'No decision'], t1: dc.none, t2: '' };
  }
  const STATE_CHIP = (d) => { const t = stepsOf(d).tone; return ({ live: 'teal', need: 'gold', held: 'gold', ok: 'ok', bad: 'red', off: '' })[t] || ''; };
  const EV_CHIP = { receipted: 'ok', 'seller-attested': 'coral dashed', held: 'gold', approved: 'gold', none: '' };
  const REC_CHIP = { matched: 'ok', pending: 'gold', 'n/a': 'line' };
  const VERDICT = { pass: ['✓', 'okc'], ask: ['?', 'gold'], fail: ['✗', 'red'], na: ['–', 'dim'], unknown: ['?', 'dim'] };
  /* a 120x18 band glyph for indicator rows: p25-p75 box, median tick, price dot */
  function bandMini(mk, ceiling) {
    if (!mk) return '';
    const vals = [mk.p25, mk.p75, mk.price, ceiling].filter((v) => v != null);
    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals); const p = (hi - lo) * 0.15 || 10; lo -= p; hi += p;
    const x = (v) => 4 + (v - lo) / (hi - lo) * 112;
    return `<svg class="bandmini" viewBox="0 0 120 18" width="120" height="18" aria-hidden="true"><line x1="2" x2="118" y1="9" y2="9" stroke="var(--line2)"/>`
      + `<rect x="${x(mk.p25)}" y="4" width="${x(mk.p75) - x(mk.p25)}" height="10" rx="2" fill="color-mix(in srgb, var(--market) 22%, transparent)"/>`
      + `<line x1="${x(mk.median)}" x2="${x(mk.median)}" y1="2" y2="16" stroke="var(--market)" stroke-width="1.5"/>`
      + (ceiling != null ? `<line x1="${x(ceiling)}" x2="${x(ceiling)}" y1="1" y2="17" stroke="var(--teal)" stroke-dasharray="2 2"/>` : '')
      + (mk.price != null ? `<circle cx="${x(mk.price)}" cy="9" r="4" fill="var(--gold)" stroke="var(--bg)"/>` : '') + '</svg>';
  }

  /* ---- view kit: layer-1 bits and layer-2 bodies (sheet / popover content) ---- */
  const pairOk = (cp) => /words ✓|house key|wallet shop/.test(cp.paired || '');
  function pairChip(cp) {
    const l = String(cp.paired || '—').replace(/ (otter|today).*$/, '').replace(/^cooperating /, '').replace(/ pinned$/, '');
    return `<span class="ui-chip ${pairOk(cp) ? 'ok' : /not paired/.test(cp.paired || '') ? 'red' : 'line'}">${esc(l)}</span>`;
  }
  function shieldChip(d) {
    const s = d.shield || (d.module === 'shield' ? d.state : null);
    return s ? `<span class="ui-chip ${s === 'CLEAR' || s === 'released' ? 'ok' : s === 'BLOCK' ? 'red' : 'gold'}">${esc(s)}</span>` : '<span class="dim">no verdict</span>';

  }
  const whoOf = (d, e) => e.lane === 'you' ? 'you' : e.lane === 'them' ? cpShort(d) : e.lane === 'paypal' ? 'PayPal' : 'gate';
  const clausesOfEvent = (e) => { const cl = []; (e.checks || []).forEach((c) => { const m = /clause (\d)/.exec(c); if (m) cl.push(m[1]); if (/^S-2/.test(c)) cl.push('S-2'); }); if (e.clause) cl.push(String(e.clause)); return cl; };
  const vglyph = (v) => { const g = VERDICT[v] || VERDICT.unknown; return `<span class="vg ${g[1]}" aria-label="${esc(v)}">${g[0]}</span>`; };
  const L2 = {
    mandate(d) {
      const md = mandateOf(d), agent = F.agents.find((a) => a.id === d.agent);
      return `<dl class="ui-kv"><dt>mandate</dt><dd>${esc(md.label)}</dd><dt>signed</dt><dd>${esc(md.signed)}${md.commitment ? ` · commitment <span class="mono">${esc(md.commitment)}</span>` : ''}</dd>
        <dt>agent</dt><dd>${esc(agent ? agent.name : '—')} · <span class="mono">${esc(agent ? agent.engine : '')}</span></dd>

        <dl class="ui-kv" style="margin-top:var(--sp-3)"><dt>evidence</dt><dd><span class="ui-chip ${EV_CHIP[ev.label] || ''}">${esc(ev.label)}</span> ${esc(ev.text)}</dd>
        <dt>statement</dt><dd><span class="ui-chip ${REC_CHIP[ev.rec]}">${esc(ev.recText)}</span> ${esc(ev.recWhy)}</dd></dl>
        <div class="ui-hint" style="margin-top:6px">Seller-attested until your wallet holds its own evidence, then receipted. Ids are truncated.</div>`;
    },
    market(d) {
      const mk = marketOf(d);
      if (!mk) return '<p class="sheet-p">No market reference for this item. The price rules are skipped, not passed.</p>';
      return bandSVG(mk, { ceiling: d.id === 'D-0193' ? F.haggle.ceiling : null }) + `<dl class="ui-kv" style="margin-top:var(--sp-3)"><dt>this deal</dt><dd>${mk.price != null ? `<b class="money">${money(mk.price)}</b> · ${esc(mk.where)}${mk.pct != null ? ` · stored as p${mk.pct}` : ''}${mk.overMedian != null && Math.abs(mk.overMedian) >= 10 ? ` · ${mk.overMedian > 0 ? '+' : ''}${mk.overMedian}% vs median` : ''}` : 'no price yet'}</dd>
        <dt>band</dt><dd class="mono">p25 ${money0(mk.p25)} · median ${money0(mk.median)} · p75 ${money0(mk.p75)}</dd><dt>source</dt><dd>${esc(mk.src)} · retrieved ${esc(mk.retrieved)}${mk.atClose ? ' · stored with the terms at close' : ''}</dd></dl>
        <div class="ui-hint" style="margin-top:6px">A reference, not a proof.</div>`;

      const ev = evidenceOf(d), m = d.events.find((e) => e.typ === 'MATCHED');

    event(d, e) {
      const link = chainOf(d).find((r) => r.ev.id === e.id);
      return `<dl class="ui-kv"><dt>when</dt><dd class="mono">${esc(e.label || clock(e.t, true))}</dd><dt>who</dt><dd>${esc(whoOf(d, e))}${e.price != null ? ` · <b class="money">${money(e.price)}</b>` : ''}</dd>
        ${e.kind === 'env' ? `<dt>signature</dt><dd>${e.sig === false ? '<span class="red">✗ unpaired key · nothing to verify against</span>' : `<span class="okc">✓ verified</span> · <span class="mono">${esc(e.signer || '')}</span>`}</dd>` : ''}
        ${link ? `<dt>hash link</dt><dd class="mono">${esc(shortH(link.prev))} → ${esc(link.show)}</dd>` : ''}
        ${e.src ? `<dt>attested by</dt><dd>${esc(e.src)}</dd>` : ''}${e.audit ? `<dt>audit row</dt><dd class="mono">#${e.audit} · append-only</dd>` : ''}

        ${(e.checks || []).length ? `<ul class="chk">${e.checks.map((c) => `<li class="${/✗/.test(c) ? 'x' : ''}">${esc(c.replace(/^✗ /, ''))}</li>`).join('')}</ul>` : ''}

    },
    transcript(d, v) {
      const chain = chainOf(d), link = new Map(chain.map((r, i) => [r.ev.id, { r, i }]));
      return `<table class="ui-table"><thead><tr><th>#</th><th>who</th><th>what</th><th class="num">price</th><th>sig · link</th><th>when</th></tr></thead><tbody>
        ${d.events.slice().sort((a, b) => a.t - b.t).map((e) => { const L = link.get(e.id); const checking = v && L && L.i === v.upto && !v.done; const checked = v && L && (L.i < v.upto || v.done);
          return `<tr class="${checking ? 'checking' : ''}"><td class="mono lane-${e.lane}">${e.seq ? e.seq : '·'}</td><td>${esc(whoOf(d, e))}</td><td class="clip" title="${esc(e.text || '')}">${esc(e.typ)}${e.text ? ` <span class="dim">· ${esc(e.text)}</span>` : ''}</td>
          <td class="num">${e.price != null ? money(e.price) : ''}</td><td>${L ? `${e.sig === false ? '<span class="red">✗</span>' : checked ? '<span class="okc">✓ re-verified</span>' : '<span class="okc">✓</span>'} <span class="mono dim">${esc(L.r.show)}</span>` : `<span class="dim">${esc(e.src || '')}</span>`}</td><td class="mono dim">${esc(e.label || clock(e.t))}</td></tr>`; }).join('')}</tbody></table>`;
    }
  };
  function withdrawSheet(d) {
    const dc = decisionsOf(d); if (!dc.withdraw) return null;
    return window.UI.sheet({ title: `Withdraw ${d.id}?`, size: 'narrow', body: `<p class="sheet-p">${esc(dc.withdrawWhat)}</p><div class="ui-silence">the safe direction · it cannot move money</div>`,
      actions: [{ label: 'Keep the deal' }, { label: 'Send signed WITHDRAW', kind: 'danger', onClick: () => { withdraw(d); } }] });
  }
  function exportSheet(d) {
    const x = exportTranscript(d), lines = x.text.split('\n');
    return window.UI.sheet({ title: `Transcript · ${d.id}`, size: 'wide',
      body: `<dl class="ui-kv"><dt>file</dt><dd class="mono">${esc(x.name)}</dd><dt>contents</dt><dd>${x.envelopes} envelope${x.envelopes === 1 ? '' : 's'} · head <span class="mono">${esc(x.head || '—')}</span> · PayPal ids · the <b>${modeOf(d)}</b> badge</dd>
        <dt>signature</dt><dd>ed25519 <span class="mono">${esc(x.sig)}</span> <span class="dim">· simulated</span></dd></dl><div class="ui-hint" style="margin-top:6px">Counterparty text is quoted as untrusted data.</div>
        <pre class="xpre">${esc(lines.slice(0, 40).join('\n'))}${lines.length > 40 ? '\n…' : ''}</pre>`,
      actions: [{ label: 'Close' }, { label: 'Save file', kind: 'primary', onClick: () => { download(x); toast(`Saved <b>${esc(x.name)}</b> (simulated signature).`, 'ok'); } }] });
  }

  /* ---- routing ---- */
  const REQUIRED = ['D-0193', 'D-0190', 'D-0196', 'D-0189', 'D-0188', 'D-0187'];
  function idFromHash() { const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).toUpperCase(); return byId(h) ? h : 'D-0193'; }
  function go(id) { if (byId(id)) location.hash = id; }

  return {
    F, esc, money, money0, now, ts, clock, dur, hhmm, shortH, MODS, MOD_ORDER, REQUIRED, deals, byId, kindOf, cpOf, cpShort, modeOf,

<script>
/* v2 Proof sheet: the deal as six graded claims. Layer 1 is one row per claim with its grade;
   the selected claim's proof fills the inspector, Enter opens it as a sheet. Keyboard-first. */
(function () {
  'use strict';
  const D = window.DV, F = D.F, esc = D.esc, money = D.money;
  const $ = (s) => document.querySelector(s);
  let cur = D.idFromHash();
  let focusIx = 0;
  let verifying = null;   /* {id, upto, done} */
  let wsheet = null;      /* the open withdraw sheet: W again confirms */
  const ORDER = D.MOD_ORDER.flatMap((k) => D.deals.filter((d) => d.module === k).map((d) => d.id));
  const live = (api) => api && api.el.isConnected;

  /* ---------- what happened, in plain words (our own facts only) ---------- */
  function story(d) {
    const cp = D.cpShort(d);
    const env = d.events.filter((e) => e.kind === 'env' && e.price != null);
    const mine = env.filter((e) => e.lane === 'you'), theirs = env.filter((e) => e.lane === 'them');
    const first = d.events.slice().sort((a, b) => a.t - b.t).find((e) => e.typ !== 'PAIRED');
    let lead = '', leadHTML = '';
    if (D.kindOf(d) === 'haggle' && mine.length && theirs.length) {
      lead = `Haggled with ${cp} from ${D.clock(first.t)} · ${env.length} signed envelopes · bids ${money(mine[0].price)} → ${money(mine[mine.length - 1].price)} · asks ${money(theirs[0].price)} → ${money(theirs[theirs.length - 1].price)}`;
      leadHTML = `Your sourcing agent haggled with <b>${esc(cp)}</b> from ${esc(D.clock(first.t))} over the ${esc(d.item.charAt(0).toLowerCase() + d.item.slice(1))}. In ${env.length} signed envelopes your bids went <b class="money">${money(mine[0].price)}</b> → <b class="money">${money(mine[mine.length - 1].price)}</b> and their asks <b class="money">${money(theirs[0].price)}</b> → <b class="money">${money(theirs[theirs.length - 1].price)}</b>.`;
    } else if (first) { lead = `${D.clock(first.t)} · ${first.text || first.typ}`; leadHTML = `${esc(D.clock(first.t))}: ${esc(first.text || first.typ)}.`; }
    const st = {
      NEGOTIATING: d.pending === 'countersign' ? `Your agent wants to accept ${money(d.amount)}. That is over the $250 line in clause 6, so it waits for your countersign.` : `Your ACCEPT is signed; ${cp}’s ACCEPT has not arrived.`,
      AGREED: 'Both sides signed ACCEPT. The seller’s wallet issues the PayPal order next.',
      SETTLING: 'The seller’s wallet is creating the PayPal order.',
      'AWAITING APPROVAL': 'The PayPal order is in a signed SETTLE and matches the deal. It waits for your approval on PayPal.',
      'IN BROWSER': 'You are approving on PayPal’s own page in your browser; the wallet polls the order.',
      APPROVED: 'PayPal shows the order approved. The seller authorizes and captures next.',
      'SELLER-ATTESTED': `${cp} says the payment is captured. Your wallet has not seen its own proof yet.`,
      RECEIPTED: `${cp}’s signed RECEIPT carries the capture id and the same transcript head as yours.`,
      AUTHORIZED: `The money is held at PayPal, not paid.${d.pending === 'capture' ? ' The payee is not on your allowlist, so the capture is yours to decide.' : ''}`,
      CAPTURED: d.side === 'seller' ? 'The buyer approved and your wallet captured: the money is paid to you.' : 'The payment was captured.',
      VOIDED: 'The hold was voided. Nothing was paid.',
      REFUSED: 'The gate refused it before any network call. No PayPal call was made.',
      BLOCK: 'The shield blocked it. No PayPal link was ever opened.',
      HOLD: 'The shield held it before any PayPal call.',
      WITHDRAWN: 'The deal was withdrawn. No money moved.',
      EXPIRED: 'It ran out on its deadline. No money moved.',
      MISMATCH: `${cp}’s SETTLE amount does not match the signed deal. There is no PayPal button.`,
      FAILED: 'Your rescue agent suggests a lever; it waits for you.',
      'OFFER SENT': 'The discounted invoice is out. Nothing is charged until the subscriber pays it.',
      RECOVERED: 'The subscriber paid this cycle.',
      QUOTED: 'A quote is out. A quote is not an order.',
      'AWAITING BUYER APPROVAL': 'The buyer approves on PayPal; receiving money needs no click from you.',
      PAIRING: 'The table is still pairing.', LISTED: 'The seller has listed; no offers yet.'
    }[d.state] || '';
    return { lead, st, full: `<p class="sheet-p">${leadHTML}</p>${st ? `<p class="sheet-p">${esc(st)}</p>` : ''}<p class="sheet-p muted">Money right now: ${esc(D.moneyNow(d))}.</p><div class="ui-hint">Built only from the wallet’s own records. Counterparty text is never quoted here.</div>` };
  }

  /* ---------- the claims: what you are asked to believe, graded by who stands behind it ---------- */
  function claims(d) {
    const C = [], cp = D.cpOf(d), chain = D.chainOf(d), bad = chain.filter((r) => r.ev.sig === false);
    if (chain.length) C.push({ id: 'terms', g: bad.length ? 'fail' : 'pass', grade: bad.length ? ['red', 'unverifiable key'] : ['ok', 'signed ✓'],
      t: bad.length ? 'The offer is not from a paired key' : 'Every price here is signed by the side that sent it',
      sub: `${chain.length} envelope${chain.length === 1 ? '' : 's'} · hash-linked · head ${D.headOf(d) || '—'}${d.terms ? ' · terms ' + d.terms : ''}` });
    else C.push({ id: 'terms', g: 'na', grade: ['', 'no envelopes'], t: 'There is no signed negotiation for this deal', sub: 'its evidence is the gate and PayPal rows' });
    const tr = D.traceOf(d), fail = tr.filter((c) => c.verdict === 'fail'), ask = tr.filter((c) => c.verdict === 'ask'), md = D.mandateOf(d);
    C.push({ id: 'mandate', g: fail.length ? 'fail' : ask.length ? 'ask' : 'pass', grade: fail.length ? ['red', `clause ${fail.map((c) => c.n).join(', ')} ✗`] : ask.length ? ['gold', `clause ${ask.map((c) => c.n).join(', ')} asks you`] : ['ok', 'inside the mandate'],
      t: fail.length ? `It breaks ${md.id}: ${fail.map((c) => c.name.toLowerCase()).join(', ')}` : ask.length ? `It fits ${md.id}, but ${md.id === 'M-12' ? 'clause ' : ''}${ask.map((c) => c.n).join(', ')} says you decide` : `It stays inside ${md.label}`,
      sub: `checked in Rust before every network call · signed ${md.signed}` });
    const paired = D.pairOk(cp), shield = d.shield || (d.module === 'shield' ? d.state : null);
    C.push({ id: 'who', g: d.note && !paired ? 'fail' : paired ? 'pass' : d.module === 'rescue' ? 'na' : 'unk', grade: paired ? ['ok', cp.paired.replace(/ otter.*/, '')] : d.module === 'rescue' ? ['', 'subscriber'] : ['red', cp.paired],
      t: paired ? `${cp.name} is the key you paired with` : d.module === 'rescue' ? `${cp.name} is a subscriber on your care plan` : `${cp.name} is not a counterparty you paired with`,
      sub: `key ${cp.key} · first seen ${cp.firstSeen}${shield ? ' · shield ' + shield : ''}${d.note ? ' · sent a note (untrusted)' : ''}` });
    const ev = D.evidenceOf(d);
    const evG = { receipted: ['pass', ['ok', 'receipted']], 'seller-attested': ['att', ['coral dashed', 'seller-attested']], held: ['pend', ['gold', 'held · your own call']], approved: ['pend', ['gold', 'approved (polled)']], none: ['pass', ['', d.pp && d.pp.order ? 'no capture' : '0 PayPal calls']] }[ev.label];
    C.push({ id: 'money', g: evG[0], grade: evG[1], t: moneyClaim(d, ev), sub: ev.text });
    const mk = D.marketOf(d);
    C.push({ id: 'market', g: mk ? (mk.price != null && mk.price > mk.p75 ? 'ask' : 'pass') : 'na', grade: mk ? ['line', `market · ${mk.retrieved}`] : ['', 'no reference'],
      t: mk ? (mk.price != null ? `${money(mk.price)} sits ${mk.where} of the market` : 'No price to compare yet') : 'There is no market reference for this item',
      sub: mk ? `${mk.src}${mk.atClose ? ' · stored with the terms at close' : ''} · a reference, not a proof` : 'price rules are skipped, not passed' });
    C.push({ id: 'books', g: ev.rec === 'matched' ? 'pass' : ev.rec === 'pending' ? 'pend' : 'na', grade: ev.rec === 'matched' ? ['ok', 'matched'] : ev.rec === 'pending' ? ['gold', 'pending in PayPal reporting'] : ['', 'n/a'],
      t: ev.rec === 'matched' ? 'PayPal’s own statement agrees' : ev.rec === 'pending' ? 'PayPal’s statement has not caught up yet' : 'There is nothing for PayPal’s statement to show',
      sub: ev.rec === 'pending' ? 'Transaction Search lags up to 3 h behind a capture' : ev.rec === 'matched' ? 'Transaction Search matched it on your own account' : 'no capture, so no statement row' });
    return C;
  }
  function moneyClaim(d, ev) {
    if (ev.label === 'receipted') return d.side === 'seller' || d.state === 'RECOVERED' ? `${money(d.amount)} was paid to you` : `${money(d.amount)} was paid, and you hold the proof`;
    if (ev.label === 'seller-attested') return `${D.cpShort(d)} says ${money(d.amount)} was captured`;
    if (ev.label === 'held') return `${money(d.amount)} is held at PayPal, not paid`;
    if (ev.label === 'approved') return 'The order is approved; nothing is captured';
    return 'No money has moved';
  }
  const GLYPH = { pass: '✓', att: '◐', pend: '…', ask: '?', fail: '✗', na: '–', unk: '?' };

  /* ---------- proofs (layer 2): compact in the inspector, full in a sheet ---------- */
  function verifyLine(d) {
    const chain = D.chainOf(d), v = verifying && verifying.id === d.id ? verifying : null;
    if (!chain.length) return '';
    return `<div class="ui-hint" style="margin-top:6px">${v && v.done ? `<span class="okc">✓ ${chain.filter((r) => r.ev.sig !== false).length}/${chain.length} signatures verify · every prev hash links · head ${esc(D.headOf(d))}</span> · checked offline in your wallet` : v ? '<span class="gold">re-verifying…</span>' : 'Signatures and hash links can be re-checked offline.'}</div>`;
  }
  function termsCompact(d) {
    const chain = D.chainOf(d), v = verifying && verifying.id === d.id ? verifying : null;
    const link = new Map(chain.map((r, i) => [r.ev.id, i]));
    return `<div class="ui-group">${d.events.slice().sort((a, b) => a.t - b.t).map((e) => {
      const i = link.get(e.id), has = i != null, checking = v && has && i === v.upto && !v.done, checked = v && has && (i < v.upto || v.done);
      return `<div class="ui-row lane-${e.lane} ${checking ? 'checking' : ''}"><span class="sq">${e.seq || '·'}</span><span class="t1" style="flex:1"><span class="dim">${esc(D.whoOf(d, e))}</span> ${esc(e.typ)}</span>${e.price != null ? `<span class="amt">${money(e.price)}</span>` : ''}<span class="${has ? (e.sig === false ? 'red' : 'okc') : 'dim'}" style="width:22px;text-align:right">${has ? (e.sig === false ? '✗' : checked ? '✓✓' : '✓') : ''}</span></div>`;
    }).join('')}</div>${verifyLine(d)}`;
  }
  function proof(d, c, full) {
    if (c.id === 'terms') return full ? D.L2.transcript(d, verifying && verifying.id === d.id ? verifying : null) + verifyLine(d) : termsCompact(d);
    return { mandate: D.L2.mandate, who: D.L2.who, money: D.L2.paypal, market: D.L2.market, books: D.L2.books }[c.id](d);
  }
  function inspector(d) {
    const C = claims(d), c = C[focusIx]; if (!c) return;
    $('#insp').innerHTML = `<div class="insp-h"><span class="vg g-${c.g}">${GLYPH[c.g]}</span><span class="kbd">${focusIx + 1}</span><span class="ui-chip ${c.grade[0]}">${esc(c.grade[1])}</span></div>
      <h2>${esc(c.t)}</h2><div class="ui-hint">${esc(c.sub)}</div>
      <div class="ui-section">${proof(d, c, false)}</div>
      <div class="insp-acts"><button class="ui-btn sm" data-do="sheet">Open as sheet <span class="kbd">Enter</span></button>${c.id === 'terms' && D.chainOf(d).length ? '<button class="ui-btn sm" data-do="verify">Re-verify offline <span class="kbd">V</span></button>' : ''}</div>`;
  }
  function proofSheet() {
    const d = D.byId(cur), c = claims(d)[focusIx]; if (!c) return;
    UI.sheet({ title: c.t, size: c.id === 'terms' || c.id === 'money' || c.id === 'market' ? 'wide' : '', body: `<div class="ui-hint" style="margin-bottom:8px">${esc(c.sub)}</div>${proof(d, c, true)}`, actions: [{ label: 'Done', kind: 'primary' }] });
  }

  /* ---------- layer 1 ---------- */
  function decision(d) {
    const L = D.decisionLine(d), dc = D.decisionsOf(d), sil = D.silenceOf(d), dl = D.deadlineOf(d);
    const b = [];
    if (dc.withdraw) b.push('<button class="ui-btn danger" data-do="withdraw" data-tip="Key: W, then W again">Withdraw</button>');
    if (dc.review && !dc.handoff) b.push(`<button class="ui-btn gold ${D.locked ? 'locked' : ''}" data-do="review" data-tip="Key: A · opens the approval window, the only place money can be released">Review &amp; approve ↗</button>`);
    return `<div class="ui-group decide ${L.tone}"><div class="ui-row ${sil ? 'two' : ''}"><span class="ui-chip ${L.chip[0]}">${esc(L.chip[1])}</span>
      <span class="main"><span class="t1"><b>${esc(L.t1)}</b>${L.t2 ? ` <span class="dim">· ${esc(L.t2)}</span>` : ''}</span>${sil ? `<span class="ui-silence">if you do nothing → <b>${esc(sil)}</b></span>` : ''}</span>
      ${dl && L.tone !== 'calm' ? `<span class="cd" data-until="${dl.t}" title="${esc(dl.what)}">${D.dur(dl.t - D.now())}</span>` : ''}<span class="end">${b.join('')}</span></div></div>`;
  }
  function render() {
    const d = D.byId(cur), m = D.MODS[d.module];
    $('#crumbs').innerHTML = `<a href="../../../index.html#home">The Table</a><span class="sep">›</span><a href="${D.backHref(d)}">${m.name}</a><span class="sep">›</span><span class="mono">${esc(d.id)}</span>`;
    $('#meters').innerHTML = D.metersHTML();
    $('#mode').innerHTML = `<span class="badge ${D.modeOf(d) === 'REPLAY' ? 'replay' : 'sandbox'}">${D.modeOf(d)}</span>`;
    const idle = $('#idle'); idle.className = 'ui-btn sm' + (D.locked ? ' gold locked' : ''); idle.textContent = D.locked ? 'Idle 15 min' : 'Active';
    const C = claims(d); if (focusIx >= C.length) focusIx = 0;
    const s = story(d), dl = D.deadlineOf(d), sims = D.simActionsOf(d);
    $('#view').innerHTML = `
      <div class="ui-pagehead"><h1 tabindex="-1" id="h1">${esc(d.item)}</h1><span class="sub">${esc(d.id)} · ${esc(d.kind)} · with <span class="coral">${esc(D.cpOf(d).name)}</span></span>
        <div class="actions"><button class="ui-btn sm" data-do="export" data-tip="Key: E">Export transcript</button></div></div>
      <div class="figs"><span class="amt">${d.amount != null ? money(d.amount) : esc(d.ask || '—')}</span><span class="ui-chip ${D.STATE_CHIP(d)}">${esc(d.state)}</span>
        <div class="f"><span class="k">Money right now</span><span class="v">${esc(D.moneyNow(d))}</span></div>
        ${dl ? `<div class="f push"><span class="k">Deadline</span><span class="v">${esc(dl.what.includes(D.clock(dl.t)) ? dl.what : `${dl.what} · ${D.clock(dl.t)}`)}</span></div>` : ''}</div>
      <div class="stripline">${D.stripHTML(d)}</div>
      ${decision(d)}
      <div class="ui-section"><div class="ui-section-h"><h2>What happened</h2><span class="end">from the wallet’s own records</span></div>
        <div class="ui-group"><div class="ui-row two act story" data-do="story" tabindex="0"><span class="main"><span class="t1">${esc(s.lead)}</span><span class="t2">${esc(s.st)}</span></span><span class="chev"></span></div></div></div>
      <div class="ui-section"><div class="ui-section-h"><h2>Why you may believe it</h2><span class="end"><span class="kbd">J</span> <span class="kbd">K</span> move · <span class="kbd">Enter</span> open · <span class="kbd">1</span>–<span class="kbd">6</span></span></div>
        <div class="ui-group claims" id="claims" role="listbox" aria-label="Claims about this deal">${C.map((c, i) => `<div class="ui-row two act claim" role="option" id="cb${i}" data-claim="${i}" tabindex="${i === focusIx ? 0 : -1}" aria-selected="${i === focusIx}">
          <span class="vg g-${c.g}" aria-hidden="true">${GLYPH[c.g]}</span><span class="kbd">${i + 1}</span>
          <span class="main"><span class="t1">${esc(c.t)}</span><span class="t2">${esc(c.sub)}</span></span><span class="ui-chip ${c.grade[0]}">${esc(c.grade[1])}</span><span class="chev"></span></div>`).join('')}</div>
        <div class="legend ui-hint">Grades: <span class="ui-chip ok">signed / receipted</span> your own proof <span class="ui-chip coral dashed">seller-attested</span> their word <span class="ui-chip gold">pending</span> not confirmed yet <span class="ui-chip line">reference</span> context</div></div>
      <div class="foot ui-proto sim"><span class="dim">Sandbox simulation:</span>${sims.length ? sims.map((x, i) => `<button class="ui-btn sm" data-sim="${i}">${esc(x.label)}</button>`).join('') : '<span class="none">no external event is pending</span>'}</div>`;
    inspector(d);
  }

  /* ---------- actions ---------- */
  function act(k) {
    const d = D.byId(cur), dc = D.decisionsOf(d);
    if (k === 'review' && dc.review && !dc.handoff) D.openApproval(d);
    else if (k === 'withdraw' && dc.withdraw) { if (live(wsheet)) { wsheet.close(); wsheet = null; D.withdraw(d); } else wsheet = D.withdrawSheet(d); }
    else if (k === 'export') D.exportSheet(d);
    else if (k === 'verify') verify(d);
    else if (k === 'sheet') proofSheet();
    else if (k === 'story') UI.sheet({ title: 'What happened', body: story(d).full, actions: [{ label: 'Done', kind: 'primary' }] });
  }
  const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function verify(d) {
    const n = D.chainOf(d).length; if (!n) return;
    focusIx = claims(d).findIndex((c) => c.id === 'terms'); UI.inspector($('#split'), true);
    verifying = { id: d.id, upto: 0, done: false };
    const step = () => { if (!verifying || verifying.id !== d.id) return; verifying.upto++; if (verifying.upto >= n) verifying.done = true; render(); if (!verifying.done) setTimeout(step, reduce() ? 0 : 120); };
    render(); setTimeout(step, reduce() ? 0 : 120);
  }
  function select(i, focus) { const n = claims(D.byId(cur)).length; focusIx = (i + n) % n; render(); if (focus !== false) { const b = document.getElementById('cb' + focusIx); if (b) b.focus(); } }
  function step(dl) { const i = ORDER.indexOf(cur); D.go(ORDER[(i + dl + ORDER.length) % ORDER.length]); }

  /* go-to palette, as a sheet */
  function palette() {
    const box = document.createElement('div'); box.className = 'pal';
    box.innerHTML = '<input class="ui-field ui-search" placeholder="Deal id, counterparty, item or state…" aria-label="Filter deals" autocomplete="off"><div class="ui-group" role="listbox"></div>';
    const q = box.querySelector('input'), list = box.querySelector('.ui-group');
    let ix = Math.max(0, D.deals.findIndex((d) => d.id === cur));
    const rows = () => D.deals.filter((d) => !q.value.trim() || [d.id, d.item, d.state, d.kind, D.cpOf(d).name, D.MODS[d.module].name].join(' ').toLowerCase().includes(q.value.trim().toLowerCase()));
    const paint = () => { const L = rows(); if (ix >= L.length) ix = 0;
      list.innerHTML = L.map((d, i) => `<div class="ui-row act" role="option" aria-selected="${i === ix}" data-pid="${d.id}"><span class="id">${d.id}</span><span class="t1">${esc(d.item)} <span class="dim">· ${esc(D.cpOf(d).name)}</span></span><span class="ui-chip ${D.STATE_CHIP(d)}">${esc(d.state)}</span></div>`).join('') || '<div class="ui-empty">no deal matches</div>';
      const on = list.querySelector('[aria-selected="true"]'); if (on) on.scrollIntoView({ block: 'nearest' }); };
    const sh = UI.sheet({ title: 'Go to a deal', body: box, actions: [] });
    const pick = (id) => { sh.close(); D.go(id); };
    q.addEventListener('input', () => { ix = 0; paint(); });
    q.addEventListener('keydown', (e) => { const L = rows();
      if (e.key === 'ArrowDown') { e.preventDefault(); ix = (ix + 1) % Math.max(1, L.length); paint(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); ix = (ix - 1 + L.length) % Math.max(1, L.length); paint(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (L[ix]) pick(L[ix].id); } });
    list.addEventListener('click', (e) => { const r = e.target.closest('[data-pid]'); if (r) pick(r.dataset.pid); });
    paint(); q.focus();
  }
  const KEYS = [['J / K', 'next / previous claim'], ['1 – 6', 'select a claim'], ['Enter', 'open its proof as a sheet'], ['V', 're-verify signatures offline'], ['A', 'Review & approve (approval window)'], ['W', 'Withdraw (W again confirms)'], ['E', 'Export transcript'], ['G · Ctrl K', 'go to a deal'], ['[ ]', 'previous / next deal'], ['Esc', 'close the top layer, then back']];

  document.addEventListener('click', (e) => {
    const t = e.target;
    const cb = t.closest('[data-claim]'); if (cb) { select(+cb.dataset.claim); return; }
    const a = t.closest('[data-do]'); if (a) { act(a.dataset.do); return; }
    const s = t.closest('[data-sim]'); if (s) { const x = D.simActionsOf(D.byId(cur))[+s.dataset.sim]; if (x) x.fn(); return; }
    if (t.closest('#find')) palette();
    else if (t.closest('#prev')) step(-1);
    else if (t.closest('#next')) step(1);
    else if (t.closest('#insp-t')) UI.inspector($('#split'));
    else if (t.closest('#keys')) UI.popover(t.closest('#keys'), `<dl class="ui-kv">${KEYS.map(([k, v]) => `<dt><span class="kbd">${esc(k)}</span></dt><dd>${esc(v)}</dd>`).join('')}</dl>`, { title: 'Keys' });
    else if (t.closest('#idle')) { D.setLocked(!D.locked); D.toast(D.locked ? 'Idle 15 min (simulated): Review now asks for Windows Hello.' : 'Active again.'); }
  });
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (live(wsheet) && (k === 'w' || k === 'W')) { e.preventDefault(); act('withdraw'); return; }
    if (UI.open) return;                                    /* a sheet or popover has the keys */
    if (e.target.matches && e.target.matches('input, textarea')) return;
    if (e.target.closest && e.target.closest('#dvApproval')) return;
    if (e.ctrlKey && k.toLowerCase() === 'k') { e.preventDefault(); palette(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'Escape') { if (D.approvalOpen) { D.closeApproval(); return; } location.href = D.backHref(D.byId(cur)); return; }
    const n = claims(D.byId(cur)).length;
    if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); select(focusIx + 1); }
    else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); select(focusIx - 1); }
    else if ((k === 'Enter' || k === ' ') && !(e.target.closest && e.target.closest('button, a, .story'))) { e.preventDefault(); act('sheet'); }
    else if ((k === 'Enter' || k === ' ') && e.target.closest && e.target.closest('.story')) { e.preventDefault(); act('story'); }
    else if (/^[1-9]$/.test(k) && +k <= n) { e.preventDefault(); select(+k - 1); }
    else if (k === 'v' || k === 'V') act('verify');
    else if (k === 'a' || k === 'A') act('review');
    else if (k === 'w' || k === 'W') act('withdraw');
    else if (k === 'e' || k === 'E') act('export');
    else if (k === 'g' || k === 'G') { e.preventDefault(); palette(); }
    else if (k === '[') step(-1);
    else if (k === ']') step(1);
  });
  /* the claim that matters most is selected on arrival, its proof in the inspector */
  function firstFocus() { const i = claims(D.byId(cur)).findIndex((c) => ['fail', 'ask', 'att'].includes(c.g)); focusIx = i >= 0 ? i : 0; }
  window.addEventListener('hashchange', () => { cur = D.idFromHash(); verifying = null; firstFocus(); render(); $('#main').scrollTop = 0; const h = $('#h1'); if (h) h.focus({ preventScroll: true }); });
  D.on(render);
  setInterval(() => document.querySelectorAll('[data-until]').forEach((el) => { el.textContent = D.dur(+el.dataset.until - D.now()); }), 1000);
  firstFocus();
  render();
})();
</script>
<script src="../../../shared/shell.js" data-page="deal" data-variant="2"></script>
</body>
