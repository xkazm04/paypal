<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup · The Circuit · The Table</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---- setup core (shared by the three setup variants): title-bar meters, rows as controls,
   prototype dock, the simulated approval window and native OS dialogs ---- */
body { overflow: hidden; }
.tb-meter { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; padding-left: var(--sp-3); border-left: 1px solid var(--line); }
.tb-meter .money { font-weight: var(--fw-semibold); }
@media (max-width: 1180px) { .tb-meter .long { display: none; } }
.ui-inspector .ui-silence { white-space: normal; }
.ui-chip svg, .ui-btn svg, .ic svg { width: 11px; height: 11px; flex: none; }
.ui-toast code, .ui-hint code { font: var(--fs-small) var(--mono); color: var(--teal-l); }
.ui-toast b { color: var(--gold-l); }
.mk { width: 14px; flex: none; text-align: center; font: var(--fw-bold) var(--fs-body)/1 var(--mono); }
.mk.y { color: var(--ok); } .mk.n { color: var(--red-l); } .mk.w { color: var(--gold-l); } .mk.o { color: var(--dim); }
.banners { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.banners:empty { display: none; }
.banners .notice { align-items: center; min-height: var(--row); padding-block: 3px; }
.banners .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* rows that are themselves a control (radio rows) */
label.ui-row { cursor: pointer; }
label.ui-row:hover { background: var(--hover); }
.ui-row input[type="radio"] { margin: 0; flex: none; }
.ui-row .lbl { flex: none; width: 176px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ui-row .st { flex: 1 1 auto; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ui-row .st .dim { color: var(--dim); }
.ui-row.need { box-shadow: inset 2px 0 0 var(--refuse); }
.ui-row.wait { box-shadow: inset 2px 0 0 var(--gold); }
.ui-row.foot { background: var(--bg2); }
.ui-sheet-b > .ui-group, .ui-sheet-b > .ui-hint, .ui-sheet-b > .ui-kv, .ui-sheet-b > p, .ui-sheet-b > .ui-section-h { margin: 0 0 var(--sp-3); }
.ui-sheet-b p, .ui-popover p { margin: 0 0 var(--sp-2); }
.ui-popover .ui-group { margin: var(--sp-2) 0; }
.ui-popover .ui-row { padding: 0 var(--sp-2); }
.pop-head { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-2); }
.acts { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }

/* prototype controls (not the product) */
.proto-in { display: grid; gap: 6px; }
.proto-in .ui-seg, .proto-in .ui-btn { justify-self: start; }
.proto-in .ui-btn { white-space: normal; height: auto; min-height: var(--ctl-sm); padding-block: 3px; text-align: left; }
.ui-proto { min-width: 0; }
.proto-in label { display: grid; gap: 2px; color: var(--dim); }
.proto-in .ui-field { height: var(--ctl-sm); font-size: var(--fs-small); width: 100%; }
.ui-sb-foot .ui-proto { margin-top: var(--sp-2); }

/* approval window: a separate OS window in the real app, the only privileged surface */
.layer { position: fixed; inset: var(--shell-h) 0 0 0; display: grid; place-items: center; padding: var(--sp-4); }
#awLayer { z-index: 8600; background: var(--scrim); animation: ui-fade var(--t-med) var(--ease); }
#nativeLayer { z-index: 8700; }
.aw { width: min(540px, 100%); max-height: 100%; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr) auto; overflow: hidden;
  background: var(--bg2); border-radius: var(--r-lg); box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 45%, transparent); animation: aw-in var(--t-med) var(--ease); }
.aw-lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
.aw-b { overflow: auto; padding: var(--sp-3) var(--sp-4) var(--sp-4); display: grid; gap: var(--sp-3); align-content: start; }
.aw-b h2 { margin: 0; font: var(--fw-semibold) var(--fs-title2)/var(--lh-tight) var(--display); }
.aw-b h2:focus { outline: none; }
.aw-k { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--gold-l); margin-bottom: calc(-1 * var(--sp-2)); }
.aw-ok { color: var(--ok); }
@keyframes aw-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }

/* native OS dialogs (simulated): drawn by Windows in the real app, outside the webview */
.native { width: min(380px, 100%); background: var(--panel3); border-radius: var(--r); box-shadow: var(--shadow-3); overflow: hidden; animation: aw-in var(--t-fast) var(--ease); }
.native .nbar { display: flex; align-items: center; gap: var(--sp-2); height: 30px; padding: 0 var(--sp-3); font-size: var(--fs-small); color: var(--muted); border-bottom: 1px solid var(--line2); }
.native .nbar i { width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(135deg, var(--teal), var(--gold)); }
.native .nbody { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-2); }
.native h3 { margin: 0; font: var(--fw-semibold) var(--fs-title3) var(--display); }
.native p { margin: 0; }
.native .faux { display: grid; gap: 2px; font-size: var(--fs-small); color: var(--muted); }
.native .faux div { height: var(--ctl); display: flex; align-items: center; padding: 0 var(--sp-2); border: 1px solid var(--line2); border-radius: 4px; background: var(--panel2); color: var(--dim); font-style: italic; }
.native .hello { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--teal-l); display: grid; place-items: center; color: var(--teal-l); margin: 0 auto; }
.native .hello svg { width: 20px; height: 20px; }
.native .nfoot { display: flex; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4) var(--sp-3); background: var(--panel2); }
.tb-meters, .tb-badges { display: flex; align-items: center; gap: var(--sp-3); }
.tb-badges { gap: var(--sp-1); }

/* ---- variant 2 · The Circuit: the money path drawn as a circuit; the inspector fills from the selected part ---- */
#page { max-width: 1040px; }
.ui-pagehead h1:focus { outline: none; }
.ui-pagehead .sub { display: flex; align-items: center; gap: var(--sp-2); }
.ui-main > .ui-proto { margin-top: var(--sp-5); max-width: 1040px; }
.ui-main .proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
.ui-main .proto-in > *, .ui-main .proto-in .ui-btn { white-space: nowrap; }
.ui-main .proto-in label { display: inline-flex; align-items: center; gap: var(--sp-2); }
.ui-main .proto-in label .ui-field { width: 160px; }

/* the circuit */
.cx { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr);
  grid-template-rows: auto 14px auto; padding: 30px var(--sp-3) var(--sp-3); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.bracket { grid-row: 1; grid-column: 5 / 8; margin: -22px -6px -6px; border: 1px dashed color-mix(in srgb, var(--gold) 70%, var(--line)); border-radius: var(--r);
  background: color-mix(in srgb, var(--gold) 5%, transparent); pointer-events: none; }
.bracket.locked { border-style: solid; border-color: var(--gold); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gold) 8%, transparent) 0 6px, transparent 6px 12px); }
.bracket-tag { grid-row: 1; grid-column: 5 / 8; align-self: start; justify-self: center; margin-top: -31px; z-index: 2; display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 var(--sp-2); border-radius: 10px; border: 1px solid color-mix(in srgb, var(--gold) 55%, var(--line)); background: var(--panel); color: var(--gold-l);
  cursor: pointer; font-size: var(--fs-small); font-weight: var(--fw-semibold); white-space: nowrap; }
.bracket-tag svg { width: 11px; height: 11px; }
.bracket-tag[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 18%, var(--panel)); }
.node { grid-row: 1; position: relative; z-index: 1; display: grid; align-content: start; justify-items: start; gap: 3px; min-width: 0; padding: 6px var(--sp-2) 7px;
  text-align: left; border-radius: var(--r-sm); border: 1.5px solid var(--line2); background: var(--bg2); color: var(--text); cursor: pointer; transition: border-color var(--t-fast); }
.node:hover { border-color: var(--dim); }
.node .k { font-size: var(--fs-small); color: var(--dim); }
.node .v { max-width: 100%; font-weight: var(--fw-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node.ok { border-color: color-mix(in srgb, var(--teal) 70%, var(--line)); }
.node.broken { border-style: dashed; border-color: var(--refuse); background: color-mix(in srgb, var(--refuse) 6%, var(--bg2)); }
.node.wait { border-color: var(--gold); }
.node.unpowered { opacity: .7; }
.node.end { background: color-mix(in srgb, var(--gold) 7%, var(--bg2)); }
.node[aria-pressed="true"] { outline: 2px solid var(--focus); outline-offset: 2px; }
.node.n-agents { grid-column: 1; } .node.n-engine { grid-column: 3; } .node.n-mandate { grid-column: 5; } .node.n-keychain { grid-column: 7; } .node.n-paypal { grid-column: 9; }
.node.n-house { grid-row: 3; grid-column: 9; }
.wire { grid-row: 1; position: relative; align-self: center; height: 28px; display: grid; place-items: center; }
.wire::before { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 2px; transform: translateY(-50%); background: var(--line2); }
.wire.live::before { background: repeating-linear-gradient(90deg, var(--teal-l) 0 6px, color-mix(in srgb, var(--teal) 35%, transparent) 6px 10px); background-size: 10px 2px; animation: flow .8s linear infinite; }
.wire.cut::before { background: repeating-linear-gradient(90deg, var(--refuse) 0 3px, transparent 3px 6px); }
.wire.cut::after { content: "×"; position: relative; z-index: 1; font: var(--fw-bold) var(--fs-body)/1 var(--mono); color: var(--red-l); background: var(--panel); padding: 0 2px; }
@keyframes flow { to { background-position: 10px 0; } }
.w1 { grid-column: 2; } .w2 { grid-column: 4; } .w3 { grid-column: 6; } .w4 { grid-column: 8; }
.vwire { grid-row: 2; grid-column: 9; justify-self: center; width: 2px; background: var(--line2); }
.vwire.live { background: repeating-linear-gradient(180deg, var(--coral-l) 0 4px, transparent 4px 8px); }
.breaker { position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--teal); background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0; }
.breaker svg { width: 18px; height: 18px; }
.breaker[aria-pressed="true"] { border-color: var(--coral); background: color-mix(in srgb, var(--coral) 14%, var(--panel)); }
.cx-foot { grid-row: 3; grid-column: 1 / 8; align-self: end; display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--sp-4); }
.cx-foot i { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 4px; background: var(--teal-l); }
.cx-foot i.cut { background: repeating-linear-gradient(90deg, var(--refuse) 0 3px, transparent 3px 6px); }
.cx-foot i.own { height: 10px; background: none; border: 1px dashed var(--gold); border-radius: 2px; }
.ui-inspector .ui-group { margin-top: var(--sp-2); }
.ui-inspector .ui-group + .ui-silence { margin-top: var(--sp-2); }
.ui-inspector .acts { margin-top: var(--sp-2); }
.ui-inspector .ui-row .lbl { width: 116px; }
@media (max-width: 1180px) { .node .k { display: none; } .cx-foot .lg { display: none; } }
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar">
    <nav class="ui-crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <span class="ui-spacer"></span>
    <span class="tb-meters" id="meters"></span>
    <span class="tb-badges" id="badges"></span>
    <button class="ui-btn sm" data-act="inspT" aria-pressed="true" id="inspT">Inspector</button><span id="lockHost"></span>
  </header>
  <div class="ui-split has-insp" id="split">
    <aside class="ui-sidebar" aria-label="Modules"><div id="sbList" style="display:contents"></div>
      <div class="ui-sb-foot"><div id="sbFoot" style="display:contents"></div></div></aside>
    <main class="ui-main" id="view"><div class="banners" id="banner"></div><div id="page"></div><div class="ui-proto" id="proto" aria-label="Prototype controls"></div></main>
    <aside class="ui-inspector" id="insp" aria-label="Inspector" aria-live="polite"></aside>
  </div>
</div>
<div id="awLayer" class="layer" hidden></div>
<div id="nativeLayer" class="layer" hidden></div>

<script>
(function () {
'use strict';
/* ---------------- core: data, state, owner acts, layer 2, approval window, native dialogs ---------------- */
const F = window.FIX;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = UI.esc;
const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ENGINES = ['claude-code', 'codex-cli'];
const NOW_LABEL = 'Thu 29 Oct 14:02';

/* Data the dataset lacks, consistent with FIX (snapshot Thu 29 Oct 14:02). The returning owner
   set up the wallet on Sat 17 Oct (S-2 and R-3 were signed then); M-12 v3 was signed Mon 26 Oct;
   the sourcing agent opened a HOUSE table at 13:58 (D-0201), so the house is waking now. */
const SETUP_FIX = {
  returning: {
    machine: 'both', probe: { 'claude-code': 'found', 'codex-cli': 'found' }, probedAt: 'Thu 29 Oct 08:00 · at launch',
    engine: F.owner.engine,
    keychain: { paypal: 'Sat 17 Oct', channel3: 'Sat 17 Oct' },
    mandates: F.mandates,
    house: 'waking', housePinged: '13:58 · D-0201 opened a HOUSE table',
    idleMin: 3, hello: true, autostart: false, paused: false
  },
  first: {
    machine: 'both', probe: { 'claude-code': 'unprobed', 'codex-cli': 'unprobed' }, probedAt: null,
    engine: null, keychain: { paypal: null, channel3: null }, mandates: [],
    house: 'idle', housePinged: null, idleMin: 0, hello: true, autostart: false, paused: false
  }
};
/* What probe() finds on this machine (prototype switch). */
const MACHINES = {
  both: { label: 'both CLIs installed', r: { 'claude-code': 'found', 'codex-cli': 'found' } },
  cc: { label: 'claude-code only', r: { 'claude-code': 'found', 'codex-cli': 'missing' } },
  cx: { label: 'codex-cli only', r: { 'claude-code': 'missing', 'codex-cli': 'found' } },
  none: { label: 'no CLI installed', r: { 'claude-code': 'missing', 'codex-cli': 'missing' } }
};
const CRED = {
  paypal: { name: 'PayPal sandbox', what: 'client id + secret of your own sandbox REST app', fields: ['Client ID', 'Secret'], kind: 'paypal_sandbox',
    why: 'Every PayPal call is made by the wallet’s Rust core with these. Without them the wallet makes no PayPal call at all.' },
  channel3: { name: 'Market data (Channel3)', what: 'API key for market reference prices', fields: ['API key'], kind: 'channel3',
    why: 'Without it every item shows “no market reference” and nothing is marked as passing the market check.' }
};
const MODS = [['tables', 'Tables'], ['spend', 'Spend'], ['counter', 'Counter'], ['book', 'Book'], ['shield', 'Shield'], ['rescue', 'Rescue']];
const WALLET_WEEK = F.deals.filter((d) => d.side === 'buyer' && (d.state === 'CAPTURED' || d.state === 'RECEIPTED')).reduce((a, d) => a + d.amount, 0);
const LOCK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
const OPEN_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.8-1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
const WIN_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.4"/></svg>';

let S;
let AW = null;      // { task, stored, signed, fresh, opener }
let NATIVE = null;  // { kind: 'hello' | 'cred', cred }
let SHEET = null;   // { name, api, def }
let POP = null;     // { name, api, def, arg }
function fresh(moment) {
  const b = SETUP_FIX[moment];
  S = {
    moment, machine: b.machine, probe: Object.assign({}, b.probe), probedAt: b.probedAt, engine: b.engine,
    keychain: Object.assign({}, b.keychain), mandates: b.mandates.slice(), house: b.house, housePinged: b.housePinged,
    idleMin: b.idleMin, locked: false, hello: b.hello, autostart: b.autostart, paused: b.paused
  };
  AW = null; NATIVE = null; closeLayers();
}

/* ---- derived truths: what must be true before agents can touch money ---- */
const engineOk = () => !!S.engine && (S.engine === 'scripted' || S.probe[S.engine] === 'found');
const keyOk = () => !!S.keychain.paypal;
const mandateOk = () => S.mandates.length > 0;
const runOk = () => !S.paused;
const anyProbed = () => ENGINES.some((e) => S.probe[e] === 'found' || S.probe[e] === 'missing');
const probing = () => ENGINES.some((e) => S.probe[e] === 'probing');
function engineValue() {
  if (S.engine === 'scripted') return 'scripted engine · no model';
  if (S.engine && S.probe[S.engine] === 'found') return S.engine;
  if (probing()) return 'probing…';
  if (!anyProbed()) return 'not probed yet';
  if (ENGINES.every((e) => S.probe[e] === 'missing')) return 'no CLI found';
  return 'none selected';
}
function musts() {
  return [
    { k: 'engine', ok: engineOk(), title: 'Engine', value: engineValue(), sil: ['agents cannot start', 'nothing moves'], who: 'owner' },
    { k: 'paypal', ok: keyOk(), title: 'PayPal credentials', value: keyOk() ? 'in the keychain · ' + S.keychain.paypal : 'not stored', sil: ['nothing stored', 'no PayPal call'], who: 'priv' },
    { k: 'mandate', ok: mandateOk(), title: 'Signed mandate', value: mandateOk() ? S.mandates.map((m) => m.id + ' v' + m.v).join(' · ') : 'none signed', sil: ['every intent refused', '0 PayPal calls'], who: 'priv' },
    { k: 'agents', ok: runOk(), title: 'Agents not paused', value: S.paused ? 'all paused' : 'may run', sil: ['stay paused', 'voids and lapses still run'], who: 'owner' }
  ];
}
const allOk = () => musts().every((m) => m.ok);

/* ---- small renderers ---- */
function whoChip(kind) {
  if (kind === 'priv') return `<span class="ui-chip gold" title="Only you, in the approval window${S.locked ? ' · locked: Windows Hello first' : ''}">${S.locked ? LOCK_SVG : ''}only you</span>`;
  if (kind === 'owner') return '<span class="ui-chip teal" title="You, here in The Table">you</span>';
  return '<span class="ui-chip dashed" title="Fixed: nobody can change it">fixed</span>';
}
/* A privileged act hands off to the approval window, or shows the idle lock. */
function privBtn(label, task, kind = 'gold') {
  if (S.locked) return `<button class="ui-btn sm gold locked" data-act="aw" data-task="unlock" title="Idle ${S.idleMin} min: Windows Hello first">Unlock with Windows Hello</button>`;
  return `<button class="ui-btn sm ${kind}" data-act="aw" data-task="${task}">${esc(label)} ↗</button>`;
}
const pauseBtn = (cls = 'sm') => S.paused
  ? `<button class="ui-btn ${cls} primary" data-act="resume">Resume agents</button>`
  : `<button class="ui-btn ${cls}" data-act="pause" title="One click, no confirmation: restricting is free"><span class="coral" aria-hidden="true">‖</span>Pause all agents</button>`;
const silent = (b, rest) => `<div class="ui-silence">silent → <b>${b}</b>${rest ? ' · ' + rest : ''}</div>`;
const info = (act, key, label, id) => `<button class="ui-btn plain sm" data-act="${act}" data-${act}="${key}"${id ? ` data-id="${id}"` : ''} aria-label="${esc(label)}" title="${esc(label)}">ⓘ</button>`;
const probeChip = (s) => s === 'found' ? '<span class="ui-chip ok">found</span>' : s === 'missing' ? '<span class="ui-chip">not found</span>'
  : s === 'probing' ? '<span class="ui-chip teal">probing…</span>' : '<span class="ui-chip dashed">unknown</span>';
const houseChip = () => ({ idle: '<span class="ui-chip">idle</span>', waking: '<span class="ui-chip gold">waking</span>', ready: '<span class="ui-chip ok">ready</span>', unavailable: '<span class="ui-chip dashed">unavailable</span>' })[S.house];
const houseLine = () => ({ idle: 'sleeps until someone sits down', waking: 'waking up · ≈ 1 min', ready: 'ready · answers at once', unavailable: 'unavailable in this build' })[S.house];
const wakeBtn = (kind = 'primary') => S.house === 'ready'
  ? '<a class="ui-btn sm" href="../../tables/variant-1/index.html">Sit down ↗</a>'
  : `<button class="ui-btn sm ${S.house === 'idle' ? kind : ''}" data-act="wake" ${S.house === 'idle' ? '' : 'disabled'}>${S.house === 'waking' ? 'Waking…' : 'Wake it now'}</button>`;
const probeBtn = () => `<button class="ui-btn sm ${anyProbed() ? '' : 'primary'}" data-act="probe" ${probing() ? 'disabled' : ''}>${probing() ? 'Probing…' : anyProbed() ? 'Probe again' : 'Probe for engines'}</button>`;

/* engine options as radio rows (k keeps radio names apart when two lists are on screen) */
function engRows(k, withInfo) {
  const row = (id, name, chip, on, extra) => `<label class="ui-row"><input type="radio" class="ui-check" name="eng-${k}" data-act="engine" data-id="${id}" ${S.engine === id ? 'checked' : ''} ${on ? '' : 'disabled'}>
    <span class="main"><span class="t1${on ? '' : ' dim'}">${name}</span></span><span class="end">${chip}${extra}</span></label>`;

      const i = ORDER.indexOf(V.sel);
      V.sel = ORDER[(i + (e.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length];
      V.focusSel = true; UI.inspector($('#split'), true); render();
    }
  }
};

fresh('first');
VARIANT.reset();
render();
})();
</script>
