<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval · v2 Read-back · The Table</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---- shared by the three approval variants: the dimmed desktop, the prototype panel, the window
   frame and the small layer-1 / layer-2 pieces the baseline does not carry. Tokens only. ---- */
:root { --tb-h: 36px; --pp-w: 248px; }
body { overflow-x: hidden; }
.desk { position: relative; height: calc(100vh - var(--shell-h)); min-height: 560px; overflow: hidden; background: var(--bg); }
.wall { position: absolute; inset: 0 0 var(--tb-h) 0; background: radial-gradient(120% 90% at 70% 10%, var(--bg2), var(--bg)); }
.ghost { position: absolute; inset: 4% 4% 5% 4%; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); overflow: hidden; }
.ghost-bar { height: 28px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); background: var(--panel); border-bottom: 1px solid var(--line); font-size: var(--fs-small); color: var(--dim); }
.ghost-bar i { width: 10px; height: 10px; border-radius: 2px; background: var(--ok); opacity: .55; }
.ghost-grid { position: absolute; inset: 28px 0 0 0; opacity: .45;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 104px 24px; }
.dimmer { position: absolute; inset: 0 0 var(--tb-h) 0; background: var(--scrim); backdrop-filter: blur(1.5px); }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tb-h); z-index: 3; display: flex; align-items: center; gap: var(--sp-1); padding: 0 var(--sp-3);
  background: var(--material); backdrop-filter: blur(16px); border-top: 1px solid var(--line); font-size: var(--fs-small); color: var(--dim); }
.tb-i { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--sp-2); border-radius: var(--r-sm); }
.tb-i svg { width: 14px; height: 14px; }
.tb-i.live { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold-l); box-shadow: inset 0 -2px 0 var(--gold); }
.tb-tray { margin-left: auto; }
.tb-tray .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

/* prototype controls (ui-proto): scenario switcher, simulated events, clock, wallet log */
.proto { position: absolute; z-index: 4; left: var(--sp-3); top: var(--sp-3); width: var(--pp-w); max-height: calc(100% - var(--tb-h) - 2 * var(--sp-3)); overflow: auto; }
.pp-h { font-weight: var(--fw-semibold); color: var(--dim); margin: var(--sp-2) 0 2px; }
.pp-h:first-of-type { margin-top: var(--sp-1); }
.pp-sc { display: block; width: 100%; height: var(--ctl-sm); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-sm); background: none; color: var(--muted);
  font-size: var(--fs-small); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.pp-sc:hover { background: var(--hover); color: var(--text); }
.pp-sc[aria-pressed="true"] { background: var(--sel); color: var(--text); box-shadow: inset 2px 0 0 var(--teal); }
.pp-sim { display: block; width: 100%; min-height: var(--ctl-sm); padding: 2px var(--sp-2); margin-top: 2px; border: 1px dashed var(--gold); border-radius: var(--r-sm); background: none;
  color: var(--gold-l); font-size: var(--fs-small); text-align: left; cursor: pointer; }
.pp-sim:hover { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.pp-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-1); }
.pp-row .ui-btn { flex: none; }
.pp-clock { font: var(--fs-small) var(--mono); color: var(--dim); }
.pp-keys { margin: var(--sp-2) 0 0; color: var(--dim); line-height: 1.7; }

/* the approval window */
.stage { position: absolute; inset: 0 0 var(--tb-h) 0; z-index: 2; display: flex; align-items: center; justify-content: center;
  padding: var(--sp-4) var(--sp-4) var(--sp-4) calc(var(--pp-w) + 2 * var(--sp-3) + var(--sp-2)); }
.aw { position: relative; display: flex; flex-direction: column; max-height: 100%; background: var(--panel); border-radius: var(--r-lg);
  box-shadow: var(--shadow-3); outline: none; overflow: hidden; }
.aw:focus-visible { box-shadow: var(--shadow-3), 0 0 0 2px var(--focus); }
.aw > .ui-titlebar { flex: none; gap: var(--sp-2); padding-right: var(--sp-1); }
.aw-emb { width: 16px; height: 16px; flex: none; } .aw-emb .e1 { fill: none; stroke: var(--steel); stroke-width: 2; } .aw-emb .e2 { fill: none; stroke: var(--gold); stroke-width: 2; }
.aw .ui-crumbs { font-size: var(--fs-small); }
.aw-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
.aw-body > * { flex-shrink: 0; }
.aw-foot { flex: none; padding: var(--sp-2) var(--sp-4) var(--sp-3); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--sp-2); }
.aw-h { margin: 0; font: var(--fw-semibold) var(--fs-title3)/1.3 var(--display); outline: none; }
.aw-h b { font-weight: var(--fw-semibold); color: var(--text); }
.aw-h .q { color: var(--muted); font-weight: var(--fw-regular); }
.aw-amt { font: var(--fw-semibold) var(--fs-display)/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.aw-unit { font: var(--fs-small) var(--mono); color: var(--dim); }
.k { font-size: var(--fs-small); color: var(--dim); }
.chipbtn { border: 0; cursor: pointer; }
.chipbtn:hover { filter: brightness(1.12); }
.aw-btns { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.aw-btns .sp { flex: 1 1 auto; }
.aw-due { display: flex; align-items: baseline; gap: var(--sp-1) var(--sp-3); flex-wrap: wrap; }
.aw-clock { font-size: var(--fs-small); color: var(--dim); white-space: nowrap; }
.aw-clock b { color: var(--gold-l); font: var(--fw-semibold) var(--fs-mono) var(--mono); }
.ui-silence.wrap { white-space: normal; flex: 1 1 260px; }
.aw-hint { margin: 0; display: flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-small); color: var(--dim); min-height: var(--ctl-sm); }
.aw-hint .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aw-hint .ui-btn { flex: none; }
.aw-status { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--row); min-width: 0; }
.aw-status .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--fw-medium); }
.poll { display: flex; align-items: center; gap: 6px; font: var(--fs-small) var(--mono); color: var(--teal-l); }
.poll::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: pulse 1.4s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
.typer { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font-size: var(--fs-small); color: var(--muted); }
.typer .ui-field { width: 132px; font-family: var(--mono); }
.typer .ui-field.ok { border-color: var(--ok); }
.typer .st { color: var(--dim); white-space: nowrap; } .typer .st.ok { color: var(--ok); }
.hello-ico { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--teal-l); stroke-width: 1.8; stroke-linecap: round; animation: hello 1.1s var(--ease) infinite alternate; }
.hello-ico circle { fill: var(--teal-l); stroke: none; }
@keyframes hello { from { opacity: .5; } to { opacity: 1; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.closed { position: relative; z-index: 2; max-width: 30rem; display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-start; color: var(--muted); }
.closed b { color: var(--text); }

/* market: a one-line mini track on layer 1, the labelled track in layer 2 */
.aw-mkt { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font-size: var(--fs-small); color: var(--muted); min-height: var(--ctl-sm); }
.aw-mkt .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { position: relative; flex: 0 0 88px; height: 10px; }
.mini::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line2); border-radius: 1px; }
.mini .b { position: absolute; top: 2px; height: 6px; border-radius: 2px; background: color-mix(in srgb, var(--market) 30%, transparent); }
.mini .m { position: absolute; top: 0; width: 2px; height: 10px; background: var(--market); transform: translateX(-1px); }
.mini .d { position: absolute; top: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); transform: translateX(-4px); box-shadow: 0 0 0 2px var(--panel); }
.track { position: relative; height: 34px; margin: var(--sp-2) 0 0; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--line); }
.tr-band { position: absolute; top: 5px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--market) 22%, transparent); border: 1px solid color-mix(in srgb, var(--market) 40%, transparent); }
.tr-med { position: absolute; top: 2px; width: 2px; height: 16px; background: var(--market); transform: translateX(-1px); }
.tr-dot { position: absolute; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--teal); border: 2px solid var(--panel); transform: translateX(-7px); box-shadow: 0 0 0 1px var(--teal-l); }
.tr-t { position: absolute; top: 20px; transform: translateX(-50%); font: var(--fs-small) var(--mono); color: var(--dim); }

/* layer 2 content: popovers and the details sheet */
.pop-p { margin: 0; color: var(--muted); }
.pop-p + .pop-p { margin-top: var(--sp-2); }
.ui-popover .ui-kv { font-size: var(--fs-small); }
.ui-popover .quarantine { margin-top: 0; }
.states { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.states li { display: flex; align-items: center; gap: var(--sp-2); height: 24px; font: var(--fs-small) var(--mono); color: var(--dim); }
.states li .g { width: 14px; text-align: center; flex: none; }
.states li.done { color: var(--muted); } .states li.done .g { color: var(--ok); }
.states li.cur, .states li.ok, .states li.bad, .states li.hold, .states li.end { color: var(--text); font-weight: var(--fw-semibold); }
.states li.cur .g { color: var(--gold-l); } .states li.ok .g { color: var(--ok); } .states li.bad .g { color: var(--red-l); } .states li.hold .g { color: var(--coral-l); }
.plog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font: var(--fs-small)/1.4 var(--mono); color: var(--muted); }
.plog .lt { color: var(--dim); } .plog .lw { font-weight: var(--fw-bold); }
.w-owner { color: var(--gold-l); } .w-rust { color: var(--teal-l); } .w-paypal { color: var(--gold-l); } .w-peer { color: var(--coral-l); }
.dsec + .dsec { margin-top: var(--sp-4); }
.dsec h3 { margin: 0 0 var(--sp-2); font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.srcs { display: flex; flex-direction: column; }
.src { display: grid; grid-template-columns: 16px 104px minmax(0, 1fr); gap: 2px var(--sp-2); padding: 6px var(--sp-3); align-items: baseline; }
.src + .src { border-top: 1px solid var(--line); }
.src .g { font-weight: var(--fw-bold); text-align: center; }
.src .n { color: var(--dim); font-size: var(--fs-small); }
.src .v { min-width: 0; overflow-wrap: anywhere; }
.src .v .op { font-family: var(--mono); color: var(--dim); padding: 0 4px; }
.src .s { grid-column: 3; font: var(--fs-small) var(--mono); color: var(--dim); overflow-wrap: anywhere; }
.src .nt { grid-column: 3; font-size: var(--fs-small); color: var(--coral-l); }
.g-ok { color: var(--ok); } .g-bad { color: var(--red-l); } .g-info { color: var(--dim); } .g-wait { color: var(--dim); }

@media (max-width: 900px) {
  .desk { height: auto; min-height: calc(100vh - var(--shell-h)); overflow: visible; }
  .proto { position: relative; left: auto; top: auto; width: auto; max-height: none; margin: var(--sp-3); }
  .stage { position: relative; inset: auto; padding: var(--sp-3) var(--sp-3) calc(var(--tb-h) + var(--sp-3)); }
}
@media (prefers-reduced-motion: reduce) { .poll::before, .hello-ico { animation: none; } }

/* ===== variant 2 ===== */
/* Read-back: a four-step stepper, two facts per page, the decision on page 4 only. */
.aw.v2 { width: min(580px, 100%); }
.v2 .aw-body.walk { min-height: 268px; }
.v2-steps { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; margin: var(--sp-3) var(--sp-4) 0; padding: 2px;
  border-radius: var(--r-sm); background: var(--panel3); }
.v2-step { display: flex; align-items: center; gap: 6px; min-width: 0; height: var(--ctl-sm); padding: 0 var(--sp-2); border: 0; border-radius: 4px; background: none;
  color: var(--dim); font-size: var(--fs-small); font-weight: var(--fw-medium); white-space: nowrap; cursor: pointer; }
.v2-step .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.v2-step .n { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font: var(--fw-semibold) var(--fs-small)/1 var(--mono); box-shadow: inset 0 0 0 1px var(--line2); }
.v2-step:hover:not(:disabled) { color: var(--text); }
.v2-step.cur { background: var(--panel); color: var(--text); box-shadow: var(--shadow-1); }
.v2-step.cur .n { background: var(--gold); color: var(--on-gold); box-shadow: none; }
.v2-step.seen { color: var(--muted); } .v2-step.seen .n { color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.v2-step.bad { color: var(--red-l); } .v2-step.bad .n { color: var(--red-l); box-shadow: inset 0 0 0 1px var(--refuse); }
.v2-step:disabled { opacity: .5; cursor: not-allowed; }
.v2-head { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.v2-head .aw-h { flex: 1 1 auto; min-width: 0; }
.v2-head .aw-h.bad { color: var(--red-l); }
.v2-lead { margin: -4px 0 0; font-size: var(--fs-small); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--sp-3); padding: var(--sp-2) var(--sp-3) 6px var(--sp-4); box-shadow: inset 3px 0 0 var(--line2); }
.ui-group > .fact + .fact { border-top: 1px solid var(--line); }
.fact.ok { box-shadow: inset 3px 0 0 var(--ok); }
.fact.bad { box-shadow: inset 3px 0 0 var(--refuse); background: color-mix(in srgb, var(--refuse) 8%, transparent); }
.fact.info { box-shadow: inset 3px 0 0 var(--dim); }
.f-name { font-size: var(--fs-small); color: var(--dim); }
.f-val { font: var(--fw-semibold) var(--fs-title3)/1.3 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.f-val.amt { font-size: var(--fs-display); line-height: 1.15; }
.fact.bad .f-val { color: var(--red-l); }
.f-chip { grid-column: 2; grid-row: 1 / span 2; align-self: start; margin-top: 2px; }
.f-vs { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-small); color: var(--muted); }
.f-vs .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-vs .op { font-family: var(--mono); font-weight: var(--fw-bold); color: var(--ok); }
.fact.bad .f-vs .op { color: var(--red-l); } .fact.info .f-vs .op { color: var(--dim); }
.f-vs .ui-btn { margin-left: auto; flex: none; }
.f-note { grid-column: 1 / -1; font-size: var(--fs-small); color: var(--coral-l); }
.v2-amt { display: flex; align-items: baseline; gap: var(--sp-3); min-width: 0; }
.v2-amt .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2-amt .who b { color: var(--text); font-weight: var(--fw-semibold); }
.v2-ne { display: flex; align-items: baseline; gap: var(--sp-3); }
.v2-ne .ne { color: var(--red-l); font: var(--fw-bold) var(--fs-display) var(--mono); }
.v2-ne .aw-amt:first-child { color: var(--red-l); } .v2-ne .aw-amt:last-of-type { color: var(--teal-l); }
.v2-recap { display: flex; flex-wrap: wrap; gap: 4px; }
.v2-reading { list-style: none; margin: 0; padding: var(--sp-1) var(--sp-2); display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--sp-3); }
.v2-reading li { display: flex; align-items: center; gap: 6px; height: 24px; color: var(--muted); }
.v2-reading li .g { width: 12px; text-align: center; font-weight: var(--fw-bold); }
.v2-reading li.wait { color: var(--dim); }
.v2-fold { align-self: flex-start; }
.v2-pg { font: var(--fs-small) var(--mono); color: var(--dim); }
.v2-lock { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-small); color: var(--gold-l); }
@media (max-width: 640px) { .v2-step .l { display: none; } .v2-reading { grid-template-columns: 1fr; } }
.v2-act { margin-top: auto; padding-top: var(--sp-1); display: flex; flex-direction: column; gap: var(--sp-2); }

</style>
</head>
<body>
<div class="desk" id="desk">
  <div class="wall" aria-hidden="true">
    <div class="ghost"><div class="ghost-bar"><i></i>Q4 stock and margins.xlsx · Maya is working here</div><div class="ghost-grid"></div></div>
  </div>
  <div class="dimmer" aria-hidden="true"></div>
  <aside class="proto ui-proto" id="proto" aria-label="Prototype controls, not part of the product"></aside>
  <main class="stage" id="stage">
    <section class="aw" id="aw" role="dialog" aria-labelledby="awTitle" tabindex="-1"></section>
    <div class="closed ui-card" id="closedNote" role="status" hidden></div>
  </main>
  <div class="taskbar" aria-label="Simulated taskbar">
    <span class="tb-i"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="currentColor"/><rect x="9" y="1" width="6" height="6" fill="currentColor"/><rect x="1" y="9" width="6" height="6" fill="currentColor"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/></svg></span>
    <span class="tb-i"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M1.5 6h13M6 6v7.5" stroke="currentColor"/></svg>Spreadsheet</span>
    <span class="tb-i" id="tbBrowser"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"/><path d="M1.5 8h13M8 1.5c2.2 2 2.2 11 0 13M8 1.5c-2.2 2-2.2 11 0 13" fill="none" stroke="currentColor"/></svg><span id="tbLabel">Browser</span></span>
    <span class="tb-i tb-tray" title="The Table in the tray"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="var(--gold)" stroke-width="2"/></svg><span class="dot"></span>Thu 29 Oct</span>
  </div>
</div>

<script>
(function () {
'use strict';
/* ======================================================================================
   Core: the approval window's simulated Rust summary and state machine. The three variants
   share these facts and rules; they differ only in how the window presents them (VIEW).
   Nothing here talks to a network. Every "Rust" or "PayPal" step is a log line.
   ====================================================================================== */
const F = window.FIX;
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const BASE = new Date(F.nowISO).getTime(); // Thu 29 Oct 2026 14:02 local
function atT(h, m, s, dd) { const d = new Date(BASE); d.setHours(h, m, s || 0, 0); return d.getTime() + (dd || 0) * DAY; }
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* money is integer cents in this page; formatting never goes through a float */
const usd = (c) => '$' + Math.floor(c / 100).toLocaleString('en-US') + '.' + String(c % 100).padStart(2, '0');
const cents = (n) => Math.round(n * 100); // FIX stores dollars; converted once at the edge
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (ms) => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hhmmss = (ms) => hhmm(ms) + ':' + pad(new Date(ms).getSeconds());
const dayHHMM = (ms) => new Date(ms).toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + hhmm(ms);
function fmtLeft(ms) {
  if (ms <= 0) return '0:00:00';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return d ? d + ' d ' + h + ' h ' + pad(m) + ' min' : h + ':' + pad(m) + ':' + pad(x);
}
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const dealOf = (id) => F.deals.find((d) => d.id === id);

function clockInfo() {

function silence() {
  if (S.end) return null;
  const c = clockInfo(), who = AX().who;
  switch (S.step) {

    case 'settling': return 'if Dan’s wallet never sends its SETTLE, the offer lapses at 18:00 · no money moves';

    case 'capture': return dealOf('D-0190').silence;
    case 'lever': return dealOf('D-0188').silence;
  }

function pctOf(v, mk) {
  const p = v <= mk.median ? 25 + ((v - mk.p25) / (mk.median - mk.p25)) * 25 : 50 + ((v - mk.median) / (mk.p75 - mk.median)) * 25;
  return Math.max(1, Math.min(99, Math.round(p)));
}
function market() {
  const d = dealOf(S.deal), mk = F.market[d.ref];
  if (!mk) return { none: true, text: S.deal === 'D-0188' ? 'no market reference · a discount on your own plan' : 'no market reference for this item · the price rule was skipped, not passed' };
  const v = headline().amount / 100;
  const pct = d.pct != null ? d.pct : pctOf(v, mk);
  return { lo: mk.p25, med: mk.median, hi: mk.p75, v, pct, src: mk.src, at: mk.retrieved,
    text: usd(headline().amount) + ' is p' + pct + ' of $' + mk.p25 + '–$' + mk.p75 + ' · median $' + mk.median };
}
function trackHTML(mk) {
  if (!mk || mk.none) return '';
  const span = mk.hi - mk.lo, min = mk.lo - span * 0.3, max = mk.hi + span * 0.3;
  const pos = (x) => Math.max(0, Math.min(100, ((x - min) / (max - min)) * 100)).toFixed(1);
  return `<div class="track" role="img" aria-label="${esc(mk.text)}"><span class="tr-band" style="left:${pos(mk.lo)}%;right:${(100 - pos(mk.hi)).toFixed(1)}%"></span>
    <span class="tr-med" style="left:${pos(mk.med)}%"></span><span class="tr-dot" style="left:${pos(mk.v)}%"></span>
    <span class="tr-t" style="left:${pos(mk.lo)}%">$${mk.lo}</span><span class="tr-t" style="left:${pos(mk.med)}%">$${mk.med}</span><span class="tr-t" style="left:${pos(mk.hi)}%">$${mk.hi}</span></div>`;
}

/* The state strip (§10.3): CHECKING → READY → (LOCKED) → IN BROWSER → APPROVED (polled) → SELLER-ATTESTED → RECEIPTED */
function strip() {
  const P = S.phase === 'CHECKING' ? 'CHECKING' : S.phase === 'EXPIRED' ? 'EXPIRED · ' + S.attempt + '/' + APPROVAL_FIX.maxAttempts : S.locked ? 'LOCKED' : 'READY';
  let L, cur, mark = 'cur';
  if (S.deal === 'D-0193') {
    if (S.step === 'mismatch') { L = ['OWNER ACCEPT', 'SETTLE', S.phase === 'CHECKING' ? 'CHECKING' : 'MISMATCH']; cur = 2; mark = S.phase === 'CHECKING' ? 'cur' : 'bad'; }
    else {
      L = ['OWNER ACCEPT', 'SETTLE', S.step === 'approve' ? P : 'READY', 'IN BROWSER', 'APPROVED (polled)', 'SELLER-ATTESTED', 'RECEIPTED'];
      if (S.step === 'accept') { L[0] = S.phase === 'CHECKING' ? 'CHECKING' : S.locked ? 'LOCKED' : 'OWNER ACCEPT'; cur = 0; }
      else if (S.step === 'settling') cur = 1;
      else cur = ({ CHECKING: 2, READY: 2, EXPIRED: 2, IN_BROWSER: 3, APPROVED: 4, ATTESTED: 5, RECEIPTED: 6 })[S.phase];
      if (S.phase === 'EXPIRED') mark = 'bad';
      if (S.phase === 'RECEIPTED') mark = 'ok';
    }
  } else if (S.deal === 'D-0198') {
    L = ['SHIELD HOLD', S.step === 'approve' ? P : 'READY', 'IN BROWSER', 'APPROVED (polled)', 'AUTHORIZED (held)'];
    if (S.step === 'hold') { cur = 0; mark = 'hold'; if (S.phase === 'CHECKING') L[0] = 'CHECKING'; }
    else cur = ({ CHECKING: 1, READY: 1, EXPIRED: 1, IN_BROWSER: 2, APPROVED: 3 })[S.phase];
    if (S.phase === 'EXPIRED') mark = 'bad';
    if (S.end && S.end.kind === 'AUTHORIZED') { cur = 4; mark = 'ok'; }
  } else if (S.deal === 'D-0190') {
    L = ['AUTHORIZED (held)', P, 'CAPTURED']; cur = 1;
    if (S.end && S.end.kind === 'CAPTURED') { cur = 2; mark = 'ok'; }
    if (S.end && S.end.kind === 'VOIDED') { L[2] = 'VOIDED'; cur = 2; mark = 'end'; }
  } else {
    L = ['RENEWAL FAILED ×1', P, 'LEVER APPROVED']; cur = 1;
    if (S.end && S.end.kind === 'LEVER') { cur = 2; mark = 'ok'; }
  }
  if (S.end && ['WITHDRAWN', 'KEPT', 'DECLINED', 'EXPIRED'].includes(S.end.kind)) { L = L.slice(0, cur); L.push(S.end.kind === 'KEPT' ? 'KEPT ON HOLD' : S.end.kind); cur = L.length - 1; mark = 'end'; }
  return L.map((label, i) => ({ label, st: i < cur ? 'done' : i === cur ? mark : 'todo' }));
}
function stripHTML(cls) {
  return `<ol class="strip ${cls || ''}" aria-label="Approval progress">${strip().map((s) => `<li class="${s.st}"${s.st !== 'done' && s.st !== 'todo' ? ' aria-current="step"' : ''}>${esc(s.label)}${s.st === 'cur' && s.label === 'IN BROWSER' ? ` · <span data-cd="${S.issued + APPROVAL_FIX.approveWindowMs}"></span>` : ''}</li>`).join('')}</ol>`;
}

   default and needs no unlock; quiet = no decision. Rust re-checks all of it; this only narrows. */
function actions() {
  const out = [];
  const close = { id: 'close', label: 'Close this window', kind: 'quiet', enabled: true };
  if (S.end) return S.deal === 'D-0193' && (S.step === 'mismatch' || S.end.kind === 'WITHDRAWN') ? [close, { id: 'export', label: 'Export transcript', kind: 'quiet', enabled: true }] : [close];
  const failed = rows().some((x) => x.ok === false), checking = S.phase === 'CHECKING';
  const priv = (id, label, extra, quiet) => {
    const why = checking ? 'the wallet is still checking' : S.locked ? 'locked · unlock with Windows Hello first' : extra || null;
    out.push({ id, label, kind: 'money', quiet: !!quiet, enabled: !why, why });
  };

function boot() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');

  document.addEventListener('keydown', (e) => {

    const tgt = e.target, typing = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA');

    if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'w' || e.key === 'W') && !S.closed) {
      const can = actions().find((x) => x.id === 'withdraw' || x.id === 'void' || x.id === 'decline');

      act(WD && WD.el.isConnected ? 'withdraw-yes' : 'withdraw');

  startScenario((location.hash.match(/s=([a-z]+)/) || [])[1] || 'approve');

/* ===== variant 2: the view ===== */
/* Read-back: the window reads the deal back to Maya one pair of facts at a time. Layer 1 per page
   is the two facts (asked value, verdict, what it is checked against); where each came from opens
   in a popover ("from ›"). The money button exists only on page 4, and page 4 opens only after
   pages 1-3 have each been shown once. Arrow keys walk; Enter never does anything here. */
const W = { page: 0, seen: -1, key: '' };
const PAGES = {
  accept: { t: ['Their offer', 'Your limits', 'Who and how', 'Decide'], g: [['offer', 'band'], ['rounds', 'present'], ['paired', 'shield']], mk: 0 },
  approve: { t: ['What you pay', 'Where it goes', 'Why it may go', 'Decide'], g: [['amount', 'invoice'], ['host', 'payee'], ['shield', 'mandate']], mk: 0 },
  mismatch: { t: ['What you pay', 'Where it goes', 'Why it may go', 'Stopped'], g: [['amount', 'invoice'], ['host', 'payee'], ['shield', 'mandate']], mk: 0 },
  hold: { t: ['Why it is held', 'Who they are', 'What is unknown', 'Decide'], g: [['rule', 'paired'], ['ff', 'perdeal'], ['payees', 'market']], mk: -1 },
  capture: { t: ['What is held', 'Where it goes', 'Why it is yours', 'Decide'], g: [['amount', 'auth'], ['payee', 'shield'], ['perdeal', 'payees']], mk: 0 },
  lever: { t: ['The lever', 'Who and what', 'What is sent', 'Decide'], g: [['lever', 'size'], ['scope', 'invoice'], ['email', 'replay']], mk: -1 }

function walkable() {

}
function syncWalk() {
  const k = S.sc + '|' + S.step + '|' + S.attempt;

  if (walkable()) W.seen = Math.max(W.seen, W.page);
}

  if (p < 0 || p > 3) return;

  if (p > W.seen + 1) return;

  return `<footer class="aw-foot"><div class="aw-btns">${wd ? btnHTML(wd) : ''}<span class="sp"></span>${nav}</div></footer>`;
}

boot();
})();
</script>
