<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend · The Gate</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---------- spend: shared page bits on top of the v2 baseline (same in all three variants) ---------- */
.cd { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--gold-l); }
.struck { color: var(--dim); text-decoration: line-through; }
.amt.held, .num.held, .money.held { color: var(--gold-l); }
.ui-stat .v.sm { font-size: var(--fs-body); }
.ui-stat .v .dim { font-weight: var(--fw-regular); font-size: var(--fs-small); }
.wstat { width: 176px; }
.estat { padding-left: var(--sp-3); border-left: 1px dashed var(--line2); }
.ui-meter.vel { display: flex; }
.ui-meter.vel > i { border-radius: 0; flex: none; }
.ui-meter.vel > i.h { background: repeating-linear-gradient(135deg, var(--gold) 0 3px, color-mix(in srgb, var(--gold) 45%, transparent) 3px 6px); }
.ui-btn .kbd { padding: 0 3px; line-height: 1.2; }
.ui-btn.gold .kbd { color: var(--on-gold); border-color: color-mix(in srgb, var(--on-gold) 35%, transparent); }
.ui-chip.note { border: 0; cursor: pointer; }
.ui-chip.note:hover { background: color-mix(in srgb, var(--coral) 26%, transparent); }
/* clause trace (layer 2) */
.trace { list-style: none; margin: 0; padding: 0; }
.trace li { display: grid; grid-template-columns: 34px 14px minmax(0, 1fr); gap: var(--sp-2); align-items: baseline; padding: 4px var(--sp-3); }
.trace li + li { border-top: 1px solid var(--line); }
.trace .n { font: var(--fs-small) var(--mono); color: var(--dim); }
.trace .g { text-align: center; font-weight: var(--fw-semibold); }
.trace .pass .g, .trace .policy .g { color: var(--ok); }
.trace .fail { background: color-mix(in srgb, var(--refuse) 10%, transparent); }
.trace .fail .g { color: var(--red-l); }
.trace .you { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.trace .you .g { color: var(--gold-l); }
.trace .policy { background: color-mix(in srgb, var(--ok) 8%, transparent); }
.trace .skip { color: var(--dim); }
/* sheets */
.sh-top { display: flex; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.sh-amt { font-size: var(--fs-title3); font-weight: var(--fw-semibold); }
.sh-lede { margin: 0 0 var(--sp-3); }
.sh-gap { margin: var(--sp-3) 0 0; }
.clist .ui-row .t1 { white-space: normal; }
.clist .hit-fail { background: color-mix(in srgb, var(--refuse) 8%, transparent); }
.clist .hit-you { background: color-mix(in srgb, var(--gold) 8%, transparent); }
.clist .hit-policy { background: color-mix(in srgb, var(--ok) 7%, transparent); }
.clist .t2.red { color: var(--red-l); } .clist .t2.gold { color: var(--gold-l); } .clist .t2.okc { color: var(--ok); }
.ui-table tr.fresh td:first-child { box-shadow: inset 2px 0 0 var(--gold); }
.ui-inspector .ui-kv dd { font-size: var(--fs-body); }
.insp-h { display: flex; align-items: center; gap: var(--sp-2); }
.insp-h .x { margin-left: auto; }
.insp-acts { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
/* prototype controls */
.proto { margin-top: var(--sp-4); flex: none; }
.proto-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
/* the source list folds to icons: with the inspector open below 1440px, always below 1180px, so Layer 1 keeps its width */
@media (max-width: 1440px) {
  .ui-split.has-insp { grid-template-columns: 56px minmax(0, 1fr) var(--inspector); }
  .ui-split.has-insp .ui-sidebar .lbl, .ui-split.has-insp .ui-sidebar .ui-sb-head, .ui-split.has-insp .ui-sb-item .cnt { display: none; }
  .ui-split.has-insp .ui-sb-item { justify-content: center; }
  .ui-split.has-insp .ui-sb-item.need .ui-dot { box-shadow: 0 0 0 2px var(--bg2), 0 0 0 3.5px var(--gold); }
}
@media (max-width: 1180px) {
  .ui-split { grid-template-columns: 56px minmax(0, 1fr); }
  .ui-split .ui-sidebar .lbl, .ui-split .ui-sidebar .ui-sb-head, .ui-split .ui-sb-item .cnt { display: none; }
  .ui-split .ui-sb-item { justify-content: center; }
  .ui-split .ui-sb-item.need .ui-dot { box-shadow: 0 0 0 2px var(--bg2), 0 0 0 3.5px var(--gold); }
}

/* ---------- variant 2: the gate (spatial trace matrix) ---------- */
.need .amt { font-size: var(--fs-title3); }
.need .acts { display: flex; gap: var(--sp-2); flex: none; align-items: center; }
.ring { width: 22px; height: 22px; flex: none; }

.matrix { --cols: minmax(176px, 1.7fr) repeat(5, minmax(60px, .5fr)) minmax(132px, 1fr);
  border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.mh, .lane { display: grid; grid-template-columns: var(--cols); }
.mh { background: var(--bg2); border-bottom: 1px solid var(--line2); }
.mh > * { min-width: 0; padding: var(--sp-2); }
.mh .lbl { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.mh .asked { display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.mh .asked .estat { border-left: 0; padding-left: 0; }
.ch { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: var(--sp-2) var(--sp-1); border-left: 1px solid var(--line); text-align: center; min-width: 0; }
.ch:hover { background: var(--hover); }
.ch:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ch.on { background: var(--sel); box-shadow: inset 0 -2px 0 var(--teal); }
.ch b { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ch .ui-meter { width: 100%; max-width: 64px; }
.ch small { font: var(--fs-small) var(--mono); color: var(--dim); white-space: nowrap; }
.mh .pp { border-left: 1px solid var(--line2); display: flex; align-items: center; }

.agrow { display: flex; gap: var(--sp-2); align-items: center; height: var(--row); padding: 0 var(--sp-3); background: color-mix(in srgb, var(--bg2) 60%, transparent); border-top: 1px solid var(--line); font-size: var(--fs-small); color: var(--dim); }
.agrow b { color: var(--text); font-weight: var(--fw-semibold); }
.lane { border-top: 1px solid var(--line); min-height: var(--row-2); }
.lane.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--teal); }
.lane.fresh { animation: laneIn .6s var(--ease) both; }
@keyframes laneIn { from { background: color-mix(in srgb, var(--refuse) 18%, transparent); } }
.lh { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 var(--sp-2); align-content: center; padding: 0 var(--sp-2) 0 var(--sp-3); min-width: 0; }
.lh:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: var(--r-sm); }
.lh .id { font: var(--fs-mono) var(--mono); color: var(--dim); grid-row: span 2; align-self: center; }
.lh .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lh .t2 { font-size: var(--fs-small); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lh .t2 .money { color: var(--muted); }

.c { position: relative; display: grid; place-items: center; min-width: 0; border-left: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.c::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; transform-origin: left center; }
.c.t-teal::before { background: var(--teal); }
.c.t-gold::before { background: var(--gold); }
.c.t-green::before { background: var(--ok); }
.c.t-dead::before { background: none; border-top: 2px dashed color-mix(in srgb, var(--line2) 70%, transparent); height: 0; }
.c.stop::before { right: 50%; }
.c.csel { background: color-mix(in srgb, var(--teal) 7%, transparent); }
.matrix.drawing .c::before { animation: draw .45s var(--ease) both; animation-delay: calc(var(--i) * 70ms + var(--j) * 85ms); }
@keyframes draw { from { transform: scaleX(0); } }
.mk { all: unset; box-sizing: border-box; position: relative; z-index: 1; height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; white-space: nowrap; cursor: pointer;
  font: var(--fw-semibold) var(--fs-small)/1 var(--mono); box-shadow: inset 0 0 0 1px currentColor; background: var(--panel); }
.mk:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mk.fail { color: var(--red-l); background: color-mix(in srgb, var(--refuse) 16%, var(--panel)); }
.mk.you { color: var(--gold-l); background: color-mix(in srgb, var(--gold) 16%, var(--panel)); }
.mk.policy { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.dot { position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 2px var(--panel); }
.dot.green { background: var(--ok); }

.out { position: relative; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) 0 0; border-left: 1px solid var(--line2); min-width: 0; }
.out::before { content: ""; width: 10px; height: 2px; flex: none; }
.out.t-gold::before { background: var(--gold); } .out.t-green::before { background: var(--ok); } .out.t-dim::before { background: var(--line2); }
.out.t-dead::before { border-top: 2px dashed var(--line2); height: 0; }
.out .ui-hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.out .zero { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--ok); white-space: nowrap; }
.capsule { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; justify-content: center; height: 34px; padding: 0 var(--sp-2); border-radius: var(--r-sm); min-width: 0;
  box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold-l); font: var(--fw-semibold) var(--fs-small)/1.25 var(--mono);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, var(--panel)) 0 6px, color-mix(in srgb, var(--gold) 22%, var(--panel)) 6px 12px); }
.capsule:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.capsule.wait { box-shadow: none; outline: 1px dashed var(--gold); outline-offset: -1px; }
.capsule span { font-weight: var(--fw-regular); }
.capsule, .capsule span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1180px) { .matrix { --cols: minmax(128px, 1.5fr) repeat(5, minmax(50px, .5fr)) minmax(112px, 1fr); } .out .ui-hint, .zero .pp-w { display: none; } }
.legend { display: grid; grid-template-columns: 28px 1fr; gap: 6px var(--sp-2); align-items: center; }
.legend i { display: block; height: 2px; background: var(--teal); }
.legend i.k { background: var(--ok); } .legend i.g { background: var(--gold); } .legend i.d { background: none; border-top: 2px dashed var(--line2); height: 0; }
.hits .ui-row b { font: var(--fw-semibold) var(--fs-small) var(--mono); min-width: 96px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  'use strict';
  /* ================= core (same data model in all three spend variants) ================= */
  const F = window.FIX;
  const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const parse = s => new Date(s + 'Z').getTime(); // wall-clock times, kept in UTC so no DST shifts
  const NOW0 = parse(F.nowISO), T0 = Date.now();
  let skew = 0;
  const now = () => NOW0 + (Date.now() - T0) + skew;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = UI.esc;
  const money = n => n == null ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money0 = n => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const p2 = n => String(n).padStart(2, '0');
  const fmtT = ms => { const d = new Date(ms); return `${DAYS[d.getUTCDay()]} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
  function dur(ms, long) {
    if (ms <= 0) return '0 m';
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    if (d > 0) return long ? `${d} d ${h} h ${p2(m)} m` : `${d} d ${h} h`;
    if (h > 0) return `${h} h ${p2(m)} m`;
    return `${m} m ${p2(ss)} s`;
  }
  const until = (t, long) => `<span class="cd" data-until="${t}"${long ? ' data-long' : ''}>${dur(t - now(), long)}</span>`;
  const M12 = F.mandates.find(m => m.id === 'M-12');
  const CL = n => M12.clauses.find(c => c.n === n);
  const agentOf = id => F.agents.find(a => a.id === id) || { id, name: id, engine: F.owner.engine, does: '' };
  const cpOf = id => F.counterparties[id] || { name: id, who: '' };
  const dealHref = id => `../../deal/variant-1/index.html#${id}`;
  const MANDATE_HREF = '../../mandate/variant-1/index.html#M-12';
  const APPROVAL_HREF = '../../approval/variant-1/index.html#D-0190';
  const HOME_HREF = '../../../index.html#home';

  /* Data FIX lacks for this page: when each ask hit the gate, its clause trace, quoted text.
     Same ids, amounts and times as FIX. Sample data, sandbox. */
  const SPEND_EXTRA = {
    'D-0192': { at: '2026-10-27T10:14:00', category: 'compute', asked: 11960, auditSeq: 4302,
      refusal: 'clause 3: max_amount $200 per deal; category compute not allowed',
      quote: { label: 'untrusted · the agent’s request, quoted as data', text: 'propose_purchase{ item: "GPU A100 80GB, 1 month", qty: 40, merchant: "gpu-cloud.example" }' },
      trace: [[1, 'pass', 'Buy is allowed for the infra agent'], [3, 'fail', 'quoted $11,960.00 > max $200.00 per deal'], [3, 'fail', 'category “compute” is not in [office, parts, packing]'],
        [5, 'skip', 'not reached'], [6, 'skip', 'not reached'], [7, 'skip', 'not reached · gpu-cloud.example is not allowlisted either']] },
    'D-0190': { at: '2026-10-29T09:02:00', category: 'parts', auditSeq: 4402,
      quote: { label: 'untrusted · merchant listing title, plain text', text: 'USB-C Dock 96W 2xDP 4K60 *** SHIPS TODAY *** see dockparts.example/promo for bulk deals' },
      delivery: 'unknown · nothing received from dockparts.example yet',
      trace: [[1, 'pass', 'Buy is allowed for the supplies agent'], [3, 'pass', '$64.00 ≤ $200.00 · category parts'], [5, 'pass', '$64 of $900 today · 1 of 12 deals'],
        [6, 'pass', 'under $250 · the policy could countersign this amount'], [7, 'you', 'dockparts.example is not on the allowlist → the capture waits for you']] },
    'D-0186': { at: '2026-10-28T15:31:00', category: 'packing',
      trace: [[1, 'pass', 'Buy is allowed for the supplies agent'], [3, 'pass', '$45.00 ≤ $200.00 · category packing'], [5, 'pass', '$45 of $900 that day · 1 of 12 deals'],
        [6, 'policy', 'under $250 and payee allowlisted → captured by policy'], [7, 'pass', 'packrite-supply is on the allowlist']] },
    'D-0183': { at: '2026-10-27T12:02:00', category: 'parts',
      trace: [[1, 'pass', 'Buy is allowed for the supplies agent'], [3, 'pass', '$38.00 ≤ $200.00 · category parts'], [5, 'pass', '$38 of $900 that day · 1 of 12 deals'],
        [6, 'policy', 'under $250 and payee allowlisted → captured by policy'], [7, 'pass', 'cablehaus is on the allowlist']] },
    'D-0181': { at: '2026-10-26T09:47:00', category: 'office',
      trace: [[1, 'pass', 'Buy is allowed for the supplies agent'], [3, 'pass', '$52.00 ≤ $200.00 · category office'], [5, 'pass', '$52 of $900 that day · 1 of 12 deals'],
        [6, 'policy', 'under $250 and payee allowlisted → captured by policy'], [7, 'pass', 'packrite-supply is on the allowlist']] },
    'D-0180': { at: '2026-10-27T08:30:00', category: 'parts', voidedAt: 'Tue 08:41',
      trace: [[1, 'pass', 'Buy is allowed for the supplies agent'], [3, 'pass', '$42.00 ≤ $200.00 · category parts'], [5, 'pass', '$42 of $900 that day · 1 of 12 deals'],
        [6, 'pass', 'under $250 · the policy would capture once it shipped'], [7, 'pass', 'cablehaus is on the allowlist']] }
  };
  const deals = F.deals.filter(d => d.module === 'spend').map(d => {
    const x = Object.assign({}, d, SPEND_EXTRA[d.id]);
    x.pp = d.pp ? Object.assign({}, d.pp) : null;
    x.atMs = parse(x.at);
    return x;
  }).sort((a, b) => b.atMs - a.atMs);
  const byId = id => deals.find(d => d.id === id);
  const HOLD = byId('D-0190');
  const HOLD_START = HOLD.atMs;
  const HOLD_END = NOW0 + F.deals.find(d => d.id === 'D-0190').holdUntilMin * MIN; // 72 h after authorize
  const VEL = { usd: 900, n: 12 }; // clause 5
  const COMMITTED = ['AUTHORIZED', 'CAPTURED', 'RECEIPTED', 'RECONCILED'];
  const live = d => (d.module === 'spend' && byId(d.id)) || d;
  /* Clause 5 counts what M-12 committed that day: holds + captures. Refused and voided count nothing. */
  function dayCommit(day) {
    const ds = F.deals.map(live).filter(d => d.side === 'buyer' && d.day === day && COMMITTED.includes(d.state) && d.amount != null);
    return { usd: ds.reduce((a, d) => a + d.amount, 0), n: ds.length, held: ds.filter(d => d.state === 'AUTHORIZED').reduce((a, d) => a + d.amount, 0), ids: ds.map(d => d.id) };
  }

  const S = { locked: false, handoff: null, voidError: null, failNextVoid: false, empty: false,
    seq: 4419, lastInput: Date.now(), log: [], reqId: '7d1c-4e0b-a9f2' };
  function audit(actor, action, deal) { S.log.unshift({ seq: S.seq++, t: fmtT(now()), actor, action, deal, fresh: true }); }

  /* Layer 1 vocabulary: a chip and a short clause tag. Everything longer lives in a sheet. */
  function verdict(d) {
    switch (d.state) {
      case 'REFUSED': return { k: 'refused', chip: 'Refused', tone: 'red', tag: 'cl 3 ✗ · 0 PayPal calls' };
      case 'AUTHORIZED': return S.handoff === d.id
        ? { k: 'held', chip: 'In approval', tone: 'gold', tag: 'cl 7 → decide there' }
        : { k: 'held', chip: 'Held', tone: 'gold', tag: 'cl 7 → needs you' };
      case 'CAPTURED': return d.decided === 'policy:clause6'
        ? { k: 'policy', chip: 'Captured', tone: 'ok', tag: 'cl 6 · by policy' }
        : { k: 'you', chip: 'Captured', tone: 'ok', tag: 'by you · approval window' };
      case 'VOIDED': return { k: 'voided', chip: 'Voided', tone: '', tag: d.decided === 'owner:void' ? 'by you · just now' : 'by you · duplicate' };
      case 'AUTO-VOIDED': return { k: 'voided', chip: 'Auto-voided', tone: '', tag: 'policy default · 72 h' };
      default: return { k: 'other', chip: d.state, tone: '', tag: '' };
    }
  }
  function amountCell(d) {
    if (d.state === 'REFUSED') return { cls: 'struck', v: money(d.asked), note: 'asked · never sent' };
    if (d.state === 'AUTHORIZED') return { cls: 'held', v: money(d.amount), note: 'held at PayPal' };
    if (d.state === 'CAPTURED') return { cls: '', v: money(d.amount), note: 'paid' };
    return { cls: 'struck', v: money(d.amount), note: 'voided · nothing paid' };
  }
  const recChip = d => d.rec === 'matched' ? '<span class="ui-chip ok">matched in Transaction Search</span>'
    : d.state === 'CAPTURED' ? '<span class="ui-chip gold">pending in PayPal reporting</span>' : '<span class="ui-chip line">no statement row</span>';
  const SILENCE = 'silent → <b>auto-void</b> Sun 09:02 · nothing is paid';

  /* ---------------- layer 2 building blocks ---------------- */
  const GLYPH = { pass: '✓', fail: '✗', you: '◆', policy: '✓', skip: '–' };
  const traceHtml = d => `<ol class="trace ui-group">${d.trace.map(([n, r, t]) => `<li class="${r}"><span class="n">cl ${n}</span><span class="g">${GLYPH[r]}</span><span>${esc(t)}</span></li>`).join('')}</ol>`;
  const quarantineHtml = d => d.quote ? `<div class="quarantine"><div class="q-label">${esc(d.quote.label)}</div><div class="q-text">${esc(d.quote.text)}</div></div>` : '';
  const noteChip = d => d.quote ? `<button class="ui-chip coral note" data-act="note" data-id="${d.id}" data-key="note-${d.id}" aria-label="Untrusted text, opens quarantined">note ›</button>` : '';
  function dealBody(d) {
    const v = verdict(d), a = amountCell(d), ag = agentOf(d.agent), cp = cpOf(d.cp), pp = d.pp || {};
    return `<div class="sh-top"><span class="ui-chip ${v.tone}">${esc(v.chip)}</span><span class="money sh-amt ${a.cls}">${a.v}</span><span class="ui-hint">${esc(a.note)}</span></div>
      <dl class="ui-kv"><dt>Asked</dt><dd>${esc(fmtT(d.atMs))} · ${esc(ag.name)} <span class="dim">${esc(ag.engine)}</span></dd>
        <dt>Payee</dt><dd>${esc(cp.name)} <span class="dim">· ${esc(cp.who)}</span></dd>
        <dt>Category</dt><dd>${esc(d.category || '—')}</dd>
        <dt>Outcome</dt><dd>${d.state === 'REFUSED' ? `<b class="okc">0 PayPal calls</b> · no order, no hold, nothing to undo` : esc(d.sub) + (d.voidedAt ? ` · ${esc(d.voidedAt)}` : '')}</dd>

        const sel = V.sel.id === d.id;
        body += `<div class="lane ${sel ? 'sel' : ''} ${V.freshId === d.id ? 'fresh' : ''}" data-id="${d.id}">${laneHead(d)}${laneCells(d, i++)}${outcome(d)}</div>`;
      });
    });
    return `<div class="matrix ${V.drawn ? '' : 'drawing'}" role="group" aria-label="The gate: each ask runs left to right through mandate M-12 and stops where a clause stops it">${head}${body}</div>`;
  }

  /* Layer 1: the one decision, one row; its why behind ⓘ. */
  function needRow() {
    if (S.empty) return `<div class="ui-row"><span class="dim">Nothing held · no agent has asked to spend</span></div>`;
    const d = HOLD, v = verdict(d);
    if (S.voidError) return `<div class="ui-row two need" role="alert"><span class="id">D-0190</span><span class="main"><span class="t1">Void failed · PayPal ${esc(S.voidError.code)} · the hold is unchanged</span><span class="ui-silence">${SILENCE}</span></span>
      <span class="ui-chip red">Void failed</span><span class="amt held">${money(d.amount)}</span><span class="acts">${decisionBtns()}</span></div>`;
    if (d.state !== 'AUTHORIZED') return `<div class="ui-row two need"><span class="id">D-0190</span><span class="main"><span class="t1">Nothing waits for you</span><span class="t2">${esc(d.sub)}</span></span>
      <span class="ui-chip ${v.tone}">${esc(v.chip)}</span><span class="amt ${amountCell(d).cls}">${money(d.amount)}</span><span class="acts"><button class="ui-btn sm" data-act="audit" data-key="need-audit">Audit rows</button></span></div>`;
    return `<div class="ui-row two need">${ring()}<span class="id">D-0190</span>
      <span class="main"><span class="t1">Capture or void · ${esc(d.item)} <span class="dim">· ${esc(cpOf(d.cp).name)}</span></span><span class="ui-silence">${SILENCE} · ${until(HOLD_END)} left</span></span>
      <button class="ui-btn plain sm" data-act="why-hold" data-key="why-hold" aria-label="Why it waits for you">ⓘ</button>
      <span class="ui-chip ${v.tone}">${esc(v.chip)}</span><span class="amt held">${money(d.amount)}</span><span class="acts">${decisionBtns()}</span></div>`;
  }

  /* Layer 2: the inspector tells the selected lane's or clause's story. */
  const xBtn = `<button class="ui-btn plain sm icon x" data-act="insp-close" data-key="insp-x" aria-label="Close inspector">✕</button>`;
  function laneStory(d) {
    const v = verdict(d), a = amountCell(d), ag = agentOf(d.agent), cp = cpOf(d.cp), pp = d.pp || {};
    return `<div class="insp-h"><span class="ui-chip ${v.tone}">${esc(v.chip)}</span>${noteChip(d)}${xBtn}</div>
      <h2 style="margin-top:6px">${esc(d.item)}</h2><div class="ui-hint">${d.id} · ${fmtT(d.atMs)} · ${esc(ag.name)} <span class="mono">${esc(ag.engine)}</span></div>
      <div class="ui-section"><dl class="ui-kv"><dt>Amount</dt><dd><span class="money ${a.cls}">${a.v}</span> <span class="dim">${esc(a.note)}</span></dd><dt>Payee</dt><dd>${esc(cp.name)}</dd>
        ${d.state === 'REFUSED' ? `<dt>PayPal</dt><dd><b class="okc">0 calls</b> · nothing to undo</dd>` : `<dt>PayPal</dt><dd class="mono">${esc(pp.order || '—')} · ${esc(pp.auth || '—')}${pp.capture ? ' · ' + esc(pp.capture) : ''}</dd><dt>Statement</dt><dd>${recChip(d)}</dd>`}</dl></div>
      <div class="ui-section"><div class="ui-section-h"><h3>Clause trace</h3><span class="end">M-12 v${M12.v}</span></div>${traceHtml(d)}</div>
      <div class="ui-section insp-acts">${d.state === 'REFUSED' ? `<button class="ui-btn sm" data-act="why" data-id="${d.id}" data-key="why-${d.id}">Why refused?</button>` : ''}
        <button class="ui-btn sm" data-act="deal" data-id="${d.id}" data-key="detail-${d.id}">Details</button><a class="ui-btn plain sm" href="${dealHref(d.id)}">Open deal ↗</a></div>`;
  }
  function clauseStory(n, focusId) {
    const c = CL(n), groups = { fail: [], you: [], policy: [], pass: [] };
    deals.forEach(d => { const x = cellOf(d, n); if (groups[x.r]) groups[x.r].push(d); });
    const lbl = { fail: ['stopped', 'red'], you: ['sent to you', 'gold'], policy: ['policy captured', 'okc'], pass: ['passed', 'dim'] };
    const focus = focusId ? byId(focusId) : null, fx = focus ? cellOf(focus, n) : null;
    let h = `<div class="insp-h"><span class="ui-chip teal">cl ${n}</span>${fx && fx.r === 'fail' ? '<span class="ui-chip red">Why refused</span>' : ''}${xBtn}</div>
      <h2 style="margin-top:6px">${esc(c.name)}</h2><div class="ui-hint">${esc(c.text)}</div>`;
    if (focus) h += `<div class="ui-section"><dl class="ui-kv"><dt>${esc(focus.id)}</dt><dd class="${lbl[fx.r] ? lbl[fx.r][1] : 'dim'}">${esc(fx.txt.join(' · '))}</dd>
      ${focus.state === 'REFUSED' ? `<dt>Verbatim</dt><dd class="mono">${esc(focus.refusal)}</dd><dt>PayPal</dt><dd><b class="okc">0 calls</b> · nothing to undo</dd>` : ''}</dl></div>`;
    h += `<div class="ui-section"><div class="ui-section-h"><h3>This week at clause ${n}</h3></div><div class="ui-group hits">${Object.keys(groups).filter(k => groups[k].length).map(k => `<div class="ui-row"><b class="${lbl[k][1]}">${groups[k].length} ${lbl[k][0]}</b><span class="dim mono">${groups[k].map(d => d.id).join(', ')}</span></div>`).join('')}</div></div>`;
    if (n === 5) { const t = dayCommit('Thu'); h += `<div class="ui-section"><dl class="ui-kv"><dt>Today</dt><dd>${money0(t.usd)} of ${money0(VEL.usd)} · ${t.n} of ${VEL.n} deals</dd><dt>Counts</dt><dd>holds until voided; refused asks count nothing</dd><dt>Engine</dt><dd>its estimate never touches this meter</dd></dl></div>`; }
    h += `<div class="ui-section insp-acts"><button class="ui-btn sm" data-act="clause-all" data-id="${focus ? focus.id : 'D-0192'}" data-key="clause-all">All clauses</button><a class="ui-btn plain sm" href="${MANDATE_HREF}">Open M-12 ↗</a></div>
      <p class="ui-hint">Changing a clause means signing v${M12.v + 1} in the approval window.</p>`;
    return h;
  }
  function inspHtml() {
    if (S.empty) return '<div class="ui-empty">Nothing to inspect</div>';
    const s = V.sel;
    return s.kind === 'lane' ? laneStory(byId(s.id) || HOLD) : clauseStory(s.n, s.kind === 'cell' ? s.id : null);
  }
  function legendPopover(anchor) {
    const quiet = F.agents.filter(a => !deals.some(d => d.agent === a.id)).map(a => a.name.replace(' agent', '').toLowerCase());
    UI.popover(anchor, `<div class="legend"><i></i><span>passing a clause</span><i class="k"></i><span>policy may capture (cl 6)</span><i class="g"></i><span>waits for you</span><i class="d"></i><span>never reached PayPal</span></div>
      <p class="ui-hint" style="margin:var(--sp-2) 0 0">Columns follow clause numbers. ${esc(quiet.join(', '))} agents asked the gate nothing this week.</p>`, { title: 'Reading the gate' });
  }

  function mainHtml() {
    return `<div class="ui-pagehead"><h1>Spend · the gate</h1><span class="sub">each ask runs left to right through mandate M-12 v${M12.v}</span>
        <div class="actions"><button class="ui-btn plain sm" data-act="legend" data-key="legend">Legend ⓘ</button></div></div>
      <div class="ui-section"><div class="ui-section-h"><h2>Needs you</h2><span class="end">${HOLD.state === 'AUTHORIZED' && !S.empty ? 1 : 0}</span></div><div class="ui-group">${needRow()}</div></div>
      <div class="ui-section"><div class="ui-section-h"><h2>This week at the gate</h2><span class="end">${S.empty ? 0 : deals.length} asks</span></div>${matrixHtml()}</div>
      ${protoHtml(`<button class="ui-btn sm" data-act="sim-ask" data-key="sim-ask" ${V.asked ? 'disabled' : ''}>Infra agent asks: 1 × GPU, $180</button>`)}`;
  }

  function render() {
    paintApp(mainHtml(), { insp: V.insp ? inspHtml() : null, bar: V.insp ? '' : `<button class="ui-btn sm" data-act="insp-open" data-key="insp-open">Inspector</button>` });
    if (!V.drawn) setTimeout(() => { V.drawn = true; const mx = $('.matrix'); mx && mx.classList.remove('drawing'); }, 1600);
    V.freshId = null;
  }

  function simAsk() {
    if (V.asked) return;
    V.asked = true;
    const d = { id: 'D-0202', module: 'spend', kind: 'purchase', side: 'buyer', cp: 'gpu', agent: 'infra', item: '1 × GPU rental (1 day)', ref: 'gpu', amount: null, asked: 180,
      state: 'REFUSED', day: 'Thu', rec: 'n/a', atMs: now(), category: 'compute', refusal: 'clause 3: category compute not allowed',
      quote: { label: 'untrusted · the agent’s request, quoted as data', text: 'propose_purchase{ item: "GPU A100 80GB, 1 day", qty: 1, merchant: "gpu-cloud.example" }' },
      trace: [[1, 'pass', 'Buy is allowed for the infra agent'], [3, 'pass', '$180.00 ≤ $200.00 per deal'], [3, 'fail', 'category “compute” is not in [office, parts, packing]'],
        [5, 'skip', 'not reached'], [6, 'skip', 'not reached'], [7, 'skip', 'not reached · gpu-cloud.example is not allowlisted either']] };
    deals.push(d); deals.sort((a, b) => b.atMs - a.atMs);
    audit('policy', 'REFUSED 1 × GPU $180.00 · clause 3 category · 0 PayPal calls', 'D-0202');
    V.sel = { kind: 'cell', id: 'D-0202', n: 3 }; V.freshId = 'D-0202'; V.insp = true;
    toast('Sandbox simulation: the infra agent asked for 1 × GPU at $180. Under $200, but compute is not a signed category: refused before any PayPal call.', 'bad');
    render();
  }

  Object.assign(ACT, {
    lane: el => { V.sel = { kind: 'lane', id: el.dataset.id }; V.insp = true; render(); },
    clause: el => { const n = +el.dataset.n; V.sel = (V.sel.kind === 'clause' && V.sel.n === n) ? { kind: 'lane', id: 'D-0190' } : { kind: 'clause', n }; V.insp = true; render(); },
    cell: el => { V.sel = { kind: 'cell', id: el.dataset.id, n: +el.dataset.n }; V.insp = true; render(); },
    'clause-all': el => clauseSheet(el.dataset.id),
    'sim-ask': () => simAsk(),
    legend: el => legendPopover(el),
    'insp-close': () => { V.insp = false; render(); },
    'insp-open': () => { V.insp = true; render(); }
  });
  document.addEventListener('keydown', e => {
    if (UI.open) return; // ui.js owns Esc while a sheet or popover is open
    if (e.key === 'Escape') {
      if (!(V.sel.kind === 'lane' && V.sel.id === 'D-0190')) { V.sel = { kind: 'lane', id: 'D-0190' }; render(); return; }
      location.href = HOME_HREF; return;
    }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.matches && e.target.matches('[data-lane]')) {
      e.preventDefault();
      const ls = $$('[data-lane]'), i = ls.indexOf(e.target), nx = ls[i + (e.key === 'ArrowDown' ? 1 : -1)];
      if (nx) { V.sel = { kind: 'lane', id: nx.dataset.id }; render(); const f = $(`[data-key="${nx.dataset.key}"]`); f && f.focus(); }
    }
  });

  function tick() {
    if (!tickCore()) return;
    $$('[data-ring]').forEach(el => el.setAttribute('stroke-dashoffset', ((1 - holdFrac()) * RING_C).toFixed(2)));
  }
  setInterval(tick, 1000);
  render();
})();
</script>
<script src="../../../shared/shell.js" data-page="spend" data-variant="2"></script>
</body>
</html>
