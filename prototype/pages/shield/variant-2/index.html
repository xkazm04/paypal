<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield · Evidence matrix</title>
<meta name="description" content="The Table · Shield module, variant 2 (Evidence matrix): checks by intent in one keyboard-first grid; the inspector explains the focused cell. Sandbox prototype.">
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---------- shared by the three Shield variants: titlebar meters, check inks, market band,
   simulated approval window. Everything else is the v2 baseline (shared/ui.css). ---------- */
html, body { height: 100%; }
body { overflow: hidden; }
.tmeter { display: flex; align-items: baseline; gap: 6px; padding-left: var(--sp-2); border-left: 2px solid var(--teal); white-space: nowrap; font-size: var(--fs-small); color: var(--dim); }
.tmeter b { font: var(--fw-semibold) var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.tmeter.eng { border-left-color: var(--line2); }
.ui-proto { display: grid; gap: var(--sp-1); margin-top: var(--sp-2); }
.ui-proto .ui-btn { justify-content: flex-start; }
.ui-proto .ui-btn[aria-pressed="true"] { color: var(--gold-l); border-color: var(--gold); }
.ui-sb-item .ui-dot { width: 9px; height: 9px; }

/* check results: glyph + ink, never colour alone */
.ck { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; flex: none; font: var(--fw-bold) var(--fs-small)/1 var(--mono); box-shadow: inset 0 0 0 1px currentColor; }
.r-hit { color: var(--coral-l); } .r-block { color: var(--red-l); } .r-pass { color: var(--ok); } .r-skip { color: var(--gold-l); } .r-na { color: var(--dim); }
button.ui-chip { border: 0; cursor: pointer; }
.notechip { background: none; color: var(--coral-l); outline: 1px dashed var(--coral); outline-offset: -1px; }
.notechip:hover { background: color-mix(in srgb, var(--coral) 12%, transparent); }

/* layer-2 bodies: check detail, check lists, engine fence */
.ckhead { display: flex; align-items: center; gap: var(--sp-2); }
.det { margin: var(--sp-2) 0; color: var(--muted); }
.l2 { display: grid; gap: var(--sp-3); }
.l2 h3 { margin: 0 0 var(--sp-1); font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.cklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cklist li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px var(--sp-2); align-items: center; }
.cklist li .l { grid-column: 2 / -1; color: var(--dim); font-size: var(--fs-small); }
.cklist li .res { font: var(--fs-small) var(--mono); white-space: nowrap; }
.cklist .stg { display: block; grid-template-columns: none; margin-top: var(--sp-1); font: var(--fs-small) var(--mono); color: var(--dim); }
.steps { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); }
.steps b { color: var(--text); font-weight: var(--fw-semibold); }
mark.hit { background: color-mix(in srgb, var(--refuse) 25%, transparent); color: var(--text); border-radius: 2px; }

/* market band (Channel3 comparables) */
.mband { position: relative; height: 46px; margin: 18px 6px 2px; }
.mband .axis { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--line2); }
.mband .iqr { position: absolute; top: 9px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--market) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--market) 40%, transparent); }
.mband .med { position: absolute; top: 5px; width: 2px; height: 20px; background: var(--market); }
.mband .flag { position: absolute; top: 0; height: 30px; border-left: 2px dashed var(--refuse); }
.mband .px { position: absolute; top: 9px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px var(--panel); }
.mband .px.ours { background: var(--teal); }
.mband .lab { position: absolute; top: 30px; font: var(--fs-small) var(--mono); color: var(--dim); white-space: nowrap; }
.mband .lab.top { top: -18px; }
.nomarket { border: 1px dashed var(--gold); border-radius: var(--r-sm); padding: 4px 8px; color: var(--gold-l); font-size: var(--fs-small); }

/* simulated approval window: a separate OS window in the product */
#apLayer { position: fixed; inset: var(--shell-h) 0 0 0; z-index: 7000; display: grid; place-items: center; background: var(--scrim); }
.apwin { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - var(--shell-h) - 32px); overflow: auto; background: var(--bg2); border-radius: var(--r-lg);
  box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); animation: ui-fade var(--t-med) var(--ease); }
.apwin > .ui-titlebar { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.ap-tag { font: var(--fw-bold) var(--fs-small) var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--gold-l); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 4px; padding: 1px 5px; }
.apbody { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-3); }
.apbody h2 { margin: 0; font: var(--fw-semibold) var(--fs-title2)/1.2 var(--display); }
.apsteps { display: flex; gap: 4px; flex-wrap: wrap; }
.apchecks { display: flex; flex-wrap: wrap; gap: 4px var(--sp-3); align-items: center; font-size: var(--fs-small); color: var(--muted); }
.apchecks span { display: inline-flex; align-items: center; gap: 4px; }
.apfoot { display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.typein { width: 100%; font-family: var(--mono); }
.typein.ok { border-color: var(--ok); }
.cd { font: var(--fw-semibold) var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; color: var(--gold-l); }
.ui-proto .short { display: none; }
@media (max-width: 1180px) {
  .ui-split.has-insp .ui-proto { padding: var(--sp-1); }
  .ui-split.has-insp .ui-proto::before { display: none; }
  .ui-split.has-insp .ui-proto .short { display: inline; }
  .ui-split.has-insp .ui-proto .ui-btn { justify-content: center; padding: 0; }
}
@media (max-width: 1100px) { .tmeter span { display: none; } }
@media (max-width: 1180px) {
  .ui-split.has-insp .ui-sidebar { overflow-x: hidden; }
  .ui-split.has-insp .ui-sb-item { gap: 2px; padding: 0 2px; }
  .ui-split.has-insp .ui-sb-item .cnt:not(.need) { display: none; }
  .ui-split.has-insp .ui-sb-item .cnt.need { padding: 3px 5px; }
}

/* ---------- v2 · Evidence matrix ---------- */
.mxwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
table.mx { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.mx col.lab { width: 148px; }
.mx th, .mx td { height: var(--row); padding: 0 var(--sp-3); border-bottom: 1px solid var(--line); text-align: left; font-weight: var(--fw-regular); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mx tbody th[scope="row"] { color: var(--muted); background: var(--bg2); border-right: 1px solid var(--line); }
.mx tr.grp th { height: 22px; font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); background: var(--bg2); }
.mx tr:last-child > * { border-bottom: 0; }
.mx thead th { height: var(--row-2); background: var(--panel); border-bottom: 1px solid var(--line2); }
.mx thead .corner { background: var(--bg2); border-right: 1px solid var(--line); color: var(--dim); font-size: var(--fs-small); }
.mx .cell { cursor: pointer; outline: none; }
.mx .cell + .cell { border-left: 1px solid var(--line); }
.mx .cell:hover { background: var(--hover); }
.mx .cell.colcur { background: color-mix(in srgb, var(--panel2) 70%, var(--panel)); }
.mx .cell.hitcell { background: color-mix(in srgb, var(--coral) 8%, transparent); }
.mx .cell.blockcell { background: color-mix(in srgb, var(--refuse) 10%, transparent); }
.mx .cell.skipcell { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gold) 9%, transparent) 0 6px, transparent 6px 12px); }
.mx .cell.cur, .mx .cell.cur.hitcell, .mx .cell.cur.blockcell, .mx .cell.cur.skipcell { background: var(--sel); box-shadow: inset 0 0 0 2px var(--sel-line); }
.mx .cell.cur:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.mx thead .cell.need { box-shadow: inset 0 3px 0 var(--gold); }
.mx thead .cell.need.cur { box-shadow: inset 0 3px 0 var(--gold), inset 0 0 0 2px var(--sel-line); }
.hc { display: grid; gap: 2px; min-width: 0; }
.hc .l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.hc b { font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; }
.hc .money { margin-left: auto; font-weight: var(--fw-semibold); }
.hc small { font-size: var(--fs-small); color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.rc { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rc .t { font: var(--fs-small) var(--mono); overflow: hidden; text-overflow: ellipsis; }
.rc .d { font-size: var(--fs-small); color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.mx .cell.faint .rc { opacity: .35; }
.mx tr.move td { height: auto; padding-top: 6px; padding-bottom: 6px; white-space: normal; vertical-align: top; }
.mx tr.move .ui-silence { display: block; white-space: normal; margin-top: 4px; }
.mvb { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; }
.mvb + .mvb { margin-top: 2px; }
.mx .ui-btn.plain.red { color: var(--red-l); }
.keys { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); margin-top: var(--sp-2); padding: 0 var(--sp-1); }
.ik { font-size: var(--fs-small); color: var(--dim); margin-bottom: 2px; }
.ui-inspector .ibig { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; }
.ui-inspector .mvb { margin-top: var(--sp-3); }
.ui-inspector .ui-silence { display: block; white-space: normal; margin-top: var(--sp-2); }
.legend { display: grid; gap: 4px; }
.legend span { display: flex; align-items: center; gap: var(--sp-2); }
.rc .t.fix { flex: none; }
@media (max-width: 1180px) { .mx col.lab { width: 116px; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== v2 · Evidence matrix: checks × intents, keyboard-first.
   Layer 1: the grid, one short line per cell (conclusion rows on top, then the five checks, then "note ›").
   Layer 2: the inspector explains whichever cell has focus (rule, numbers, market band, matched phrase,
   quarantined note, the act in exact words); legend and "how verdicts form" open on demand. ===== */
(function () {
  const COLS = ['D-0198', 'D-0196', 'D-0193'];
  const CHECK_KEYS = ['payee', 'ff', 'newcp', 'market', 'typology'];
  // focusable rows, top to bottom; group label rows are not focusable
  const ROWS = ['head', 'verdict', 'paypal', 'move', 'payee', 'ff', 'newcp', 'market', 'typology', 'words'];
  const L = { r: ROWS.indexOf('verdict'), c: 0, passes: true };

  function cellCls(r, c, extra) { return `cell${L.r === r && L.c === c ? ' cur' : L.c === c ? ' colcur' : ''}${extra ? ' ' + extra : ''}`; }
  function cellAttrs(r, c) { return `data-act="v2-cell" data-r="${r}" data-c="${c}" data-fk="cell:${r}:${c}" tabindex="${L.r === r && L.c === c ? 0 : -1}" aria-selected="${L.r === r && L.c === c}"`; }

  function paypalLine(id) {
    const S = window.SH.S;
    if (id === 'D-0196') return ['0 calls', 'no PayPal link ever opened'];
    if (id === 'D-0193') return ['0 calls', 'nothing sent yet · negotiating'];
    switch (S.hold) {
      case 'REFUSED': return ['0 calls', 'refused by you · none will be made'];
      case 'RELEASED': return ['order created', '2PB4…7H after your release · nothing paid'];
      case 'IN_BROWSER': return ['order created', 'awaiting your approval on PayPal · nothing paid'];
      default: return ['0 calls', 'held before any PayPal call'];
    }
  }

  function cell(rowKey, r, c) {
    const H = window.SH; const { esc, money, deal, cp, verdict, vchip, ico, S } = H;
    const id = COLS[c], d = deal(id), cpo = cp(d), vd = verdict(id);
    if (rowKey === 'head') {
      const need = id === 'D-0198' && H.waiting();
      return `<th scope="col" class="${cellCls(r, c, need ? 'need' : '')}" ${cellAttrs(r, c)}><div class="hc"><span class="l1"><b>${esc(cpo.name)}</b><span class="money">${money(d.amount)}</span></span>
        <small>${esc(id)} · ${id === 'D-0193' ? 'Tables' : 'Shield'}${need ? ' · <span class="gold">needs you</span>' : ' · ' + esc(d.when)}</small></div></th>`;
    }
    if (CHECK_KEYS.includes(rowKey)) {
      const x = vd.cs.find((q) => q.k === rowKey);
      const tone = x.r === 'hit' ? (x.eff === 'BLOCK' ? 'blockcell' : 'hitcell') : x.r === 'skip' ? 'skipcell' : (x.r === 'pass' && !L.passes ? 'faint' : '');
      return `<td class="${cellCls(r, c, tone)}" ${cellAttrs(r, c)}><div class="rc">${ico(x)}<span class="t ${H.resCls(x)}">${esc(x.s)}</span></div></td>`;
    }
    if (rowKey === 'words') return `<td class="${cellCls(r, c)}" ${cellAttrs(r, c)}><div class="rc">${d.note ? H.noteChip(id) : '<span class="d">no note · listing text only</span>'}</div></td>`;
    if (rowKey === 'verdict') {
      const st = id === 'D-0198' && !H.waiting() ? (S.hold === 'REFUSED' ? 'refused by you' : 'released by you') : vd.by ? `by ${vd.by.short}${vd.v === 'BLOCK' ? ' · final' : ''}` : 'nothing found';
      return `<td class="${cellCls(r, c)}" ${cellAttrs(r, c)}><div class="rc">${id === 'D-0198' ? H.holdStatus().chip : vchip(vd.v)}<span class="d">${esc(st)}</span></div></td>`;
    }
    if (rowKey === 'paypal') { const [a, b] = paypalLine(id); return `<td class="${cellCls(r, c)}" ${cellAttrs(r, c)}><div class="rc"><b class="t fix ${a === '0 calls' ? 'okc' : 'gold'}">${a}</b><span class="d">${esc(b)}</span></div></td>`; }
    // move: the one decision, in the grid
    let inner;
    if (id === 'D-0198') {
      inner = S.hold === 'HOLD'
        ? `<div class="mvb">${H.releaseBtn(true)}</div><div class="mvb">${S.kept ? '<span class="ui-hint">kept held</span>' : '<button class="ui-btn plain sm" data-act="keep">Keep held</button>'}<button class="ui-btn plain sm red" data-act="refuse">Refuse…</button></div>${H.silence()}`
        : S.hold === 'REFUSED' ? '<span class="ui-hint">refused · nothing waits for you</span>' : `<div class="mvb">${H.holdActions()}</div>${H.silence()}`;
    } else if (id === 'D-0196') inner = '<b class="red" style="font-weight:600">Final · no release</b><div class="ui-hint">not here, not in the approval window</div>';
    else inner = '<span class="muted">Nothing for the shield</span><div class="ui-hint">the mandate decides in Tables</div>';
    return `<td class="${cellCls(r, c)}" ${cellAttrs(r, c)}>${inner}</td>`;
  }

  function rowHead(rowKey) {
    const H = window.SH; const x = H.CHECKS.find((q) => q.k === rowKey);
    if (x) return `<th scope="row" title="${H.esc(x.name)} · on hit → ${x.effect}">${H.esc(x.short === 'F&F request' ? 'Friends & family' : x.short === 'Market' ? '1.4 × median' : x.short)}</th>`;
    return { words: '<th scope="row">Their words</th>', verdict: '<th scope="row">Verdict</th>', paypal: '<th scope="row">PayPal</th>', move: '<th scope="row">Your move</th>' }[rowKey];
  }

  /* Layer 2: the inspector explains the focused cell */
  function inspector() {
    const H = window.SH; const { esc, money, deal, cp, verdict, vchip, ico, S } = H;
    const id = COLS[L.c], d = deal(id), c = cp(d), vd = verdict(id), rowKey = ROWS[L.r];
    const open = `<div class="mvb"><a class="ui-btn sm" href="${H.dealHref(id)}">Open deal ${esc(id)}</a></div>`;
    if (rowKey === 'head') return `<div class="ik">Who sat down · ${esc(id)}</div><h2>${esc(c.name)}</h2><div class="ui-hint">${esc(c.who)}</div>
      <div class="ui-section"><dl class="ui-kv"><dt>Key</dt><dd>${c.key === '—' ? 'none' : `<span class="mono">${esc(c.key)}</span>`}</dd><dt>Pairing</dt><dd>${esc(c.paired)}</dd><dt>First seen</dt><dd>${esc(c.firstSeen)}</dd><dt>Deals before</dt><dd>${esc(c.deals)}</dd>
      <dt>Wants</dt><dd>${esc(d.item)}</dd><dt>Amount</dt><dd class="money">${money(d.amount)}</dd><dt>Agent</dt><dd>${esc(d.agent)}</dd></dl></div>${open}`;
    if (CHECK_KEYS.includes(rowKey)) {
      const x = vd.cs.find((q) => q.k === rowKey);
      return `<div class="ik">${esc(H.STAGES[x.stage])} · ${esc(id)} · ${esc(c.name)}</div><h2>${esc(x.name)}</h2><div class="ui-section">${H.checkDetail(id, rowKey)}</div>`;
    }
    if (rowKey === 'words') return `<div class="ik">Their words · ${esc(id)}</div><h2>${esc(c.name)}</h2><div class="ui-section">${d.note ? H.quarantine(d.note, c.name) : '<p class="det">No note. Only listing text, which the engine reads as data.</p>'}
      <p class="det">Rendered as plain text: never markdown, never links, never passed to an agent as instructions. Only the tool-less engine reads it, as data, and returns a verdict object.</p></div>`;
    if (rowKey === 'verdict') return `<div class="ik">Verdict · ${esc(id)}</div><h2>${vd.v === 'CLEAR' ? 'Nothing found' : (vd.v === 'BLOCK' ? 'Blocked' : 'Held') + ' by ' + esc(vd.by.name)}</h2>
      <div class="ibig">${vchip(vd.v)}${id === 'D-0198' && !H.waiting() ? H.holdStatus().chip : ''}</div>${H.checkList(id)}
      <p class="det">Strongest verdict wins: BLOCK over HOLD over ASK over CLEAR. ${vd.skips.length ? `<span class="r-skip">${vd.skips.map((x) => esc(x.short)).join(', ')}: skipped, not passed.</span> ` : ''}Nothing can turn a BLOCK into CLEAR.</p>`;
    if (rowKey === 'paypal') { const [a, b] = paypalLine(id); return `<div class="ik">PayPal · ${esc(id)}</div><h2>${esc(a)}</h2><p class="det">${esc(b)}. ${esc(d.money)}.</p>`; }
    // move
    if (id === 'D-0198') {
      const hs = H.holdStatus();
      return `<div class="ik">Your move · D-0198</div><h2>${H.waiting() ? 'Release or leave it' : esc(hs.line.split(' · ')[0])}</h2><div class="ibig">${hs.chip}<span class="ui-hint">${esc(hs.line)}</span></div>
        ${S.hold === 'HOLD' ? '<p class="det">Releasing is privileged. You start it here; the typed payee name and the release happen in the approval window. Releasing does not pay: PayPal approval comes after, in your browser.</p>' : ''}
        <div class="mvb">${H.holdActions()}</div>${H.silence()}`;
    }
    if (id === 'D-0196') return `<div class="ik">Your move · D-0196</div><h2>None. A BLOCK is final.</h2><p class="det">The friends &amp; family rule is deterministic: no engine output and no button can release it. No PayPal link was ever opened.</p><div class="mvb">${H.blockActions(id)}<a class="ui-btn sm" href="${H.dealHref(id)}">Open deal</a></div>`;
    return `<div class="ik">Your move · D-0193</div><h2>Nothing for the shield</h2><p class="det">Shield CLEAR means only that nothing was found. Whether $329 gets countersigned is the mandate’s question, in Tables and then the approval window.</p>${open}`;
  }

  function render(view, insp) {
    const H = window.SH; const { esc, verdict, CHECKS } = H;
    const skips = COLS.reduce((a, id) => a + verdict(id).skips.length, 0);
    let body = ''; let lastStage = null;
    const grp = (t) => `<tr class="grp"><th colspan="${COLS.length + 1}" scope="colgroup">${t}</th></tr>`;
    ROWS.forEach((rowKey, r) => {
      if (rowKey === 'head') return;
      const x = CHECKS.find((q) => q.k === rowKey);
      if (rowKey === 'verdict') body += grp('Outcome · conclusion first, evidence below');
      if (x && x.stage !== lastStage) { lastStage = x.stage; body += grp(esc(H.STAGES[x.stage])); }
      if (rowKey === 'words') body += grp('What they sent');
      body += `<tr class="${rowKey}">${rowHead(rowKey)}${COLS.map((_, c) => cell(rowKey, r, c)).join('')}</tr>`;
    });
    view.innerHTML = `
      <div class="ui-pagehead"><h1 tabindex="-1">Shield</h1><span class="sub">2 stopped · ${H.waiting() ? '1 waits for you' : 'nothing waits'} · 0 money moved · ${skips} skipped</span>
        <div class="actions"><div class="ui-seg" role="group" aria-label="Checks shown"><button data-act="v2-passes" data-v="1" aria-pressed="${L.passes}">All checks</button><button data-act="v2-passes" data-v="0" aria-pressed="${!L.passes}">What decided <span class="kbd">P</span></button></div>
          <button class="ui-btn sm" data-act="v2-legend">Legend</button></div></div>
      <div class="mxwrap"><table class="mx" role="grid" aria-label="Shield checks by intent" aria-readonly="true"><colgroup><col class="lab">${COLS.map(() => '<col>').join('')}</colgroup>
        <thead><tr><th class="corner" scope="col">check · intent →</th>${COLS.map((_, c) => cell('head', 0, c)).join('')}</tr></thead>
        <tbody>${body}</tbody></table></div>
      <div class="keys ui-hint" aria-label="Keyboard"><span><span class="kbd">←↑→↓</span> move</span><span><span class="kbd">O</span> open deal</span><span><span class="kbd">R</span> release in approval window</span><span><span class="kbd">K</span> keep held</span><span><span class="kbd">P</span> what decided</span><span><span class="kbd">Esc</span> back</span></div>`;
    insp.innerHTML = inspector();
  }

  function focusCur() { const el = window.SH.$(`[data-fk="cell:${L.r}:${L.c}"]`); if (el) el.focus({ preventScroll: false }); }
  function move(dr, dc) {
    L.r = Math.max(0, Math.min(ROWS.length - 1, L.r + dr));
    L.c = Math.max(0, Math.min(COLS.length - 1, L.c + dc));

          ${RAIL.map(([k, n]) => `<a class="ui-sb-item${k === 'shield' ? ' on' : ''}" href="${k === 'shield' ? '#' : `../../${k}/variant-1/index.html`}"${k === 'shield' ? ' aria-current="page"' : ''}><span class="ico"><span class="ui-dot" style="color:var(--m-${k})"></span></span><span class="lbl">${n}</span><span data-rc="${k}">${railCount(k)}</span></a>`).join('')}
          <div class="ui-sb-foot"><a class="ui-sb-item" href="../../mandate/variant-1/index.html"><span class="lbl">Mandates</span></a><a class="ui-sb-item" href="../../setup/variant-1/index.html"><span class="lbl">Settings</span></a>
            <div class="ui-proto"><button class="ui-btn sm" data-act="toggle-lock" id="simLock" aria-pressed="false" title="Prototype: simulate 15 minutes idle"><span class="lbl">Idle 15 min · lock</span><span class="short">Idle</span></button><button class="ui-btn sm" data-act="toggle-engine" id="simEng" aria-pressed="false" title="Prototype: no engine configured"><span class="lbl">No engine configured</span><span class="short">Eng</span></button></div></div>
        </aside>
        <section class="ui-main" id="view" tabindex="-1"></section>
        <aside class="ui-inspector" id="insp" aria-label="Inspector" aria-live="polite" hidden></aside>
      </div></div>
      <div id="apLayer" hidden></div>`;
  }
  function refreshChrome() {
    $('#engMeter').innerHTML = S.engine
      ? `<b>~$${F.engineWeekUSD.toFixed(2)}</b><span>engine · ${esc(F.owner.engine)} estimate · not a bill</span>`
      : `<b>no engine</b><span>model checks skipped · rules still run</span>`;
    $('#lockSlot').innerHTML = S.locked
      ? `<button class="ui-btn sm gold locked" data-act="unlock" title="Privileged actions are locked. Click: unlock (Windows Hello, simulated)">Locked · idle 17 min</button>`
      : `<button class="ui-btn sm" data-act="toggle-lock" title="Prototype: simulate 15 minutes idle">Unlocked</button>`;
    $('#simLock').setAttribute('aria-pressed', String(S.locked));
    $('#simEng').setAttribute('aria-pressed', String(!S.engine));
    $$('[data-rc]').forEach((el) => { el.innerHTML = railCount(el.dataset.rc); });
  }

  function toast(text, kind, sub) {
    const n = document.createElement('div'); n.textContent = text;
    if (sub) { const s = document.createElement('div'); s.className = 'ui-hint mono'; s.textContent = sub; n.appendChild(s); }
    UI.toast(n, kind);
  }
  function audit(action) {
    const t = clock(now()) + ':' + pad(new Date(now()).getSeconds());
    const row = { seq: S.seq++, t, actor: 'human:maya', action, deal: 'D-0198' };
    S.log.unshift(row); return row;
  }

  /* ---- render loop ---- */
  function rerender() {
    const view = $('#view'); const insp = $('#insp'); const top = view.scrollTop;
    const a = document.activeElement; const fk = a && (a.dataset.fk || (a.dataset.act ? 'act:' + a.dataset.act + ':' + (a.dataset.id || '') : null));
    window.V.render(view, insp);
    if (window.V.inspector) UI.inspector($('#split'), true);
    refreshChrome(); renderApproval();
    view.scrollTop = top;
    if (fk && !$('#apLayer').contains(a) && !document.body.contains(a)) {
      const sel = fk.startsWith('act:') ? `[data-act="${fk.split(':')[1]}"]${fk.split(':')[2] ? `[data-id="${fk.split(':')[2]}"]` : ''}` : `[data-fk="${fk}"]`;
      const el = $(sel); if (el) el.focus({ preventScroll: true });
    }
  }

  /* ---- simulated approval window (a separate privileged OS window in the product) ---- */
  function openApproval(phase) {
    S.approval = { phase: phase || (S.locked ? 'LOCKED' : 'CHECKING'), typed: '' };
    if (S.hold === 'HOLD') S.hold = 'APPROVAL';
    rerender();
    if (S.approval.phase === 'CHECKING') setTimeout(() => { if (S.approval && S.approval.phase === 'CHECKING') { S.approval.phase = 'READY'; renderApproval(true); } }, reduced() ? 50 : 650);
  }
  function closeApproval() {
    if (!S.approval) return;
    if (S.hold === 'APPROVAL') S.hold = 'HOLD';
    S.approval = null; rerender();
    const r = $('[data-act="release"]') || $('[data-act="review-approve"]') || $('#view'); if (r) r.focus();
  }
  function renderApproval(focus) {
    const Lr = $('#apLayer'); const A = S.approval;
    if (!A) { Lr.hidden = true; Lr.innerHTML = ''; return; }
    const d = deal('D-0198'); const vd = verdict('D-0198'); const c = F.counterparties.pixel;
    const steps = ['Checking', 'Ready', 'Released', 'In browser'];
    const ph = { CHECKING: 0, READY: 1, LOCKED: 1, RELEASED: 2, 'IN BROWSER': 3 }[A.phase];
    const strip = `<div class="apsteps" aria-label="Approval states">${steps.map((s, i) => `<span class="ui-chip ${i < ph ? 'ok' : i === ph ? 'gold' : 'line'}">${i === 1 && A.phase === 'LOCKED' ? 'Locked' : s}</span>`).join('')}</div>`;
    const ok = A.typed.trim().toLowerCase() === 'pixel-bay';
    let title = 'Release a shield hold', body = '', foot = '';
    if (ph <= 1) {
      body = `<h2>Release the hold on ${money(d.amount)}</h2>
        <div class="ui-hint">to <b class="muted">pixel-bay</b> · ${esc(c.who)} · first seen ${esc(c.firstSeen)} · D-0198</div>
        <div class="apchecks" aria-label="Summary from the wallet core, read-only">${vd.cs.map((x) => `<span>${ico(x)}${esc(x.short)}</span>`).join('')}${noteChip('D-0198')}</div>
        ${A.phase === 'LOCKED' ? `<div class="notice locked"><span class="n-code">Locked</span><span>Idle 17 min. The wallet re-authenticates its privileged tier after 15 idle minutes.</span></div>`
        : A.phase === 'CHECKING' ? '<div class="ui-hint">Checking the summary against the ledger…</div>'
        : `<label for="typeName">Type the payee’s name to release: <b class="mono">pixel-bay</b></label>
          <input class="ui-field typein${ok ? ' ok' : ''}" id="typeName" value="${esc(A.typed)}" autocomplete="off" spellcheck="false" aria-describedby="relNote">
          <div class="ui-hint" id="relNote">Releasing does not pay. It lets the purchase continue to PayPal, where you approve ${money(d.amount)} on PayPal’s own page.</div>`}`;
      foot = `<button class="ui-btn" data-ap="close">Keep it held</button>${A.phase === 'LOCKED' ? '<button class="ui-btn gold locked" data-ap="unlock">Unlock with Windows Hello</button>' : `<button class="ui-btn gold" data-ap="release" ${ok && A.phase === 'READY' ? '' : 'disabled'}>Release hold</button>`}`;
    } else if (ph === 2) {
      title = 'Hold released · D-0198';
      body = `<h2>Next: approve ${money(d.amount)} on PayPal</h2>
        <dl class="ui-kv"><dt>Decided by</dt><dd class="mono">human:2026-10-29T${clock(S.releasedAt)}</dd><dt>Audit</dt><dd>#${dealLog('D-0198')[0].seq} · append-only, hash-chained</dd>
          <dt>Order</dt><dd class="mono">2PB4…7H · AUTHORIZE · www.sandbox.paypal.com</dd><dt>Market</dt><dd class="r-skip">no reference · still unchecked</dd>
          <dt>Approve window</dt><dd><span class="cd" data-cd="order">${hms(S.orderUntil - now())}</span></dd></dl>
        ${S.locked ? '<div class="notice locked"><span class="n-code">Locked</span><span>Idle 17 min.</span></div>' : ''}`;
      foot = `<button class="ui-btn" data-ap="close">Decide later</button>${S.locked ? '<button class="ui-btn gold locked" data-ap="unlock">Unlock with Windows Hello</button>' : '<button class="ui-btn gold" data-ap="browser">Open PayPal in your browser ↗</button>'}`;
    } else {
      title = 'In your browser · D-0198';
      body = `<h2>Approve ${money(d.amount)} on PayPal’s page</h2>
        <div class="notice"><span class="n-code">Browser</span><span>Opened in your system browser. PayPal pages are never drawn in this app; this window polls <span class="mono">GET /v2/checkout/orders/2PB4…7H</span> every 5 s.</span></div>
        <div>Approve window <span class="cd" data-cd="order">${hms(S.orderUntil - now())}</span></div>`;
      foot = '<button class="ui-btn" data-ap="close">Close · keeps waiting</button>';
    }
    Lr.innerHTML = `<div class="apwin" role="dialog" aria-modal="true" aria-label="Approval window">
      <div class="ui-titlebar"><span class="ap-tag">approval</span><span class="ui-title">${esc(title)}</span><span class="ui-spacer"></span><span class="badge sandbox">Sandbox</span><button class="ui-btn plain icon" data-ap="close" aria-label="Close the approval window">✕</button></div>
      <div class="apbody">${strip}${body}${silence()}</div><div class="apfoot">${foot}</div></div>`;
    Lr.hidden = false;
    if (focus || !Lr.contains(document.activeElement)) {
      const f = $('#typeName', Lr) || $('[data-ap="unlock"]', Lr) || $('[data-ap="browser"]', Lr) || $('.apfoot .ui-btn', Lr);
      if (f) { f.focus(); if (f.id === 'typeName') { const n = f.value.length; f.setSelectionRange(n, n); } }
    }
  }
  function apAct(name) {
    const A = S.approval; if (!A) return;
    if (name === 'close') return closeApproval();
    if (name === 'unlock') { S.locked = false; A.phase = A.phase === 'LOCKED' ? 'READY' : A.phase; toast('Windows Hello · unlocked', 'ok', 'prototype · sandbox simulation'); rerender(); renderApproval(true); return; }
    if (name === 'release') {
      if (A.typed.trim().toLowerCase() !== 'pixel-bay' || S.locked) return;
      S.releasedAt = now(); S.orderUntil = now() + 6 * 3600e3; S.hold = 'RELEASED'; A.phase = 'RELEASED';
      const row = audit('shield.release D-0198 pixel-bay $140.00 · typed payee name · decided_by human');
      toast('Hold released in the approval window. Nothing paid yet: approval on PayPal is next.', 'gold', `audit #${row.seq} · decided_by human:2026-10-29T${clock(S.releasedAt)}`);
      rerender(); renderApproval(true); return;
    }
    if (name === 'browser') { S.hold = 'IN_BROWSER'; A.phase = 'IN BROWSER'; toast('Opened PayPal in your system browser', 'gold', 'prototype · no PayPal page is drawn in the app'); rerender(); renderApproval(true); }
  }

  /* ---- events ---- */
  function act(name, el) {
    if (window.V.act && window.V.act(name, el)) return;
    switch (name) {
      case 'release': if (S.locked) return; return openApproval();
      case 'review-approve': return openApproval(S.hold === 'IN_BROWSER' ? 'IN BROWSER' : 'RELEASED');
      case 'focus-approval': if (!S.approval) openApproval(S.hold === 'IN_BROWSER' ? 'IN BROWSER' : undefined); else renderApproval(true); return;
      case 'unlock': S.locked = false; toast('Windows Hello · unlocked', 'ok', 'prototype · sandbox simulation'); return rerender();
      case 'toggle-lock': S.locked = !S.locked; if (S.approval && S.locked && S.approval.phase === 'READY') S.approval.phase = 'LOCKED'; toast(S.locked ? 'Idle 15 min: privileged buttons now show a lock' : 'Unlocked', S.locked ? 'gold' : 'ok', 'prototype · sandbox simulation'); return rerender();
      case 'toggle-engine': S.engine = !S.engine; toast(S.engine ? `Engine back: ${F.owner.engine} (tool-less profile)` : 'No engine: model check skipped; the rules still run', '', 'prototype · sandbox simulation'); return rerender();
      case 'keep': S.kept = true; toast('Left held. At 20:00 the request lapses · nothing is paid.'); return rerender();
      case 'refuse':
        return UI.sheet({ title: 'Refuse pixel-bay’s $140.00 request?', size: 'narrow',
          body: `<p style="margin:0 0 8px">The hold becomes a refusal. No PayPal call was made and none will be; there is no release afterwards.</p><dl class="ui-kv"><dt>Deal</dt><dd>D-0198 · Monitor stand, walnut (2)</dd><dt>Recorded</dt><dd>audit log · decided_by human</dd></dl>`,
          actions: [{ label: 'Cancel' }, { label: 'Refuse for good', kind: 'danger', onClick: () => act('refuse-confirm') }] });
      case 'refuse-confirm': {
        if (S.hold !== 'HOLD') return;
        S.hold = 'REFUSED'; const row = audit('shield.refuse D-0198 pixel-bay $140.00 · decided_by human');
        toast('Refused. No PayPal call was ever made.', 'ok', `audit #${row.seq}`); return rerender();
      }
      case 'export': toast(`Transcript export ready · ${el.dataset.id}`, 'ok', 'signed file for a dispute · prototype'); return;
      case 'note': return openNote(el, el.dataset.id);
      case 'check': return openCheck(el, el.dataset.id, el.dataset.k);
      case 'how': return openHow();
      case 'log': return openLog();
    }
  }
  function boot() {
    $('#app').innerHTML = chrome();
    document.addEventListener('click', (e) => {
      const ap = e.target.closest('[data-ap]'); if (ap) { e.preventDefault(); return apAct(ap.dataset.ap); }
      if (e.target.id === 'apLayer') return closeApproval();
      const a = e.target.closest('[data-act]'); const link = e.target.closest('a[href]');
      if (a && !(link && a.contains(link))) { e.preventDefault(); act(a.dataset.act, a); }
    });
    document.addEventListener('input', (e) => {
      if (e.target.id === 'typeName' && S.approval) {
        S.approval.typed = e.target.value; const ok = S.approval.typed.trim().toLowerCase() === 'pixel-bay';
        e.target.classList.toggle('ok', ok); const b = $('[data-ap="release"]'); if (b) b.disabled = !ok;
      }
    });
    document.addEventListener('keydown', (e) => {
      if (S.approval) {
        if (e.key === 'Escape') { e.preventDefault(); return closeApproval(); }
        if (e.key === 'Enter' && e.target.id === 'typeName') { e.preventDefault(); return apAct('release'); }
        if (e.key === 'Tab') { const f = $$('button:not([disabled]), input', $('#apLayer')); if (!f.length) return; const i = f.indexOf(document.activeElement);
          if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
        return;
      }
      if (UI.open) return; // a sheet or popover is on top; ui.js handles its Esc
      const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
      if (window.V.onKey && !typing && window.V.onKey(e)) return;
      if (e.key === 'Escape' && !typing) {
        if (window.V.onEsc && window.V.onEsc()) return;
        location.href = '../../../index.html#home';
      }
    });
    setInterval(() => {
      $$('[data-cd="lapse"]').forEach((el) => { el.textContent = dur(LAPSE - now()); });
      if (S.orderUntil) $$('[data-cd="order"]').forEach((el) => { el.textContent = hms(S.orderUntil - now()); });
    }, 1000);
    rerender();
    const h1 = $('#view h1'); if (h1) h1.focus({ preventScroll: true });
  }

  window.SH = { F, S, $, $$, esc, money, deal, cp, dealHref, now, clock, dur, hms, reduced, CHECKS, STAGES, SHIELD_EVIDENCE, SHIELD_DEALS, ELSEWHERE, RES,
    waiting, checks, verdict, vchip, ico, resCls, quarantine, noteChip, marketBand, engineFence, checkDetail, checkList, dealLog, logTable, logRows,
    holdStatus, holdActions, blockActions, releaseBtn, silence, lapseLine, rerender, toast, act, openHow, openLog, openNote, openCheck };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
<script src="../../../shared/shell.js" data-page="shield" data-variant="2"></script>
