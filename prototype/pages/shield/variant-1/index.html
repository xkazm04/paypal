<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield · Case cards</title>
<meta name="description" content="The Table · Shield module, variant 1 (Case cards): every stop is a compact card with its checks as chips and the act on the card; detail opens in popovers and a case-file sheet. Sandbox prototype.">
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
/* ---------- shared by the three Shield variants: titlebar meters, check inks, market band,
   simulated approval window. Everything else is the v2 baseline (shared/ui.css). ---------- */
html, body { height: 100%; }
body { overflow: hidden; }
.tmeter { display: flex; align-items: baseline; gap: 6px; padding-left: var(--sp-2); border-left: 2px solid var(--teal); white-space: nowrap; font-size: var(--fs-small); color: var(--dim); }
.tmeter b { font: var(--fw-semibold) var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.tmeter.eng { border-left-color: var(--line2); }
.ui-proto { display: grid; gap: var(--sp-1); margin-top: var(--sp-2); }
.ui-proto .ui-btn { justify-content: flex-start; }
.ui-proto .ui-btn[aria-pressed="true"] { color: var(--gold-l); border-color: var(--gold); }
.ui-sb-item .ui-dot { width: 9px; height: 9px; }

/* check results: glyph + ink, never colour alone */
.ck { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; flex: none; font: var(--fw-bold) var(--fs-small)/1 var(--mono); box-shadow: inset 0 0 0 1px currentColor; }
.r-hit { color: var(--coral-l); } .r-block { color: var(--red-l); } .r-pass { color: var(--ok); } .r-skip { color: var(--gold-l); } .r-na { color: var(--dim); }
button.ui-chip { border: 0; cursor: pointer; }
.notechip { background: none; color: var(--coral-l); outline: 1px dashed var(--coral); outline-offset: -1px; }
.notechip:hover { background: color-mix(in srgb, var(--coral) 12%, transparent); }

/* layer-2 bodies: check detail, check lists, engine fence */
.ckhead { display: flex; align-items: center; gap: var(--sp-2); }
.det { margin: var(--sp-2) 0; color: var(--muted); }
.l2 { display: grid; gap: var(--sp-3); }
.l2 h3 { margin: 0 0 var(--sp-1); font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--dim); }
.cklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cklist li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px var(--sp-2); align-items: center; }
.cklist li .l { grid-column: 2 / -1; color: var(--dim); font-size: var(--fs-small); }
.cklist li .res { font: var(--fs-small) var(--mono); white-space: nowrap; }
.cklist .stg { display: block; grid-template-columns: none; margin-top: var(--sp-1); font: var(--fs-small) var(--mono); color: var(--dim); }
.steps { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); }
.steps b { color: var(--text); font-weight: var(--fw-semibold); }
mark.hit { background: color-mix(in srgb, var(--refuse) 25%, transparent); color: var(--text); border-radius: 2px; }

/* market band (Channel3 comparables) */
.mband { position: relative; height: 46px; margin: 18px 6px 2px; }
.mband .axis { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--line2); }
.mband .iqr { position: absolute; top: 9px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--market) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--market) 40%, transparent); }
.mband .med { position: absolute; top: 5px; width: 2px; height: 20px; background: var(--market); }
.mband .flag { position: absolute; top: 0; height: 30px; border-left: 2px dashed var(--refuse); }
.mband .px { position: absolute; top: 9px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px var(--panel); }
.mband .px.ours { background: var(--teal); }
.mband .lab { position: absolute; top: 30px; font: var(--fs-small) var(--mono); color: var(--dim); white-space: nowrap; }
.mband .lab.top { top: -18px; }
.nomarket { border: 1px dashed var(--gold); border-radius: var(--r-sm); padding: 4px 8px; color: var(--gold-l); font-size: var(--fs-small); }

/* simulated approval window: a separate OS window in the product */
#apLayer { position: fixed; inset: var(--shell-h) 0 0 0; z-index: 7000; display: grid; place-items: center; background: var(--scrim); }
.apwin { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - var(--shell-h) - 32px); overflow: auto; background: var(--bg2); border-radius: var(--r-lg);
  box-shadow: var(--shadow-3), 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); animation: ui-fade var(--t-med) var(--ease); }
.apwin > .ui-titlebar { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.ap-tag { font: var(--fw-bold) var(--fs-small) var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--gold-l); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 4px; padding: 1px 5px; }
.apbody { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-3); }
.apbody h2 { margin: 0; font: var(--fw-semibold) var(--fs-title2)/1.2 var(--display); }
.apsteps { display: flex; gap: 4px; flex-wrap: wrap; }
.apchecks { display: flex; flex-wrap: wrap; gap: 4px var(--sp-3); align-items: center; font-size: var(--fs-small); color: var(--muted); }
.apchecks span { display: inline-flex; align-items: center; gap: 4px; }
.apfoot { display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.typein { width: 100%; font-family: var(--mono); }
.typein.ok { border-color: var(--ok); }
.cd { font: var(--fw-semibold) var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; color: var(--gold-l); }
.ui-proto .short { display: none; }
@media (max-width: 1180px) {
  .ui-split.has-insp .ui-proto { padding: var(--sp-1); }
  .ui-split.has-insp .ui-proto::before { display: none; }
  .ui-split.has-insp .ui-proto .short { display: inline; }
  .ui-split.has-insp .ui-proto .ui-btn { justify-content: center; padding: 0; }
}
@media (max-width: 1100px) { .tmeter span { display: none; } }
@media (max-width: 1180px) {
  .ui-split.has-insp .ui-sidebar { overflow-x: hidden; }
  .ui-split.has-insp .ui-sb-item { gap: 2px; padding: 0 2px; }
  .ui-split.has-insp .ui-sb-item .cnt:not(.need) { display: none; }
  .ui-split.has-insp .ui-sb-item .cnt.need { padding: 3px 5px; }
}

/* ---------- v1 · Case cards ---------- */
.case { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.case + .case { margin-top: var(--sp-2); }
.case.BLOCK { border-color: color-mix(in srgb, var(--refuse) 35%, var(--line)); }
.case.need { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); box-shadow: inset 3px 0 0 var(--gold); }
.case-h .t1 a { color: var(--text); font-weight: var(--fw-semibold); text-decoration: none; }
.case-h .t1 a:hover { text-decoration: underline; }
.case-h .amt { font-size: var(--fs-title3); }
.case-ev { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); padding: 6px var(--sp-3); border-top: 1px solid var(--line); background: var(--bg2); }
.case-ev .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.case-ev .gap { width: 1px; height: 14px; background: var(--line2); margin: 0 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl-sm); padding: 0 8px 0 3px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: var(--fs-small); cursor: pointer; white-space: nowrap; }
.pill:hover { background: var(--panel2); border-color: var(--line2); }
.pill .r { font-family: var(--mono); }
.pill.hit { border-color: color-mix(in srgb, var(--coral) 50%, var(--line)); }
.pill.block { border-color: color-mix(in srgb, var(--refuse) 50%, var(--line)); }
.pill.skip, .pill.na { border-style: dashed; border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.pill.na { border-color: var(--line2); }
.case-f { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--bar); padding: 0 var(--sp-3); border-top: 1px solid var(--line); }
.case-f > :first-child { flex: 1 1 auto; min-width: 0; }
.final { font-size: var(--fs-small); color: var(--red-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l2.cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--sp-5); align-items: start; }
.l2.cols .span { grid-column: 1 / -1; }
.logrow .t1 { font-size: var(--fs-body); }
@media (max-width: 1100px) { .case-ev .end .ui-chip.ok { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== v1 · Case cards: every stop is a card with its key evidence as chips and the act on the card.
   Layer 1: one card per stop (who · amount · verdict · the five checks as chips · default on silence · act).
   Layer 2: a check chip opens its popover; "note ›" opens the quarantined note; "Case file ›" opens the
   whole case in a sheet; "How verdicts form" and "Full log" are sheets. ===== */
(function () {
  const L = { show: { CLEAR: true, ASK: true, HOLD: true, BLOCK: true } };

  function pills(id) {
    const H = window.SH; const vd = H.verdict(id); let stage = '';
    return vd.cs.map((x) => {
      const gap = stage && x.stage !== stage ? '<span class="gap" aria-hidden="true"></span>' : ''; stage = x.stage;
      const cls = x.r === 'hit' ? (x.eff === 'BLOCK' ? 'block' : 'hit') : x.r;
      const tail = x.r === 'hit' ? ` <span class="r ${H.resCls(x)}">→ ${x.eff}</span>` : x.r === 'skip' ? ' <span class="r r-skip">skipped</span>' : x.r === 'na' ? ' <span class="r r-na">unknown</span>' : '';
      return `${gap}<button class="pill ${cls}" data-act="check" data-id="${id}" data-k="${x.k}" title="${H.esc(x.name)} · ${H.esc(x.s)}">${H.ico(x)}${H.esc(x.short)}${tail}</button>`;
    }).join('');
  }

  function caseCard(id) {
    const H = window.SH; const { esc, money, deal, cp, verdict, vchip, S } = H;
    const d = deal(id), c = cp(d), vd = verdict(id);
    const isHold = id === 'D-0198';
    const hs = isHold ? H.holdStatus() : null;
    const why = vd.v === 'BLOCK' ? `blocked by ${vd.by.name} · final` : isHold ? (H.waiting() ? `held by ${vd.by.name}` : hs.line) : 'nothing found';
    const foot = isHold
      ? `${H.silence() || `<span class="ui-hint">${esc(hs.line)}</span>`}<button class="ui-btn plain sm" data-act="case" data-id="${id}">Case file ›</button>${H.holdActions()}`
      : `<span class="final">Final · no release, here or in the approval window</span><button class="ui-btn plain sm" data-act="case" data-id="${id}">Case file ›</button>${H.blockActions(id)}`;
    return `<article class="case ${vd.v}${isHold && H.waiting() ? ' need' : ''}" aria-labelledby="h-${id}">
      <div class="ui-row two case-h">${isHold ? hs.chip : vchip(vd.v)}
        <span class="main"><span class="t1" id="h-${id}"><a href="${H.dealHref(id)}">${esc(c.name)}</a> <span class="dim">· ${esc(d.item)}</span></span>
          <span class="t2">${esc(why)} · ${esc(c.who)} · ${esc(id)} · ${esc(d.when)}</span></span>
        <span class="amt">${money(d.amount)}</span></div>
      <div class="case-ev" aria-label="What the shield ran">${pills(id)}<span class="end">${H.noteChip(id)}<span class="ui-chip ok" title="No PayPal call was made while it was stopped">0 PayPal calls</span></span></div>
      <div class="case-f">${foot}</div></article>`;
  }

  function openCase(id) {
    const H = window.SH; const { esc, money, deal, cp, verdict, vchip } = H;
    const d = deal(id), c = cp(d), vd = verdict(id);
    const state = id === 'D-0198' ? H.holdStatus().line : vd.v === 'BLOCK' ? 'final · no release exists' : 'cleared · the mandate still decides (Tables)';
    UI.sheet({
      title: `${id} · ${c.name} · ${money(d.amount)}`, size: 'wide',
      body: `<div class="l2 cols"><div class="l2">
        <section><h3>Who and what</h3><dl class="ui-kv"><dt>Counterparty</dt><dd>${esc(c.name)} · ${esc(c.who)}</dd><dt>Key</dt><dd>${c.key === '—' ? 'none' : `<span class="mono">${esc(c.key)}</span>`} · ${esc(c.paired)}</dd>
          <dt>First seen</dt><dd>${esc(c.firstSeen)} · ${esc(c.deals)} deals before</dd><dt>Wants</dt><dd>${esc(d.item)} · <span class="money">${money(d.amount)}</span></dd>
          <dt>Agent</dt><dd>${esc(d.agent)}</dd><dt>Verdict</dt><dd>${vchip(vd.v)} ${vd.by ? 'by ' + esc(vd.by.name) : 'nothing found'}</dd><dt>Now</dt><dd>${esc(state)}</dd><dt>PayPal</dt><dd>${esc(d.money)}</dd></dl></section>
        <section><h3>Market</h3>${H.marketBand(id)}</section>
        <section><h3>Their words</h3>${d.note ? H.quarantine(d.note, c.name) : '<span class="ui-hint">No note · listing text only</span>'}</section></div>
        <section><h3>What the shield ran</h3>${H.checkList(id, true)}</section>
        <section class="span"><h3>Record</h3>${H.logTable(H.dealLog(id))}</section></div>`,
      actions: [{ label: 'Open deal', left: true, onClick: () => { location.href = H.dealHref(id); } }, { label: 'Done', kind: 'primary' }]
    });
  }

  function render(view) {
    const H = window.SH; const { esc, money, deal, cp, verdict, vchip, S, SHIELD_DEALS, ELSEWHERE } = H;
    const all = SHIELD_DEALS.concat(ELSEWHERE);
    const count = { CLEAR: 0, ASK: 0, HOLD: 0, BLOCK: 0 }; all.forEach((id) => count[verdict(id).v]++);
    const seg = ['BLOCK', 'HOLD', 'ASK', 'CLEAR'].map((v) => `<button data-act="v1-filter" data-id="${v}" aria-pressed="${count[v] ? L.show[v] : 'false'}" ${count[v] ? '' : 'disabled'} title="${count[v] ? 'Show or hide ' + v : 'none this week'}">${v[0] + v.slice(1).toLowerCase()} ${count[v]}</button>`).join('');
    const stops = SHIELD_DEALS.filter((id) => L.show[verdict(id).v]);
    const el = ELSEWHERE.map((id) => { const d = deal(id), c = cp(d);
      return `<div class="ui-row two act" data-act="case" data-id="${id}" tabindex="0">${vchip('CLEAR')}<span class="main"><span class="t1">${esc(c.name)} <span class="dim">· ${esc(d.item)}</span></span>
        <span class="t2">vetted in Tables · 5 of 5 checks passed · the mandate decides · ${esc(id)} · ${esc(d.when)}</span></span><span class="amt">${money(d.amount)}</span><span class="chev"></span></div>`; }).join('');
    const log = S.log.filter((a) => a.actor === 'shield' || a.actor.startsWith('human')).slice(0, 5);
    view.innerHTML = `
      <div class="ui-pagehead"><h1 tabindex="-1">Shield</h1><span class="sub">${H.waiting() ? '1 hold waits for you' : 'nothing held'} · stopped before any money moved</span>
        <div class="actions"><div class="ui-seg" role="group" aria-label="Filter by verdict">${seg}</div><button class="ui-btn sm" data-act="how">How verdicts form</button></div></div>
      <div class="ui-section"><div class="ui-section-h"><h2>Holds and blocks · newest first</h2><span class="end">${stops.length} shown · 0 PayPal calls among them</span></div>
        ${stops.length ? stops.map(caseCard).join('') : '<div class="ui-group ui-empty">Every stop is filtered out · use the verdict filter above</div>'}</div>
      ${L.show.CLEAR ? `<div class="ui-section"><div class="ui-section-h"><h2>Vetted elsewhere · cleared</h2><span class="end">CLEAR grants nothing</span></div><div class="ui-group">${el}</div></div>` : ''}
      <div class="ui-section"><div class="ui-section-h"><h2>Shield log</h2><span class="end"><button class="ui-btn plain sm" data-act="log">Full log ›</button></span></div>
        <div class="ui-group">${log.map((a) => `<div class="ui-row logrow"><span class="id">#${a.seq}</span><span class="main"><span class="t1">${esc(a.action)}</span></span><span class="ui-hint mono">${esc(a.t)} · ${esc(a.actor)}</span><a class="mono teal" href="${H.dealHref(a.deal)}">${esc(a.deal)}</a></div>`).join('')}</div></div>`;
  }

  window.V = {
    render,
    act(name, el) {
      if (name === 'v1-filter') { const v = el.dataset.id; L.show[v] = !L.show[v]; window.SH.rerender(); return true; }
      if (name === 'case') { openCase(el.dataset.id); return true; }
      return false;
    },
    onKey(e) {
      const r = e.target.closest && e.target.closest('.ui-row.act');
      if (r && e.key === 'Enter') { e.preventDefault(); openCase(r.dataset.id); return true; }
      return false;
    }
  };
})();

/* ===== Shared by the three Shield variants: data, main-window chrome (v2 baseline), layer-2 bodies,
   simulated approval window. Each variant sets window.V = { render(view, insp), inspector, onKey(e),
   onEsc(), act(name, el) } before this runs. ===== */
(function () {
  const F = window.FIX;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = UI.esc;
  const money = (n) => n == null ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const deal = (id) => F.deals.find((d) => d.id === id);
  const cp = (d) => F.counterparties[d.cp] || { name: d.cp };
  const dealHref = (id) => `../../deal/variant-1/index.html#${id}`;
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- simulated clock: the snapshot moment, ticking ---- */
  const T0 = new Date(F.nowISO).getTime(); const started = Date.now();
  const now = () => T0 + (Date.now() - started);
  const LAPSE = new Date('2026-10-29T20:00:00').getTime(); // D-0198 silence: "the request lapses at 20:00"
  const pad = (n) => String(n).padStart(2, '0');
  const clock = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dur = (ms) => { if (ms <= 0) return '0 m'; const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? `${h} h ${pad(m % 60)} m` : `${m} m`; };
  const hms = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };

  /* ---- what the shield ran, per vetted intent. Consistent with FIX.deals[].rules / note / typology / mkt
     and FIX.market. Pipeline order is the report's: deterministic rules, then the Channel3 band, then the
     quarantined engine (text only). ---- */
  const CHECKS = [
    { k: 'payee', name: 'Payee = signed deal payee', short: 'Payee', stage: 'rules', kind: 'deterministic', effect: 'BLOCK' },
    { k: 'ff', name: '“Pay as friends & family”', short: 'F&F request', stage: 'rules', kind: 'deterministic · regex on NOTE / invoice text', effect: 'BLOCK' },
    { k: 'newcp', name: 'New counterparty over $100', short: 'New counterparty', stage: 'rules', kind: 'deterministic · first_seen today and amount > $100', effect: 'HOLD' },
    { k: 'market', name: 'Over 1.4 × market median', short: 'Market', stage: 'market', kind: 'Channel3 /similar-products', effect: 'HOLD' },
    { k: 'typology', name: 'Scam typology in their text', short: 'Text check', stage: 'engine', kind: 'quarantined engine · tool-less run', effect: 'HOLD' }
  ];
  const STAGES = { rules: '1 · Deterministic rules', market: '2 · Market band', engine: '3 · Quarantined engine' };
  const SHIELD_EVIDENCE = {
    'D-0196': {
      payee: { r: 'na', s: 'unknown · unpaired', l: 'deal-hub-22 is not paired and has no pinned key, so there is no declared payee to compare against. Shown as unknown, not as passed.' },
      ff: { r: 'hit', s: 'hit → BLOCK', l: 'Their note asks to be paid as friends & family. Goods must be paid as a commercial transaction (PayPal User Agreement). This rule is deterministic and final.', quote: 'friends & family' },
      newcp: { r: 'hit', s: 'hit → HOLD', l: 'First seen Wed 28 Oct, the day of the offer, and $460.00 is over $100.' },
      market: { r: 'hit', s: '45% over → HOLD', l: '$460.00 against a Channel3 comparables median of $318 (p25 $301 · p75 $336). The flag line is 1.4 × $318 = $445.20.', price: 460 },
      typology: { r: 'hit', s: 'Buyer Scam', l: 'The quarantined engine read their note as data and returned “Buyer Scam”, one of the User Agreement typologies. Its verdict can only add caution, never remove it.', typology: 'Buyer Scam' }
    },
    'D-0198': {
      payee: { r: 'pass', s: 'pass', l: 'pixel-bay’s paired key aa31…f0 declares the payee the request names.' },
      ff: { r: 'pass', s: 'pass', l: 'No friends & family wording in their note.' },
      newcp: { r: 'hit', s: 'hit → HOLD', l: 'First seen Thu 29 Oct (today), paired today, 0 deals before, and $140.00 is over $100.' },
      market: { r: 'skip', s: 'skipped · no reference', l: 'Channel3 has no match for “Monitor stand, walnut (2)”. The price rule was skipped, not passed: nobody has checked this price.' },
      typology: { r: 'pass', s: 'none found', l: 'The quarantined engine read their note as data and found no typology.' }
    },
    'D-0193': {
      payee: { r: 'pass', s: 'pass', l: 'Payee north-desk-biz (sandbox) = the declared payee of Dan’s paired key 47be…0d.' },
      ff: { r: 'pass', s: 'pass', l: 'No friends & family wording in Dan’s envelopes.' },
      newcp: { r: 'pass', s: 'pass · since 12 Oct', l: 'First seen Mon 12 Oct, one deal closed before (D-0187).' },
      market: { r: 'pass', s: 'pass · list 22% over', l: 'List price $389 is 22% over the $318 median, under the 40% flag ($445.20). Dan’s current ask is $329.', price: 389, ours: 329 },
      typology: { r: 'pass', s: 'none found', l: 'The quarantined engine read the listing text as data and found no typology.' }
    }
  };
  const SHIELD_DEALS = ['D-0198', 'D-0196'];          // module list: holds and blocks, newest first

        if (e.key === 'Tab') { const f = $$('button:not([disabled]), input', $('#apLayer')); if (!f.length) return; const i = f.indexOf(document.activeElement);
          if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
        return;
      }

      const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
