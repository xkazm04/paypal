<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairing · Call script</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>
<script src="../../../shared/ui.js"></script>
<style>
  /* Only what is unique to this variant: the command line, the "now" strip, the call log,
     the turn card in the approval window, and Dan's narrow side screen. */
  body { overflow: hidden; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2); padding: var(--sp-2); height: calc(100vh - var(--shell-h)); min-height: 560px; }
  .win { position: relative; display: grid; grid-template-rows: var(--bar) var(--bar) auto minmax(0, 1fr) auto; min-height: 0; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-2); overflow: hidden; }
  .clock { font: var(--fs-small) var(--mono); color: var(--dim); white-space: nowrap; }

  .cmd { gap: var(--sp-2); }
  .cmd form { display: flex; align-items: center; gap: var(--sp-2); flex: 1 1 auto; min-width: 0; }
  .cmd .prompt { font: var(--fw-semibold) var(--fs-title3) var(--mono); color: var(--teal-l); }
  .cmd .ui-field { flex: 1 1 auto; font-family: var(--mono); letter-spacing: .05em; max-width: 420px; }
  .cmd .vsep { width: 1px; height: 18px; background: var(--line2); flex: none; }
  .cmderr { padding: var(--sp-1) var(--sp-4) 0; color: var(--red-l); font-size: var(--fs-small); }

  .now { padding: var(--sp-3) var(--sp-4) 0; }
  .step { padding-top: var(--sp-3); padding-bottom: var(--sp-3); }
  .code { font: var(--fw-semibold) var(--fs-display)/1.1 var(--mono); letter-spacing: .1em; color: var(--teal-l); }
  .code.coral { color: var(--coral-l); font-size: var(--fs-title2); }
  .exp { display: flex; align-items: center; gap: var(--sp-3); padding: 6px var(--sp-3); border-top: 1px solid var(--line); }
  .exp > .ui-hint { white-space: nowrap; }
  .exp .ui-meter { flex: 1 1 60px; max-width: 160px; min-width: 40px; }
  .exp .ui-silence { margin-left: auto; }
  .ui-row .grow { flex: 1 1 auto; min-width: 0; }

  .log { overflow: auto; min-height: 0; padding: var(--sp-3) var(--sp-4) var(--sp-4); }
  .ln time { font: var(--fs-small) var(--mono); color: var(--dim); width: 38px; flex: none; }
  .ln .ui-chip { width: 58px; justify-content: center; flex: none; }
  .ln .t1 b { font-weight: var(--fw-medium); }
  .q { font-family: var(--mono); color: var(--coral-l); }
  .q.you { color: var(--teal-l); }
  .ln { animation: ui-fade var(--t-med) var(--ease); }
  .win > .ui-proto { margin: 0 var(--sp-4) var(--sp-3); display: flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; }
  .win > .ui-proto::before { width: 100%; margin-bottom: 0; }
  .ui-proto .ui-btn[aria-pressed="true"] { color: var(--coral-l); box-shadow: inset 0 0 0 1px var(--coral); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--teal); animation: sp 1s linear infinite; flex: none; display: inline-block; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* the four turns, as a strip */
  .turns { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-1); }
  .turns li { display: flex; flex-direction: column; gap: 1px; padding: 4px var(--sp-2); border-radius: var(--r-sm); background: var(--bg2); box-shadow: inset 0 0 0 1px var(--line); font-size: var(--fs-small); color: var(--dim); min-width: 0; }
  .turns li b { font: var(--fw-semibold) var(--fs-mono) var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turns li.cur { box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold-l); }
  .turns li.ok b { color: var(--ok); }
  .turns li.bad { box-shadow: inset 0 0 0 1px var(--refuse); } .turns li.bad b { color: var(--red-l); }
  .now .turns { flex: 1 1 auto; }

  /* approval window: a separate privileged window over the main one */
  .aw-back { position: absolute; inset: 0; z-index: 50; display: grid; place-items: start center; padding: calc(var(--bar) + var(--sp-5)) var(--sp-4) var(--sp-4); background: var(--scrim); animation: ui-fade var(--t-med) var(--ease); }
  .aw { width: min(520px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-rows: var(--bar) auto; background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-3), 0 0 0 1px var(--gold); }
  .aw .ui-titlebar { border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .aw-b { display: grid; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-4); }
  .aw-b h2 { margin: 0; font: var(--fw-semibold) var(--fs-title3)/1.25 var(--display); }
  .ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--dim); }
  .turn { display: grid; justify-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-3) var(--sp-3); border-radius: var(--r); background: var(--bg2); box-shadow: inset 0 0 0 1px var(--line2); text-align: center; }
  .turn .role { font-size: var(--fs-small); font-weight: var(--fw-semibold); }
  .turn .word { font: var(--fw-semibold) var(--fs-display)/1.1 var(--mono); letter-spacing: .04em; }
  .turn .word.hidden { color: var(--dim); letter-spacing: .3em; }
  .turn .heard { min-height: 18px; font-size: var(--fs-small); color: var(--muted); }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); width: 100%; }
  .aw .kbd { margin-left: 4px; color: inherit; border-color: currentColor; opacity: .7; }
  .foot { display: flex; align-items: center; gap: var(--sp-3); }
  .foot .ui-silence { min-width: 0; }
  .namerow { display: flex; align-items: center; gap: var(--sp-2); }
  .namerow .ui-field { flex: 1 1 auto; }
  .aw-b dl { margin: 0; }
  .lbl { color: var(--dim); font-size: var(--fs-small); white-space: nowrap; }
  .err { color: var(--red-l); font-size: var(--fs-small); }
  .wordline { font: var(--fw-semibold) var(--fs-title3) var(--mono); letter-spacing: .03em; }

  /* Dan's narrow screen (simulated) */
  .danpanel { width: 248px; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); min-height: 0; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-2); overflow: hidden; }
  .danpanel.closed { width: 40px; }
  .danpanel.closed .dbody, .danpanel.closed .ui-titlebar > :not(.tog) { display: none; }
  .danpanel.closed .ui-titlebar { justify-content: center; padding: 0; }
  .dbody { overflow: auto; padding: var(--sp-3); display: grid; gap: var(--sp-2); align-content: start; }
  .dwords li.cur { box-shadow: inset 2px 0 0 var(--coral); background: color-mix(in srgb, var(--coral) 8%, transparent); }
  .dwords .w { font: var(--fw-semibold) var(--fs-body) var(--mono); }
  .dwords .hid { color: var(--dim); letter-spacing: .2em; }
  .fpr { font: var(--fw-medium) var(--fs-mono) var(--mono); color: var(--coral-l); word-spacing: .2em; }
  .pinmeans { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-top: var(--sp-3); }
  .pinmeans h3 { margin: 0 0 var(--sp-1); font-size: var(--fs-small); color: var(--dim); font-weight: var(--fw-semibold); }
  .pinmeans ul { margin: 0; padding-left: 16px; } .pinmeans li { margin: 2px 0; }
  .pop p { margin: 0 0 var(--sp-2); } .pop p:last-child { margin: 0; }
  @media (max-width: 1180px) { .cmd .hints { display: none; } .danpanel { width: 216px; } }
</style>
</head>
<body>
<div class="stage">
  <section class="win" aria-label="Maya's main window">
    <header class="ui-titlebar">
      <nav class="ui-crumbs"><button data-act="esc">The Table</button><span class="sep">›</span><button data-act="esc">Tables</button><span class="sep">›</span><span>Pair a table</span></nav>
      <span class="ui-spacer"></span>
      <span class="clock" id="clock"></span>
      <span class="badge sandbox">Sandbox</span>
      <span id="lockind"></span>
    </header>
    <div class="ui-toolbar cmd">
      <form id="cmdform" autocomplete="off">
        <label class="prompt" for="cmdin" title="Code from the other owner">›</label>
        <input id="cmdin" class="ui-field" placeholder="TBL-XXXX-XX · HOUSE · N for a new code" spellcheck="false" aria-describedby="cmderr">
        <button class="ui-btn primary" type="submit">Go</button>
      </form>
      <span class="vsep"></span>
      <button class="ui-btn sm chip" data-act="new">Create a code <span class="kbd">N</span></button>
      <button class="ui-btn sm chip" data-act="houseGo">House seller <span class="kbd">H</span></button>
      <span class="ui-hint hints"><span class="kbd">/</span> field · <span class="kbd">D</span> Dan</span>
      <button class="ui-btn plain sm" data-pop="how">How it works</button>
    </div>
    <div>
      <div class="cmderr" id="cmderr" role="alert" hidden></div>
      <div class="now" id="now"></div>
    </div>
    <div class="log" id="log" aria-live="polite">
      <div class="ui-section-h"><h2>Call log</h2><span class="end" id="logCount"></span></div>
      <div class="ui-group" id="logList"></div>
    </div>
    <div class="ui-proto" aria-label="Prototype controls" id="dock"></div>
    <div id="approvalLayer" hidden></div>
  </section>
  <aside class="danpanel" id="danPanel" aria-label="Dan's screen (simulated)">
    <header class="ui-titlebar"><span class="ui-chip coral" id="danChip">Dan</span><span id="danState"></span><span class="ui-spacer"></span><button class="ui-btn plain sm tog" data-act="toggleDan" id="danToggle" aria-expanded="true" title="D">hide</button></header>
    <div class="dbody" id="dbody" aria-live="polite"></div>
  </aside>
</div>

<script>
(() => {
  'use strict';
  const F = window.FIX;
  const DAN = F.counterparties.dan, HOUSE = F.counterparties.house;
  const D0201 = F.deals.find(d => d.id === 'D-0201');
  const M12 = F.mandates.find(m => m.id === 'M-12');
  const esc = UI.esc, $ = s => document.querySelector(s);

  // ---- page constants consistent with FIX ----
  const PAIR = { code: 'TBL-7Q4M-K2', words: DAN.paired.replace('words ✓ ', '').split(' '),
    danFpr: '47be 3a91 d20c 7f55 e81b 0c4a 96d2 110d', mayaPayee: 'second-screen-biz (sandbox)', ttl: 24 * 3600000 };
  const MITM = { mayaWords: ['otter', 'fennel', 'cobalt', 'meadow'], danWords: ['otter', 'harbor', 'willow', 'tundra'], key: '5e02…9b', fpr: '5e02 c7a4 19fe 0b38 6d71 a2c0 4e85 d39b' };
  const HOUSEP = { words: ['lantern', 'cedar', 'orbit', 'pebble'], fpr: 'c4d1 07e9 5b2a 88f3 1d60 ae47 39c2 7b15' };
  const SPELL = { T: 'tango', B: 'bravo', L: 'lima', Q: 'quebec', M: 'mike', K: 'kilo', '7': 'seven', '4': 'four', '2': 'two' };
  // Turn order: you read 1 and 3; Dan reads 2 and 4 (his own word, while yours stays hidden).
  const READER = ['you', 'dan', 'you', 'dan'];

  const BASE = new Date(F.nowISO).getTime(), T0 = Date.now();
  let skew = 0;
  const now = () => BASE + (Date.now() - T0) + skew;
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const p2 = n => String(n).padStart(2, '0');
  const hm = t => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const day = t => { const d = new Date(t); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${hm(t)}`; };
  const left = t => { const m = Math.max(0, Math.floor((t - now()) / 60000)); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min left` : `${m} min left`; };

  // ---- state ----
  const S = {
    mode: null,            // create | join | house
    phase: 'idle',         // idle | code | danCode | waking | words | pinned | aborted | expired
    mitm: false, locked: false, unlocking: false, danOpen: true,
    codeAt: 0, codeExp: 0, polls: 0, log: [], house: 'asleep',
    aw: null,              // approval window state
    pinnedName: '', pinnedAt: 0, dan: 'idle',
  };
  let pollTimer = null, houseTimer = null, speakTimer = null;
  const house = () => S.mode === 'house';
  const myW = () => house() ? HOUSEP.words : S.mitm ? MITM.mayaWords : PAIR.words;
  const danW = () => house() ? HOUSEP.words : S.mitm ? MITM.danWords : PAIR.words;
  const peerKey = () => house() ? 'house key (release pin)' : S.mitm ? MITM.key : DAN.key;
  const peerFpr = () => house() ? HOUSEP.fpr : S.mitm ? MITM.fpr : PAIR.danFpr;
  const toast = (m, k) => UI.toast(m, k);
  const spelled = () => PAIR.code.replace(/-/g, '').split('').map(c => SPELL[c] || c).join(' · ');

  // ---- layer 2 ----
  const POP = {
    how: ['How the call script works', () => `<div class="pop"><p>Type Dan's code, type HOUSE, or press N to make a code. Then you and Dan read the four words to each other, one at a time.</p>
      <p>You read words 1 and 3. Dan reads 2 and 4 while your word stays hidden, so "looks the same" cannot pass. The first "no" ends the pairing.</p><p class="ui-hint">Pairing makes 0 PayPal calls and pays nobody.</p></div>`],
    spell: ['Read it like this', () => `<div class="pop"><p class="wordline">${PAIR.code}</p><p class="mono">${spelled()}</p><p class="ui-hint">Single use. Share only the code; the words come later.</p></div>`],
    expiry: ['When it lapses', () => `<dl class="ui-kv"><dt>Code</dt><dd>single use · 24 h</dd><dt>Bundles</dt><dd>signed identities live 24 h; then the relay forgets the mailbox</dd><dt>Restart</dt><dd>a wallet restart before you confirm needs a fresh code</dd><dt>Silence</dt><dd>nothing is pinned · no money moves</dd></dl>`],
    house: ['The house seller', () => `<div class="pop"><p>${esc(HOUSE.who.charAt(0).toUpperCase() + HOUSE.who.slice(1))}. Its key ships pinned in this release, so there is nobody to read words to; you still pin it yourself.</p><p>It sleeps after 15 idle minutes on its free host; waking takes about a minute.</p></div>`],
    fpr: ['Their key', () => `<dl class="ui-kv"><dt>Fingerprint</dt><dd class="fpr">${esc(peerFpr())}</dd><dt>Payee</dt><dd class="mono">${esc(house() ? HOUSE.payee : DAN.payee)}</dd><dt>Checks</dt><dd>${house() ? 'matches the release pin' : 'owner + agent signatures ✓ · expiry ✓'}</dd></dl>`],
    turns: ['Why one word at a time', () => `<div class="pop"><p>Same code + same two keys = the same four words. A relay that swapped the keys would change them.</p><p>On Dan's turns you hear his word before you see yours, so you cannot just glance and agree.</p></div>`],
    differ: ['Why a different word stops it', () => `<div class="pop"><p>Different words mean different keys: someone may be relaying between you. Nothing is pinned until you say all four match.</p><p>You may ask for one repeat per word, in case you misheard.</p></div>`],
    lock: ['Idle lock', () => `<div class="pop"><p>After 15 idle minutes privileged buttons lock. Pinning a key is privileged: unlock with Windows Hello. Aborting never needs an unlock.</p></div>`],
  };
  const info = (k, label = 'ⓘ') => `<button class="ui-btn plain sm" data-pop="${k}" aria-label="${esc(POP[k][0])}">${label}</button>`;
  const DETAIL = {
    pinned: () => { const h = house(); UI.sheet({ title: `What the pin means · ${S.pinnedName}`, size: 'wide', body: `<dl class="ui-kv">
        <dt>Key fingerprint</dt><dd class="fpr">${esc(peerFpr())}</dd>
        <dt>First seen</dt><dd>${h ? esc(HOUSE.firstSeen) : S.mitm ? 'today (a key you have never seen)' : esc(DAN.firstSeen)}</dd>
        <dt>Declared payee</dt><dd class="mono">${esc(h ? HOUSE.payee : DAN.payee)}</dd>
        <dt>Words</dt><dd class="mono">${myW().join(' ')} · ${day(S.pinnedAt)}</dd>
        <dt>Pin expiry</dt><dd>none · it stays pinned to this name</dd>
        <dt>Audit</dt><dd class="mono">4419 · actor owner · pairing.confirm · 0 PayPal calls</dd></dl>
      <div class="pinmeans"><div><h3>The pin means</h3><ul><li>Signed offers from this key may reach your agents (clause 2: paired only).</li><li>A SETTLE must name this payee.</li></ul></div>
        <div><h3>It does not</h3><ul><li>Pay anyone or open a PayPal page.</li><li>Raise a limit: ${M12.id} v${M12.v} still binds every number.</li></ul></div></div>
      ${S.mitm && !h ? `<p class="red" style="margin:12px 0 0">Prototype run: the relay was in the middle. This is its key, not Dan's. Dan's words differ, so he will not confirm and his agent never sees the table.</p>` : ''}`,
      actions: [{ label: 'Done', kind: 'primary' }] }); },
    aborted: () => UI.sheet({ title: 'Nothing was pinned', size: 'narrow', body: `<p style="margin:0">Words that differ can mean a relay sits in the middle. The code <span class="mono">${PAIR.code}</span> is spent. Start again with a new code and read it over a different channel than the one you used.</p>`, actions: [{ label: 'Close' }, { label: 'Start over', kind: 'primary', onClick: () => resetAll() }] }),
    expired: () => UI.sheet({ title: 'Expired · nothing pinned', size: 'narrow', body: `<p style="margin:0">Signed identity bundles live 24 h; the relay has forgotten the mailbox. No money moved. Press N for a fresh code.</p>`, actions: [{ label: 'Close' }] }),
  };

  // log: one line per entry; longer content opens from "Details…"
  function say(who, html, det) { S.log.push({ t: now(), who, html, det }); renderLog(); }

  function resetAll() {
    clearInterval(pollTimer); clearTimeout(houseTimer); clearTimeout(speakTimer);
    Object.assign(S, { mode: null, phase: 'idle', codeAt: 0, codeExp: 0, polls: 0, log: [], house: 'asleep', aw: null, pinnedName: '', pinnedAt: 0, dan: 'idle' });
    setErr(''); $('#cmdin').value = '';
    say('wallet', 'Pairing makes no PayPal call and pays nobody. It decides whose key your agents may talk to.');
    render();
  }
  function setErr(m) { const e = $('#cmderr'); e.textContent = m; e.hidden = !m; }

  // ---- three ways in ----
  function newCode() {
    if (S.phase !== 'idle') return;
    S.mode = 'create'; S.phase = 'code'; S.codeAt = now(); S.codeExp = S.codeAt + PAIR.ttl; S.dan = 'join';
    say('you', `Created a one-time code <b class="mono">${PAIR.code}</b> · read it to Dan`);
    say('wallet', `Waiting for Dan to join · polling the relay mailbox`);
    pollTimer = setInterval(() => { S.polls++; const p = document.getElementById('polls'); if (p && S.phase === 'code') p.textContent = `mailbox checked ${S.polls}×`; }, 3000);
    render();
  }
  function submitCode(raw) {
    const c = raw.trim().toUpperCase();
    setErr('');
    if (!c) return;
    if (c === 'N') { $('#cmdin').value = ''; return newCode(); }
    if (c === 'HOUSE') { $('#cmdin').value = ''; return houseGo(); }
    if (S.phase !== 'idle' && S.phase !== 'danCode') { setErr('A pairing is already in progress. Finish it or cancel it first.'); return; }
    if (!/^TBL-?[0-9A-Z]{4}-?[0-9A-Z]{2}$/.test(c)) { setErr('That is not a code. Codes look like TBL-7Q4M-K2.'); return; }
    const norm = c.replace(/^TBL-?(\w{4})-?(\w{2})$/, 'TBL-$1-$2');
    if (norm !== PAIR.code || S.dan !== 'code') { say('wallet', `<span class="red">Unavailable</span> · no table waits at <span class="mono">${esc(norm)}</span>: expired, used, or misheard. Ask Dan to read it again.`); return; }
    $('#cmdin').value = '';
    S.mode = 'join';
    say('you', `Joined <span class="mono">${PAIR.code}</span> as the buyer · payee <span class="mono">${esc(PAIR.mayaPayee)}</span>`);
    arrived();
  }
  function houseGo() {
    if (S.phase !== 'idle') return;
    S.mode = 'house'; S.phase = 'waking'; S.house = 'waking';
    say('you', `Sit down with the house seller · ${esc(D0201.id)} · ${esc(D0201.item)}`);
    say('house', 'Waking up on its free host (about a minute)');
    houseTimer = setTimeout(houseAwake, 6000);
    render();
  }
  function newAw(stage) { return { stage, i: 0, ans: [null, null, null, null], rev: [false, false, false, false], heard: [null, null, null, null], rep: [false, false, false, false], name: '', open: true }; }
  function houseAwake() {
    if (S.phase !== 'waking') return;
    clearTimeout(houseTimer);
    S.house = 'awake'; S.codeAt = now(); S.codeExp = now() + PAIR.ttl;
    say('house', `Answered with a signed table <span class="mono">${D0201.id}</span> · seller · payee <span class="mono">${esc(HOUSE.payee)}</span>`);
    say('wallet', `<span class="okc">✓</span> House key matches the release pin · nobody to read words to · you still pin it`);
    S.phase = 'words'; S.aw = newAw('house');
    render(); focusAw();
  }
  function houseTimeout() {
    if (S.phase !== 'waking') return;
    clearTimeout(houseTimer);
    S.phase = 'idle'; S.mode = null; S.house = 'asleep';
    say('house', `<span class="red">Unavailable</span> · no answer to the wake ping · retryable, not a pairing · press H to try again`);
    render();
  }
  function arrived() {
    clearInterval(pollTimer);
    if (S.mode === 'create') say('relay', `Dan's signed reply arrived · signatures ✓ · code ✓ · opposite side ✓`);
    else say('relay', `Found Dan's signed identity at H(code) · signatures ✓ · expiry ✓`);
    say('wallet', `Four words ready · key <span class="mono">${esc(peerKey())}</span> · get Dan on a call`);
    S.phase = 'words'; S.dan = 'words'; S.aw = newAw('turn');
    render(); focusAw(); startTurn();
  }

  // ---- the call script ----
  function startTurn() {
    clearTimeout(speakTimer);
    const a = S.aw; if (!a || a.stage !== 'turn') return;
    const i = a.i;
    a.heard[i] = null;
    speakTimer = setTimeout(() => {
      if (!S.aw || S.aw.i !== i || S.aw.stage !== 'turn') return;
      if (READER[i] === 'dan') a.heard[i] = danW()[i];
      else a.heard[i] = danW()[i] === myW()[i] ? `same, ${danW()[i]}` : `no, mine says ${danW()[i]}`;

      if (k === 'y') { e.preventDefault(); answer(true); }
      else if (k === 'n') { e.preventDefault(); answer(false); }
      else if (e.key === ' ' && S.aw.stage === 'turn' && READER[S.aw.i] === 'dan' && !S.aw.rev[S.aw.i]) { e.preventDefault(); reveal(); }
      else if (k === 'r') { e.preventDefault(); repeat(); }
      else if (k === 'x') { e.preventDefault(); abort(); }
      return;
    }
    if (typing) return;
    const k = e.key.toLowerCase();
    if (e.key === '/') { e.preventDefault(); $('#cmdin').focus(); }
    else if (k === 'n') { e.preventDefault(); if (S.phase === 'aborted' || S.phase === 'expired' || S.phase === 'pinned') { resetAll(); } newCode(); }
    else if (k === 'h') { e.preventDefault(); houseGo(); }
    else if (k === 'd') { S.danOpen = !S.danOpen; renderDan(); }
    else if (k === 'l') { S.locked = !S.locked; render(); }
    else if (k === 't' && S.phase === 'pinned') { const b = document.querySelector('[data-act="next"]:not([disabled])'); if (b) b.click(); }
    else if (e.key === 'Enter' && S.aw && !S.aw.open && S.phase === 'words') { S.aw.open = true; render(); focusAw(); }
  });

  function tick() {
    $('#clock').textContent = day(now());
    if ((S.phase === 'code' || S.phase === 'words' || S.phase === 'danCode') && S.codeExp && now() >= S.codeExp) {
      clearInterval(pollTimer); clearTimeout(speakTimer);
      S.phase = 'expired'; if (S.aw) S.aw.stage = 'expired'; S.dan = house() ? S.dan : 'expired';
      say('wallet', `Expired at ${day(S.codeExp)} · nothing pinned · no money moved`, 'expired');
      render(); return;
    }
    const lt = document.getElementById('leftTxt'); if (lt && S.codeExp) lt.textContent = left(S.codeExp);
    const bar = document.getElementById('expBar'); if (bar && S.codeExp) bar.style.width = Math.max(0, Math.min(100, ((S.codeExp - now()) / PAIR.ttl) * 100)).toFixed(2) + '%';
  }
  setInterval(tick, 1000);
  resetAll(); tick();
  $('#cmdin').focus();
})();
</script>
<script src="../../../shared/shell.js" data-page="pairing" data-variant="2"></script>
