<html lang="en">
<head>

<style>
/* ---- shared by the three Tables variants: what the v2 baseline lacks (titlebar meters, sheet forms, check rows) ---- */
body { overflow: hidden; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
.tmeter { display: inline-flex; align-items: baseline; gap: 6px; padding-left: var(--sp-2); border-left: 2px solid var(--teal); font-size: var(--fs-small); color: var(--dim); white-space: nowrap; }
.tmeter.eng { border-left-color: var(--line2); }
.tmeter b { font: var(--fw-semibold) var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.proto-btn { border-style: dashed; background: none; box-shadow: none; color: var(--dim); }
.ui-proto.inline { display: flex; flex-wrap: nowrap; flex: none; align-items: center; gap: var(--sp-1) var(--sp-2); padding: var(--sp-1) var(--sp-2); }
.ui-proto.inline::before { content: "Prototype"; margin: 0; }
.ui-proto.stack { display: grid; gap: var(--sp-1); justify-items: start; }
button.ui-chip { border: 0; cursor: pointer; }
button.ui-chip:hover { box-shadow: inset 0 0 0 1px var(--line2); }
.ico-i { font-size: 14px; line-height: 1; }
.ckl .ui-row { align-items: baseline; padding-top: 5px; padding-bottom: 5px; }
.ckl .mk { width: 12px; flex: none; font-weight: var(--fw-bold); color: var(--ok); }
.ckl .x .mk { color: var(--red-l); }
.ckl .i .mk { color: var(--dim); }
.ckl .tx { white-space: normal; min-width: 0; }
.sform { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0 var(--sp-2); }
.sform .wide { grid-column: 1 / -1; }
.fl { display: grid; gap: 4px; font-size: var(--fs-small); color: var(--dim); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: var(--sp-2); counter-reset: s; font-size: var(--fs-small); color: var(--dim); }
.steps li { counter-increment: s; display: flex; gap: 6px; align-items: baseline; }
.steps li::before { content: counter(s); font: var(--fw-semibold) var(--fs-small) var(--mono); color: var(--dim); }
.steps li.now { color: var(--text); } .steps li.now::before { color: var(--gold-l); }
.steps li + li::after { content: none; }
.sheet-p { margin: 0 0 var(--sp-2); color: var(--muted); }
@media (max-width: 1180px) { .tmeter .lb { display: none; } }
.ui-btn .kbd { color: inherit; border-color: color-mix(in srgb, currentColor 35%, transparent); opacity: .85; }

/* ---- V1 · Band Box: the convergence chart with the band as a draggable box ---- */
.v1grid { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
.v1grid > .col { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.spark { width: 64px; height: 22px; flex: none; }
.spark .a { stroke: var(--coral); } .spark .b { stroke: var(--teal); } .spark .c { stroke: var(--teal-l); } .spark .cd { stroke: var(--gold-l); } .spark .nb { stroke: var(--dim); }
.ui-row .amt small { font: var(--fs-small) var(--font); color: var(--dim); margin-right: 6px; }
.need-row { box-shadow: inset 3px 0 0 var(--gold); margin-bottom: var(--sp-3); }
.band { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-3) var(--sp-2); }
.bhead { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.bhead h2 { margin: 0; font: var(--fw-semibold) var(--fs-title3)/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bhead .ref { font: var(--fs-mono) var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.bhead > * { flex: none; } .bhead > .ref { flex: 0 1 auto; }
.chartwrap { position: relative; }
.chart { width: 100%; height: auto; display: block; touch-action: none; }
.chart .grid { stroke: var(--line); }
.chart .ax { fill: var(--dim); font: 13px var(--font); }
.chart .axm { fill: var(--muted); font: 13px var(--font); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.chart .mk { fill: color-mix(in srgb, var(--market) 12%, transparent); }
.chart .mkline { stroke: var(--market); stroke-opacity: .5; stroke-dasharray: 3 4; }
.chart .boxf { fill: color-mix(in srgb, var(--teal) 16%, transparent); }
.chart .boxf.draft { fill: color-mix(in srgb, var(--gold) 14%, transparent); }
.chart .out { fill: color-mix(in srgb, var(--bg) 50%, transparent); }
.chart .ceil { stroke: var(--teal-l); stroke-width: 2.5; }
.chart .ceil.draft { stroke: var(--gold-l); stroke-dasharray: 7 5; }
.chart .ghost { stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .8; }
.chart .redge { stroke: var(--teal-l); stroke-width: 2; }
.chart .redge.draft { stroke: var(--gold-l); stroke-dasharray: 6 5; }
.chart .la { stroke: var(--coral); stroke-width: 2; fill: none; opacity: .85; }
.chart .lb { stroke: var(--teal); stroke-width: 2; fill: none; opacity: .85; }
.chart .da { fill: var(--coral); } .chart .db { fill: var(--teal); }
.chart .slot { fill: none; stroke: var(--line2); stroke-dasharray: 2 3; }
.chart .meet { fill: none; stroke: var(--gold); stroke-width: 3; }
.chart .meet.no { stroke: var(--dim); }
.chart .meett { fill: var(--gold-l); font: 600 14px var(--font); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.chart .meett.no { fill: var(--red-l); }
.chart .pill { fill: color-mix(in srgb, var(--teal) 22%, var(--panel)); stroke: var(--teal); }
.chart .pill.draft { fill: color-mix(in srgb, var(--gold) 22%, var(--panel)); stroke: var(--gold); }
.chart .pillt { fill: var(--teal-l); font: 700 14px var(--mono); }
.chart .pillt.draft { fill: var(--gold-l); }
.chart .h { cursor: ns-resize; outline: none; }
.chart .hr { cursor: ew-resize; outline: none; }
.chart .h:focus-visible .pill, .chart .hr:focus-visible .pill { stroke: var(--focus); stroke-width: 3; }
.chart .pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.nob { position: absolute; inset: 22% 18% 26% 12%; display: grid; place-content: center; justify-items: center; gap: var(--sp-2); padding: var(--sp-3); text-align: center;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px dashed var(--line2); border-radius: var(--r); }
.nob b { font-weight: var(--fw-semibold); }
.dlrow { display: flex; align-items: center; gap: var(--sp-3); }
.dlrow > .k { font-size: var(--fs-small); color: var(--dim); width: 52px; flex: none; }
.dtrack { position: relative; flex: 1; height: 34px; margin: 0 var(--sp-5) 0 var(--sp-2); touch-action: none; }
.dtrack .rail2 { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--panel3); }
.dtrack .fill { position: absolute; top: 9px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--teal) 60%, var(--panel3)); }
.dtrack .fill.draft { background: color-mix(in srgb, var(--gold) 60%, var(--panel3)); }
.dtrack .tick { position: absolute; top: 18px; transform: translateX(-50%); font: var(--fs-small) var(--mono); color: var(--dim); }
.dtrack .now { position: absolute; top: 2px; width: 2px; height: 18px; background: var(--muted); }
.dtrack .ghost { position: absolute; top: 3px; width: 2px; height: 16px; background: var(--teal); opacity: .8; }
.dtrack .dh { position: absolute; top: 0; transform: translateX(-50%); height: 22px; padding: 0 var(--sp-2); display: inline-flex; align-items: center; border-radius: 11px;
  border: 1px solid var(--teal); background: color-mix(in srgb, var(--teal) 22%, var(--panel)); font: var(--fw-bold) var(--fs-small) var(--mono); color: var(--teal-l); cursor: ew-resize; }
.dtrack .dh.draft { border-color: var(--gold); color: var(--gold-l); background: color-mix(in srgb, var(--gold) 22%, var(--panel)); }
.bfoot { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; min-height: var(--ctl); }
.bfoot .ui-hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dbar { box-shadow: inset 3px 0 0 var(--gold); }
.dbar .ui-row { gap: var(--sp-2); }
@media (max-width: 1100px) { .v1grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar" id="tbar"></header>
  <div class="ui-split" id="split">
    <nav class="ui-sidebar" id="rail" aria-label="Modules"></nav>
    <section class="ui-main" id="view" tabindex="-1"></section>
    
  </div>
</div>
<script>
'use strict';
/* ---------------- shared: data, domain rules, chrome, layer-2 sheets and popovers (same in all three variants) ---------------- */
const F = window.FIX;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = UI.esc;
const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd = (n) => '$' + Math.round(n).toLocaleString('en-US');
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SNAP = new Date(F.nowISO).getTime();
const T0 = Date.now();
const nowMin = () => { const d = new Date(SNAP + (Date.now() - T0)); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const toMin = (s) => { const p = String(s).split(':').map(Number); return p[0] * 60 + p[1]; };
const hm = (m) => { m = Math.round(m); if (m >= 1440) return '24:00'; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const leftTxt = (dl) => { const l = dl - nowMin(); if (l <= 0) return 'passed'; const h = Math.floor(l / 60), m = Math.floor(l % 60); return (h ? h + ' h ' : '') + m + ' m'; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const OUT = ' <span aria-hidden="true">↗</span>';
const DEAL_HREF = (id) => '../../deal/variant-1/index.html#' + id;

/* Page constants that FIX does not hold (consistent with it):
   - M-12 clause 4 names a band for monitor-27-4k only, so D-0201 (HOUSE · monitor-24-ips) has no band yet:
     the core refuses every OFFER on it until Maya signs one (report §6.4: m.band(item_ref)? fails).
   - When the house wakes it posts a LISTING; its list price is a prototype constant below. */
const HOUSE_LISTING = { ask: 236, t: '14:04', note: 'house catalog list price, cached at deploy · prototype constant' };
const NEXT_COMMIT = 'a7f2…09';
const M12 = F.mandates[0];
const MK = F.market;
const CP = F.counterparties;
const TABLES = F.deals.filter((d) => d.module === 'tables').map((d) => Object.assign({}, d));
const T = (id) => TABLES.find((d) => d.id === id);
const LIVE_STATES = ['PAIRING', 'LISTED', 'NEGOTIATING', 'AGREED', 'SETTLING', 'AWAITING APPROVAL', 'APPROVED'];
const isLive = (d) => LIVE_STATES.includes(d.state);
const chipCls = (s) => (['RECEIPTED', 'RECONCILED', 'CAPTURED'].includes(s) ? 'ok' : ['WITHDRAWN', 'EXPIRED'].includes(s) ? '' : ['REFUSED', 'MISMATCH'].includes(s) ? 'red' : ['PAIRING', 'LISTED'].includes(s) ? 'line' : 'teal');
const stChip = (d) => `<span class="ui-chip ${chipCls(d.state)}">${esc(d.state)}</span>`;
const NEED_CHIP = '<span class="ui-chip gold">Needs you</span>';
const cpName = (d) => (CP[d.cp] ? CP[d.cp].name : d.cp);
const cpShort = (d) => (d.cp === 'house' ? 'HOUSE' : CP[d.cp] ? CP[d.cp].name.split(' · ')[0] : d.cp);
/* "the offer lapses at 18:00 · no money moves" → one ui-silence line with the act in bold */
const silence = (txt) => { const p = String(txt || '').replace(/^the /, '').split(' · '); return `<span class="ui-silence">silent → <b>${esc(p[0])}</b>${p.length > 1 ? ' · ' + esc(p.slice(1).join(' · ')) : ''}</span>`; };

const S = {
  v: M12.v, commit: M12.commitment, signedAt: M12.signed,
  signed: { 'D-0193': { ceiling: F.haggle.ceiling, rounds: F.haggle.rounds, deadline: toMin(F.haggle.deadline) } },
  draft: {}, handoff: null, locked: false, paused: false, empty: false, houseAwake: false, csHanded: false,
};

/* signed envelopes per table */
function envs(id) {
  if (id === 'D-0193') return F.haggle.envelopes;
  if (id === 'D-0201' && S.houseAwake) return [{ seq: 1, by: 'them', typ: 'LISTING', price: HOUSE_LISTING.ask, t: HOUSE_LISTING.t }];
  return [];
}
const lastBy = (id, by) => { const e = envs(id).filter((x) => x.by === by); return e.length ? e[e.length - 1] : null; };
const roundsUsed = (id) => envs(id).filter((x) => x.by === 'you').length;
const mkt = (id) => MK[T(id).ref] || null;
const signedBand = (id) => S.signed[id] || null;
const band = (id) => S.draft[id] || S.signed[id] || null;
const sameBand = (a, b) => !!a && !!b && a.ceiling === b.ceiling && a.rounds === b.rounds && a.deadline === b.deadline;
const isDraft = (id) => !!S.draft[id] && !sameBand(S.draft[id], S.signed[id]);
const hasDraft = () => Object.keys(S.draft).some(isDraft);
function domain(id) {
  const m = mkt(id); const ps = envs(id).map((e) => e.price);
  const b = band(id); if (b) ps.push(b.ceiling);
  if (m) ps.push(m.p25, m.p75);
  if (id === 'D-0193') return [280, 400];
  if (id === 'D-0201') return [180, 250];
  const lo = Math.floor(Math.min.apply(null, ps) * 0.9 / 10) * 10, hi = Math.ceil(Math.max.apply(null, ps) * 1.08 / 10) * 10;
  return [lo, hi];
}
const ceilRange = (id) => { const d = domain(id); return [d[0] + 5, d[1] - 5]; };
const roundsRange = (id) => [Math.max(1, roundsUsed(id)), 12];
const deadlineRange = () => [Math.ceil((nowMin() + 15) / 15) * 15, 23 * 60 + 45];
function defaultBand(id) {
  const m = mkt(id);
  return { ceiling: m ? m.median : ceilRange(id)[0], rounds: F.haggle.rounds, deadline: toMin(F.haggle.deadline), fresh: true };
}
function setDraft(id, patch) {
  const base = Object.assign({}, S.draft[id] || S.signed[id] || defaultBand(id));
  const nb = Object.assign(base, patch);
  const cr = ceilRange(id), rr = roundsRange(id), dr = deadlineRange();
  nb.ceiling = clamp(Math.round(nb.ceiling), cr[0], cr[1]);
  nb.rounds = clamp(Math.round(nb.rounds), rr[0], rr[1]);
  nb.deadline = clamp(Math.round(nb.deadline / 15) * 15, dr[0], dr[1]);
  if (sameBand(nb, S.signed[id])) delete S.draft[id]; else S.draft[id] = nb;
  if (S.handoff) { S.handoff = null; toast('Draft changed · the approval-window request was withdrawn. Hand off again when done.'); }
  rerender();
}
function discard(id) { if (id) delete S.draft[id]; else S.draft = {}; S.handoff = null; rerender(); }

/* clause 4 checks of the (draft or signed) band against the signed transcript */
function checks(id, b) {
  b = b || band(id); const out = []; if (!b) return out;
  const ask = lastBy(id, 'them'), bid = lastBy(id, 'you'), d = T(id);
  if (ask) {
    const what = ask.typ === 'LISTING' ? 'listing' : 'last ask';
    if (ask.price <= b.ceiling) out.push({ ok: true, text: `${cpShort(d)}'s ${what} ${usd(ask.price)} fits under ${usd(b.ceiling)} · ${usd(b.ceiling - ask.price)} of room` });
    else out.push({ ok: false, text: `${cpShort(d)}'s ${what} ${usd(ask.price)} is above ${usd(b.ceiling)} · unsignable: the core will not sign an ACCEPT at that price` });
  } else out.push({ ok: true, text: 'no ask yet · the first price arrives in a signed LISTING' });
  if (bid && bid.price > b.ceiling) out.push({ ok: false, text: `your bid #${bid.seq} ${usd(bid.price)} stays in the transcript (signed history is never re-signed), but the next bid must be ≤ ${usd(b.ceiling)}` });
  const left = b.rounds - roundsUsed(id);
  out.push(left > 0 ? { ok: true, text: `${left} of ${b.rounds} round${b.rounds === 1 ? '' : 's'} left (${roundsUsed(id)} used)` }
    : { ok: false, text: `no counters left at ${b.rounds} rounds · the agent may only accept a price inside the band, or withdraw` });
  out.push({ ok: true, text: `until ${hm(b.deadline)} today · ${leftTxt(b.deadline)} · then auto-WITHDRAW{DEADLINE}, no money moves` });
  return out;
}
const fitsAsk = (id, b) => { b = b || band(id); const a = lastBy(id, 'them'); return !b || !a || a.price <= b.ceiling; };
const failing = (id) => checks(id).filter((c) => !c.ok).length;

function diffLines(id) {
  const a = S.signed[id], b = S.draft[id], ref = T(id).ref, L = [];
  if (!b) return L;
  if (!a) { L.push(`+ ${ref} · ceiling ${usd(b.ceiling)} · ${b.rounds} rounds · until ${hm(b.deadline)}`); return L; }
  if (a.ceiling !== b.ceiling) L.push(`${ref} · ceiling ${usd(a.ceiling)} → ${usd(b.ceiling)}`);
  if (a.rounds !== b.rounds) L.push(`${ref} · rounds ${a.rounds} → ${b.rounds}`);
  if (a.deadline !== b.deadline) L.push(`${ref} · until ${hm(a.deadline)} → ${hm(b.deadline)}`);
  return L;
}
const allDiff = () => Object.keys(S.draft).filter(isDraft).reduce((acc, id) => acc.concat(diffLines(id)), []);
/* what the pending change does to each table (x = it breaks something signable) */
function impact() {
  const out = [];
  Object.keys(S.draft).filter(isDraft).forEach((id) => {
    const d = T(id), ask = lastBy(id, 'them'), b = S.draft[id];
    if (ask && ask.price > b.ceiling) out.push({ x: true, t: `${id}: ${cpShort(d)}'s ${usd(ask.price)} becomes unsignable · clause 4${d.pending === 'countersign' ? ' · the countersign request lapses' : ''}` });
    else if (ask) out.push({ x: false, t: `${id}: ${cpShort(d)}'s ${usd(ask.price)} still fits · ${usd(b.ceiling - ask.price)} of room` });
    if (!S.signed[id]) out.push({ x: false, t: `${id}: your agent may start bidding ≤ ${usd(b.ceiling)}` });
  });
  return out;
}

/* ---- hand-offs: only the approval window signs or countersigns ---- */
function handOff() {
  if (!hasDraft()) return;
  if (S.locked) { unlockPrompt(); return; }
  S.handoff = { v: S.v + 1, lines: allDiff() };
  toast(`Approval window opened beside Main · <b>sign M-12 v${S.v + 1}</b> there. Signing changes the band only; it never pays.`, 'gold');
  rerender();
}
function simSigned() {
  if (!S.handoff) return;
  Object.keys(S.draft).forEach((id) => { if (isDraft(id)) { const b = Object.assign({}, S.draft[id]); delete b.fresh; S.signed[id] = b; } });
  S.draft = {}; S.v = S.handoff.v; S.commit = NEXT_COMMIT; S.signedAt = 'Thu 29 Oct ' + hm(nowMin()); S.handoff = null;
  const d = T('D-0193');
  if (d.state === 'NEGOTIATING') {
    const ok = fitsAsk('D-0193');
    d.pending = ok ? 'countersign' : null;
    d.sub = ok ? `round ${roundsUsed('D-0193')}/${S.signed['D-0193'].rounds} · agent wants to accept $329` : `clause 4 refuses $329 under v${S.v} · the agent must counter ≤ ${usd(S.signed['D-0193'].ceiling)} or withdraw`;
    if (!ok) S.csHanded = false;
  }
  const h = T('D-0201'); if (S.signed['D-0201'] && h.state !== 'WITHDRAWN') h.sub = S.houseAwake ? 'listing in · your agent may now bid inside the band' : 'band signed · the house seller is waking up (≈ 1 min)';
  toast(`<b>M-12 v${S.v}</b> signed in the approval window · commitment ${NEXT_COMMIT}. The counterparty sees the new hash, never your ceiling.`, 'ok');
  rerender();
}
function simClosed() { S.handoff = null; toast(`Approval window closed without signing · M-12 v${S.v} still binds.`); rerender(); }
function countersign() {
  if (S.locked) { unlockPrompt(); return; }
  S.csHanded = true;
  toast('Approval window opened · <b>countersign $329.00</b> there. It re-checks clause 4, then the seller issues the order.', 'gold');
  rerender();
}
function withdrawAsk(id) {
  const d = T(id);
  sheet({ title: `Withdraw from ${cpShort(d)}'s table?`, size: 'narrow',
    body: `<p class="sheet-p">Your wallet signs one WITHDRAW envelope and ${esc(id)} closes.</p>
      <dl class="ui-kv"><dt>PayPal</dt><dd>no call</dd><dt>Money</dt><dd>none moves</dd><dt>Approval</dt><dd>not needed · restricting is always free</dd></dl>`,
    actions: [{ label: 'Keep the table' }, { label: 'Withdraw', kind: 'danger', onClick: () => withdraw(id) }] });
}
function withdraw(id) {
  const d = T(id);
  Object.assign(d, { state: 'WITHDRAWN', pending: null, amount: null, sub: 'you withdrew · signed WITHDRAW · no order was ever issued', money: 'none' });
  delete S.draft[id]; S.handoff = hasDraft() ? S.handoff : null; if (id === 'D-0193') S.csHanded = false;
  toast(`<b>${esc(id)}</b> withdrawn · one signed WITHDRAW envelope · 0 PayPal calls.`, 'ok');
  rerender();
}
function houseWake() {
  S.houseAwake = true; const d = T('D-0201');
  if (d.state === 'PAIRING') Object.assign(d, { state: 'LISTED', sub: S.signed['D-0201'] ? 'listing in · your agent may now bid inside the band' : `listing in at ${usd(HOUSE_LISTING.ask)} · no band yet, so every OFFER is refused` });
  toast('Prototype · the house seller woke up and posted a signed LISTING.');
  rerender();
}
/* the one privileged hand-off button; idle-locked it asks for Windows Hello instead */
function privBtn(label, act, arg, sm) {
  const c = sm ? ' sm' : '';
  if (S.locked) return `<button class="ui-btn gold locked${c}" data-act="unlock">Unlock with Windows Hello</button>`;
  return `<button class="ui-btn gold${c}" data-act="${act}"${arg ? ` data-arg="${esc(arg)}"` : ''}>${label}${OUT}</button>`;
}

  for (let r = 1; r <= RMAX; r++) g += `<text class="ax" x="${x(2 * r)}" y="${CH - CB + 18}" text-anchor="middle">${r}</text>`;
  g += `<text class="ax" x="${CW - CR + 8}" y="${CH - CB + 18}">round</text>`;
  if (m) g += `<rect class="mk" x="${CL}" y="${y(m.p75)}" width="${CW - CL - CR}" height="${y(m.p25) - y(m.p75)}"/><line class="mkline" x1="${CL}" x2="${CW - CR}" y1="${y(m.median)}" y2="${y(m.median)}"/>`;
  const mlab = m ? `<text class="axm" x="${CW - CR - 6}" y="${y(m.p25) - 6}" text-anchor="end">market ${usd(m.p25)}–${usd(m.p75)}</text>` : '';
  if (b) {
    const xr = x(1 + 2 * b.rounds);
    g += `<rect class="out" x="${xr}" y="${CT}" width="${Math.max(0, CW - CR - xr)}" height="${CH - CT - CB}"/>`;
    g += `<rect class="boxf ${dr ? 'draft' : ''}" x="${CL}" y="${y(b.ceiling)}" width="${xr - CL}" height="${CH - CB - y(b.ceiling)}"/>`;
    if (dr && sb) g += `<line class="ghost" x1="${CL}" x2="${CW - CR}" y1="${y(sb.ceiling)}" y2="${y(sb.ceiling)}"/><text class="ax" x="${CL + 6}" y="${y(sb.ceiling) - 6}">signed ${usd(sb.ceiling)} · v${S.v}</text>
      <line class="ghost" x1="${x(1 + 2 * sb.rounds)}" x2="${x(1 + 2 * sb.rounds)}" y1="${CT}" y2="${CH - CB}"/>`;
  }
  const path = (by) => E.filter((e) => e.by === by).map((e, i) => `${i ? 'L' : 'M'}${x(e.seq).toFixed(1)} ${y(e.price).toFixed(1)}`).join(' ');
  if (E.length) {
    g += `<path class="la" d="${path('them')}"/><path class="lb" d="${path('you')}"/>`;
    g += E.map((e) => `<circle class="${e.by === 'you' ? 'db' : 'da'}" cx="${x(e.seq)}" cy="${y(e.price)}" r="4.5"><title>#${e.seq} ${e.by === 'you' ? 'your' : cpShort(d) + '’s'} ${e.typ} $${e.price} · ${e.t} · signature verified</title></circle>`).join('');
  }
  if (b) for (let s = E.length + 1; s <= 1 + 2 * b.rounds && s <= 1 + 2 * RMAX; s++) g += `<circle class="slot" cx="${x(s)}" cy="${CH - CB - 6}" r="3"/>`;
  const ask = lastBy(id, 'them');
  if (ask && isLive(d)) {
    const ok = !b || ask.price <= b.ceiling;
    const lab = ask.typ === 'LISTING' ? `listing ${usd(ask.price)}` : d.pending === 'countersign' || !b ? `${usd(ask.price)} · agent wants to accept` : `${usd(ask.price)} · on the table`;
    g += `<circle class="meet ${ok ? '' : 'no'} ${ok && !REDUCE ? 'pulse' : ''}" cx="${x(ask.seq)}" cy="${y(ask.price)}" r="10"/>
      <text class="meett ${ok ? '' : 'no'}" x="${x(ask.seq) + 15}" y="${y(ask.price) - 9}">${ok ? lab : `${usd(ask.price)} · unsignable · clause 4`}</text>`;
  }
  g += mlab;
  if (b) {
    const yc = y(b.ceiling), xr = x(1 + 2 * b.rounds), cr = ceilRange(id), rr = roundsRange(id);
    g += `<line class="ceil ${dr ? 'draft' : ''}" x1="${CL}" x2="${CW - CR + 4}" y1="${yc}" y2="${yc}"/>`;
    g += `<line class="redge ${dr ? 'draft' : ''}" x1="${xr}" x2="${xr}" y1="${yc}" y2="${CH - CB}"/>`;
    g += `<g class="h" tabindex="0" role="slider" aria-label="Ceiling for ${esc(d.ref)}" aria-valuemin="${cr[0]}" aria-valuemax="${cr[1]}" aria-valuenow="${b.ceiling}" aria-valuetext="ceiling ${usd(b.ceiling)}" data-drag="ceil" data-k="ceil" data-id="${id}" data-fk="ceil-${id}">
      <rect class="pill ${dr ? 'draft' : ''}" x="${CW - CR + 6}" y="${yc - 13}" width="${CR - 10}" height="26" rx="13"/>
      <text class="pillt ${dr ? 'draft' : ''}" x="${CW - CR / 2 + 1}" y="${yc + 5}" text-anchor="middle">≤ ${usd(b.ceiling)}</text></g>`;
    g += `<g class="hr" tabindex="0" role="slider" aria-label="Max rounds" aria-valuemin="${rr[0]}" aria-valuemax="${RMAX}" aria-valuenow="${b.rounds}" data-drag="rounds" data-k="rounds" data-id="${id}" data-fk="rounds-${id}">
      <rect class="pill ${dr ? 'draft' : ''}" x="${xr - 40}" y="${CT + 2}" width="80" height="24" rx="12"/>
      <text class="pillt ${dr ? 'draft' : ''}" x="${xr}" y="${CT + 19}" text-anchor="middle">${b.rounds} rounds</text></g>`;
  }
  return `<svg class="chart" id="chart-${id}" viewBox="0 0 ${CW} ${CH}" role="group" aria-label="Signed offers for ${id} against your band">${g}</svg>`;
}
function dtrack(id) {
  const b = band(id), sb = signedBand(id), dr = isDraft(id);
  if (!b) return '';
  const pos = (m) => ((m - 840) / 600 * 100).toFixed(2) + '%';
  const nm = nowMin();
  let t = '';
  for (let h = 14; h <= 24; h += 2) t += `<span class="tick" style="left:${pos(h * 60)}">${h}:00</span>`;
  return `<div class="dlrow"><span class="k">Deadline</span><div class="dtrack" id="dt-${id}"><div class="rail2"></div><div class="fill ${dr ? 'draft' : ''}" style="left:${pos(nm)};width:calc(${pos(b.deadline)} - ${pos(nm)})"></div>
    ${t}<span class="now" style="left:${pos(nm)}" title="now ${hm(nm)}"></span>
    ${dr && sb && sb.deadline !== b.deadline ? `<span class="ghost" style="left:${pos(sb.deadline)}" title="signed ${hm(sb.deadline)}"></span>` : ''}
    <span class="dh ${dr ? 'draft' : ''}" style="left:${pos(b.deadline)}" tabindex="0" role="slider" aria-label="Deadline" aria-valuetext="${hm(b.deadline)}" data-drag="dl" data-k="dl" data-id="${id}" data-fk="dl-${id}">${hm(b.deadline)}</span></div></div>`;
}
/* layer 1 bar under the chart: idle hint, a draft, or the hand-off in flight */
function draftBar(id) {
  const b = band(id);
  if (S.handoff) return `<div class="ui-group dbar"><div class="ui-row two"><span class="ui-chip gold">In approval window</span>
      <span class="main"><span class="t1">M-12 v${S.handoff.v} · ${S.handoff.lines.length} edit${S.handoff.lines.length === 1 ? '' : 's'}</span><span class="ui-silence">silent → <b>v${S.v} keeps binding</b> · no PayPal call</span></span>
      <button class="ui-btn plain sm" data-act="changes">What changes ›</button></div>
      <div class="ui-row" style="justify-content:flex-end;min-height:36px"><span class="ui-proto inline"><button class="ui-btn sm" data-act="simSigned">signed in the approval window</button><button class="ui-btn sm" data-act="simClosed">closed without signing</button></span></div></div>`;
  if (hasDraft()) {
    const L = allDiff();
    return `<div class="ui-group dbar"><div class="ui-row two"><span class="ui-chip gold">Draft</span>
      <span class="main"><span class="t1 mono">${esc(L[0])}${L.length > 1 ? ` <span class="dim">+${L.length - 1}</span>` : ''}</span><span class="ui-silence">not signed · <b>v${S.v} binds</b> · Esc discards</span></span>
      <button class="ui-btn plain sm" data-act="changes">What changes ›</button><button class="ui-btn sm" data-act="discard">Discard</button>${privBtn(`Sign v${S.v + 1}`, 'handOff', null, true)}</div></div>`;
  }
  return `<div class="bfoot">${b ? '<span class="ui-hint">drag or arrow keys · Shift = $5</span>' : ''}<button class="ui-btn plain sm" data-act="market" data-arg="${id}">Market ›</button><span class="ui-spacer"></span>${b ? silence(`auto-WITHDRAW at ${hm(b.deadline)} · no money moves`) : ''}</div>`;
}
function needRow() {
  const d = TABLES.find((x) => x.pending === 'countersign' && isLive(x));
  if (!d) return '';
  if (S.csHanded) return `<div class="ui-group need-row"><div class="ui-row two"><span class="ui-chip gold">In approval window</span>
    <span class="main"><span class="t1">Countersign <span class="money">$329.00</span> · ${esc(d.id)} · ${esc(cpShort(d))}</span>${silence(d.silence)}</span>
    <span class="ui-proto inline"><button class="ui-btn sm" data-act="csClosed">window closed</button></span></div></div>`;
  const kills = isDraft(d.id) && !fitsAsk(d.id);
  return `<div class="ui-group need-row"><div class="ui-row two">${NEED_CHIP}
    <span class="main"><span class="t1">Countersign <span class="money">$329.00</span> · ${esc(d.id)} · ${esc(cpShort(d))}</span>${silence(d.silence)}</span>
    ${kills ? `<span class="ui-chip red" title="Until you sign it, v${S.v} still binds at ${usd(signedBand(d.id).ceiling)}">draft blocks it</span>` : ''}
    <button class="ui-btn plain sm icon" data-act="csWhy" data-arg="${d.id}" aria-label="Why this needs you" title="Why this needs you"><span class="ico-i">ⓘ</span></button>
    <button class="ui-btn sm danger" data-act="withdrawAsk" data-arg="${d.id}">Withdraw</button>${privBtn('Review &amp; countersign', 'countersign', null, true)}</div></div>`;
}
function bandCard() {
  const live = TABLES.filter(isLive);
  if (S.empty || !live.length) return `<section class="ui-card band" id="bandcard"><div class="bhead"><h2>The band</h2></div>
    <div class="ui-empty">No live table, so there is no band to move.<div style="margin-top:var(--sp-3);display:flex;gap:var(--sp-2);justify-content:center"><button class="ui-btn primary" data-act="house">Play the house seller</button><button class="ui-btn" data-act="openTable">Open a table</button></div></div></section>`;
  const d = T(SEL), b = band(SEL), m = mkt(SEL), nf = failing(SEL);
  const ck = !b ? `<button class="ui-chip line" data-act="checks" data-arg="${SEL}">no band ›</button>`
    : nf ? `<button class="ui-chip red" data-act="checks" data-arg="${SEL}">clause 4 ✗${nf} ›</button>` : `<button class="ui-chip ok" data-act="checks" data-arg="${SEL}">clause 4 ✓ ›</button>`;
  return `<section class="ui-card band" id="bandcard" aria-label="The band">
    <div class="bhead"><h2 title="${esc(cpName(d))} · ${esc(d.ref)}">${d.id} · ${esc(cpShort(d))}</h2><span class="ref">${esc(d.ref)}</span>${stChip(d)}<button class="ui-chip line" data-act="note" data-arg="${d.id}">note ›</button>
      <span class="ui-spacer"></span>${S.paused && d.id === 'D-0193' ? '<span class="ui-chip coral" title="The relay is unreachable · retrying · signed envelopes make a retry safe · no money moves">paused</span>' : ''}${ck}
      <a class="ui-btn plain sm" href="${DEAL_HREF(d.id)}">Open deal ›</a></div>
    <div class="chartwrap">${chart(SEL)}${!b ? `<div class="nob"><b>No band for ${esc(d.ref)}</b><span class="ui-hint">every OFFER is refused until you sign one</span>
      <button class="ui-btn primary" data-act="drawBand" data-arg="${d.id}">Draw a band at the median ${m ? usd(m.median) : ''}</button></div>` : ''}</div>
    ${b ? dtrack(SEL) : ''}
    ${draftBar(SEL)}
  </section>`;
}
function render() {
  const live = TABLES.filter(isLive), closed = TABLES.filter((d) => !isLive(d));
  if (live.length && !live.some((d) => d.id === SEL)) SEL = live[0].id;
  CRUMB = live.length && !S.empty ? SEL : '';
  const nNeed = live.filter((d) => d.pending).length;
  const left = S.empty ? '<div class="ui-group"><div class="ui-empty">No tables yet.<div style="margin-top:var(--sp-3)"><button class="ui-btn primary" data-act="house">Play the house seller</button></div></div></div>'
    : `<div><div class="ui-section-h"><h2>Live</h2><span class="end">${live.length}</span></div>
        <div class="ui-group" role="listbox" aria-label="Live tables">${live.map(rowLive).join('') || '<div class="ui-empty">No live tables.</div>'}</div></div>
      <div><div class="ui-section-h"><h2>Closed</h2><span class="end">price vs market</span></div><div class="ui-group">${closed.map(rowClosed).join('')}</div></div>
      <div class="ui-group"><div class="ui-row act" tabindex="0" data-act="bands"><span class="main"><span class="t1">Clause 4 · bands in M-12 v${S.v}</span></span><span class="id">${esc(S.commit)}</span><span class="chev"></span></div></div>`;
  $('#view').innerHTML = `<div class="ui-pagehead"><h1>Tables</h1><span class="sub">${live.length} live${nNeed ? ` · ${nNeed} needs you` : ''} · the core signs only inside the band you signed</span>
      <div class="actions"><button class="ui-btn primary" data-act="openTable">Open a table</button><button class="ui-btn" data-act="join">Join with code</button><button class="ui-btn" data-act="house">House seller</button></div></div>
    ${S.empty ? '' : needRow()}<div class="v1grid"><div class="col">${left}</div><div class="col">${bandCard()}</div></div>`;
}

ACTS.drawBand = (id) => setDraft(id, {});
document.addEventListener('click', (e) => { const t = e.target.closest('[data-sel]'); if (t && !e.target.closest('[data-act]')) { SEL = t.dataset.sel; rerender(); } });
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('[data-drag]'); if (!h) return;
  const id = h.dataset.id, kind = h.dataset.drag;
  h.focus({ preventScroll: true });
  if (kind === 'ceil') startDrag(e, '#chart-' + id, 'y', (f) => { const dm = domain(id); const py = f * CH; setDraft(id, { ceiling: dm[1] - (py - CT) / (CH - CT - CB) * (dm[1] - dm[0]) }); });
  if (kind === 'rounds') startDrag(e, '#chart-' + id, 'x', (f) => { const s = (f * CW - CL) / (CW - CL - CR) * 2 * RMAX + 1; setDraft(id, { rounds: Math.min(RMAX, Math.round((s - 1) / 2)) }); });
  if (kind === 'dl') startDrag(e, '#dt-' + id, 'x', (f) => setDraft(id, { deadline: 840 + f * 600 }));
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (UI.open) return;
  if (t.matches && t.matches('[data-sel]')) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); SEL = t.dataset.sel; rerender(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const rows = $$('[data-sel]'); const i = rows.indexOf(t); const n = rows[clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, rows.length - 1)];
      if (n) { e.preventDefault(); focusTable(n.dataset.sel); } return;
    }
  }
  const k = t.dataset ? t.dataset.k : null; if (!k) return;
  const id = t.dataset.id, b = band(id), st = e.shiftKey ? 5 : 1; if (!b) return;
  const map = { ceil: { ArrowUp: ['ceiling', st], ArrowDown: ['ceiling', -st], PageUp: ['ceiling', 5], PageDown: ['ceiling', -5] },
    rounds: { ArrowRight: ['rounds', 1], ArrowLeft: ['rounds', -1], ArrowUp: ['rounds', 1], ArrowDown: ['rounds', -1] },
    dl: { ArrowRight: ['deadline', 15], ArrowLeft: ['deadline', -15], ArrowUp: ['deadline', 15], ArrowDown: ['deadline', -15] } }[k];
  const a = map && map[e.key]; if (!a) return;
  e.preventDefault();
  const v = b[a[0]] + a[1];
  if (k === 'rounds' && v > RMAX) return;
  setDraft(id, { [a[0]]: v });
});
TABLES.sort((a, b) => (b.pending ? 1 : 0) - (a.pending ? 1 : 0));
rerender();
</script>
<script src="../../../shared/shell.js" data-page="tables" data-variant="1"></script>
</body>
