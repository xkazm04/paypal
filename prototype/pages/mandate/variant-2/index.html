<body>
<div class="stage">
  <div class="behind" aria-hidden="true"><div class="r"></div><div class="m"><i></i><i></i><i></i></div></div>

<script>
/* ===================================================================================
   Shared mandate engine (identical in variants 1-3). Pure functions over window.FIX:
   the signed rows, the clause judge (a mirror of mandate::check, §8 step 2), the diff,
   the "what would have happened this week" replay, and the bytes the owner key signs.
   =================================================================================== */
const F = window.FIX;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const getp = (o, p) => p.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
const setp = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; };

/* Money is integer cents + USD. Owner input is parsed from the string, never via a float. */
const money = (c) => {
  if (c == null) return '—';
  const neg = c < 0; const a = Math.abs(c); const d = Math.floor(a / 100); const m = a % 100;
  return (neg ? '−' : '') + '$' + d.toLocaleString('en-US') + (m ? '.' + String(m).padStart(2, '0') : '');
};
const parseMoney = (s) => {
  const t = String(s).trim().replace(/^\$/, '').replace(/,/g, '');
  if (!/^\d{1,7}(\.\d{1,2})?$/.test(t)) return null;
  const [a, b = ''] = t.split('.');
  return Number(a) * 100 + Number((b + '00').slice(0, 2));
};
const inputMoney = (c) => (c % 100 ? (c / 100).toFixed(2) : String(c / 100));
const fixtureCents = (d) => Math.round(Number(d) * 100); // FIX carries display dollars; converted once here
const parseIntStrict = (s, lo, hi) => (/^\d{1,3}$/.test(String(s).trim()) && +s >= lo && +s <= hi ? +s : null);

/* Prototype stand-in for sha256 over the canonical body (the real commitment is sha256(JCS)). */
function phash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
const shortHash = (h) => h.slice(0, 4) + '…' + h.slice(-2);
const canon = (v) => (Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}'
  : JSON.stringify(v));

/* ---------- the signed rows (FIX.mandates as structured terms) ---------- */
const AGENT_KEY = F.mandates[0].agentKey;                       // 9f3c…a1
const agentName = (id) => (F.agents.find((a) => a.id === id) || { name: id }).name;
const NOW = 'Thu 29 Oct 14:02';
const NOW_ISO = '2026-10-29T14:02';
const CATS = ['office', 'parts', 'packing', 'compute', 'service', 'other'];
const ROLES = [['buy', 'Buy'], ['sell', 'Sell'], ['shop', 'Shop'], ['rescue', 'Rescue']];
const PAYEES_SEEN = ['packrite-supply', 'cablehaus', 'north-desk', 'HOUSE', 'dockparts.example'];
const CP_RULES = { house: 'HOUSE only', pinned: 'pinned keys only (Dan 47be…0d, HOUSE)', paired_or_house: 'paired (words confirmed) or HOUSE only' };
const CP_PLAIN = { house: 'the HOUSE seller only', pinned: 'only the keys I pinned: Dan (47be…0d) and the HOUSE', paired_or_house: 'wallets I paired by confirming four words, or the HOUSE seller' };
const CP_RANK = { house: 0, pinned: 1, paired_or_house: 2 };
const PINNED = ['dan', 'house'];

const M12_V3 = {
  roles: ['buy', 'sell', 'shop', 'rescue'], cp: 'paired_or_house',
  max: 20000, cats: ['office', 'parts', 'packing'],
  band: { item: 'monitor-27-4k', ceiling: fixtureCents(F.haggle.ceiling), rounds: F.haggle.rounds, deadline: F.haggle.deadline },
  velDeals: 12, velTotal: 90000, hpo: 25000,
  payees: ['packrite-supply', 'cablehaus', 'north-desk', 'HOUSE'],
};
const M12_V2 = clone(M12_V3); M12_V2.band.ceiling = 32000;        // FIX: prev v2 diff "ceiling 320 → 340"
const S2_V1 = { floors: Object.fromEntries(F.shop.filter((s) => s.floor != null).map((s) => [s.sku, fixtureCents(s.floor)])) };
const R3_V1 = { discount: { on: true, max: 25 }, pause: { on: true, max: 1 }, retry: { on: true }, downgrade: { on: false } };

/* Page constants FIX lacks (marked): S-2 / R-3 commitments and the expiry dates (30 days from signing). */
const MANDATES = {
  'M-12': { id: 'M-12', kind: 'open', label: 'Open mandate', what: 'buying, haggling and spending', agents: ['sourcing', 'supplies', 'infra'],
    expires: 'Wed 25 Nov 08:40', expiresISO: '2026-11-25T08:40',
    rows: [
      { v: 1, status: 'superseded', signed: 'before Mon 26 Oct', commitment: null, body: null },
      { v: 2, status: 'superseded', signed: 'before Mon 26 Oct', commitment: null, body: M12_V2 },
      { v: 3, status: 'active', signed: F.mandates[0].signed, commitment: F.mandates[0].commitment, body: M12_V3 },
    ] },
  'S-2': { id: 'S-2', kind: 'shop', label: 'Shop mandate', what: 'quoting at your counter', agents: ['quoting'],
    expires: 'Mon 16 Nov', expiresISO: '2026-11-16T09:00',
    rows: [{ v: 1, status: 'active', signed: F.mandates[1].signed, commitment: 'c4e8…17', body: S2_V1 }] },
  'R-3': { id: 'R-3', kind: 'rescue', label: 'Rescue mandate', what: 'rescuing failed renewals', agents: ['rescue'],
    expires: 'Mon 16 Nov', expiresISO: '2026-11-16T09:00',
    rows: [{ v: 1, status: 'active', signed: F.mandates[2].signed, commitment: 'b2a9…5f', body: R3_V1 }] },
};
const MIDS = ['M-12', 'S-2', 'R-3'];
const headRow = (mid) => MANDATES[mid].rows[MANDATES[mid].rows.length - 1];
const liveBody = (mid) => (headRow(mid).status === 'revoked' ? null : headRow(mid).body);
let AUDIT_SEQ = F.audit[0].seq;                                  // 4418
const nextAudit = () => ++AUDIT_SEQ;

/* ---------- this week's intents, replayed through a body ---------- */
const deal = (id) => F.deals.find((d) => d.id === id);
const WEEK = [
  { id: 'D-0181', at: 'Mon 09:47', kind: 'purchase', role: 'buy', cat: 'office', payee: 'packrite-supply' },
  { id: 'D-0180', at: 'Tue 08:30', kind: 'purchase', role: 'buy', cat: 'parts', payee: 'cablehaus', aside: 'you voided it as a duplicate' },
  { id: 'D-0192', at: 'Tue 10:14', kind: 'purchase', role: 'buy', cat: 'compute', payee: 'gpu-cloud.example', amt: 1196000, quoted: true },
  { id: 'D-0183', at: 'Tue 12:02', kind: 'purchase', role: 'buy', cat: 'parts', payee: 'cablehaus' },
  { id: 'D-0186', at: 'Wed 15:31', kind: 'purchase', role: 'buy', cat: 'packing', payee: 'packrite-supply' },
  { id: 'D-0190', at: 'Thu 09:02', kind: 'purchase', role: 'buy', cat: 'parts', payee: 'dockparts.example', held: true },
  { id: 'D-0201', at: 'Thu 13:58', kind: 'haggle', role: 'buy', cp: 'house', amt: null, live: true },
  { id: 'D-0193', at: 'Thu 14:00', kind: 'haggle', role: 'buy', cp: 'dan', round: 5, live: true },
  { id: 'Q-0207', at: 'Thu 14:02', kind: 'quote', role: 'shop', live: true },
  { id: 'D-0188', at: 'Thu 06:00', kind: 'rescue', role: 'rescue' },
].map((w) => { const d = deal(w.id); return Object.assign({ deal: d, item: d.item, agent: d.agent, day: w.at.slice(0, 3) }, w, { amt: w.amt !== undefined ? w.amt : fixtureCents(d.amount) }); });

const QUOTES = [
  { id: 'Q-0207', sku: 'monitor-arm', live: 'live quote · expires 14:12' },
  { id: 'D-0189', sku: 'monitor-arm-dual', live: 'order at PayPal · waiting for the buyer' },
  { id: 'D-0185', sku: 'wipe-kit' },
].map((q) => { const d = deal(q.id); return Object.assign({ deal: d, item: d.item, amt: fixtureCents(d.amount), cp: F.counterparties[d.cp].name, at: d.when }, q); });

const subscriber = (id) => F.subscribers.find((s) => s.id === id);
const RESCUES = [
  { id: 'D-0188', sub: 'S-14', lever: 'discount', pct: 20, what: '−20% this cycle → $9.60 invoice', replay: true, at: 'Thu 06:00' },
  { id: 'S-22', sub: 'S-22', lever: 'pause', cycles: 1, what: 'PAUSE 1 cycle (suggested, nothing sent)', at: 'retry in 18 h' },
].map((r) => Object.assign({ s: subscriber(r.sub), item: 'Care plan · ' + r.sub }, r));
const LEVERS = [
  { k: 'discount', code: 'DISCOUNT_THIS_CYCLE', plain: 'a discount on this cycle', unit: '%' },
  { k: 'pause', code: 'PAUSE', plain: 'a pause', unit: 'cycle' },
  { k: 'retry', code: 'RETRY_AFTER_FIX', plain: 'a retry after the subscriber fixes the payment method' },
  { k: 'downgrade', code: 'DOWNGRADE', plain: 'a downgrade to a cheaper plan' },
];

/* verdict: { s: REFUSED | ASK | POLICY | OPEN, n: clause, why, short } */
function judgeM12(b) {
  const out = {}; const days = {};
  for (const w of WEEK) out[w.id] = judgeOne(b, w, days);
  return { v: out, days };
}
function judgeOne(b, w, days) {
  const R = (n, why) => ({ s: 'REFUSED', n, why: `clause ${n}: ${why}`, short: 'refused' });
  if (!b) return { s: 'REFUSED', n: 0, why: 'no active mandate (revoked) · 0 PayPal calls', short: 'refused' };
  if (!b.roles.includes(w.role)) return R(1, `role ${w.role} is not in this mandate`);
  if (w.role === 'shop') return { s: 'OPEN', n: 1, why: 'may quote at the counter · floors live in S-2', short: 'may quote' };
  if (w.role === 'rescue') return { s: 'OPEN', n: 1, why: 'may suggest a lever · levers live in R-3', short: 'may suggest' };
  if (w.kind === 'haggle') {
    const cpn = F.counterparties[w.cp].name;
    if (b.cp === 'house' && w.cp !== 'house') return R(2, `${cpn} is not the HOUSE`);
    if (b.cp === 'pinned' && !PINNED.includes(w.cp)) return R(2, `${cpn} is not a pinned key`);
    if (w.amt == null) return { s: 'OPEN', n: 2, why: 'the HOUSE table may open (no price yet)', short: 'may open' };
    if (b.band.deadline < NOW.slice(-5)) return R(4, `deadline ${b.band.deadline} has passed`);
    if (w.round > b.band.rounds) return R(4, `round ${w.round} is past max_rounds ${b.band.rounds} → auto-WITHDRAW`);
    if (w.amt > b.band.ceiling) return R(4, `price ${money(w.amt)} above ceiling ${money(b.band.ceiling)}`);
  }
  if (w.kind === 'purchase') {
    const why = [];
    if (w.amt > b.max) why.push(`max_amount ${money(b.max)} per deal`);
    if (!b.cats.includes(w.cat)) why.push(`category ${w.cat} not allowed`);
    if (why.length) return R(3, why.join('; '));

  const b = el.querySelector('.ui-sheet-f .ui-btn.gold'); if (!b) return;
  const errs = Object.values(S.raw[S.mid]).filter((r) => r.err).length + problems(S.mid, S.drafts[S.mid]).e.length;
  b.classList.toggle('locked', S.locked);
  b.disabled = S.signing || (!S.locked && errs > 0);
  b.textContent = S.locked ? 'Unlock with Windows Hello' : S.signing ? 'Signing with your owner key…' : `Sign v${headRow(S.mid).v + 1} with owner key`;
}
function signClick(api) {
  if (S.signing) return false;
  if (S.locked) {
    hello('The Table wants to unlock privileged commands (sign a mandate).', () => {
      S.locked = false; S.idle = 0; gateBtn(api.el); render(); note('Unlocked · privileged commands available until 15 min idle.', 'ok');
      const b = api.el.querySelector('.ui-sheet-f .ui-btn.gold'); if (b) b.focus();
    });
    return false;
  }
  S.signing = true; gateBtn(api.el);
  setTimeout(() => { const row = signRow(S.mid, S.drafts[S.mid]); S.signing = false; api.close(); signed(row); }, 700);
  return false;
}
const signedToast = (row) => note(`Signed ${S.mid} v${row.v} with your owner key · commitment ${row.commitment} · audit #${row.audit}. Agents obey v${row.v} from their next intent.`, 'ok');
const revokedToast = (r) => note(`${S.mid} v${r.v} revoked at ${NOW.slice(-5)} · audit #${r.revokeAudit}. ${revokeNotes(S.mid)[0]}`, 'bad');
/** The signature facts (Layer 2 of every sign sheet). */
function sigFacts(v, b) {

  return `<dl class="ui-kv"><dt>Mandate</dt><dd>${S.mid} · version ${v} · kind ${m.kind}</dd>
    <dt>Agent key</dt><dd><span class="mono">${esc(AGENT_KEY)}</span> <span class="dim">· ${m.agents.map(agentName).join(', ')} · ${esc(engineOf(m.agents[0]))}</span></dd>
    <dt>Commitment</dt><dd><span class="mono dim">${esc(h.commitment)}</span> → <span class="new">${commitmentOf(S.mid, v, b)}</span> <span class="dim">· sha256 of the canonical body (prototype hash)</span></dd>
    <dt>Valid</dt><dd>from signing (${NOW}) to ${esc(m.expires)}</dd>
    <dt>Applies</dt><dd>to every next intent; held, issued and countersigned items stay as they are</dd></dl>
    <details class="ui-disclosure"><summary>Exactly what your key signs · ${canon(payload(S.mid, v, b)).length} bytes of canonical JSON</summary><pre class="payload" tabindex="0" aria-label="Canonical body">${esc(prettyPayload(S.mid, v, b))}</pre></details>`;
}
/** Plain-words consequences + live notes + warnings (Layer 2). */
function conseqHtml(base, draft) {

    ${pr.w.length || pr.e.length ? `<ul class="warns">${pr.e.map((w) => `<li class="err">${esc(w)}</li>`).join('')}${pr.w.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}`;

const identKv = () => { const m = MANDATES[S.mid], h = headRow(S.mid);
  return `<dl class="ui-kv"><dt>Mandate</dt><dd>${esc(m.label)} · ${esc(m.what)}</dd><dt>Agents</dt><dd>${m.agents.map(agentName).join(', ')} <span class="dim">· ${esc(engineOf(m.agents[0]))}</span></dd>

/* ===================== variant 2 · The contract =====================
   The mandate reads as what it is: a short contract in Maya's own words. Layer 1 is the prose,
   one sentence per clause, every term a button, an edit redlined in place (old struck, new in
   gold), a "this week" chip in the margin, and the signature line at the foot. Layer 2: a term
   opens a popover with its control and what this one change would have done; the margin chip
   opens the clause's deals and reasons; the signature opens a sheet with the consequences and
   the exact bytes. */
const S = { mid: 'M-12', read: null, edit: null, pop: null, locked: true, idle: 17, closed: false, signing: false, fresh: false, drafts: {}, raw: {}, resetScroll: false };
MIDS.forEach((m) => { S.drafts[m] = clone(headRow(m).body); S.raw[m] = {}; });
const D = () => S.drafts[S.mid];
const H = () => headRow(S.mid);
const field = (k) => FIELDS[S.mid].find((f) => f.k === k);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const ROLE_NOUN = { buy: 'buyer', sell: 'seller', shop: 'shopkeeper', rescue: 'rescuer' };
const listOr = (a) => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' or ' + a[a.length - 1]);
const MG = {};   // margin notes of the current render: id → { title, aside, ws, va, vb, lab }

/** The body this view shows, and the body it is redlined against. */
function shown() {
  const rows = MANDATES[S.mid].rows;
  if (S.read != null) { const r = rows.find((x) => x.v === S.read); const p = rows.find((x) => x.v === S.read - 1); return { body: r.body, against: p && p.body ? p.body : r.body, ro: true, row: r }; }
  return { body: D(), against: H().body, ro: false, row: null };
}
function liveOrBody(sh) { return !sh.ro && H().status === 'revoked' && same(sh.body, sh.against) ? null : sh.body; }
/* plain-language value of a term */
function plain(k, b) {
  const v = getp(b, k);
  switch (k) {
    case 'roles': return v.length ? list(v.map((r) => ROLE_NOUN[r])) : 'nothing at all';
    case 'cp': return CP_PLAIN[v];
    case 'cats': return v.length ? listOr(v) : 'no category';
    case 'payees': return v.length ? list(v.map((p) => (p === 'HOUSE' ? 'the HOUSE' : p))) : 'nobody';
    case 'band.rounds': return `${v} round${v === 1 ? '' : 's'}`;
    case 'band.deadline': return `${v} today`;
    case 'velDeals': return `${v} deal${v === 1 ? '' : 's'}`;
    case 'pause.max': return `${v} cycle${v === 1 ? '' : 's'}`;
    case 'discount.max': return `${v}%`;
    default:
      if (k.endsWith('.on')) return v ? 'may' : 'may not';
      return money(v);
  }
}
/** A term: struck old value (if edited) + the live value as a button that opens its editor. */
function term(k) {
  const sh = shown(); const now = plain(k, sh.body), was = plain(k, sh.against);
  const chg = !same(getp(sh.body, k), getp(sh.against, k));
  const f = field(k); const off = k.endsWith('.on') && !getp(sh.body, k);
  if (sh.ro) return chg ? `<del>${esc(was)}</del><ins>${esc(now)}</ins>` : `<span class="term ro">${esc(now)}</span>`;
  return `${chg ? `<del>${esc(was)}</del>` : ''}<button type="button" class="term ${chg ? 'chg' : ''} ${off ? 'off' : ''}" data-act="edit" data-k="${k}" data-f="term:${k}" aria-haspopup="dialog" aria-expanded="${S.edit === k}" aria-label="${esc(f.label)}: ${esc(now)}${chg ? ' (was ' + esc(was) + ')' : ''}. Press to edit.">${esc(now)}</button>`;
}

/* ---------- the margin: a chip on Layer 1, the deals in a popover ---------- */
function margin(id, title, ws, va, vb, aside) {
  const sh = shown(); const mv = ws.filter((w) => moved(va[w.id], vb[w.id])).length;
  const rev = !sh.ro && liveOrBody(sh) === null;
  MG[id] = { title, aside, ws, va, vb, lab: !mv ? 'this week' : sh.ro ? `changed by v${sh.row.v}` : rev ? 'since the revoke' : 'with your edit' };
  const label = mv ? `${mv} ${sh.ro ? 'changed' : rev ? 'refused now' : 'would change'}` : ws.length ? `${ws.length} this week` : 'none this week';
  return `<span class="mg"><button type="button" class="ui-chip btnchip ${mv ? 'gold' : ws.length ? 'line' : 'dashed'}" data-act="margin" data-v="${id}" data-f="mg:${id}" aria-haspopup="dialog">${label}</button></span>`;
}
function marginBody(id) {
  const m = MG[id]; if (!m) return '';
  return `${m.aside ? `<p class="ui-hint aside">${m.aside}</p>` : ''}${m.ws.length ? m.ws.map((w) => { const a = m.va[w.id], b = m.vb[w.id], c = moved(a, b);
    return `<div class="mrow ${c ? 'mv' : ''}"><div class="l1"><span class="id">${esc(w.sub || w.id)}</span><span class="dim">${esc(w.amt != null ? itemAmt(w) : (w.what || ''))}</span>${w.replay ? '<span class="badge replay">Replay</span>' : ''}<span class="ui-spacer"></span>${vchip(a)}${c ? '<span class="dim">→</span>' + vchip(b) : ''}</div>
      <div class="why">${esc(w.sub ? w.what : w.item)} · ${esc((c ? b : a).why)}</div></div>`; }).join('') : '<p class="ui-hint" style="margin:0">Nothing reached this clause this week.</p>'}`;
}
const M12_WS = (n, va, vb) => WEEK.filter((w) => va[w.id].n === n || vb[w.id].n === n || (n === 2 && w.kind === 'haggle') || (n === 4 && w.kind === 'haggle' && w.amt != null));

/* ---------- the three documents ---------- */
function docM12() {
  const sh = shown(); const b = sh.body; const mk = F.market['monitor-27-4k'];

    + cl(3, `A single purchase may be at most ${term('max')}, and only for ${term('cats')}.`)
    + cl(4, `At a table for <span class="mono">${esc(b.band.item)}</span> they may agree up to ${term('band.ceiling')}, over at most ${term('band.rounds')}, until ${term('band.deadline')}.`,
      `Market for ${esc(b.band.item)}: p25 $${mk.p25} · median $${mk.median} · p75 $${mk.p75} · ${esc(mk.src)}, ${mk.retrieved}`)

}
const MG_T = { 1: 'Roles', 2: 'Counterparties', 3: 'Per deal', 4: 'Band', 5: 'Velocity', 6: 'Ask me above', 7: 'Payees' };
function docS2() {

/* ---------- the signature line (Layer 1) ---------- */
const SCRAWL = '<svg class="scrawl" viewBox="0 0 170 50" aria-hidden="true"><path d="M6 38c10-20 18-30 22-26s-8 26-4 26 14-28 20-26-4 22 2 22 10-16 16-16 2 14 8 14 12-20 20-20-6 22 4 20c8-2 14-14 22-14s4 10 12 10 14-8 28-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function sigblock() {

  const r = sh.ro ? sh.row : h;
  const signedLine = `<div class="signed ${S.fresh && !sh.ro ? 'fresh' : ''}">${SCRAWL}<div class="who"><div>Maya · owner key</div><div class="ui-hint">v${r.v} · signed ${esc(r.signed)}${r.commitment ? ' · commitment <span class="mono">' + esc(r.commitment) + '</span>' : ''}${r.revokedAt ? ' · revoked ' + esc(r.revokedAt) : ''}</div></div>${statusChip(r)}</div>`;
  if (sh.ro) return `<div class="sigblock">${signedLine}<span class="ui-hint">A signed row never changes. <button type="button" class="ui-btn plain sm" data-act="draftfrom" data-v="${r.v}">Draft v${h.v + 1} from these words</button></span></div>`;

  return `<div class="sigblock" id="sig">${signedLine}
    <div class="sigline"><span class="x" aria-hidden="true">✕</span><span class="ln" aria-hidden="true"></span><span class="ui-hint">v${h.v + 1} · ${n ? n + ' edit' + (n > 1 ? 's' : '') + ' redlined above' : 'same words as v' + h.v} · not signed</span>

}

/* ---------- Layer 2 · the term editor (a popover) ---------- */

  } else if (f.type === 'time') {
    ctl = `<div class="trow"><input class="ui-field num" type="time" data-act="num" data-k="${k}" data-f="tin:${k}" value="${esc(v)}" aria-label="${esc(f.label)}"><span class="ui-hint">today, Thu 29 Oct</span></div>`;
  } else if (f.type === 'choice') {
    ctl = `<div class="opts" role="radiogroup" aria-label="${esc(f.label)}">${Object.keys(CP_PLAIN).map((o) => `<label class="pick"><input type="radio" class="ui-check" name="cp" data-act="choose" data-k="${k}" data-v="${o}" data-f="tin:${k}:${o}" ${v === o ? 'checked' : ''}><span style="white-space:normal">${esc(CP_PLAIN[o])}</span></label>`).join('')}</div>`;
  } else if (f.type === 'set') {

    ctl = `<div class="trow" role="group" aria-label="${esc(f.label)}">${all.map((x) => `<label class="pick"><input type="checkbox" class="ui-check" data-act="toggle" data-k="${k}" data-v="${esc(x)}" data-f="tin:${k}:${esc(x)}" ${v.includes(x) ? 'checked' : ''}>${esc(k === 'roles' ? ROLE_NOUN[x] : x)}</label>`).join('')}</div>`
      + (k === 'payees' ? `<div class="trow" style="margin-top:6px"><input class="ui-field mono" id="newPayee" data-f="newPayee" placeholder="add a payee id" aria-label="Payee id to add" style="width:170px"><button type="button" class="ui-btn sm" data-act="addpayee">Add</button></div>` : '');
  } else if (f.type === 'toggle') {
    ctl = `<div class="ui-seg" role="radiogroup" aria-label="${esc(f.label)}">${[[true, 'may suggest it'], [false, 'may not']].map(([o, l]) => `<button type="button" role="radio" aria-checked="${v === o}" aria-pressed="${v === o}" data-act="settoggle" data-k="${k}" data-v="${o}" data-f="tin:${k}:${o}">${l}</button>`).join('')}</div>`;
  }
  const one = clone(H().body); setp(one, k, clone(v));
  const eff = same(v, was) ? '<span class="dim">The signed value. Change it to see what it would have done this week.</span>' : changeSentences(S.mid, H().body, one).map((s) => s.html).join('<br>');
  return `<div class="ted"><div class="ui-hint" style="margin-bottom:6px">signed v${H().v}: <span class="mono">${esc(fmtVal(f, was))}</span></div>${ctl}
    <div class="eff" aria-live="polite">${eff}</div>
    <div class="tb"><button type="button" class="ui-btn primary sm" data-act="done" data-f="done">Done</button>${!same(v, was) ? `<button type="button" class="ui-btn sm" data-act="restore" data-k="${k}">Restore v${H().v}</button>` : ''}<span class="ui-spacer"></span><span class="ui-hint"><span class="kbd">Enter</span> done · <span class="kbd">Esc</span> undo</span></div></div>`;
}
let editSnapshot = null; // the value a term had when its popover opened (Esc restores it)
function paintTerm() { if (!S.edit || !S.pop) return; const host = S.pop.el.querySelector('#tpb'); if (host) host.innerHTML = termBody(S.edit); }
function openTerm(k, anchor) {
  if (S.pop) S.pop.close();
  S.edit = k; editSnapshot = clone(getp(D(), k));
  const api = UI.popover(anchor, '<div id="tpb"></div>', { title: field(k).label.replace(/^./, (c) => c.toUpperCase()) });
  S.pop = api; paintTerm(); render();
  onGone(api.el, () => { if (S.pop === api) finishTerm(false, true); });
  const i = api.el.querySelector('[data-f^="tin:"]') || api.el.querySelector('[data-act="done"]'); if (i) i.focus();
}
/** Close the editor: keep the edit (an unparsed entry falls back to the snapshot), or undo it. */
function finishTerm(undo, already) {
  const k = S.edit; if (!k) return;
  if (undo || (S.raw[S.mid][k] && S.raw[S.mid][k].err)) { setp(D(), k, clone(editSnapshot)); delete S.raw[S.mid][k]; }
  const api = S.pop; S.edit = null; S.pop = null;
  if (!already && api) api.close();
  render(); const t = $(`[data-f="term:${CSS.escape(k)}"]`); if (t) t.focus();
}
window.addEventListener('keydown', (e) => {   // before UI's Esc: Esc in the term editor undoes the edit
  if (!S.edit || $('.hello')) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); finishTerm(true); }
  else if (e.key === 'Enter' && e.target.closest && e.target.closest('.ui-popover') && e.target.tagName === 'INPUT' && e.target.id !== 'newPayee') { e.preventDefault(); e.stopImmediatePropagation(); finishTerm(false); }
}, true);

/* ---------- Layer 2 · sign sheet ---------- */
function openReview() {
  const h = H(), v = h.v + 1, b = D(), ch = diff(S.mid, h.body, b);
  const body = `<p class="ui-hint" style="margin:0 0 8px">Signing makes this text a new row. v${h.v} ${h.status === 'revoked' ? 'stays revoked' : 'becomes superseded'} and stays in the ledger; a signed version is never edited.</p>
    <div class="ui-section"><div class="ui-section-h"><h3>${ch.length ? `${ch.length} edit${ch.length > 1 ? 's' : ''}, in plain words` : `Same words as v${h.v}`}</h3><span class="end">gold widens · teal restricts · coral is live now</span></div>${conseqHtml(h.body, b)}</div>
    <div class="ui-section"><div class="ui-section-h"><h3>What your owner key signs</h3></div>${sigFacts(v, b)}</div>
    <p class="ui-silence" style="margin-top:12px">close → nothing is signed · v${h.v} stays <b>${h.status}</b> · no money moves</p>`;
  const api = sheet({ title: `Sign ${S.mid} v${v} on the line`, size: 'wide', body, actions: [
    { label: 'Keep editing', left: true },
    { label: 'Sign', kind: 'gold', keep: true, onClick: () => signClick(api) }] });
  gateBtn(api.el);
}
function signed(row) {
  S.drafts[S.mid] = clone(row.body); S.raw[S.mid] = {}; S.fresh = true;
  render(); const sg = $('#sig'); if (sg) sg.scrollIntoView({ block: 'nearest' });
  signedToast(row);
}

/* ---------- actions ---------- */
function setMid(id) { if (S.pop) finishTerm(false); S.mid = id; S.read = null; S.resetScroll = true; }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, k = t.dataset.k, v = t.dataset.v;
  switch (a) {
    case 'mid': setMid(v); break;
    case 'read': S.read = v === 'draft' ? null : +v; S.resetScroll = true; break;
    case 'edit': if (S.edit === k) { finishTerm(false); return; } openTerm(k, t); return;
    case 'done': finishTerm(false); return;
    case 'margin': { const m = MG[v]; UI.popover(t, marginBody(v), { title: `${m.title} · ${m.lab}` }); return; }
    case 'revnotes': UI.popover(t, revokeKv(), { title: `${S.mid} v${H().v} revoked` }); return;
    case 'restore': setp(D(), k, clone(getp(H().body, k))); delete S.raw[S.mid][k]; break;
    case 'step': { const f = field(k); let nv = getp(D(), k) + Number(v); if (f.type !== 'money') nv = Math.min(f.hi, Math.max(f.lo, nv)); if (nv < 0) nv = 0; setp(D(), k, nv); delete S.raw[S.mid][k]; break; }
    case 'toggle': { const arr = getp(D(), k); setp(D(), k, arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat([v])); break; }
    case 'choose': setp(D(), k, v); break;
    case 'settoggle': setp(D(), k, v === 'true'); break;
    case 'addpayee': { const i = $('#newPayee'); const p = i.value.trim(); if (!/^[a-z0-9][a-z0-9.-]{1,40}$/i.test(p)) { note('A payee id is letters, digits, dots and dashes.', 'bad'); return; } if (!D().payees.includes(p)) D().payees.push(p); i.value = ''; break; }
    case 'draftfrom': { const r = MANDATES[S.mid].rows.find((x) => x.v === +v); S.drafts[S.mid] = clone(r.body); S.raw[S.mid] = {}; S.read = null; S.resetScroll = true; note(`Draft v${H().v + 1} starts from v${v}’s words. Nothing is signed yet.`); break; }
    case 'discard': S.drafts[S.mid] = clone(H().body); S.raw[S.mid] = {}; note(`Edits discarded · ${S.mid} v${H().v} unchanged.`); break;
    case 'tosig': { const sg = $('#sig'); if (sg) sg.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'end' }); const b = $('[data-f="review"]'); if (b) b.focus({ preventScroll: true }); return; }
    case 'review': openReview(); return;
    case 'unlock': hello('The Table wants to unlock privileged commands (sign a mandate).', () => { S.locked = false; S.idle = 0; rerender(); note('Unlocked · privileged commands available until 15 min idle.', 'ok'); }); return;
    case 'revoke': { const r = revokeRow(S.mid); S.read = null; render(); revokedToast(r); return; }
    case 'close': if (S.pop) finishTerm(false); S.closed = true; render(); note('Approval window closed · nothing signed · no money moves.'); $('[data-act="reopen"]').focus(); return;
    case 'reopen': S.closed = false; render(); return;
    case 'idle': S.locked = true; S.idle = 15; S.signing = false; note('Idle 15 min: privileged commands locked. Reading and redlining still work.', 'gold'); break;
    default: return;
  }
  rerender();
});
document.addEventListener('input', (e) => {
  const t = e.target.closest('[data-act="num"]'); if (!t) return;
  const k = t.dataset.k, f = field(k); let val = null, err = null;
  if (f.type === 'money') { val = parseMoney(t.value); if (val == null) err = `“${t.value}” is not an amount in USD`; }
  else if (f.type === 'time') { val = /^\d\d:\d\d$/.test(t.value) ? t.value : null; if (val == null) err = 'choose a time'; }
  else { val = parseIntStrict(t.value, f.lo, f.hi); if (val == null) err = `a whole number ${f.lo}–${f.hi}`; }
  S.raw[S.mid][k] = err ? { text: t.value, err } : { text: t.value };
  if (!err) setp(D(), k, val);
  rerender();
});
document.addEventListener('keydown', (e) => {
  if (S.closed || $('.hello')) return;
  if (e.key === 'Enter' && e.target.id === 'newPayee') { e.preventDefault(); $('[data-act="addpayee"]').click(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && UI.open) { const g = $('.ui-sheet-f .ui-btn.gold'); if (g) { e.preventDefault(); if (!g.disabled) g.click(); } return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $('[data-act="review"]'); if (b && !b.disabled) b.click(); return; }
  tabKeys(e, setMid);
});
render();
</script>
<script src="../../../shared/shell.js" data-page="mandate" data-variant="2"></script>
