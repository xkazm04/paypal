<style>
/* ---- approval-window frame on the v2 baseline (identical in variants 1-3) ---- */

/* simulated Windows Hello (an OS dialog, not a sheet) */
.hello { position: fixed; inset: 0; z-index: 9200; display: grid; place-items: center; background: var(--scrim); animation: ui-fade var(--t-fast) var(--ease); }
.hbox { width: min(340px, calc(100vw - 32px)); background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-3); padding: var(--sp-3) var(--sp-4) var(--sp-4); text-align: center; }

.sc.moved { background: color-mix(in srgb, var(--gold) 9%, var(--panel)); }

.rp .ui-chip.live { margin-right: var(--sp-1); }
.ui-silence.end { display: block; margin-top: var(--sp-2); }

.lgd { display: flex; flex-wrap: wrap; gap: 2px var(--sp-3); margin: 0 0 var(--sp-2); }
.lgd i { display: inline-block; width: 3px; height: 10px; border-radius: 1px; margin-right: 4px; vertical-align: -1px; }
.lever { padding: var(--sp-2) 0 var(--sp-1); border-top: 1px solid var(--line); }
.lever.chg { box-shadow: inset 2px 0 0 var(--gold); padding-left: var(--sp-2); margin-left: calc(-1 * var(--sp-2)); }
.lh { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; height: var(--ctl); }
.lh .cn { font: var(--fw-semibold) var(--fs-small) var(--mono); color: var(--dim); width: 12px; flex: none; }

.track input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line2); box-shadow: var(--shadow-1), 0 0 0 2px var(--gold); }
.track input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line2); box-shadow: 0 0 0 2px var(--gold); }
.track input[type="range"]:focus-visible { outline: none; }

.ticks { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

.tk.REFUSED { background: var(--refuse); } .tk.ASK { background: var(--gold); } .tk.POLICY { background: var(--teal-l); } .tk.OPEN { background: var(--muted); }
.tk.ask { background: var(--coral); height: 10px; } .tk.bid { background: var(--teal); height: 10px; }
.tk.out { opacity: .35; } .tk.now { height: 18px; width: 4px; }
.tk.mkt { background: var(--market); height: 7px; width: 2px; }
.tk.over { background: var(--refuse); } .tk.under { background: var(--teal-l); }
.tk.sel { height: 22px; box-shadow: 0 0 0 2px var(--bg2), 0 0 0 3px var(--gold-l); }

.scale { display: flex; justify-content: space-between; gap: var(--sp-2); font: var(--fs-small) var(--mono); color: var(--dim); }

.ww .ui-row .val { flex: 1; min-width: 0; font: var(--fs-mono) var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }

.levers .ui-section-h { padding: 0; }
.picks { display: grid; gap: 4px; }

@media (max-width: 1100px) { .wbody.split { grid-template-columns: minmax(0, 1fr) 320px; } .rp .ag { display: none; } }
</style>

<body>
<div class="stage">
  <div class="behind" aria-hidden="true"><div class="r"></div><div class="m"><i></i><i></i><i></i></div></div>
  <div class="backdrop" aria-hidden="true"></div>

<script>
/* ===================================================================================
   Shared mandate engine (identical in variants 1-3). Pure functions over window.FIX:
   the signed rows, the clause judge (a mirror of mandate::check, §8 step 2), the diff,
   the "what would have happened this week" replay, and the bytes the owner key signs.
   =================================================================================== */
const F = window.FIX;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const getp = (o, p) => p.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
const setp = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; };

/* Money is integer cents + USD. Owner input is parsed from the string, never via a float. */
const money = (c) => {
  if (c == null) return '—';
  const neg = c < 0; const a = Math.abs(c); const d = Math.floor(a / 100); const m = a % 100;
  return (neg ? '−' : '') + '$' + d.toLocaleString('en-US') + (m ? '.' + String(m).padStart(2, '0') : '');
};
const parseMoney = (s) => {
  const t = String(s).trim().replace(/^\$/, '').replace(/,/g, '');
  if (!/^\d{1,7}(\.\d{1,2})?$/.test(t)) return null;
  const [a, b = ''] = t.split('.');
  return Number(a) * 100 + Number((b + '00').slice(0, 2));
};
const inputMoney = (c) => (c % 100 ? (c / 100).toFixed(2) : String(c / 100));
const fixtureCents = (d) => Math.round(Number(d) * 100); // FIX carries display dollars; converted once here
const parseIntStrict = (s, lo, hi) => (/^\d{1,3}$/.test(String(s).trim()) && +s >= lo && +s <= hi ? +s : null);

/* Prototype stand-in for sha256 over the canonical body (the real commitment is sha256(JCS)). */
function phash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
const shortHash = (h) => h.slice(0, 4) + '…' + h.slice(-2);
const canon = (v) => (Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}'
  : JSON.stringify(v));

/* ---------- the signed rows (FIX.mandates as structured terms) ---------- */
const AGENT_KEY = F.mandates[0].agentKey;                       // 9f3c…a1
const agentName = (id) => (F.agents.find((a) => a.id === id) || { name: id }).name;
const NOW = 'Thu 29 Oct 14:02';
const NOW_ISO = '2026-10-29T14:02';
const CATS = ['office', 'parts', 'packing', 'compute', 'service', 'other'];
const ROLES = [['buy', 'Buy'], ['sell', 'Sell'], ['shop', 'Shop'], ['rescue', 'Rescue']];
const PAYEES_SEEN = ['packrite-supply', 'cablehaus', 'north-desk', 'HOUSE', 'dockparts.example'];
const CP_RULES = { house: 'HOUSE only', pinned: 'pinned keys only (Dan 47be…0d, HOUSE)', paired_or_house: 'paired (words confirmed) or HOUSE only' };
const CP_PLAIN = { house: 'the HOUSE seller only', pinned: 'only the keys I pinned: Dan (47be…0d) and the HOUSE', paired_or_house: 'wallets I paired by confirming four words, or the HOUSE seller' };
const CP_RANK = { house: 0, pinned: 1, paired_or_house: 2 };
const PINNED = ['dan', 'house'];

const M12_V3 = {
  roles: ['buy', 'sell', 'shop', 'rescue'], cp: 'paired_or_house',
  max: 20000, cats: ['office', 'parts', 'packing'],
  band: { item: 'monitor-27-4k', ceiling: fixtureCents(F.haggle.ceiling), rounds: F.haggle.rounds, deadline: F.haggle.deadline },
  velDeals: 12, velTotal: 90000, hpo: 25000,
  payees: ['packrite-supply', 'cablehaus', 'north-desk', 'HOUSE'],
};
const M12_V2 = clone(M12_V3); M12_V2.band.ceiling = 32000;        // FIX: prev v2 diff "ceiling 320 → 340"
const S2_V1 = { floors: Object.fromEntries(F.shop.filter((s) => s.floor != null).map((s) => [s.sku, fixtureCents(s.floor)])) };
const R3_V1 = { discount: { on: true, max: 25 }, pause: { on: true, max: 1 }, retry: { on: true }, downgrade: { on: false } };

/* Page constants FIX lacks (marked): S-2 / R-3 commitments and the expiry dates (30 days from signing). */
const MANDATES = {
  'M-12': { id: 'M-12', kind: 'open', label: 'Open mandate', what: 'buying, haggling and spending', agents: ['sourcing', 'supplies', 'infra'],
    expires: 'Wed 25 Nov 08:40', expiresISO: '2026-11-25T08:40',
    rows: [
      { v: 1, status: 'superseded', signed: 'before Mon 26 Oct', commitment: null, body: null },
      { v: 2, status: 'superseded', signed: 'before Mon 26 Oct', commitment: null, body: M12_V2 },
      { v: 3, status: 'active', signed: F.mandates[0].signed, commitment: F.mandates[0].commitment, body: M12_V3 },
    ] },
  'S-2': { id: 'S-2', kind: 'shop', label: 'Shop mandate', what: 'quoting at your counter', agents: ['quoting'],
    expires: 'Mon 16 Nov', expiresISO: '2026-11-16T09:00',
    rows: [{ v: 1, status: 'active', signed: F.mandates[1].signed, commitment: 'c4e8…17', body: S2_V1 }] },
  'R-3': { id: 'R-3', kind: 'rescue', label: 'Rescue mandate', what: 'rescuing failed renewals', agents: ['rescue'],
    expires: 'Mon 16 Nov', expiresISO: '2026-11-16T09:00',
    rows: [{ v: 1, status: 'active', signed: F.mandates[2].signed, commitment: 'b2a9…5f', body: R3_V1 }] },
};
const MIDS = ['M-12', 'S-2', 'R-3'];
const headRow = (mid) => MANDATES[mid].rows[MANDATES[mid].rows.length - 1];
const liveBody = (mid) => (headRow(mid).status === 'revoked' ? null : headRow(mid).body);
let AUDIT_SEQ = F.audit[0].seq;                                  // 4418
const nextAudit = () => ++AUDIT_SEQ;

/* ---------- this week's intents, replayed through a body ---------- */
const deal = (id) => F.deals.find((d) => d.id === id);
const WEEK = [
  { id: 'D-0181', at: 'Mon 09:47', kind: 'purchase', role: 'buy', cat: 'office', payee: 'packrite-supply' },
  { id: 'D-0180', at: 'Tue 08:30', kind: 'purchase', role: 'buy', cat: 'parts', payee: 'cablehaus', aside: 'you voided it as a duplicate' },
  { id: 'D-0192', at: 'Tue 10:14', kind: 'purchase', role: 'buy', cat: 'compute', payee: 'gpu-cloud.example', amt: 1196000, quoted: true },
  { id: 'D-0183', at: 'Tue 12:02', kind: 'purchase', role: 'buy', cat: 'parts', payee: 'cablehaus' },
  { id: 'D-0186', at: 'Wed 15:31', kind: 'purchase', role: 'buy', cat: 'packing', payee: 'packrite-supply' },
  { id: 'D-0190', at: 'Thu 09:02', kind: 'purchase', role: 'buy', cat: 'parts', payee: 'dockparts.example', held: true },
  { id: 'D-0201', at: 'Thu 13:58', kind: 'haggle', role: 'buy', cp: 'house', amt: null, live: true },
  { id: 'D-0193', at: 'Thu 14:00', kind: 'haggle', role: 'buy', cp: 'dan', round: 5, live: true },
  { id: 'Q-0207', at: 'Thu 14:02', kind: 'quote', role: 'shop', live: true },
  { id: 'D-0188', at: 'Thu 06:00', kind: 'rescue', role: 'rescue' },
].map((w) => { const d = deal(w.id); return Object.assign({ deal: d, item: d.item, agent: d.agent, day: w.at.slice(0, 3) }, w, { amt: w.amt !== undefined ? w.amt : fixtureCents(d.amount) }); });

const QUOTES = [
  { id: 'Q-0207', sku: 'monitor-arm', live: 'live quote · expires 14:12' },
  { id: 'D-0189', sku: 'monitor-arm-dual', live: 'order at PayPal · waiting for the buyer' },
  { id: 'D-0185', sku: 'wipe-kit' },
].map((q) => { const d = deal(q.id); return Object.assign({ deal: d, item: d.item, amt: fixtureCents(d.amount), cp: F.counterparties[d.cp].name, at: d.when }, q); });

const subscriber = (id) => F.subscribers.find((s) => s.id === id);
const RESCUES = [

function wwRows() {
  const rows = WW[S.mid]; if (!rows.length) return '';
  return `<div class="ui-section"><div class="ui-section-h"><h3>${S.mid === 'R-3' ? 'Other levers' : 'Who and what'}</h3><span class="end">opens a popover</span></div><div class="ui-group ww">${rows.map(([k, l]) => {
    const f = field(k), chg = JSON.stringify(getp(D(), k)) !== JSON.stringify(getp(H().body, k));
    return `<div class="ui-row act ${chg ? 'chg' : ''}" role="button" tabindex="0" data-act="ww" data-k="${k}" data-f="ww:${k}" aria-haspopup="dialog"><span class="cn dim mono">${f.n}</span><span class="lbl">${esc(l)}</span><span class="val" title="${esc(wwVal(k, D()))}">${esc(wwVal(k, D()))}</span><span class="chev"></span></div>`; }).join('')}</div></div>`;
}
function wwBody(k) {
  const f = field(k), v = getp(D(), k), was = getp(H().body, k);
  let ctl;
  if (f.type === 'choice') ctl = `<div class="picks" role="radiogroup">${Object.keys(CP_RULES).reverse().map((o) => `<label class="pick"><input type="radio" class="ui-check" name="cp" data-act="choose" data-k="${k}" data-v="${o}" data-f="wp:${k}:${o}" ${v === o ? 'checked' : ''}>${esc(CP_RULES[o])}</label>`).join('')}</div>`;
  else if (f.type === 'toggle') ctl = `<span class="ui-seg" role="radiogroup">${[[true, 'On'], [false, 'Off']].map(([o, l]) => `<button type="button" role="radio" aria-checked="${v === o}" aria-pressed="${v === o}" data-act="setflag" data-k="${k}" data-v="${o}" data-f="wp:${k}:${o}">${l}</button>`).join('')}</span><p class="ui-hint" style="margin:8px 0 0">${esc(WW_NOTE[k])}</p>`;
  else { const names = k === 'roles' ? Object.fromEntries(ROLES) : null; ctl = `<div class="picks" role="group">${f.all.concat(v.filter((x) => !f.all.includes(x))).map((x) => `<label class="pick"><input type="checkbox" class="ui-check" data-act="toggle" data-k="${k}" data-v="${esc(x)}" data-f="wp:${k}:${esc(x)}" ${v.includes(x) ? 'checked' : ''}>${esc(names ? names[x] : x)}</label>`).join('')}</div>`; }
  return `<p class="ui-hint" style="margin:0 0 8px">signed v${H().v}: <span class="mono">${esc(fmtVal(f, was))}</span></p>${ctl}`;
}
function paintWW() { if (!S.ww) return; const host = S.ww.api.el.querySelector('#wwb'); if (host) host.innerHTML = wwBody(S.ww.k); }
function leversHtml() {
  const mid = S.mid;
  const head = `<div class="ui-section-h"><h3>${mid === 'S-2' ? 'Floors' : mid === 'R-3' ? 'Levers' : 'Amounts'}</h3><span class="end">drag · arrow keys · type</span></div>
    <div class="lgd ui-hint">${LEGEND[mid].map(([c, l]) => `<span><i style="background:var(${c})"></i>${esc(l)}</span>`).join('')}<span>▾ signed</span></div>`;
  return head + leverSpecs(mid).map(leverHtml).join('') + wwRows()
    + (mid === 'S-2' ? '<p class="ui-hint">The care plan has no floor; it is rescued under R-3. Buyers approve every order on PayPal.</p>' : '')
    + (mid === 'R-3' ? '<p class="ui-hint">The agent fills a fixed template and writes no free text; you approve each lever and press send yourself.</p>' : '');
}

/* ---------- frame ---------- */
function footInfo() {
  const ch = diff(S.mid, H().body, D()); const errs = Object.values(S.raw[S.mid]).filter((r) => r.err).length;
  if (errs) return `<span class="red">Fix ${errs} amount${errs > 1 ? 's' : ''} before signing.</span>`;
  if (!ch.length) return H().status === 'revoked' ? 'Revoked · re-sign to restore' : `No changes · agents obey ${S.mid} v${H().v}`;
  return `<b>${ch.length} change${ch.length > 1 ? 's' : ''}</b> · unsigned · close → v${H().v} stays ${H().status} · no money moves`;
}
function render() {
  const root = $('#root');
  if (S.closed) { root.innerHTML = closedHtml(); return; }
  const lp = $('#lp'), rp = $('#rp'); const tops = lp && !S.resetScroll ? [lp.scrollTop, rp.scrollTop] : [0, 0]; S.resetScroll = false;
  const h = H(), m = MANDATES[S.mid]; const ch = diff(S.mid, h.body, D());
  const p = replayParts();
  root.innerHTML = `<section class="win" role="dialog" aria-modal="false" aria-labelledby="wTitle">
    ${titlebar(`${S.mid} ${ch.length ? 'what-if v' + (h.v + 1) : 'v' + h.v}`)}
    <div class="ui-toolbar">${segTabs()}<span class="ui-spacer"></span><span class="ui-hint meta">key <span class="mono">${esc(AGENT_KEY)}</span> · ${esc(h.commitment)} · signed ${esc(h.signed)} · expires ${esc(m.expires)}</span>
      <button type="button" class="ui-btn plain sm" data-act="ident" aria-label="Mandate details" aria-haspopup="dialog">ⓘ</button></div>
    <div class="wbody split">
      <div class="pane replay" id="lp">
        <div class="q"><h2>What would my agents have done this week?</h2><span class="ui-hint">${esc(m.what)} · ${m.agents.map(agentName).join(', ')}</span></div>
        ${h.status === 'revoked' ? `<div class="notice error" role="status" style="margin-bottom:8px;align-items:center"><span class="n-code">Revoked</span><span>v${h.v} at ${esc(h.revokedAt.slice(-5))} · audit #${h.revokeAudit}</span><button type="button" class="ui-btn plain sm" data-act="revnotes" style="margin-left:auto" aria-haspopup="dialog">What this means ›</button></div>` : ''}
        <div class="scorebar" id="score">${p.score}<div id="talk">${p.talk}</div></div>
        <div id="replay">${p.table}</div>
        <span class="ui-silence end">close → nothing is signed · ${S.mid} v${h.v} stays <b>${h.status}</b> · no money moves</span>
      </div>
      <aside class="pane levers" id="rp" aria-label="Levers">${leversHtml()}</aside>
    </div>
    <footer class="wfoot">${h.status === 'active' ? `<button type="button" class="ui-btn danger" data-act="revoke" id="revokeBtn" title="Hover to preview · one click revokes now, works through the lock">Revoke v${h.v}</button>` : ''}
      <span class="status" id="footInfo" aria-live="polite">${footInfo()}</span><span class="ui-spacer"></span>
      ${ch.length ? '<button type="button" class="ui-btn" data-act="reset">Reset levers</button>' : ''}
      <button type="button" class="ui-btn gold" data-act="sheet" data-f="opensheet" ${ch.length || h.status === 'revoked' ? '' : 'disabled'} title="Ctrl + Enter">Review &amp; sign v${h.v + 1}…</button></footer>
  </section>${protoDock()}`;
  $('#lp').scrollTop = tops[0]; $('#rp').scrollTop = tops[1];
}
const rerender = () => keepFocus(() => { render(); paintWW(); });
/** Light update while a slider is being dragged: never replaces the slider itself. */
function paint() {
  const rp = $('#replay'); if (!rp) return;
  const p = replayParts(); rp.innerHTML = p.table; $('#score').innerHTML = p.score + `<div id="talk">${p.talk}</div>`;
  for (const sp of leverSpecs(S.mid)) {
    const el = $(`[data-lever="${CSS.escape(sp.k)}"]`); if (!el) continue;
    $('[data-ticks]', el).innerHTML = ticksHtml(sp);
    const d = diff(S.mid, H().body, D()).find((c) => c.k === sp.k);
    el.classList.toggle('chg', !!d);
    $('.dirslot', el).innerHTML = d ? dirChip(d.dir) : '';
    const v = getp(D(), sp.k); const ro = $('[data-act="num"]', el), rg = $('[data-act="range"]', el);
    if (ro && document.activeElement !== ro && !S.raw[S.mid][sp.k]) ro.value = fmtRO(sp, v);
    if (rg && document.activeElement !== rg) rg.value = toRange(sp, v);
    if (rg) rg.setAttribute('aria-valuetext', fmtVal(field(sp.k), v));
  }
  const fi = $('#footInfo'); if (fi) fi.innerHTML = footInfo();
  const sb = $('[data-act="sheet"]'); if (sb) sb.disabled = !(diff(S.mid, H().body, D()).length || H().status === 'revoked');
}

/* ---------- Layer 2 ---------- */
function rowWhy(id, anchor) {
  const w = items(S.mid).find((x) => x.id === id || x.sub === id) || items(S.mid).find((x) => x.id === id);
  const h = H(), a = judge(S.mid, baseBody()).v[w.id], b = judge(S.mid, draftBody()).v[w.id], c = moved(a, b);
  const body = `<dl class="ui-kv"><dt>${S.preview ? 'Now' : 'v' + h.v}</dt><dd>${vchip(a, LABELS[S.mid][a.s])} ${esc(a.why)}</dd>
    <dt>${S.preview ? 'If revoked' : diff(S.mid, h.body, D()).length ? 'Draft' : 'v' + (h.v + 1)}</dt><dd>${vchip(b, LABELS[S.mid][b.s])} ${c ? `<span class="gold">${esc(b.why)}</span>` : '<span class="dim">same</span>'}</dd>
    <dt>When</dt><dd>${esc(w.at || '—')}${w.agent ? ' · ' + esc(agentName(w.agent)) : ''}${w.aside ? ' · ' + esc(w.aside) : ''}</dd>
    ${w.held ? '<dt>Money</dt><dd>held, not captured · stays yours to capture or void in the approval window · auto-voids at 72 h</dd>' : ''}
    ${w.live && !w.held ? '<dt>Live</dt><dd>open right now; a new version governs its next step only</dd>' : ''}</dl>`;
  UI.popover(anchor, body, { title: `${w.sub || w.id} · ${w.sub ? w.what : w.item}` });
}
function openWW(k, anchor) {
  const api = UI.popover(anchor, '<div id="wwb"></div>', { title: WW[S.mid].find((x) => x[0] === k)[1] });
  S.ww = { k, api }; paintWW();
  onGone(api.el, () => { if (S.ww && S.ww.api === api) S.ww = null; });
  const i = api.el.querySelector('input, button'); if (i) i.focus();
}
function openSheet() {
  const h = H(), v = h.v + 1, b = D(), ch = diff(S.mid, h.body, b);
  const body = `${ch.length ? `<div class="ui-group"><table class="ui-table"><thead><tr><th>Term</th><th>v${h.v} signed</th><th>v${v}</th><th>Effect</th></tr></thead><tbody>${ch.map((c) => `<tr><td>${esc(c.f.label)}</td><td class="mono dim"><s>${esc(c.from)}</s></td><td class="mono"><b>${esc(c.to)}</b></td><td>${dirChip(c.dir)}</td></tr>`).join('')}</tbody></table></div>`
    : `<p style="margin:0">v${h.v}’s terms, re-signed as v${v}.</p>`}
    <div class="ui-section"><div class="ui-section-h"><h3>What the replay shows, in plain words</h3></div>${conseqHtml(h.body, b)}</div>
    <div class="ui-section"><div class="ui-section-h"><h3>What your owner key signs</h3></div>${sigFacts(v, b)}</div>
    <p class="ui-silence" style="margin-top:12px">close → nothing is signed · v${h.v} ${h.status === 'revoked' ? 'stays revoked' : 'stays active'} · no money moves · v${h.v} becomes superseded only when you sign</p>`;
  const api = sheet({ title: `Sign ${S.mid} v${v} · ${ch.length ? ch.length + ' change' + (ch.length > 1 ? 's' : '') : 're-sign'}`, size: 'wide', body, actions: [
    { label: 'Keep editing', left: true },
    { label: 'Sign', kind: 'gold', keep: true, onClick: () => signClick(api) }] });
  gateBtn(api.el);
}
function signed(row) {
  S.drafts[S.mid] = clone(row.body); S.raw[S.mid] = {}; S.resetScroll = true;
  render(); signedToast(row);
  const tb = $(`[data-f="tab:${S.mid}"]`); if (tb) tb.focus();
}

/* ---------- actions ---------- */
function setMid(id) { S.mid = id; S.sel = null; S.preview = false; S.resetScroll = true; }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, k = t.dataset.k, v = t.dataset.v;
  switch (a) {
    case 'mid': setMid(v); break;
    case 'sel': { S.sel = v; paint(); const r = $(`[data-f="row:${CSS.escape(v)}"]`); if (r) { r.setAttribute('aria-selected', 'true'); rowWhy(v, r); } return; }
    case 'why': UI.popover(t, `<ul class="conseq">${changeSentences(S.mid, H().body, D()).map((s) => `<li class="${s.c.dir}">${s.html}</li>`).join('')}${liveNotes(S.mid, H().body, D()).map((l) => `<li class="live">${l}</li>`).join('')}</ul>`, { title: 'What the changes did this week' }); return;
    case 'ident': UI.popover(t, identKv(), { title: `${S.mid} v${H().v} · ${H().status}` }); return;
    case 'revnotes': UI.popover(t, revokeKv(), { title: `${S.mid} v${H().v} revoked` }); return;
    case 'ww': openWW(k, t); return;
    case 'toggle': { const arr = getp(D(), k); setp(D(), k, arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat([v])); break; }
    case 'choose': setp(D(), k, v); break;
    case 'setflag': setp(D(), k, v === 'true'); break;
    case 'inc': { const f = field(k); setp(D(), k, Math.min(f.hi, Math.max(f.lo, getp(D(), k) + Number(v)))); break; }
    case 'reset': S.drafts[S.mid] = clone(H().body); S.raw[S.mid] = {}; note(`Levers back to ${S.mid} v${H().v} · nothing signed.`); break;
    case 'sheet': S.preview = false; openSheet(); return;
    case 'unlock': hello('The Table wants to unlock privileged commands (sign a mandate).', () => { S.locked = false; S.idle = 0; rerender(); note('Unlocked · privileged commands available until 15 min idle.', 'ok'); }); return;
    case 'revoke': { S.preview = false; const r = revokeRow(S.mid); S.resetScroll = true; render(); revokedToast(r); const tb = $(`[data-f="tab:${S.mid}"]`); if (tb) tb.focus(); return; }
    case 'close': S.closed = true; render(); note('Approval window closed · nothing signed · no money moves.'); $('[data-act="reopen"]').focus(); return;
    case 'reopen': S.closed = false; render(); return;
    case 'idle': S.locked = true; S.idle = 15; S.signing = false; note('Idle 15 min: privileged commands locked. The replay and the levers still work.', 'gold'); break;
    default: return;
  }
  rerender();
});
document.addEventListener('input', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const k = t.dataset.k;
  if (t.dataset.act === 'range') { const sp = specOf(k); setp(D(), k, fromRange(sp, t.value)); delete S.raw[S.mid][k]; paint(); return; }
  if (t.dataset.act !== 'num') return;
  const f = field(k); let val = null, err = null;
  if (f.type === 'money') { val = parseMoney(t.value); if (val == null) err = `“${t.value}” is not an amount in USD`; }
  else if (f.type === 'time') { val = /^\d\d:\d\d$/.test(t.value) ? t.value : null; if (val == null) err = 'choose a time'; }
  else { val = parseIntStrict(t.value, f.lo, f.hi); if (val == null) err = `a whole number ${f.lo}–${f.hi}`; }
  if (err) S.raw[S.mid][k] = { text: t.value, err }; else { delete S.raw[S.mid][k]; setp(D(), k, val); }
  t.classList.toggle('bad', !!err);
  const lv = t.closest('.lever'); if (lv) { let n = $('[role="alert"]', lv); if (err && !n) { n = document.createElement('div'); n.className = 'ui-hint red'; n.setAttribute('role', 'alert'); lv.appendChild(n); } if (n) { if (err) n.textContent = err; else n.remove(); } }
  paint();
});
const preview = (on) => { if (S.preview === on) return; S.preview = on; paint(); };
document.addEventListener('mouseover', (e) => { if (e.target.closest('#revokeBtn')) preview(true); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('#revokeBtn') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#revokeBtn'))) preview(false); });
document.addEventListener('focusin', (e) => { preview(!!e.target.closest('#revokeBtn')); });
document.addEventListener('keydown', (e) => {
  if (S.closed || $('.hello')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="sel"], .ui-row[data-act="ww"]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && UI.open) { const g = $('.ui-sheet-f .ui-btn.gold'); if (g) { e.preventDefault(); if (!g.disabled) g.click(); } return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $('[data-act="sheet"]'); if (b && !b.disabled) openSheet(); return; }
  tabKeys(e, setMid);
});
render();
</script>
