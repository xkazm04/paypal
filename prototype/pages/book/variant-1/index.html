<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book · Ledger Lens</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/ui.css">
<script src="../../../main/fixtures.js"></script>

<style>
/* ---- Book pages on the v2 baseline: only what the baseline does not carry ---- */
body { overflow: hidden; }
button.ui-chip { border: 0; cursor: pointer; }
button.ui-row { border: 0; background: none; color: inherit; font: inherit; text-align: left; width: 100%; }
.ui-titlebar .ui-crumbs { flex: 0 1 auto; }
.crumb-btn { background: none; border: 0; padding: 0 2px; color: var(--text); font-weight: var(--fw-semibold); cursor: pointer; border-radius: var(--r-sm); }
.crumb-btn:hover { background: var(--hover); }
.tb-meter { display: inline-flex; align-items: center; gap: 6px; height: var(--ctl); padding: 0 var(--sp-2); border: 0; border-left: 2px solid var(--teal); background: none;
  color: var(--dim); font-size: var(--fs-small); white-space: nowrap; cursor: pointer; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.tb-meter:hover { background: var(--hover); }
.tb-meter b { color: var(--text); font: var(--fw-semibold) var(--fs-mono) var(--mono); font-variant-numeric: tabular-nums; }
.tb-meter.eng { border-left-color: var(--line2); }
@media (max-width: 1180px) { .tb-meter .lbl { display: none; } }
.modlist { display: flex; flex-direction: column; gap: 1px; margin: 0 calc(-1 * var(--sp-2)); }
.ui-btn.primary .kbd { color: inherit; border-color: color-mix(in srgb, var(--on-teal) 40%, transparent); }
.ui-sidebar .ico.mono { font: var(--fw-semibold) var(--fs-small) var(--mono); }

/* the verbatim query: one line on Layer 1, wrapped in full on Layer 2 */
.json { margin: 0; padding: var(--sp-2) var(--sp-3); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
  font: var(--fs-small)/1.55 var(--mono); color: var(--teal-l); white-space: pre-wrap; word-break: break-word; }
.json.bad { color: var(--coral-l); border-color: color-mix(in srgb, var(--refuse) 45%, var(--line)); }
.ui-row .q1, .q1 { font: var(--fs-small) var(--mono); color: var(--teal-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ui-row .q1.bad, .q1.bad { color: var(--coral-l); }
.errs { margin: 0; padding-left: 18px; font: var(--fs-small)/1.6 var(--mono); color: var(--red-l); }
.sheet-note { margin: var(--sp-3) 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-bottom: var(--sp-3); }
.auditl { font: var(--fs-small)/1.6 var(--mono); color: var(--muted); }
.ui-table tr.new td { color: var(--teal-l); }
a.dl { color: var(--teal-l); text-decoration: none; }
a.dl:hover { text-decoration: underline; }
.ui-dot.pulse { animation: bk-pulse 1s ease-in-out infinite; }
@keyframes bk-pulse { 50% { opacity: .25; } }

/* money is kept apart by state: each state has its own ink */
.bk-captured { color: var(--ok); } .bk-held { color: var(--coral-l); } .bk-motion { color: var(--teal-l); } .bk-stopped { color: var(--dim); }

/* market band: the deal price against the band on file (Layer 2) */
.mk { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: var(--fs-small); color: var(--muted); }
.mk.none { color: var(--dim); font-style: italic; }
.mk svg { display: block; flex: none; }
.mk-axis { stroke: var(--line2); stroke-width: 1; }
.mk-band { fill: color-mix(in srgb, var(--market) 22%, transparent); stroke: color-mix(in srgb, var(--market) 45%, transparent); }
.mk-med { stroke: var(--market); stroke-width: 1.5; }
.mk-dot { stroke: var(--bg); stroke-width: 1.5; fill: var(--teal-l); }
.mk-dot.mk-held { fill: var(--coral-l); } .mk-dot.mk-motion { fill: var(--panel); stroke: var(--teal-l); } .mk-dot.mk-stopped { fill: var(--dim); }
/* the collapsed source list (inspector open below 1180px) keeps icons only */
@media (max-width: 1180px) { .ui-split.has-insp .ui-sidebar { overflow-x: hidden; } .ui-split.has-insp .ui-sidebar .cnt, .ui-split.has-insp .ui-sidebar .ui-proto { display: none; } }

/* ---- Variant 1 · Ledger Lens: the week's grid is the page; a query is a lens laid over it ---- */
#h1:focus { outline: none; }
/* outlook: three one-line items in one grouped box, each with its default on silence */
.outlook { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.outlook > .ui-row + .ui-row { border-top: 0; border-left: 1px solid var(--line); }
.outlook .t1 b { font-family: var(--mono); }
.ask { margin-top: var(--sp-3); }
.askrow { display: flex; gap: var(--sp-2); }
.askrow .ui-field { flex: 1 1 auto; }
#slip { margin-top: var(--sp-2); }
#slip .ui-row .main { min-width: 120px; }
#slip .ui-table td { height: 26px; }
#slip .ui-table th { position: static; }

/* the grid: four money columns with their own totals, never added together */
.gridbox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: clip; }
.gridbox .ui-toolbar { gap: var(--sp-2); flex-wrap: wrap; }
.gt-title { font-weight: var(--fw-semibold); }
#grid { table-layout: auto; }
#grid th.num { text-align: right; }
#grid thead tr.tots th { top: 26px; height: auto; padding-top: var(--sp-1); padding-bottom: var(--sp-1); background: var(--bg2); vertical-align: top; font-weight: var(--fw-regular); }
.tot { display: inline-flex; flex-direction: column; align-items: flex-end; min-width: 72px; padding: 2px 6px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--panel); color: var(--text); cursor: pointer; font: var(--fw-semibold) var(--fs-mono)/1.35 var(--mono); font-variant-numeric: tabular-nums; }
.tot:hover { background: var(--hover); }
.tot[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
.tot small { font: var(--fw-regular) var(--fs-small)/1.35 var(--mono); color: var(--dim); }
#grid tr.grp td { height: 22px; background: var(--bg2); color: var(--dim); font-size: var(--fs-small); font-weight: var(--fw-semibold); }
#grid tbody tr.r { cursor: pointer; }
#grid tbody tr.r:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
#grid tr.off td { opacity: .3; }
#grid td.c-held { color: var(--coral-l); }
#grid td.c-motion { color: var(--muted); }
#grid td.c-stopped { color: var(--dim); text-decoration: line-through; }
#grid .in { color: var(--dim); font-size: var(--fs-small); margin-left: 3px; text-decoration: none; display: inline-block; }
#grid .day { color: var(--dim); font: var(--fs-small) var(--mono); margin: 0 4px; }
#grid .cp { color: var(--dim); }
.proto { margin-top: var(--sp-4); display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.proto::before { width: 100%; margin-bottom: 0; }
@media (max-width: 1180px) {
  .outlook { grid-template-columns: minmax(0, 1fr); }
  .outlook > .ui-row + .ui-row { border-left: 0; border-top: 1px solid var(--line); }
  #grid .cp, #grid .c-mkt { display: none; }
}
</style>
</head>
<body>
<div class="ui-app">
  <header class="ui-titlebar" id="top"></header>
  <div class="ui-split" id="split">
    <aside class="ui-sidebar" id="side" aria-label="Modules and lenses"></aside>
    <main class="ui-main" id="view" tabindex="-1">
      <div class="ui-pagehead">
        <h1 tabindex="-1" id="h1">Book</h1>
        <span class="sub">Payments ops · week Mon 26 Oct – Sun 1 Nov · ledger as of <span id="asof"></span> · sample snapshot</span>
        <div class="actions"><button class="ui-btn sm" data-act="audit">Audit trail</button></div>
      </div>

      <div class="ui-group outlook" id="outlook" aria-label="Cash-flow outlook"></div>

      <section class="ui-section ask" aria-label="Ask the book">
        <form class="askrow" id="askform">
          <input class="ui-field ui-search" id="ask" autocomplete="off" aria-label="Ask the book" placeholder="Ask about your agents’ money in plain words   ( / )">
          <button class="ui-btn" type="submit" id="draftbtn">Draft query</button>
        </form>
        <div id="slip" hidden></div>
      </section>

      <section class="ui-section" aria-label="The week's ledger">
        <div class="gridbox">
          <div class="ui-toolbar" id="gtools"></div>
          <table class="ui-table" id="grid"></table>
        </div>
      </section>

      <div class="ui-proto proto" id="proto"></div>
    </main>
  </div>
</div>
<script>
/* ---- Book core (v2 baseline): ledger rows, BookQuery schema + validator, read-only executor,
   outlook, CSV, and the Layer-2 detail (read sheet, rejection sheet, row detail, outlook popover).
   Shared by the three Book variants (each page carries its own inline copy). Renders from FIX. */
'use strict';
const F = window.FIX;
const NOW0 = new Date(F.nowISO).getTime();
const T0 = Date.now();
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const simNow = () => NOW0 + (Date.now() - T0);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Money is integer minor units (cents) + ISO currency; FIX holds USD dollars, converted once here. */
const toMinor = (n) => (n == null ? null : Math.round(n * 100));
const fmt = (minor) => (minor == null ? '—' : '$' + (minor / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const DEAL_HREF = (id) => `../../deal/variant-1/index.html#${encodeURIComponent(id)}`;
const HOME_HREF = '../../../index.html#home';

/* Week of Mon 26 Oct - Sun 1 Nov 2026. */
const DAYDATE = { Mon: '2026-10-26', Tue: '2026-10-27', Wed: '2026-10-28', Thu: '2026-10-29', Fri: '2026-10-30', Sat: '2026-10-31', Sun: '2026-11-01' };
const WEEK = { from: '2026-10-26', to: '2026-11-01' };

/* Page-local constants consistent with FIX (same ids, times as prototype/main/modules.js). */
const DEADLINE = {
  'D-0190': NOW0 + F.deals.find((d) => d.id === 'D-0190').holdUntilMin * MIN, // auto-void at 72 h: Sun 1 Nov 09:02
  'D-0189': NOW0 + 4 * HOUR + 31 * MIN, // buyer's approve link
};
/* decided_by per the AGENTS.md authorities: owner (approval window), a signed rule, or a safe default. */
const DECIDED_BY = {
  'D-0187': 'owner', 'D-0180': 'owner',
  'D-0186': 'policy:clause6', 'D-0183': 'policy:clause6', 'D-0181': 'policy:clause6',
  'D-0192': 'policy:clause3', 'D-0196': 'shield', 'D-0185': 'mandate:S-2', 'D-0176': 'auto:rounds',
};
const DECIDED_LABEL = {
  owner: 'you · approval window', 'policy:clause6': 'policy · clause 6', 'policy:clause3': 'policy · clause 3 (refused)',
  shield: 'shield · BLOCK', 'mandate:S-2': 'shop mandate S-2 · buyer approved', 'auto:rounds': 'auto-withdraw · rounds', open: 'still open',
};
/* Last Transaction Search poll in this sample (UNVERIFIED cadence; report §10.5: ≤ 3 h lag). */
const LAST_POLL = '13:47';

const STATE_TONE = (s) => ({
  NEGOTIATING: 'live', PAIRING: 'live', QUOTED: 'live', 'AWAITING BUYER APPROVAL': 'wait', AUTHORIZED: 'held', HOLD: 'held',
  CAPTURED: 'done', RECEIPTED: 'done', RECOVERED: 'done', REFUSED: 'bad', BLOCK: 'bad', VOIDED: 'off', WITHDRAWN: 'off', FAILED: 'wait',
}[s] || 'off');
const BUCKET = (s) => (['CAPTURED', 'RECEIPTED', 'RECONCILED', 'RECOVERED'].includes(s) ? 'captured'
  : s === 'AUTHORIZED' ? 'held'
  : ['REFUSED', 'BLOCK', 'VOIDED', 'WITHDRAWN', 'EXPIRED'].includes(s) ? 'stopped' : 'motion');
const BUCKETS = ['captured', 'held', 'motion', 'stopped'];
const BUCKET_LABEL = { captured: 'Captured', held: 'Held at PayPal', motion: 'In motion', stopped: 'Stopped' };
const BUCKET_SUB = { captured: 'money moved', held: 'authorized, not captured', motion: 'nothing captured yet', stopped: 'never paid' };

const cpName = (id) => (F.counterparties[id] ? F.counterparties[id].name : id);
const ROWS = F.deals.map((d) => {
  const kind = d.kind.split(' · ')[0].replace(' ', '_');
  return {
    id: d.id, kind, kindLabel: d.kind, side: d.side, dir: d.side === 'buyer' ? 'out' : 'in', cpId: d.cp, cp: cpName(d.cp), item: d.item,
    minor: toMinor(d.amount), ask: d.ask || null, state: d.state, bucket: BUCKET(d.state), day: d.day, date: DAYDATE[d.day], when: d.when,
    pct: d.pct == null ? null : d.pct, ref: d.ref, decided: DECIDED_BY[d.id] || 'open', mode: d.replay ? 'REPLAY' : F.mode, pp: d.pp || null,
    recBase: d.rec, sub: d.sub, link: d.id, module: d.module,
  };
});
const SUBROWS = F.subscribers.map((s) => ({
  id: s.id, kind: 'subscription', kindLabel: 'subscription · ' + s.plan, side: 'seller', dir: 'in', cpId: s.id, cp: 'subscriber ' + s.id, item: s.plan,
  minor: null, state: s.state, bucket: 'n/a', day: null, date: null, when: s.retry, pct: null, ref: 'care-plan', decided: 'open',
  mode: s.replay ? 'REPLAY' : F.mode, pp: null, recBase: 'n/a', sub: s.retry, link: s.deal || null, module: 'rescue',
}));

/* Reconciliation: our ledger first, PayPal's Transaction Search second. */
const REC = { overrides: {}, reporting: true };
function recOf(r) {
  const v = REC.overrides[r.id] || r.recBase || 'n/a';
  if (!REC.reporting && v === 'pending') return 'off';
  return v;
}
const REC_LABEL = { matched: 'matched', pending: 'pending in PayPal reporting', mismatch: 'mismatch', 'n/a': 'n/a', off: 'reporting not enabled' };
const REC_TIP = {
  matched: 'Transaction Search found this capture on your account',
  pending: 'Captured in your ledger; Transaction Search lags up to 3 h before it lists the row',
  mismatch: 'PayPal reports a different amount or id than the ledger',
  'n/a': 'No money reached PayPal for this row, so there is nothing to reconcile',
  off: 'The REST app lacks the Transaction Search permission; your own ledger still answers',
};
/* Layer 1 shows a short chip; the full label and its meaning live in the tooltip and the detail. */
const REC_CHIP = { matched: ['ok', 'matched'], pending: ['gold dashed', 'pending'], mismatch: ['red', 'mismatch'], 'n/a': ['', 'n/a'], off: ['line', 'not enabled'] };
function recChip(r) {
  const v = recOf(r);
  if (v === 'n/a') return `<span class="dim" title="${esc(REC_TIP[v])}">n/a</span>`;
  return `<span class="ui-chip ${REC_CHIP[v][0]}" title="${esc(REC_LABEL[v] + ' · ' + REC_TIP[v])}">${REC_CHIP[v][1]}</span>`;
}
function recCounts(rows) {
  const c = { matched: 0, pending: 0, mismatch: 0, off: 0, 'n/a': 0 };
  rows.forEach((r) => { c[recOf(r)]++; });
  return c;
}
/** Compact reconciliation summary for a set of rows (text + colour, never colour alone). */
function recSummary(rc, all) {
  const c = [];
  if (rc.matched || all) c.push(`<span class="ui-chip ok" title="${esc(REC_TIP.matched)}">${rc.matched} matched</span>`);
  if (REC.reporting && (rc.pending || all)) c.push(`<span class="ui-chip gold dashed" title="${esc(REC_TIP.pending)}">${rc.pending} pending</span>`);
  if (rc.off) c.push(`<span class="ui-chip line" title="${esc(REC_TIP.off)}">${rc.off} not enabled</span>`);
  if (rc.mismatch || all) c.push(`<span class="ui-chip red" title="${esc(REC_TIP.mismatch)}">${rc.mismatch} mismatch</span>`);
  return c.join(' ');
}
const TONE_CHIP = { live: 'teal', wait: 'gold', held: 'coral', done: 'ok', bad: 'red', off: '' };
const STATE_SHORT = { 'AWAITING BUYER APPROVAL': 'awaiting buyer' };
const stChip = (s, full) => `<span class="ui-chip ${TONE_CHIP[STATE_TONE(s)]}" title="${esc(s)}">${esc(full ? s : (STATE_SHORT[s] || s))}</span>`;
const modeChip = (m) => `<span class="badge ${m === 'REPLAY' ? 'replay' : 'sandbox'}">${esc(m)}</span>`;
const QS_TONE = { DRAFTING: 'teal', DRAFTED: 'gold', INVALID: 'red', RUNNING: 'teal', RESULT: 'ok', EMPTY: '' };
/** Phase of a query: drafting → drafted (read me) → running → result / empty, or invalid. */
const qsChip = (p, label) => `<span class="ui-chip ${QS_TONE[p] || ''}">${p === 'DRAFTING' || p === 'RUNNING' ? '<span class="ui-dot pulse"></span>' : ''}${esc(label || p)}</span>`;
const BUCKET_SHORT = { captured: 'captured', held: 'held', motion: 'in motion', stopped: 'stopped' };
/** One line of money, kept apart by state and direction: never one total. */
function moneyLine(sums) {
  const p = [];
  BUCKETS.forEach((b) => {
    const s = sums[b];
    if (s.out) p.push(`<span class="dim">${BUCKET_SHORT[b]}</span> <span class="money bk-${b}">${fmt(s.out)}</span>`);
    if (s.in) p.push(`<span class="dim">${BUCKET_SHORT[b]} in</span> <span class="money bk-${b}">${fmt(s.in)}</span>`);
  });
  return p.join('<span class="dim"> · </span>') || '<span class="dim">no amounts</span>';
}

/* ---- BookQuery: the closed query language (report §7 cap 5), verbatim. ---- */
const SCHEMA_TEXT = `{ "type":"object", "additionalProperties":false,
  "required":["view","metrics"],
  "properties":{
    "view":{"enum":["deals","paypal_calls","receipts","subscriptions","reconciliation"]},
    "filters":{"type":"array","maxItems":6,"items":{"type":"object","additionalProperties":false,
      "properties":{"field":{"enum":["kind","state","counterparty","amount","created_at","vs_market_pct","decided_by"]},
      "op":{"enum":["eq","ne","gt","lt","between","in"]},"value":{}}}},
    "group_by":{"type":"array","items":{"enum":["kind","counterparty","state","day","decided_by"]},"maxItems":2},
    "metrics":{"type":"array","items":{"enum":["count","sum_amount","avg_vs_market_pct","recovered_sum"]}},
    "range":{"type":"object","properties":{"from":{"type":"string"},"to":{"type":"string"}}},
    "limit":{"type":"integer","maximum":500} } }`;
const SCHEMA = JSON.parse(SCHEMA_TEXT);
const ENUMS = {
  view: SCHEMA.properties.view.enum,
  field: SCHEMA.properties.filters.items.properties.field.enum,
  op: SCHEMA.properties.filters.items.properties.op.enum,
  group_by: SCHEMA.properties.group_by.items.enum,
  metrics: SCHEMA.properties.metrics.items.enum,
};
function checkNode(s, v, path, errs) {
  const at = path || '/';
  if (s.type) {
    const ok = s.type === 'object' ? (v !== null && typeof v === 'object' && !Array.isArray(v))
      : s.type === 'array' ? Array.isArray(v)
      : s.type === 'integer' ? Number.isInteger(v)
      : s.type === 'string' ? typeof v === 'string' : true;
    if (!ok) { errs.push(`${at} must be ${s.type}`); return; }
  }
  if (s.enum && !s.enum.includes(v)) errs.push(`${at} must be equal to one of the allowed values: ${s.enum.join(', ')}`);
  if (s.maximum != null && typeof v === 'number' && v > s.maximum) errs.push(`${at} must be <= ${s.maximum}`);
  if (s.type === 'object') {
    (s.required || []).forEach((k) => { if (!(k in v)) errs.push(`${at} must have required property '${k}'`); });
    Object.keys(v).forEach((k) => {
      if (s.properties && s.properties[k]) checkNode(s.properties[k], v[k], `${path}/${k}`, errs);
      else if (s.additionalProperties === false) errs.push(`${at} must NOT have additional properties: '${k}'`);
    });
  }
  if (s.type === 'array') {
    if (s.maxItems != null && v.length > s.maxItems) errs.push(`${at} must NOT have more than ${s.maxItems} items`);
    if (s.items) v.forEach((x, i) => checkNode(s.items, x, `${path}/${i}`, errs));
  }
}
/** Parse + validate exactly the text the engine (or a preset, or Maya) produced. */
function validateText(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { ok: false, obj: null, errors: [`not JSON · ${e.message}`] }; }
  const errors = [];
  checkNode(SCHEMA, obj, '', errors);
  return { ok: errors.length === 0, obj, errors };
}

/* Presets: fixed queries that run without an engine (report §13 cut-line). */
const R = `"range":{"from":"${WEEK.from}","to":"${WEEK.to}"}`;
const PRESETS = [
  { id: 'week', short: 'This week vs market', q: 'What did my agents commit this week, and how did it compare with the market?',
    json: `{"view":"deals","group_by":["kind"],"metrics":["count","sum_amount","avg_vs_market_pct"],${R}}` },
  { id: 'pending', short: 'Does PayPal agree yet?', q: 'Does PayPal agree yet? Which captures are still pending in PayPal reporting?',
    json: `{"view":"reconciliation","metrics":["count","sum_amount"],${R}}` },
  { id: 'decided', short: 'Policy vs me', q: 'What did the policy decide on its own, and what did I decide?',
    json: `{"view":"deals","group_by":["decided_by"],"metrics":["count","sum_amount"],${R}}` },
  { id: 'day', short: 'Day by day', q: 'Day by day: what was committed?',
    json: `{"view":"deals","group_by":["day"],"metrics":["count","sum_amount"],${R}}` },
  { id: 'stopped', short: 'What was stopped', q: 'What was stopped, and by what?',
    json: `{"view":"deals","filters":[{"field":"state","op":"in","value":["REFUSED","BLOCK","VOIDED","WITHDRAWN"]}],"group_by":["decided_by"],"metrics":["count","sum_amount"],${R}}` },
  { id: 'mismatch', short: 'Mismatches with PayPal', q: 'Any mismatches with PayPal?',
    json: `{"view":"reconciliation","filters":[{"field":"state","op":"eq","value":"MISMATCH"}],"metrics":["count"],${R}}` },
  { id: 'rescue', short: 'Rescue recovered', q: 'What did rescue recover?',
    json: `{"view":"subscriptions","group_by":["state"],"metrics":["count","recovered_sum"]}` },
];

/* Prototype stand-in for the engine (claude-code, tool-less profile). It sees the question and the
   schema only - never rows, never counterparty text. Deterministic so the demo repeats. */
function engineDraft(question) {
  const s = question.toLowerCase();
  const has = (re) => re.test(s);
  if (has(/\b(delete|drop|update|insert|refund|pay|send|capture|void|cancel)\b/)) {
    const id = (question.match(/[DQ]-\d{4}/i) || ['D-0186'])[0].toUpperCase();
    const act = (s.match(/\b(delete|drop|update|insert|refund|pay|send|capture|void|cancel)\b/) || ['refund'])[0];

  }
  if (has(/\b(sql|select)\b/)) return `SELECT * FROM deals WHERE state = 'CAPTURED'`;
  if (has(/forecast|predict|next week|projection|expect/)) return `{"view":"deals","metrics":["forecast_sum"],${R}}`;
  if (has(/all time|\bever\b|everything|since the start/)) return `{"view":"deals","metrics":["count","sum_amount"],"limit":5000}`;
  if (has(/mismatch|disagree|wrong/)) return PRESETS[5].json;
  if (has(/pending|reporting|reconcil|match|agree|statement/)) return PRESETS[1].json;
  if (has(/recover|rescue|subscri|renewal/)) return PRESETS[6].json;
  if (has(/refus|block|stopp|void|withdr/)) return PRESETS[4].json;
  if (has(/polic|decid|on its own|automatic|who/)) return PRESETS[2].json;
  if (has(/\bday\b|daily|each day|per day/)) return PRESETS[3].json;
  const cp = Object.values(F.counterparties).find((c) => s.includes(c.id) || s.includes(c.name.toLowerCase().split(' ')[0]));
  if (cp) {

    return `{"view":"deals","filters":[{"field":"counterparty","op":"eq","value":"${cp.id}"}${st}],"metrics":["count","sum_amount","avg_vs_market_pct"],${R}}`;

  if (has(/supplier|counterpart|vendor|seller/)) return `{"view":"deals","group_by":["counterparty"],"metrics":["count","sum_amount"],${R}}`;
  if (has(/paypal call|order id|capture id/)) return `{"view":"paypal_calls","metrics":["count","sum_amount"],${R}}`;

/* Example questions that show the rejection path (engine output that fails the schema). */
const TRY_INVALID = ['Refund D-0186', 'Forecast next week’s spend', 'Show everything since the start'];

/* ---- Read-only executor: the prototype's stand-in for Rust on SQLITE_OPEN_READ_ONLY. ---- */
const FIELD = {
  kind: (r) => r.kind, state: (r) => r.state, counterparty: (r) => r.cpId, amount: (r) => (r.minor == null ? null : r.minor / 100),
  created_at: (r) => r.date, vs_market_pct: (r) => r.pct, decided_by: (r) => r.decided,
};
const norm = (x) => (typeof x === 'string' ? x.toLowerCase() : x);
function matchFilter(r, f) {
  if (!f.field) return true;
  const a = FIELD[f.field](r), v = f.value, op = f.op || 'eq';
  if (op === 'eq') return norm(a) === norm(v);
  if (op === 'ne') return norm(a) !== norm(v);
  if (op === 'gt') return a != null && a > v;
  if (op === 'lt') return a != null && a < v;
  if (op === 'between') return Array.isArray(v) && a != null && a >= v[0] && a <= v[1];
  if (op === 'in') return Array.isArray(v) && v.map(norm).includes(norm(a));
  return false;
}
function viewRows(view) {
  switch (view) {
    case 'deals': return ROWS;
    case 'paypal_calls': return ROWS.filter((r) => r.pp);
    case 'receipts': return ROWS.filter((r) => r.state === 'RECEIPTED' || (r.side === 'seller' && r.bucket === 'captured'));
    case 'reconciliation': return ROWS.filter((r) => r.pp && r.pp.capture);
    case 'subscriptions': return SUBROWS;
    default: return [];
  }
}
const GROUP_LABEL = {
  kind: (r) => r.kind.replace('_', ' '), counterparty: (r) => r.cp, state: (r) => r.state, day: (r) => r.day || '—',
  decided_by: (r) => DECIDED_LABEL[r.decided] || r.decided,
};
const DAY_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
/** Aggregate without ever adding money in different states or directions together. */
function aggregate(rows) {
  const sums = {};
  BUCKETS.forEach((b) => { sums[b] = { out: 0, in: 0, nOut: 0, nIn: 0 }; });
  rows.forEach((r) => {
    if (r.minor == null || !sums[r.bucket]) return;
    sums[r.bucket][r.dir] += r.minor;
    sums[r.bucket][r.dir === 'out' ? 'nOut' : 'nIn']++;
  });
  const pr = rows.filter((r) => r.pct != null);
  const pct = pr.length ? { avg: Math.round(pr.reduce((a, r) => a + r.pct, 0) / pr.length), n: pr.length, ids: pr.map((r) => r.id) } : null;
  const recovered = rows.filter((r) => r.state === 'RECOVERED' && r.mode !== 'REPLAY').reduce((a, r) => a + (r.minor || 0), 0);
  return { count: rows.length, sums, pct, rec: recCounts(rows), recovered };
}
let QSEQ = 0;
function runQuery(q) {
  const t0 = performance.now();
  let rows = viewRows(q.view);
  const filters = q.filters || [];
  if (q.range && q.view !== 'subscriptions') rows = rows.filter((r) => r.date && (!q.range.from || r.date >= q.range.from) && (!q.range.to || r.date <= q.range.to));
  rows = rows.filter((r) => filters.every((f) => matchFilter(r, f)));
  const total = rows.length;
  rows = rows.slice(0, q.limit == null ? 500 : q.limit);
  const gb = q.group_by || [];
  let groups = [];
  if (gb.length) {
    const map = new Map();
    rows.forEach((r) => {
      const key = gb.map((g) => GROUP_LABEL[g](r)).join(' · ');
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    groups = [...map.entries()].map(([key, rs]) => ({ key, rows: rs, ...aggregate(rs) }));
    if (gb[0] === 'day') groups.sort((a, b) => DAY_ORDER.indexOf(a.key.split(' · ')[0]) - DAY_ORDER.indexOf(b.key.split(' · ')[0]));
    else groups.sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));
  }
  const params = filters.length + (q.range ? 2 : 0) + 1;
  return { q, rows, total, groups, all: aggregate(rows), empty: rows.length === 0, metrics: q.metrics || [], gb, seq: ++QSEQ,
    ms: Math.max(1, Math.round(performance.now() - t0)), sqlView: 'v_book_' + q.view, params };
}

/* Plain-words reading of a valid query, generated by the wallet from the schema (not by the engine). */
const VIEW_WORDS = {
  deals: 'rows from your deal ledger', paypal_calls: 'the PayPal calls the pipeline made', receipts: 'signed receipts',
  subscriptions: 'care-plan subscriptions', reconciliation: 'captures checked against PayPal Transaction Search',
};
const METRIC_WORDS = {
  count: 'how many', sum_amount: 'amounts, kept apart by money state (captured · held · in motion · stopped)',
  avg_vs_market_pct: 'average market percentile where a reference exists', recovered_sum: 'recovered money (paid invoices + captures, never REPLAY)',
};
const OP_WORDS = { eq: 'is', ne: 'is not', gt: 'over', lt: 'under', between: 'between', in: 'is one of' };
function readQuery(q) {
  const lines = [['view', VIEW_WORDS[q.view]]];
  (q.filters || []).forEach((f) => lines.push(['filter', `only where ${String(f.field || '?').replace(/_/g, ' ')} ${OP_WORDS[f.op] || f.op} ${Array.isArray(f.value) ? f.value.join(', ') : f.value}`]));
  if (q.group_by && q.group_by.length) lines.push(['group_by', 'one line per ' + q.group_by.map((g) => g.replace('_', ' ')).join(' then ')]);
  lines.push(['metrics', (q.metrics || []).map((m) => METRIC_WORDS[m]).join('; ') || 'nothing (metrics is empty)']);
  if (q.range) lines.push(['range', `from ${q.range.from || 'the start'} to ${q.range.to || 'now'}`]);
  if (q.limit != null) lines.push(['limit', `at most ${q.limit} rows`]);
  return lines;
}

/* ---- Fixed cash-flow outlook: a fixed query, never an LLM one. Counts from data, no forecasts. ---- */
function outlook() {
  const holds = ROWS.filter((r) => r.state === 'AUTHORIZED').map((r) => ({ r, until: DEADLINE[r.id], silence: F.deals.find((d) => d.id === r.id).silence }));
  const links = ROWS.filter((r) => /AWAITING/.test(r.state)).map((r) => ({ r, until: DEADLINE[r.id], silence: F.deals.find((d) => d.id === r.id).silence }));
  const failing = F.subscribers.filter((s) => s.state === 'FAILED');
  return { holds, links, renewals: F.activeSubscribers, failing };
}
function countdown(until) {
  const ms = Math.max(0, until - simNow());
  if (ms >= DAY) { const hrs = Math.ceil(ms / HOUR); return `${Math.floor(hrs / 24)} d ${hrs % 24} h`; }
  const h = Math.floor(ms / HOUR), m = Math.ceil((ms - h * HOUR) / MIN);
  return h ? `${h} h ${String(m).padStart(2, '0')} m` : `${m} m`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function absTime(t) {
  const d = new Date(t);

}
const nowClock = () => absTime(simNow()).split(' ')[1];

/* ---- Market comparison: the deal price against the Channel3 band on file. ---- */
function marketBand(r, w) {
  w = w || 132;
  const m = F.market[r.ref];
  if (!m || r.minor == null) {
    return r.pct != null ? `<span class="mk mono" title="percentile recorded at the deal; no band on file">p${r.pct}</span>` : `<span class="mk none">no market ref</span>`;
  }
  const a = r.minor / 100, lo = Math.min(m.p25, a) * 0.97, hi = Math.max(m.p75, a) * 1.03, h = 18;
  const x = (v) => (4 + ((v - lo) / (hi - lo)) * (w - 8)).toFixed(1);
  const tip = `${fmt(r.minor)} vs p25 $${m.p25} · median $${m.median} · p75 $${m.p75} · ${m.src} · retrieved ${m.retrieved}${r.pct != null ? ` · p${r.pct} at the deal` : ''}`;
  return `<span class="mk" title="${esc(tip)}"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="2" x2="${w - 2}" y1="9" y2="9" class="mk-axis"/>
    <rect x="${x(m.p25)}" y="4" width="${(x(m.p75) - x(m.p25)).toFixed(1)}" height="10" rx="2" class="mk-band"/>
    <line x1="${x(m.median)}" x2="${x(m.median)}" y1="2" y2="16" class="mk-med"/>
    <circle cx="${x(a)}" cy="9" r="4" class="mk-dot mk-${r.bucket}"/></svg><span class="mono">${r.pct != null ? 'p' + r.pct : (a > m.median ? '+' : '') + Math.round(((a - m.median) / m.median) * 100) + '%'}</span></span>`;
}

/* ---- CSV export: every record carries its mode badge; formula-safe cells. ---- */
function csvCell(v) {

/* ================= Variant 1 · Ledger Lens ================= */
const S = { phase: 'IDLE', asked: '', text: '', source: '', val: null, res: null, lens: null, recF: 'all', bucketF: null, token: 0, engineOn: true, preset: null, auditSeq: 0, sel: null };
let READ = null; // the open read-before-run sheet, if any

function renderChrome() {

/* sidebar: modules, then the fixed lenses (presets) and the drafts that show a rejection */
function renderSide() {

    <span class="ui-silence">if you do nothing → <b>${esc(it.short)}</b></span></span><span class="chev"></span></button>`).join('');

function ask(q, presetJson, presetIdx) {
  q = (q || '').trim();
  if (!q) { $('#ask').focus(); return; }
  if (!presetJson && !S.engineOn) { toast('<b>No engine connected.</b> Typed questions need claude-code or codex-cli. The lenses are fixed queries and still run.', 'gold'); return; }
  const tok = ++S.token;
  Object.assign(S, { phase: 'DRAFTING', asked: q, text: '', source: presetJson ? 'preset' : 'engine', val: null, res: null, lens: null, preset: presetIdx == null ? null : presetIdx, auditSeq: 0 });
  renderSlip(); renderGrid(); renderChrome(); renderSide();
  const done = () => {
    if (tok !== S.token) return;
    S.text = presetJson || engineDraft(q);
    S.val = validateText(S.text);
    S.phase = S.val.ok ? 'DRAFTED' : 'INVALID';
    if (!S.val.ok) S.auditSeq = audit('agent:book', 'book.query REJECTED by schema · nothing ran');
    renderSlip();
    const b = S.val.ok ? $('#runbtn') : $('#whybtn');
    if (b) b.focus();
  };
  if (presetJson) done(); else setTimeout(done, reduceMotion ? 150 : 1100);
}

function run() {
  if (S.phase !== 'DRAFTED') return;
  if (READ) { READ.close(); READ = null; }
  const tok = S.token;
  S.phase = 'RUNNING'; renderSlip();
  setTimeout(() => {
    if (tok !== S.token) return;
    S.res = runQuery(S.val.obj);
    S.phase = S.res.empty ? 'EMPTY' : 'RESULT';
    audit('owner', `book.query #${S.res.seq} ran read-only · view ${S.val.obj.view} · ${S.res.total} rows`);
    S.lens = S.val.obj.view === 'subscriptions' ? null : new Set(S.res.rows.map((r) => r.id));
    renderSlip(); renderGrid(); renderChrome();
  }, reduceMotion ? 120 : 650);
}

function discard() {
  S.token++;
  Object.assign(S, { phase: 'IDLE', asked: '', text: '', source: '', val: null, res: null, lens: null, preset: null });
  renderSlip(); renderGrid(); renderChrome(); renderSide();
  $('#ask').focus();
}

/* the answer, as numbers only: one line per group; explanations stay on Layer 2 */
function pivot(res) {
  const m = res.metrics;
  const groups = res.groups.length ? res.groups : [{ key: res.gb.length ? '—' : 'all rows', ...res.all }];
  const cols = [];
  if (m.includes('count')) cols.push(['Rows', (g) => g.count, 'num']);
  if (m.includes('sum_amount')) BUCKETS.forEach((b) => cols.push([BUCKET_LABEL[b].replace(' at PayPal', ''), (g) => cellSum(g.sums[b], b), 'num']));
  if (m.includes('avg_vs_market_pct')) cols.push(['vs market', (g) => (g.pct ? `p${g.pct.avg} <span class="dim">n=${g.pct.n}</span>` : '<span class="dim">no ref</span>'), 'num']);
  if (m.includes('recovered_sum')) cols.push(['Recovered', (g) => `<span class="money">${fmt(g.recovered)}</span>`, 'num']);
  if (res.q.view === 'reconciliation' || res.q.view === 'deals') cols.push(['PayPal statement', (g) => recSummary(g.rec) || '<span class="dim">n/a</span>', '']);
  return `<table class="ui-table"><thead><tr><th>${res.gb.length ? esc(res.gb.join(' · ').replace(/_/g, ' ')) : 'Result'}</th>${cols.map((c) => `<th class="${c[2]}">${c[0]}</th>`).join('')}</tr></thead>
    <tbody>${groups.map((g) => `<tr><td>${esc(g.key)}</td>${cols.map((c) => `<td class="${c[2]}">${c[1](g)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function cellSum(s, b) {
  const p = [];
  if (s.out) p.push(`<span class="bk-${b}">${fmt(s.out)}</span>`);
  if (s.in) p.push(`<span class="bk-${b}">${fmt(s.in)}</span><span class="dim"> in</span>`);
  return p.join(' · ') || '<span class="dim">—</span>';
}

const btn = (act, label, kind, id) => `<button class="ui-btn sm ${kind || ''}" data-act="${act}"${id ? ` id="${id}"` : ''}>${label}</button>`;
function renderSlip() {
  const el = $('#slip');
  if (S.phase === 'IDLE') { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const src = S.source === 'preset' ? '<span class="ui-chip line" title="A fixed query: no engine needed">preset</span>'
    : `<span class="ui-chip line" title="Drafted by ${esc(APP.engine)} on a tool-less profile: it saw your words and the schema, never your rows">${esc(APP.engine)}</span>`;
  const q1 = S.text ? `<span class="t2 q1${S.phase === 'INVALID' ? ' bad' : ''}" title="The query, verbatim">${esc(S.text)}</span>` : '';
  let t2 = q1, end = '', more = '';
  if (S.phase === 'DRAFTING') {
    t2 = `<span class="t2">${esc(APP.engine)} is writing a BookQuery · it sees your words and the schema, never rows</span>`;
    end = btn('discard', 'Cancel', 'plain');
  } else if (S.phase === 'INVALID') {
    end = `<span class="ui-silence">${plural(S.val.errors.length, 'schema error')} · <b>nothing ran</b></span>${btn('why', 'Why rejected ›', '', 'whybtn')}${btn('discard', 'Discard', 'plain')}`;
  } else if (S.phase === 'DRAFTED') {
    end = `<span class="ui-silence">until you run · <b>nothing is read</b></span>${btn('read', 'Read ›')}${btn('run', 'Run read-only', 'primary', 'runbtn')}${btn('discard', 'Discard', 'plain')}`;
  } else if (S.phase === 'RUNNING') {
    end = '<span class="ui-silence">read-only connection</span>';
  } else if (S.phase === 'EMPTY') {
    end = `<span class="ui-silence">#${S.res.seq} · <b>no rows</b>${S.val.obj.view === 'reconciliation' ? ' · nothing disagrees with PayPal' : ''}</span>${btn('read', 'Query ›')}${btn('discard', 'Clear', 'plain')}`;
  } else if (S.phase === 'RESULT') {
    const subs = S.val.obj.view === 'subscriptions';
    end = `<span class="ui-silence" title="${S.res.ms} ms · ${S.res.params} bound params · audit logged">#${S.res.seq} · ${plural(S.res.total, 'row')}</span>${btn('read', 'Query ›')}${subs ? btn('subs', 'Subscribers ›') : ''}${btn('csv', 'Export CSV')}${btn('discard', 'Clear', 'plain')}`;
    more = pivot(S.res);
  }
  el.innerHTML = `<div class="ui-group"><div class="ui-row two">${qsChip(S.phase, S.phase === 'DRAFTED' ? 'read me' : S.phase)}
    <span class="main"><span class="t1">“${esc(S.asked)}”</span>${t2}</span><span class="end">${src}${end}</span></div>${more}</div>`;
  $$('[data-act]', el).forEach((b) => b.addEventListener('click', () => act(b.dataset.act)));
}

function act(a) {
  if (a === 'run') run();
  else if (a === 'discard') discard();
  else if (a === 'read') READ = readSheet({ text: S.text, val: S.val, source: S.source, onRun: S.phase === 'DRAFTED' ? run : null, title: S.phase === 'DRAFTED' ? 'Read before you run' : `Query #${S.res.seq} · as it ran` });
  else if (a === 'why') rejectSheet({ text: S.text, val: S.val, source: S.source, auditSeq: S.auditSeq });
  else if (a === 'csv') exportRows(S.res ? S.res.rows : visibleRows(), S.res ? S.text : '');
  else if (a === 'subs') subsSheet();
  else if (a === 'clearlens') { S.lens = null; renderGrid(); renderChrome(); }
  else if (a === 'audit') auditSheet();
}

function subsSheet() {
  UI.sheet({ title: `Subscribers · query #${S.res.seq}`, size: 'wide', actions: [{ label: 'Done', kind: 'primary' }],
    body: `<table class="ui-table"><thead><tr><th>Subscriber</th><th>Plan</th><th>State</th><th>PayPal</th><th>Mode</th></tr></thead><tbody>${S.res.rows.map((r) => `<tr><td class="mono">${r.link ? `<a class="dl" href="${DEAL_HREF(r.link)}">${r.id}</a>` : r.id}</td><td>${esc(r.item)}</td><td>${stChip(r.state)}</td><td class="clip">${esc(r.sub)}</td><td>${modeChip(r.mode)}</td></tr>`).join('')}</tbody></table>

}

function exportRows(rows, q) {
  const r = downloadCSV(rows, q, S.res ? `book-query-${S.res.seq}` : 'book-week');

}

const KIND_ORDER = ['haggle', 'purchase', 'shop_order', 'shop_quote', 'rescue'];
function visibleRows() {
  return ROWS.filter((r) => (S.recF === 'all' || recOf(r) === S.recF || (S.recF === 'pending' && recOf(r) === 'off')) && (!S.bucketF || r.bucket === S.bucketF));
}
function totalsRow() {
  const a = aggregate(ROWS);
  const cell = (b) => {
    const sm = a.sums[b], n = ROWS.filter((r) => r.bucket === b).length;
    const asked = ROWS.filter((r) => r.bucket === b && r.ask);
    const lines = [sm.out ? `<span class="bk-${b}">${fmt(sm.out)}</span>` : '', sm.in ? `<small>${fmt(sm.in)} in</small>` : ''].join('') || '<span class="dim">—</span>';
    return `<th class="num"><button class="tot" data-bucket="${b}" aria-pressed="${S.bucketF === b}" title="${BUCKET_LABEL[b]}: ${BUCKET_SUB[b]} · ${plural(n, 'deal')}. Click to filter.${asked.length ? ' Not in the sum: ' + esc(asked.map((r) => r.id + ' ' + r.ask).join(', ')) : ''}">${lines}</button></th>`;
  };
  return `<tr class="tots"><th colspan="2"><span class="ui-hint">Week totals · four states, never added</span></th>${BUCKETS.map(cell).join('')}<th class="c-mkt"></th>
    <th><span class="ui-hint">${REC.reporting ? `poll ${LAST_POLL} · ≤ 3 h lag` : 'reporting not enabled'}</span></th></tr>`;
}
function renderGrid() {
  const rows = visibleRows();

  const rc = recCounts(ROWS);

  $('#gtools').innerHTML = `<span class="gt-title">The week’s ledger</span>

    <span class="ui-spacer"></span>
    <span class="ui-hint">PayPal statement</span>

  $$('#gtools [data-rec]').forEach((b) => b.addEventListener('click', () => { S.recF = b.dataset.rec; renderGrid(); }));
  $$('#gtools [data-act]').forEach((b) => b.addEventListener('click', () => act(b.dataset.act)));
  $('#gtools [data-csvall]').addEventListener('click', () => exportRows(visibleRows(), ''));
  $('#gtools [data-help]').addEventListener('click', (e) => UI.popover(e.currentTarget, `<dl class="ui-kv">
      <dt>Columns</dt><dd>four money states, each with its own week total; a hold is not a payment</dd>
      <dt>Held</dt><dd>authorized at PayPal, not captured</dd>
      <dt>Statement</dt><dd>whether PayPal Transaction Search lists the capture yet (31-day window per call · page_size ≤ 500 · ≤ 3 h lag)</dd>

      <dt>Notes</dt><dd>counterparty text never shows in the grid; the detail keeps it behind “note ›”</dd></dl>`, { title: 'Reading the ledger' }));

  const head = `<thead><tr><th>Deal</th><th>State</th><th class="num">Captured</th><th class="num" title="Authorized at PayPal, not captured">Held</th><th class="num">In motion</th><th class="num">Stopped</th><th class="num c-mkt" title="Market percentile at the deal, or distance from the band median">Mkt</th><th>PayPal</th></tr>${totalsRow()}</thead>`;

      if (dir) { e.preventDefault(); const all = $$('#grid tr.r'); const i = all.indexOf(tr) + dir; if (all[i]) all[i].focus(); }
    });
  });
}

$('#askform').addEventListener('submit', (e) => { e.preventDefault(); ask($('#ask').value); });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.phase === 'DRAFTED') { e.preventDefault(); run(); return; }
  if (UI.open) return; // a sheet or popover is open: Esc belongs to it
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#ask').focus(); return; }
  if (e.key === 'Escape') {
    if (S.lens) { S.lens = null; renderGrid(); renderChrome(); return; }
    if (S.phase !== 'IDLE') { discard(); return; }
    if (typing) { document.activeElement.blur(); return; }
    location.href = HOME_HREF;
  }
});
setInterval(() => { renderOutlook(); $('#asof').textContent = absTime(simNow()); }, 20000);
renderAll();
$('#h1').focus({ preventScroll: true });
</script>
