<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tumbler</title>
<meta name="description" content="Desktop simulation of the Tumbler, the small operative window of the agentic wallet built on PayPal. Stylised desktop, sandbox sample data.">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="tumbler.css">
<script src="../main/fixtures.js"></script>
<script src="../shared/ui.js"></script>
</head>
<body>

<!-- ============ stylised desktop (not the product) ============ -->
<div id="desk" aria-label="Stylised desktop">
  <span class="desk-label">stylised desktop · The Table is closed · Maya works in a spreadsheet</span>

  <section class="oswin" id="sheet" aria-label="Spreadsheet app (Maya is working here)">
    <div class="bar">
      <svg class="appico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="3" style="fill:var(--ok)"/><path d="M4 5h8M4 8h8M4 11h8M7 3.5v9" style="stroke:var(--panel)" stroke-width="1.2"/></svg>
      <span class="t">restock-plan-q4 · Sheets</span>
      <span class="wc"><span>—</span><span>☐</span><span>✕</span></span>
    </div>
    <div class="fx"><span class="nm">D9</span><em>fx</em><span>=ROUNDUP(C9*1.4,0)</span></div>
    <div class="gridwrap"><table id="grid" aria-label="Q4 restock plan"></table></div>
    <div class="tabs"><span class="on">Restock</span><span>Suppliers</span><span>Care plan</span><span>+</span></div>
  </section>

  <section class="oswin" id="tablewin" hidden aria-label="The Table (main window)">
    <div class="bar">
      <svg class="appico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" style="fill:var(--panel);stroke:var(--steel)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" style="stroke:var(--gold)" stroke-width="2"/></svg>
      <span class="t">The Table · an agentic wallet built on PayPal</span>
      <a id="tableNewTab" class="ui-btn sm" href="../main/index.html" target="_blank" rel="noopener">Open in a tab ↗</a>
      <span class="wc"><span>—</span><span>☐</span><button id="tableClose" title="Close hides The Table to the tray. The wallet keeps running." aria-label="Close The Table">✕</button></span>
    </div>
    <iframe id="tableframe" title="The Table" src="about:blank"></iframe>
  </section>
</div>

<!-- ============ taskbar ============ -->
<nav id="taskbar" aria-label="Taskbar">
  <div class="tb-apps">
    <span class="tapp" title="Start"><svg viewBox="0 0 24 24" aria-hidden="true"><g style="fill:var(--teal-l)"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></g></svg></span>
    <span class="tapp" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
    <span class="tapp" title="Files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" style="fill:var(--gold)"/></svg></span>
    <span class="tapp" id="tBrowser" title="Your browser"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" style="fill:var(--teal)"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" style="stroke:var(--on-teal)" stroke-width="1.3" fill="none"/></svg></span>
    <span class="tapp run act" title="Sheets · restock-plan-q4"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" style="fill:var(--ok)"/><path d="M6.5 8h11M6.5 12h11M6.5 16h11M10.5 5.5v13" style="stroke:var(--panel)" stroke-width="1.4"/></svg></span>
    <button class="tapp wallet run" id="tTable" hidden title="The Table"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" style="fill:var(--panel);stroke:var(--steel)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" style="stroke:var(--gold)" stroke-width="2"/></svg></button>
  </div>
  <div class="tray">
    <span class="ti" title="Show hidden icons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <button class="ti wal" id="trayWallet" aria-label="The Table tray icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" style="fill:var(--panel);stroke:var(--steel)" stroke-width="1.8"/><path d="M12 3.5v2.4M19.4 7.7l-2 1.2M19.4 16.3l-2-1.2M12 20.5v-2.4M4.6 16.3l2-1.2M4.6 7.7l2 1.2" style="stroke:var(--steel)" stroke-width="1.4"/><circle cx="12" cy="12" r="4" fill="none" style="stroke:var(--gold)" stroke-width="1.8"/></svg><i class="dot" id="trayDot" hidden></i></button>
    <span class="ti moon" id="trayDnd" hidden title="Do not disturb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="currentColor"/></svg></span>
    <span class="ti" title="Network"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a13 13 0 0 1 18 0M6 12.5a8.5 8.5 0 0 1 12 0M9 16a4 4 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg></span>
    <span class="ti" title="Volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    <span class="ti clock" id="trayClock" title="Simulated clock"><span id="clkT">14:02</span><span id="clkD">29/10/2026</span></span>
  </div>
</nav>
<div id="traymenu" hidden role="menu" aria-label="The Table tray menu"></div>

<!-- ============ the Tumbler ============ -->
<aside id="tumbler" data-form="rest" aria-label="The Tumbler" role="complementary">
  <div class="plate"></div>
  <div class="tbody" id="tbody" aria-live="polite"></div>
  <button class="puck" id="puck" aria-label="The Tumbler"><svg id="puckSvg" viewBox="0 0 88 88" aria-hidden="true"></svg></button>
</aside>

<!-- ============ transient windows ============ -->
<section id="approval" hidden role="dialog" aria-label="The Table · Approval"></section>
<button id="ostoast" hidden></button>

<!-- ============ prototype controls (not part of the product) ============ -->
<aside id="proto" class="ui-proto" aria-label="Prototype controls, not part of the product">
  <button class="ui-btn plain sm ptoggle" id="protoToggle" aria-expanded="true">Hide controls</button>
  <div class="body">
    <div class="pg"><span class="ph">Ladder · D-0193</span>
      <button class="ui-btn sm" data-ctl="arrive" title="Dan accepted $329: ring + bead on the puck. The card stays closed and focus stays put.">New GATE arrives</button>
      <button class="ui-btn sm" data-ctl="soon" title="Moves the clock so D-0193 has 2 h left: the ring breathes every 10 s.">Jump to ≤ 2 h</button>
      <button class="ui-btn sm" data-ctl="now" title="Moves the clock to 15 min left: one OS notification; clicking it opens the card.">Jump to ≤ 15 min</button>
      <button class="ui-btn sm" data-ctl="lapse" title="The deadline passes: Rust applies the default. No money moves.">Let deadline pass</button>
    </div>
    <div class="pg"><span class="ph">Events</span>
      <button class="ui-btn sm" data-ctl="refuse" title="STOP ticker: 40 × GPU refused by clause 3, 0 PayPal calls.">Agent refused</button>
      <button class="ui-btn sm" data-ctl="mismatch" title="Dan's SETTLE says $339: HOLD card, no pay button.">MISMATCH arrives</button>
      <button class="ui-btn sm" data-ctl="browserClosed" hidden title="The browser closed without approving; polling still says CREATED.">Browser closed, not approved</button>
    </div>
    <div class="pg"><span class="ph">Windows &amp; settings</span>
      <button class="ui-btn sm" data-ctl="table" title="The main window, hosted from ../main/. The first close shows the welcome form.">Open The Table</button>
      <button class="ui-btn sm" data-ctl="lock" aria-pressed="false" title="Idle 17 min: privileged buttons need Windows Hello in the approval window.">Idle lock</button>
      <button class="ui-btn sm" data-ctl="dnd" aria-pressed="false" title="Suppresses the OS notification and the breathing; ring and count stay.">Do not disturb</button>
      <button class="ui-btn sm" data-ctl="dock" aria-pressed="false" title="Docks the Tumbler to the screen edge as the 28 × 96 tab.">Dock to edge (tab)</button>
      <button class="ui-btn sm" data-ctl="rm" aria-pressed="false" title="Same as the OS prefers-reduced-motion setting.">Reduced motion</button>
      <button class="ui-btn sm" data-ctl="relaunch" hidden>Relaunch the wallet</button>
      <button class="ui-btn sm" data-ctl="reset" title="Reloads the page.">Reset scenario</button>
    </div>
    <div class="readout" id="readout"></div>
  </div>
</aside>

<script src="tumbler.js"></script>
<script src="../shared/shell.js" data-page="tumbler" data-variant="1" data-root="../"></script>
</body>
</html>
