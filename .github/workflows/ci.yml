name: ci
on: [push, pull_request]
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Licences, bans, sources and RustSec advisories against deny.toml (AGENTS.md dependency gate).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  rust:
    strategy:
      # One OS failing must not cancel the other: each leg reports its own failures.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Tauri shell embeds apps/desktop/client/dist at compile time, so build the client first.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/client/pnpm-lock.yaml
      - run: pnpm --dir apps/desktop/client install --frozen-lockfile
      - run: pnpm --dir apps/desktop/client build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # With TABLE_EVIDENCE_DIR set, the H6 golden run writes its signed proof file and the
      # hostile-agent gauntlet its summary there (ops-and-delivery-1 safety dossier).
      - run: cargo test --workspace --no-fail-fast
        env:
          TABLE_EVIDENCE_DIR: ${{ github.workspace }}/safety-dossier
      # Which test carries which §13 / window acceptance ID; fails while a never-cut ID has none.
      - name: Acceptance matrix
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p safety-dossier
          cargo test --workspace -- --list 2>&1 \
            | cargo run -q -p table-verify --bin acceptance-matrix \
            | tee safety-dossier/acceptance-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the safety dossier offline
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          shopt -s nullglob
          files=(safety-dossier/*.tableproof)
          test ${#files[@]} -gt 0
          for f in "${files[@]}"; do
            cargo run -q -p table-verify --bin table-verify -- "$f" | tee "${f%.tableproof}.verify.txt"
          done
          {
            echo '## Safety dossier'
            echo
            echo '```'
            cat safety-dossier/gauntlet.txt safety-dossier/*.verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: safety-dossier
          path: safety-dossier/
          if-no-files-found: error
