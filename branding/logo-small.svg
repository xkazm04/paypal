<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Table">
  <!-- The Table at 16-48 px (taskbar, title bar, favicon): the bezel is dropped, the seats and the deal
       are heavier so they survive a 16 px grid. Same geometry family as logo.svg. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a222d"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ground)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g fill="none" stroke-width="9">
    <path d="M23.08 48.78A19 19 0 0 1 23.08 15.22" stroke="#3cc4b6"/>
    <path d="M40.92 15.22A19 19 0 0 1 40.92 48.78" stroke="#ff8f6b"/>
  </g>
  <path d="M32 23.5L40.5 32L32 40.5L23.5 32Z" fill="#e4b95b"/>
</svg>
