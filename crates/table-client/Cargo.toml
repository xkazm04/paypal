[package]
name = "table-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
# The browser checker's practice deals and parity files (`sample_proof`) and the bins that write
# them. Off in every shipped build; `cargo run -p table-client --features samples --bin <name>`.
samples = []
[dependencies]
table-core.workspace = true
table-proto.workspace = true
table-attention.workspace = true
table-engine.workspace = true
table-app.workspace = true
table-ledger.workspace = true
table-verify = {path="../table-verify"}
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
ts-rs.workspace = true

[[bin]]
name = "sample-proof"
path = "src/bin/sample-proof.rs"
required-features = ["samples"]
[[bin]]
name = "real-proofs"
path = "src/bin/real-proofs.rs"
required-features = ["samples"]
[[bin]]
name = "fuzz-proofs"
path = "src/bin/fuzz-proofs.rs"
required-features = ["samples"]
